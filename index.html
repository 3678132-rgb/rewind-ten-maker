<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e1230"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>다시, 스무 살</title>
<meta name="description" content="마흔에서 스무 살로 되감긴 십 년, 육성 시뮬레이션">
<style>:root{--bg:#0e1230;--bg2:#1a1f4a;--card:#222862;--card2:#2b3275;--ink:#f3efe6;--mute:#a9acd6;--gold:#f2b84b;--gold2:#ffd98a;--rose:#ff8fa3;--mint:#7fe0c3;--sky:#8fb8ff;--bad:#ff6b6b;--line:rgba(255,255,255,.1)}
:root[data-theme="light"]{--bg:#f6f1e7;--bg2:#ece3d0;--card:#fffaf0;--card2:#f3ead6;--ink:#262338;--mute:#6c6a85;--gold:#c98410;--gold2:#a96a00;--rose:#d9506a;--mint:#16967a;--sky:#3a62b8;--bad:#c93a3a;--line:rgba(0,0,0,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
body{background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg))}
button{font:inherit;color:inherit;cursor:pointer;border:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{position:relative;width:100%;height:100vh;height:100dvh;max-width:calc(100dvh * 9 / 16);margin:0 auto;overflow:hidden;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.5)}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.screen.on{display:block}
.screen.pad{padding:0 16px;padding-top:env(safe-area-inset-top)}
h1,h2,h3{margin:0}
.btn{background:var(--gold);color:#241a05;font-weight:700;padding:13px 18px;border-radius:14px;width:100%;font-size:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
/* title/setup */
#title{text-align:center;overflow:hidden}
.coverbg{position:absolute;inset:0;background:linear-gradient(rgba(14,18,48,.15),rgba(14,18,48,.55) 55%,rgba(14,18,48,.92)),url(art/cover.jpg) center top/cover no-repeat}
.tcontent{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(34px + env(safe-area-inset-bottom));text-shadow:0 2px 12px rgba(0,0,0,.6)}
#title p{color:#e7e4ff}
.hourglass{font-size:44px;animation:flip 6s ease-in-out infinite}
@keyframes flip{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(180deg)}}
#title h1{font-size:36px;margin-top:10px;letter-spacing:-1px}
#title p{color:var(--mute);margin:10px 0 28px}
.sub{color:var(--mute);font-size:13px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,184,75,.3)}
.opt .ic{font-size:24px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
/* game */
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:12px 0 8px}
.date{display:flex;justify-content:space-between;align-items:baseline}
.date b{font-size:18px}
.sand{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 8px}
.sand i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip.up{color:var(--mint)}.chip.down{color:var(--bad)}
.pillars{display:grid;gap:8px;margin-top:6px}
.bar{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;gap:8px;font-size:13px}
.bar .t{height:10px;background:var(--line);border-radius:99px;position:relative;overflow:visible}
.bar .t i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.bar .t u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.bar.bond .t i{background:var(--rose)}.bar.self .t i{background:var(--mint)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.stats div{background:var(--card);border-radius:10px;padding:6px 4px;text-align:center}
.stats b{display:block;font-size:15px}
.slots{display:grid;gap:8px;margin-top:6px}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card2);border:1px dashed var(--line);border-radius:14px;padding:12px}
.slot .lb{font-size:12px;color:var(--mute);width:34px}
.slot.cont{opacity:.5}
.slot .nm{font-weight:600}.slot .ds{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:12px}
/* overlay */
.ov{position:absolute;inset:0;background:rgba(5,7,22,.78);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{width:100%;max-height:82%;padding-bottom:calc(26px + env(safe-area-inset-bottom));overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:18px 16px 26px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:18px;margin-bottom:8px}
.place{height:92px;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,#323a8a,#14183f)}
.place.rain{background:linear-gradient(135deg,#2b3350,#0f1325)}.place.shop{background:linear-gradient(135deg,#6b4a1a,#2a1b07)}.place.night{background:linear-gradient(135deg,#201a52,#0b0a20)}.place.campus{background:linear-gradient(135deg,#3b7fb5,#274c84)}.place.cafe{background:linear-gradient(135deg,#7a4c2b,#2f1b0d)}.place.room{background:linear-gradient(135deg,#4a4170,#1f1a3a)}
.who{display:inline-block;font-size:12px;background:var(--gold);color:#241a05;border-radius:99px;padding:2px 10px;font-weight:700;margin-bottom:6px}
.txt{white-space:pre-wrap;margin:6px 0 12px}
.ch{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.ch b{display:block}.ch span{font-size:12px;color:var(--mute)}
.acts{display:grid;gap:8px}
.act{display:flex;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.act:disabled{opacity:.4}
.act .ic{font-size:22px}.act b{font-size:14px}.act small{display:block;color:var(--mute);font-size:12px}
.cat{font-size:12px;color:var(--gold);margin:12px 0 2px;letter-spacing:1px}
.ending{text-align:center}
.ending .big{font-size:64px}.ending h1{font-size:26px;margin:4px 0}
.letter{text-align:left;background:var(--card);border-radius:14px;padding:14px;white-space:pre-wrap;margin:14px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--gold);color:var(--gold)}
.tag.ret{border-color:var(--bad);color:var(--bad)}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
.herorow{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;margin-top:6px}
.hero{width:104px;height:150px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.place.img{background-size:cover;background-position:center;background-color:#1a1f4a;height:150px;font-size:0}
.face{width:64px;height:84px;border-radius:12px;object-fit:cover;object-position:50% 20%;float:left;margin:0 12px 6px 0;border:1px solid var(--line)}
.endimg{width:100%;max-height:52vh;object-fit:cover;object-position:50% 15%;border-radius:18px;margin-bottom:10px}

/* ── 풀스크린 게임 화면 ── */
#game{overflow:hidden}
.gbg{position:absolute;inset:0;background:#0e1230 center top/cover no-repeat;transition:background-image .3s}
.gshade{position:absolute;inset:0;background:linear-gradient(rgba(10,12,34,.72) 0,rgba(10,12,34,0) 24%,rgba(10,12,34,0) 46%,rgba(10,12,34,.78) 72%,rgba(10,12,34,.94) 100%)}
.ghud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.ghud .date b{font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.ghud .sub{color:#d9d9f2}
.ghud .chip{background:rgba(14,18,48,.62);backdrop-filter:blur(4px);border-color:rgba(255,255,255,.18);color:#fff}
.gbottom .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 2px 10px}
.gbottom .bar{grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:3px 6px;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.gbottom .bar span{grid-column:1}.gbottom .bar b{grid-column:2;grid-row:1;text-align:right}.gbottom .bar .t{grid-column:1/3;grid-row:2;height:8px;background:rgba(255,255,255,.25)}
.gbottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.gbottom .slots{grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.gbottom .slot{flex-direction:column;align-items:flex-start;gap:2px;padding:10px;min-height:92px;background:rgba(26,31,74,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);border-radius:14px}
.gbottom .slot .lb{width:auto;font-size:11px;color:#c9caf0}
.gbottom .slot .ic{font-size:22px;line-height:1.1}
.gbottom .slot .nm{font-size:13px;font-weight:700;line-height:1.25}
.gbottom .slot .ds{font-size:11px;color:#c9caf0}
.gbottom .slot.cont{opacity:.55}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.btn.sm{padding:9px 6px;font-size:13px;background:rgba(14,18,48,.55);border-color:rgba(255,255,255,.2);color:#fff}
#b-run{margin-top:0}
/* 활동 카드: 활동 그림이 화면을 채운다 */
.actcard{position:absolute;inset:0;z-index:15;display:none;background:#0e1230 center/cover no-repeat}
.actcard.on{display:block;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.actcard .ashade{position:absolute;inset:0;background:linear-gradient(rgba(10,12,34,.6),rgba(10,12,34,0) 22%,rgba(10,12,34,0) 50%,rgba(10,12,34,.92) 82%)}
.actcard .atop{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 16px 0;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.actcard .abot{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(18px + env(safe-area-inset-bottom))}
.actcard h2{font-size:22px;margin:0 0 4px}
.stats.sheetstats{margin-top:8px}
</style></head><body>
<div id="app">
 <section id="title" class="screen on">
  <div class="coverbg"></div>
  <div class="tcontent"><div class="hourglass">⏳</div><h1>다시, 스무 살</h1>
  <p>마흔의 기억을 안고 스무 살로.<br>십 년 안에 새 인생을 만들지 못하면, 그 골목으로 돌아간다.</p>
  <button class="btn" id="b-new">새로 시작</button>
  <button class="btn ghost" id="b-cont" style="margin-top:10px;display:none">이어하기</button>

 </section>
 <section id="setup" class="screen pad">
  <h2 style="margin-top:22px">이름</h2><input type="text" id="in-name" maxlength="6" value="서윤">
  <h2 style="margin-top:22px">학과 <span class="sub">한국대학교</span></h2><div class="opts" id="o-major"></div>

 </section>
 <section id="game" class="screen">
  <div class="gbg" id="g-bg"></div><div class="gshade"></div>
  <div class="ghud">
   <div class="date"><b id="h-date"></b><span class="sub" id="h-left"></span></div>
   <div class="sub" id="h-job" style="margin-top:2px"></div>
   <div class="sand"><i id="h-sand"></i></div>
   <div class="chips" id="h-chips"></div>
  </div>
  <div class="gbottom">
   <div class="pillars" id="pillars"></div>
   <div class="slots" id="slots"></div>
   <div class="row3"><button class="btn ghost sm" id="b-stat">능력치</button><button class="btn ghost sm" id="b-log">기록</button><button class="btn ghost sm" id="b-menu">메뉴</button></div>
   <button class="btn" id="b-run">이번 달 시작</button>
  </div>
 </section>
 <section id="end" class="screen pad"></section>
 <div id="act" class="actcard"></div>
 <div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
</div>
<script>// ==ENGINE== 순수 게임 로직 (DOM 금지: sim.mjs가 이 파일들을 그대로 실행한다)
const TOTAL_MONTHS = 120, START_YEAR = 2006, START_MONTH = 3; // 2006년 3월 입학 → 2016년 2월
const STAT = {know:'학식', skill:'실무', neg:'협상', ins:'통찰', sense:'감각', dare:'도전', charm:'매력'};
const STAT_KEYS = Object.keys(STAT);
const PILLAR = {work:'일', bond:'관계', self:'나'};
const LABEL = Object.assign({hp:'체력', stress:'스트레스', cash:'자금', clarity:'기억 선명도'}, STAT, PILLAR);

let R = Math.random;
function seededRand(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seedMonth(S){ if(!S.seed) S.seed = (Math.random() * 4294967295) >>> 0 || 1; R = seededRand((S.seed ^ Math.imul(S.m + 1, 2654435761)) >>> 0); }
const rand = (a, b) => a + R() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(R() * arr.length)];
function josa(w, a, b){ const c = w.charCodeAt(w.length - 1); const has = c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; return w + (has ? a : b); }
const fmtMoney = v => { const n = Math.round(v); const s = n < 0 ? '-' : ''; const a = Math.abs(n); return s + (a >= 10000 ? (a / 10000).toFixed(a % 10000 ? 1 : 0) + '억' : a.toLocaleString('ko-KR') + '만원'); };

const monthOf = S => (S.m + START_MONTH - 1) % 12 + 1;
const yearOf = S => START_YEAR + Math.floor((S.m + START_MONTH - 1) / 12);
const ageOf = S => 20 + Math.floor(S.m / 12);
const monthIndex = (y, mo) => (y - START_YEAR) * 12 + (mo - START_MONTH); // 실제 연·월 → S.m
const SLOT_NAMES = ['상순', '중순', '하순'];

// ── 되감기 전의 나 / 가장 후회하는 것 ──────────────────────────────
const ORIGINS = [
  {id:'office',  name:'사무직',     icon:'🗂️', desc:'경리·총무로 15년. 서류와 숫자엔 자신 있었다.',   fx:{skill:12, know:5, neg:4}},
  {id:'sales',   name:'영업직',     icon:'📞', desc:'사람 상대로 먹고살았다. 거절엔 이골이 났다.',     fx:{neg:14, charm:8}},
  {id:'design',  name:'디자이너',   icon:'🎨', desc:'야근과 시안 수정 속에서 감각만은 지켰다.',       fx:{sense:14, skill:6}},
  {id:'teacher', name:'학원 강사',  icon:'📚', desc:'남의 아이들을 가르치며 내 인생은 못 가르쳤다.',   fx:{know:12, ins:8}},
  {id:'service', name:'서비스직',   icon:'☕', desc:'웃는 얼굴 뒤로 속이 닳았다. 사람 마음은 잘 읽는다.', fx:{charm:8, ins:10}},
];
const REGRETS = [
  {id:'work', name:'일', icon:'💼', desc:'그렇게 일했는데 해고 한 장이었다.',        fx:{work:10, skill:4}},
  {id:'bond', name:'사람', icon:'🫂', desc:'곁에 있던 사람들을 제대로 붙잡지 못했다.',   fx:{bond:10, charm:4}},
  {id:'self', name:'나', icon:'🪞', desc:'나를 돌본 기억이 하나도 없다.',             fx:{self:10, ins:4}},
];
// ── 한국대학교 학과 / 직업(회사) ────────────────────────────────
const UNIVERSITY = '한국대학교';
const MAJORS = [
  {id:'biz',     name:'경영학과',               icon:'📊', desc:'조직과 시장을 읽는 법. 협상과 실무에 강하다.',   fx:{neg:8, know:4, skill:3}, fav:['beauty', 'pd']},
  {id:'media',   name:'미디어커뮤니케이션학과', icon:'📺', desc:'방송·광고·콘텐츠. 감각과 사람 다루기.',          fx:{sense:6, charm:4, neg:4}, fav:['beauty', 'pd', 'writer']},
  {id:'korean',  name:'국어국문학과',           icon:'🖋️', desc:'문장과 이야기의 힘. 통찰이 깊어진다.',          fx:{know:4, sense:4, ins:6}, fav:['writer']},
  {id:'cs',      name:'컴퓨터공학과',           icon:'💻', desc:'만드는 사람들. 실무 능력이 압도적이다.',          fx:{skill:10, know:6}, fav:['dev']},
  {id:'law',     name:'법학과',                 icon:'⚖️', desc:'논리와 암기와 끈기. 로스쿨로 가는 길.',          fx:{know:8, neg:6}, fav:['lawyer']},
  {id:'vdesign', name:'시각디자인학과',         icon:'🎨', desc:'눈으로 말하는 사람들. 감각이 뛰어나다.',          fx:{sense:10, skill:4}, fav:['designer', 'beauty']},
  {id:'theater', name:'연극영화학과',           icon:'🎭', desc:'무대와 카메라 앞. 매력과 도전이 자란다.',        fx:{charm:8, sense:4, dare:4}, fav:['actor', 'pd', 'writer']},
  {id:'psych',   name:'심리학과',               icon:'🧠', desc:'사람 마음의 지도. 통찰과 공감.',                  fx:{ins:8, charm:3, know:3}, fav:['beauty', 'writer']},
  {id:'fashion', name:'의류학과',               icon:'🧵', desc:'소재와 패턴, 트렌드. 감각과 손기술.',            fx:{sense:8, skill:4, charm:2}, fav:['designer', 'beauty']},
  {id:'polisci', name:'정치외교학과',           icon:'🌐', desc:'세상과 협상하는 법. 논쟁에 강하다.',              fx:{neg:8, ins:4, know:4}, fav:['lawyer', 'pd']},
];
// key: 합격에 중요한 능력 가중치 / need: 이 점수면 합격률 약 65%

function newGame(name, originId, regretId, majorId){
  const o = ORIGINS.find(x => x.id === originId) || ORIGINS[0], rg = REGRETS.find(x => x.id === regretId) || REGRETS[0], mj = MAJORS.find(x => x.id === majorId) || MAJORS[0];

    hp:80, stress:30, cash:200, clarity:100, borrowed:0,
    st:{know:20, skill:8, neg:30, ins:40, sense:15, dare:10, charm:22},
    work:5, bond:10, self:15,

    seen:{}, cd:{}, uses:{}, last:{work:0, bond:0, self:0}, album:[], ending:null, seed:null, collapse:false, picks:{}};
  for(const k in o.fx) S.st[k] += o.fx[k];
  for(const k in mj.fx) S.st[k] += mj.fx[k];
  for(const k in rg.fx){ if(S[k] != null && typeof S[k] === 'number') S[k] += rg.fx[k]; else if(S.st[k] != null) S.st[k] += rg.fx[k]; }
  return S;
}

// ── 수치 변경 헬퍼 ─────────────────────────────────────────────
function push(ch, label, d, money){ if(!ch) return; if(Math.abs(d) < 0.05) return; ch.push({label, d, money:!!money}); }
function grow(S, k, base, ch){ const cur = S.st[k]; const nv = clamp(cur + base * 0.6 * Math.max(0.1, 1 - cur / 115), 0, 100); push(ch, STAT[k], nv - cur); S.st[k] = nv; }
const GAUGE_SCALE = 0.34; // 3축 증가량 배율 (밸런스 조절용)
function gauge(S, k, d, ch){ const cur = S[k]; const nv = clamp(d > 0 ? cur + d * GAUGE_SCALE * Math.max(0.15, 1 - cur / 95) : cur + d, 0, 100); push(ch, PILLAR[k], nv - cur); S[k] = nv; if(d > 0 && k !== 'self' && k !== 'bond') S.last.work = S.m; if(d > 0 && k === 'bond') S.last.bond = S.m; if(d > 0 && k === 'self') S.last.self = S.m; }
function bump(S, key, d, ch){
  if(key === 'cash'){ S.cash += d; push(ch, LABEL.cash, d, true); return; }
  if(key === 'clarity'){ const b = S.clarity; S.clarity = clamp(b + d, 0, 100); push(ch, LABEL.clarity, S.clarity - b); return; }
  if(key === 'hp' || key === 'stress'){ const b = S[key]; S[key] = clamp(b + d, 0, 100); push(ch, LABEL[key], S[key] - b); return; }
  if(PILLAR[key]) return gauge(S, key, d, ch);
  if(STAT[key]) return grow(S, key, d, ch);
}
function fx(S, o, ch){ for(const k in o) bump(S, k, o[k], ch); return ch; }

function addAff(S, id, d, ch){
  const v = S.love[id]; if(!v) return; const lv = LOVERS[id];
  if(d > 0 && S.partner && S.partner !== id) d = Math.min(d, Math.max(0, 44 - v.aff)); // 마음은 있어도 선을 지킨다
  const b = v.aff; v.aff = clamp(v.aff + d, 0, 100); push(ch, lv.name + ' 호감', v.aff - b);
}
function dateTarget(S){
  if(S.partner) return S.partner;
  const c = Object.keys(S.love).filter(i => S.love[i].stage === -1 && S.love[i].aff >= 18).sort((a, b) => S.love[b].aff - S.love[a].aff);
  return c[0] || null;
}

function doAction(S, id){
  const a = ACTS[id], ch = [], out = {id, ch, note:''};
  if(a.cost) bump(S, 'cash', -a.cost, ch);
  if(a.pay){ const pay = Math.round(a.pay * earnedMult(S) * (id === 'cafe' ? 1 : 1)); bump(S, 'cash', pay, ch); }
  if(a.run) a.run(S, ch, out);
  if(!out.skipBase){
    if(a.hp) bump(S, 'hp', a.hp, ch);
    if(a.stress) bump(S, 'stress', a.stress, ch);
    if(a.eff) fx(S, a.eff, ch);
  }
  S.uses[id] = (S.uses[id] || 0) + 1;
  if(S.hp <= 0){ S.hp = 0; S.collapse = true; out.burnout = true; }
  return out;
}

const livingCost = S => (S.m < 48 || inLawSchool(S)) ? 55 : 95;

function settle(S){
  const ch = [];
  bump(S, 'cash', -livingCost(S), ch); if(allowance(S)) bump(S, 'cash', allowance(S), ch);
  if(S.stress >= 75){ bump(S, 'self', -1.2, ch); }
  if(S.stress >= 100 || S.hp <= 0) S.collapse = true;
  // 균형: 한쪽만 하면 다른 쪽이 마른다
  if(S.m - S.last.bond > 3) gauge(S, 'bond', -0.7, ch);
  if(S.m - S.last.work > 4) gauge(S, 'work', -0.5, ch);
  if(S.m - S.last.self > 4) gauge(S, 'self', -0.5, ch);
  S.clarity = clamp(S.clarity - 0.25, 0, 100);
  for(const id in S.love){ const v = S.love[id]; if(v.stage === -9) continue; if(S.m - (v.lastDate == null ? v.since : v.lastDate) > 3){ const b = v.aff; v.aff = clamp(v.aff - (v.stage >= 1 ? 1.4 : 0.8), 0, 100); if(v.stage >= 1 && v.aff < 14) v.fading = true; } }
  S.hp = clamp(S.hp + 3, 0, 100);
  S.stress = clamp(S.stress - 2, 0, 100);
  if(S.cash < -300 && !S.ending) S.ending = 'ret_debt';
  return ch;
}

function loveEvent(S){
  const L = S.love;
  for(const id of LOVER_IDS){ const lv = LOVERS[id]; if(L[id] || S.seen['meet_' + id]) continue; const ok = lv.career ? (S.track === lv.career && S.hired && S.hiredAt != null && S.m >= S.hiredAt + 2) : S.m >= lv.meet; if(ok) return meetEvent(S, id); }
  for(const id of LOVER_IDS){ const v = L[id]; if(!v) continue;
    if(v.stage >= 1 && v.fading && !S.seen['fade_' + id]) return breakupEvent(S, id);
    if(v.stage === -1 && v.aff >= 45 && !S.partner && !S.seen['confess_' + id]) return confessEvent(S, id);
    if(v.stage === 1 && S.m - v.since2 >= 9 && !S.seen['trial_' + id]) return trialEvent(S, id);
    if(v.stage === 1 && S.seen['trial_' + id] && S.m - v.since2 >= 24 && S.m >= 54 && v.aff >= 70 && !S.seen['propose_' + id]) return proposeEvent(S, id);
  }
  return null;
}

function fixedEvents(S){
  const out = [];
  if(S.collapse){ out.push(collapseEvent(S)); }
  if(S.m === 0 && !S.seen.prologue) out.push(PROLOGUE);
  for(const c of CHECKS) if(S.m === c.m && !S.seen[c.id]) out.push(checkEvent(S, c));
  for(const e of ERA) if(S.m === e.m && !S.seen[e.id]) out.push(Object.assign({once:true, speaker:''}, e));
  if(S.m === INTEREST_M && !S.seen.interest) out.push(interestEvent(S));
  if(S.m === GRAD_M && !S.seen.graduation) out.push(graduationEvent(S));
  if(S.m === CAREERS.lawyer.school - 1 && !S.seen.bar_exam && BAR_EXAM.cond(S)) out.push(BAR_EXAM);
  const le = loveEvent(S); if(le) out.push(le);
  if(S.m === TOTAL_MONTHS - 1) out.push(FINALE);
  return out;
}
function collapseEvent(S){
  return {id:'collapse_' + S.m, speaker:'', title:'쓰러지다', place:'room',
    text:S => '버티다 못한 몸이 먼저 신호를 보냈다. 눈을 떠 보니 병원 천장이었다. 의사가 한마디 했다. “이렇게 사시면 안 됩니다.”',
    choices:[{label:'정말 쉬기로 한다', sub:'체력 회복 · 자금 -30', run(S){ const ch = []; S.collapse = false; S.hp = 50; S.stress = 45; fx(S, {cash:-30, self:-2, ins:1}, ch); return {text:'일주일을 입원해 있었다. 마흔의 몸은 이렇게 무너졌을 것이다. 이번에는 늦지 않게 멈췄다.', chips:ch}; }}]};
}
function pickEvent(S){
  const pool = EVENTS.filter(e => (!e.once || !S.seen[e.id]) && (!e.cd || (S.cd[e.id] == null) || S.m - S.cd[e.id] >= e.cd) && (!e.cond || e.cond(S)));
  if(!pool.length) return null;
  const tot = pool.reduce((a, e) => a + (e.w || 1), 0); let r = R() * tot;
  for(const e of pool){ r -= (e.w || 1); if(r <= 0) return e; }
  return pool[pool.length - 1];
}

// 엔딩 판정과 텍스트 (ENGINE 구간 안, DOM 금지)
const FREE_MIN = 50, FREE_SUM = 184;

// 빌린 인생 / 되풀이된 결혼 같은 보정을 반영한 최종 3축
function finalPillars(S){
  const w = S.work - Math.min(32, S.borrowed * 2.8);
  let b = S.bond; const j = S.love.jaewoo;
  if(S.partner === 'jaewoo' && j && !j.fixed) b -= 18;
  return {work:clamp(w, 0, 100), bond:clamp(b, 0, 100), self:S.self};
}
function isFree(P){ return P.work >= FREE_MIN && P.bond >= FREE_MIN && P.self >= FREE_MIN && (P.work + P.bond + P.self) >= FREE_SUM; }

function computeEnding(S){
  if(S.ending) return S.ending;
  const P = finalPillars(S), raw = {work:S.work, bond:S.bond, self:S.self};
  if(isFree(P)){
    if(CAREERS[S.track] && S.hired && P.work >= 62 && !inLawSchool(S)) return 'free_' + S.track;
    if(S.engaged && P.bond >= 70) return 'free_home';
    if(P.self >= 75) return 'free_soul';
    return 'free_balance';
  }
  if(isFree(raw)) return 'ret_borrowed'; // 겉보기엔 통과했지만 빌린 인생이었다
  const lowest = Object.keys(P).sort((a, b) => P[a] - P[b])[0];
  if(P.work < 35 && P.bond < 35 && P.self < 35) return 'ret_all';
  return 'ret_' + lowest;
}

  $('o-major').innerHTML = mk(MAJORS, 'major'); $('o-origin').innerHTML = mk(ORIGINS, 'origin'); $('o-regret').innerHTML = mk(REGRETS, 'regret');
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { setupSel[b.dataset.k] = b.dataset.id; renderSetup(); });
}

// ── 메인 화면 ─────────────────────────────────────────────────
function render(){
  if(!S) return;
  const left = TOTAL_MONTHS - S.m;
  $('h-date').textContent = `${yearOf(S)}년 ${monthOf(S)}월 · ${S.name} ${ageOf(S)}세`;
  $('h-left').textContent = `남은 시간 ${left}개월`;
  $('h-job').textContent = S.hired && CAREERS[S.track] ? (inLawSchool(S) ? `${UNIVERSITY} 로스쿨 · 법학전문대학원생` : `${CAREERS[S.track].company} · ${rankName(S)} (${CAREERS[S.track].name})`) : (S.track ? `${UNIVERSITY} ${majorOf(S).name} · 구직 중 (${CAREERS[S.track].name})` : `${UNIVERSITY} ${majorOf(S).name}${S.interest ? ` · 관심: ${CAREERS[S.interest].name}` : ''}`);
  $('g-bg').style.backgroundImage = `url(art/${heroKey(S)}.jpg)`;
  $('h-sand').style.width = (100 * S.m / TOTAL_MONTHS) + '%';
  $('h-chips').innerHTML = [`💰 ${fmtMoney(S.cash)}`, `❤️ ${Math.round(S.hp)}`, `😮‍💨 ${Math.round(S.stress)}`, `🔮 ${Math.round(S.clarity)}`].map(t => `<span class="chip">${t}</span>`).join('');
  $('pillars').innerHTML = Object.keys(PILLAR).map(k => `<div class="bar ${k}"><span>${PILLAR[k]}</span><div class="t"><i style="width:${S[k]}%"></i><u></u></div><b>${Math.round(S[k])}</b></div>`).join('');
  $('slots').innerHTML = [0, 1, 2].map(i => {
    const id = S.plan[i];
    if(id === '>') return `<button class="slot cont" disabled><span class="lb">${SLOT_NAMES[i]}</span><span class="ic">⏩</span><span class="ds">이어지는 칸</span></button>`;
    if(!id) return `<button class="slot" data-i="${i}"><span class="lb">${SLOT_NAMES[i]}</span><span class="ic">＋</span><span class="ds">활동 고르기</span></button>`;
    const a = ACTS[id]; return `<button class="slot" data-i="${i}"><span class="lb">${SLOT_NAMES[i]}</span><span class="ic">${a.icon}</span><span class="nm">${actName(S, id)}</span></button>`;
  }).join('');
  document.querySelectorAll('.slot[data-i]').forEach(b => b.onclick = () => openPicker(+b.dataset.i));
  $('b-run').disabled = S.plan.some(x => !x);
}
function setPlan(i, id){
  const p = S.plan;
  const clear = j => { if(p[j] === '>'){ p[j] = null; if(p[j - 1] && ACTS[p[j - 1]] && ACTS[p[j - 1]].slots === 2) p[j - 1] = null; } else if(p[j] && ACTS[p[j]].slots === 2){ p[j] = null; p[j + 1] = null; } else p[j] = null; };
  clear(i); const a = ACTS[id];
  if(a.slots === 2){ clear(i + 1); p[i] = id; p[i + 1] = '>'; } else p[i] = id;
}
function openPicker(i){
  let html = `<h2>${SLOT_NAMES[i]}에 무엇을 할까요?</h2>`;
  for(const cat of ACTS_ORDER_CATS){
    const ids = Object.keys(ACTS).filter(id => ACTS[id].cat === cat); if(!ids.length) continue;
    html += `<div class="cat">${cat}</div><div class="acts">` + ids.map(id => {
      const a = ACTS[id]; let why = a.req ? a.req(S) : null; if(!why && a.cost && a.cost > S.cash) why = '자금 부족'; if(!why && a.slots > 3 - i) why = '칸이 모자라요';
      const meta = [a.cost ? `-${a.cost}만` : '', a.pay ? `+${Math.round(a.pay * earnedMult(S))}만` : '', a.slots > 1 ? '2칸' : ''].filter(Boolean).join(' · ');
      return `<button class="act" data-id="${id}" ${why ? 'disabled' : ''}><span class="ic">${a.icon}</span><span><b>${actName(S, id)}</b> <span class="sub">${meta}</span><small>${why || a.desc}</small></span></button>`;
    }).join('') + `</div>`;
  }
  openSheet(html + `<button class="btn ghost" style="margin-top:14px" id="x">닫기</button>`);
  $('x').onclick = closeSheet;
  document.querySelectorAll('.act').forEach(b => b.onclick = () => { setPlan(i, b.dataset.id); closeSheet(); render(); save(); });
}

// ── 이벤트 재생 ───────────────────────────────────────────────
function playEvent(ev){
  return new Promise(resolve => {
    S.seen[ev.id] = true; S.cd[ev.id] = S.m;
    const pimg = ev.img || PLACE_IMG[ev.place]; const head = (pimg ? `<div class="place img" style="background-image:url(${pimg});background-position:${ev.img ? '50% 2%' : (PLACE_POS[ev.place] || '50% 50%')}"></div>` : `<div class="place ${ev.place || 'room'}">${PLACE_ICON[ev.place] || '🏠'}</div>`) + (ev.speaker ? `<span class="who">${esc(ev.speaker)}</span>` : '') + `<h2>${esc(ev.title)}</h2>`;
    const beats = (ev.beats || []).slice();
    const nextBeat = () => {
      if(beats.length){ const t = beats.shift(); openSheet(head + `<div class="txt">${esc(t)}</div><button class="btn" id="nx">다음</button>`); $('nx').onclick = nextBeat; return; }
      const cs = ev.choices; openSheet(head + `<div class="txt">${esc(ev.text(S))}</div>` + cs.map((c, k) => `<button class="ch" data-k="${k}"><b>${esc(c.label)}</b><span>${esc(c.sub || '')}</span></button>`).join(''));
      document.querySelectorAll('.ch').forEach(b => b.onclick = () => {
        const out = cs[+b.dataset.k].run(S); save();
        if(!out.text){ closeSheet(); render(); return resolve(); }
        openSheet(head + faceImg(out.chips) + `<div class="txt">${esc(out.text)}</div><div class="chips" style="clear:both">${chipHTML(out.chips)}</div><button class="btn" id="nx" style="margin-top:14px">계속</button>`);
        $('nx').onclick = () => { closeSheet(); render(); resolve(); };
      });
    };
    nextBeat();
  });
}
const alertSheet = (title, body, chips, btn) => new Promise(res => { openSheet(`<h2>${esc(title)}</h2><div class="txt">${body}</div><div class="chips">${chipHTML(chips)}</div><button class="btn" id="nx" style="margin-top:14px">${btn || '계속'}</button>`); $('nx').onclick = () => { closeSheet(); res(); }; });

// ── 한 달 진행 ────────────────────────────────────────────────
const ACT_ART = new Set(['study','cert','tutor','cafe','intern','project','jobhunt','job','future','exercise','journal','hobby','style','family','friends','club','date','travel','rest']);
function showAct(slotName, id, out){
  return new Promise(res => {
    const a = ACTS[id], el = $('act');
    el.style.backgroundImage = ACT_ART.has(id) ? `url(art/act_${id}.jpg)` : 'none';
    el.innerHTML = `<div class="ashade"></div><div class="atop"><span class="who">${slotName}</span></div><div class="abot"><h2>${a.icon} ${esc(actName(S, id))}</h2>${out.note ? `<div class="txt" style="margin:4px 0 8px">${esc(out.note)}</div>` : `<div class="txt" style="margin:4px 0 8px;opacity:.85">${esc(a.desc)}</div>`}<div class="chips">${chipHTML(out.ch)}</div><button class="btn" id="anx" style="margin-top:14px">다음</button></div>`;
    el.classList.add('on'); $('anx').onclick = () => { el.classList.remove('on'); res(); };
  });
}
async function runMonth(){
  seedMonth(S); S.lastPlan = S.plan.slice();
  for(let i = 0; i < 3; i++){
    let id = S.plan[i]; if(!id || id === '>') continue; let a = ACTS[id]; const first = i;
    let fell = false; if(a.cost && a.cost > S.cash || (a.req && a.req(S))){ fell = true; id = 'rest'; a = ACTS[id]; }
    const out = doAction(S, id); i += a.slots - 1; if(fell) out.note = '조건이 맞지 않아 계획을 바꿔 쉬었다.';
    await showAct(SLOT_NAMES[first], id, out);
    if(out.burnout) break;
  }
  const sch = settle(S);
  await alertSheet(`${yearOf(S)}년 ${monthOf(S)}월 정산`, '생활비·균형을 정산했어요.', sch, '계속');
  if(!S.ending){
    const fx_ = fixedEvents(S); for(const f of fx_){ await playEvent(f); if(S.ending) break; }
    if(!S.ending){ const ev = fx_.length >= 2 ? null : (R() < 0.7 ? pickEvent(S) : null); if(ev) await playEvent(ev); }
  }
  if(!S.ending) S.m++;
  S.plan = [null, null, null];
  if(S.m >= TOTAL_MONTHS || S.ending){ S.ending = S.ending || computeEnding(S); save(); return showEnding(); }
  save(); render();
}
async function startFlow(){ // 새 게임: 프롤로그 먼저
  seedMonth(S); await playEvent(PROLOGUE); save(); render();
}

// ── 엔딩 ──────────────────────────────────────────────────────
function showEnding(){
  const id = S.ending || computeEnding(S), e = ENDINGS[id]; const P = finalPillars(S);
  const seen = store(ENDINGS_KEY) || []; if(!seen.includes(id)){ seen.push(id); store(ENDINGS_KEY, seen); }
  $('end').innerHTML = `<div class="ending" style="padding-top:4vh"><img class="endimg" src="art/${e.free ? 'age30' : 'cover'}.jpg" alt="" onerror="this.style.display='none'"><div class="big">${e.icon}</div><span class="tag ${e.free ? '' : 'ret'}">${e.sub}</span><h1>${e.title}</h1>
   <div class="pillars" style="text-align:left">${Object.keys(PILLAR).map(k => `<div class="bar ${k}"><span>${PILLAR[k]}</span><div class="t"><i style="width:${P[k]}%"></i><u></u></div><b>${Math.round(P[k])}</b></div>`).join('')}</div>
   <div class="letter">${esc(e.letter.replace(/\{name\}/g, S.name))}\n\n— 일흔 살의 나로부터</div>
   <p class="sub">엔딩 ${seen.length}/${ENDING_IDS.length} 수집 · 빌린 인생 ${S.borrowed} · 기억 선명도 ${Math.round(S.clarity)}</p>
   <button class="btn" id="b-again">${e.free ? '다시 도전하기' : '한 번 더 되감기'}</button></div>`;
  $('b-again').onclick = () => { store(SAVE_KEY, null); S = null; initTitle(); show('title'); };
  show('end');
}

// ── 메뉴·기록 ─────────────────────────────────────────────────
function initGame(){
  $('b-run').onclick = () => { $('b-run').disabled = true; runMonth(); };
  $('b-stat').onclick = () => { openSheet(`<h2>능력치</h2><p class=\"sub\">${UNIVERSITY} ${majorOf(S).name}${S.hired && CAREERS[S.track] ? ' · ' + CAREERS[S.track].company + ' ' + rankName(S) : ''}</p><div class="stats sheetstats">${STAT_KEYS.map(k => `<div>${STAT[k]}<b>${Math.round(S.st[k])}</b></div>`).join('')}<div>빌린 인생<b>${S.borrowed}</b></div></div><p class="sub" style="margin-top:10px">생활비 월 ${livingCost(S)}만 · 지원 ${allowance(S)}만 · 기억 선명도 ${Math.round(S.clarity)}</p><button class="btn ghost" id="x" style="margin-top:14px">닫기</button>`); $('x').onclick = closeSheet; };
  $('b-log').onclick = () => { openSheet(`<h2>기록</h2><div class="txt">${S.album.length ? S.album.map(esc).join('\n') : '아직 기록이 없어요.'}</div><div class="sub">연애: ${Object.keys(S.love).map(i => `${LOVERS[i].name} ${LOVE_STAGE[S.love[i].stage] || ''} ${Math.round(S.love[i].aff)}`).join(' / ') || '없음'}</div><button class="btn ghost" id="x" style="margin-top:14px">닫기</button>`); $('x').onclick = closeSheet; };
  $('b-menu').onclick = () => { openSheet(`<h2>메뉴</h2><button class="btn ghost" id="m-prev">지난달 계획 반복</button><button class="btn ghost" id="m-theme" style="margin-top:8px">밝은/어두운 화면</button><button class="btn ghost" id="m-title" style="margin-top:8px">타이틀로 (자동 저장)</button><button class="btn ghost" id="x" style="margin-top:8px">닫기</button>`);
    $('x').onclick = closeSheet;
    $('m-prev').onclick = () => { if(S.lastPlan) S.plan = S.lastPlan.slice(); closeSheet(); render(); };
    $('m-theme').onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'light' ? 'dark' : 'light'; try{ localStorage.setItem('rewind-ten-theme', d.dataset.theme); }catch(e){} closeSheet(); };
    $('m-title').onclick = () => { save(); closeSheet(); initTitle(); show('title'); }; };
  $('ov').addEventListener('click', e => { if(e.target === $('ov') && !document.querySelector('#sheet .ch, #sheet #nx')) closeSheet(); });
}
try{ const t = localStorage.getItem('rewind-ten-theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
initTitle(); initGame();
</script></body></html>
