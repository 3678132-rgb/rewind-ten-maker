 text:S => `${lvFlag(S, 'yuchan', 'y_truth') ? '임원 회의 이후 그의 눈은 한결 편안해졌다.' : lvFlag(S, 'yuchan', 'y_fight') ? '그날 다투고 난 뒤 처음으로 마주 서는 자리다.' : '조심스러운 침묵 속에서도 그의 마음이 읽힌다.'} “올봄에 팀을 나와서 작은 서비스를 직접 만들어 보려고요. 그런데 혼자 하는 건 처음이라…” ${isCouple(S, 'yuchan') ? '그는 내 손을 쥔 채 말을 이었다.' : '그가 처음으로 내 얼굴을 똑바로 보았다.'}`,
 choices:[
  {label:'“같이 만들어요. 대신 퇴근 시간은 내가 정해요”', sub:'도전 · 실무 · 호감↑', run(S){ if(S.st.dare >= 45 || S.st.skill >= 55) return _lsdR(S, 'yuchan', 9, {dare:1.5, skill:1.5, work:2}, 'y_join', '“…진짜요?” 그의 목소리가 갈라졌다. 나는 내가 가진 기술과 일정표 한 장을 그의 구조도 옆에 얹었다. 그가 웃음을 참으며 파일명을 바꿨다. “공동 소유자 한 명 추가. 오류 없음.”'); return _lsdR(S, 'yuchan', 6, {dare:1, work:1, stress:4}, 'y_join', '자신 있게 말했지만 손바닥에는 땀이 맺혔다. 유찬은 그걸 눈치채고도 모른 척해 주었다. “준비는 내가 많이 해 둘게요. 당신은 방향만 잡아 줘요.”'); }},
  {label:'“당신이 만들고, 나는 가장 먼저 쓰는 사람이 될게요”', sub:'매력 · 호감↑', run(S){ return _lsdR(S, 'yuchan', 7, {charm:1.5, bond:1.5}, 'y_user', `유찬은 한동안 대답 없이 난간만 쥐고 있었다. “사용자 한 명이 이렇게 크게 느껴진 적은 처음이에요.” ${isCouple(S, 'yuchan') ? '그가 내 어깨에 이마를 잠깐 기댔다. 짧은 순간이었지만 오래 기억할 것이다.' : '그가 어색하게 웃으며 시선을 도시의 불빛 쪽으로 돌렸다.'}`, 'shy'); }},
  {label:'“지금은 내 일부터 단단히 해 둘게요. 기다려 줘요”', sub:'나 +2 · 호감 소폭', run(S){ return _lsdR(S, 'yuchan', isCouple(S, 'yuchan') ? 3 : 1, {self:2.5, stress:-2}, 'y_wait', `“…알겠어요. 대기열에 넣어 둘게요.” 그는 서운함을 감추며 웃었다. 내 선택이 틀린 건 아니지만 옥상의 바람이 조금 쓸쓸했다. ${isCouple(S, 'yuchan') ? '“기다리는 건 잘해요. 로그 돌아가는 걸 몇 시간씩 보던 사람이잖아요.”' : '그가 기다림에 익숙한 사람이라는 게 새삼 마음에 걸렸다.'}`); }},
 ]},

{id:'ls_yuchan_6', lover:'yuchan', cond:S => isMet(S, 'yuchan') && afterEv(S, 'ls_yuchan_5', 3) && _lsdHigh(S, 'yuchan') && S.m < 119,
 speaker:'안유찬', title:'첫 번째 릴리즈', place:'night', img:'art/bg_office.webp', cut:'yuchan', cutVar:'a',
 beats:['릴리즈 날 밤. 텅 빈 사무실에 모니터 불빛만 둘이다. 유찬의 손가락 끝이 병합 버튼 위에서 멈춰 있다.', '“이 버튼은 늘 혼자 눌렀어요. 잘못되면 혼자 책임지려고.” 그가 마우스에서 손을 뗀다.', '저장소 첫 화면에는 기여자 목록이 보인다. 맨 위에 내 이름, 그 아래에 그의 이름이다.'],
 text:S => `${lvFlag(S, 'yuchan', 'y_join') ? '우리가 함께 만든 서비스가 마침내 세상에 나가는 순간이다.' : lvFlag(S, 'yuchan', 'y_wait') ? '내가 기다려 달라고 했던 시간이 이 밤까지 이어졌다.' : '그가 오랫동안 혼자 만들어 온 것을 마침내 나에게 보여 준다.'} 유찬이 낮게 말한다. “이번엔 같이 눌러요. 혹시 에러가 나면 같이 읽을 수 있게.”`,
 choices:[
  {label:'커밋 메시지를 직접 써서 그에게 보여 준다', sub:'실무 · 학식 · 호감↑↑', run(S){ S.album.push('유찬과 처음으로 함께 배포한 날. 커밋 메시지에는 “같이 읽는다”라고 적었다.'); lvSet(S, 'yuchan', 'y_promise'); if(S.st.skill >= 55 && S.st.know >= 55) return _lsdR(S, 'yuchan', 12, {skill:1.5, know:1.5, self:3, bond:2}, 'y_final', `“fix: 새벽 세 시에도 혼자가 아니게.” 내가 쓴 메시지를 읽은 그가 입술을 깨물며 웃었다. “이 정도 문장이면 로그가 아니라 편지네요.” ${isCouple(S, 'yuchan') ? '“앞으로도 모든 커밋에 네 이름을 같이 적을래.”' : '“약속할게요. 에러가 나도, 새벽이어도, 같이 읽는다는 걸요.”'}`); return _lsdR(S, 'yuchan', 8, {self:3, bond:2}, 'y_final', `“fix: 같이 읽는다.” 서툰 문장이었지만 유찬이 한참을 화면에서 눈을 떼지 못했다. ${isCouple(S, 'yuchan') ? '“…이거 영원히 안 지울래. 되돌리기 없이.”' : '“약속이라고 읽어도 되죠?” 그의 목소리가 아주 조금 떨렸다.'}`, 'shy'); }},
  {label:'“약속 하나 해요. 새벽 세 시엔 같이 깨어 있기, 대신 낮엔 같이 자기”', sub:'감각 · 매력 · 호감↑', run(S){ S.album.push('유찬이 병합 버튼을 누르기 전에 약속했다. 어떤 에러도 같이 읽자고.'); lvSet(S, 'yuchan', 'y_promise'); return _lsdR(S, 'yuchan', 10, {charm:1.5, self:3, stress:-3}, 'y_final', `유찬이 소리 내어 웃었다. 오랫동안 들어 보지 못한 웃음이었다. “낮에 자는 건 생각 못 했네요. 좋은 요구 사항이에요.” ${isCouple(S, 'yuchan') ? '우리는 병합 버튼을 같이 눌렀고, 손등이 겹친 채 한동안 떼지 않았다.' : '버튼 위에서 겹친 손가락을 그도 나도 끝내 떼지 못했다.'}`, 'shy'); }},
  {label:'말없이 그의 손 위에 손을 얹어 병합 버튼을 누른다', sub:'도전 · 호감↑', run(S){ S.album.push('유찬의 손 위에 손을 얹어 버튼을 눌렀다. 화면이 초록색으로 바뀌었다.'); lvSet(S, 'yuchan', 'y_promise'); return _lsdR(S, 'yuchan', S.st.dare >= 45 ? 9 : 7, {dare:1, self:3, bond:2}, 'y_final', `화면이 초록색으로 바뀌었다. 한동안 아무도 말하지 않았다. ${S.st.dare >= 45 ? '유찬은 천천히 내 손을 뒤집어 깍지를 끼웠다. “이게 제일 완전한 배포 같아요.”' : '유찬이 숨을 길게 내쉬었다. “…이제 되돌리기 없어요.” 그 말이 오히려 안심이 되었다.'}`, 'shy'); }},
 ]},

// ════════ 신우진 (디자이너 · 원단과 색으로 마음을 읽는 사람) ════════
{id:'ls_ujin_1', lover:'ujin', cond:S => inCareer(S, 'designer', 'stylist') && isMet(S, 'ujin') && S.m - (S.hiredAt || 0) >= 3 && S.m >= 50 && S.m < 90,
 speaker:'신우진', title:'색은 거짓말을 안 해요', place:'cafe', img:'art/ct_mall.webp', cut:'ujin', cutVar:'a',
 beats:['작업실 테이블 위에 내 룩 보드가 펼쳐져 있다. 우진이 장갑도 끼지 않은 맨손으로 종이 가장자리를 천천히 쓸어 본다.', '그는 아무 말이 없다. 초 단위로 시간이 가는 소리가 들릴 정도다.', '마흔의 나는 이런 침묵이 두려웠다. 하지만 스무 살의 나는 이 침묵이 평가가 아니라 읽는 중이라는 걸 안다.'],
 text:S => `한참 뒤 우진이 고개를 든다. “여기 이 쪽빛이요, 의도한 색인가요, 우연히 나온 색인가요?” ${isCouple(S, 'ujin') ? '연인의 눈이 아니라 디자이너의 눈으로 묻는 질문이라 더 긴장된다.' : '그의 눈빛이 이상하게 진지해서 대답이 잘못 나올까 손끝이 차가워진다.'}`,
 choices:[
  {label:'“어떤 색이 거짓말을 했나요?”라고 되묻는다', sub:'감각 · 호감↑', run(S){ if(S.st.sense >= 45) return _lsdR(S, 'ujin', 6, {sense:1.5, work:1}, 'u_eye', '우진은 보드 한쪽의 연한 회색을 가리켰다. 나는 거의 반사적으로 “이 회색이 옆의 쪽빛을 죽이고 있죠” 하고 말했다. 그가 놀란 듯 눈을 크게 떴다. “…눈이 좋아요. 손끝이 아니라 눈으로 읽는 분이네요.”'); return _lsdR(S, 'ujin', 4, {sense:1.5}, 'u_eye', '우진은 천천히 회색 조각을 짚으며 이유를 설명했다. 이해하는 데 시간이 걸렸지만 그는 한 번도 서두르지 않았다. “색을 보는 눈은 길러져요. 오늘 하나 늘었어요.”'); }},
  {label:'“솔직히 우연이에요. 그런데 마음에 들었어요”', sub:'매력 · 호감↑', run(S){ return _lsdR(S, 'ujin', 5, {charm:1, self:1}, 'u_honest', '우진의 입가가 부드럽게 풀렸다. “우연이라고 말해 주는 사람이 드물어요. 대부분 처음부터 다 계획한 척하거든요.” 그가 쪽빛 천 조각 하나를 건넸다. “이건 선물이에요. 우연히 마음에 들어서.”', 'shy'); }},
  {label:'“그럼 이 색을 어떻게 고쳐야 하나요?”라고 가르침을 청한다', sub:'학식 · 실무', run(S){ return _lsdR(S, 'ujin', 4, {know:1, skill:1, work:1.5}, 'u_learn', '우진은 가위를 들어 천 조각 한쪽 끝을 비스듬히 잘랐다. “색은 고치는 게 아니라 옆에 둘 사람을 바꾸는 거예요.” 그의 설명은 시처럼 들렸지만 따라 해 보니 정말 색이 살아났다.'); }},
 ]},

{id:'ls_ujin_2', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_1', 2) && S.m < 108,
 speaker:'신우진', title:'새벽 원단 시장', place:'rain', img:'art/bg_shop.webp', cut:'ujin', cutVar:'a',
 beats:['새벽 다섯 시, 비가 내린다. 우진이 컬렉션용 원단을 직접 고르겠다며 나를 불러냈다.', '좁은 골목마다 원단 롤이 쌓여 있다. 그는 롤 사이를 걸으며 손끝으로 천을 쓸고, 눈을 감은 채 결을 읽는다.', '“비 오는 날 천은 평소보다 솔직해요. 습기를 먹으면 거짓 광택이 사라지거든요.”'],
 text:S => `상인이 같은 색이라며 건넨 롤 두 개를 우진이 번갈아 만진다. ${lvFlag(S, 'ujin', 'u_eye') ? '내 눈에도 두 롤의 색이 미묘하게 다르게 보인다.' : '솔직히 내 눈에는 똑같아 보이지만, 그의 표정이 굳어 있다.'} 어떻게 할까?`,
 choices:[
  {label:'두 롤을 펼쳐 놓고 빛에 비춰 색 차이를 짚는다', sub:'감각 · 호감↑', run(S){ if(S.st.sense >= 50) return _lsdR(S, 'ujin', 9, {sense:1.5, work:1.5}, 'u_dye', '“염색 로트가 달라요. 이쪽이 아주 조금 붉어요.” 내 지적에 상인이 머쓱하게 머리를 긁었고 우진은 나를 오래 바라보았다. “지금 이 순간이, 제가 당신을 믿게 된 때예요.”'); return _lsdR(S, 'ujin', 4, {sense:1, stress:3}, 'u_dye', '빛에 비춰 봐도 확신이 서지 않았다. 그래도 정직하게 “잘 모르겠지만 이쪽이 더 따뜻해 보여요”라고 말했다. 우진이 짧게 웃었다. “그 말이 틀린 말이 아니라서 괜찮아요.”'); }},
  {label:'상인과 가격을 조율해 불량 롤을 교환받는다', sub:'협상 · 호감↑', run(S){ if(S.st.neg >= 45) return _lsdR(S, 'ujin', 7, {neg:1.5, work:1.5}, 'u_deal', '상인은 처음엔 버텼지만 내가 입고 날짜와 지난번 거래 기록을 차근차근 들이밀자 한숨을 쉬며 교환에 응했다. 돌아서는 우진의 입가에 비가 아닌 웃음이 번졌다. “협상하는 모습, 재단하는 손 같아요.”'); return _lsdR(S, 'ujin', 3, {neg:1, stress:4}, 'u_deal', '상인은 끝내 교환은 안 된다고 버텼다. 그래도 우진은 내 서툰 협상을 끝까지 옆에서 들어 주었다. “교환은 못 했어도, 같이 서 있어 줘서 충분해요.”'); }},
  {label:'우산을 기울여 그의 어깨가 젖지 않게 한다', sub:'관계↑ · 부끄러움', run(S){ return _lsdR(S, 'ujin', 6, {bond:1.5, charm:0.5}, 'u_umbrella', `우진이 걸음을 멈췄다. 내 우산 아래로 들어오며 낮게 말했다. “이 색은 처음 봐요. 빗속의 베이지.” ${isCouple(S, 'ujin') ? '그의 손가락이 내 손가락 사이로 천천히 들어왔다. 우산 손잡이를 같이 쥔 셈이다.' : '우산 안이 너무 좁아서 팔이 닿았다. 둘 다 앞만 보고 걸었다.'}`, 'shy'); }},
 ]},

{id:'ls_ujin_3', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_2', 3) && affOf(S, 'ujin') >= 30 && S.m < 112,
 speaker:'신우진', title:'서랍 속 미완성 컬렉션', place:'room', img:'art/bg_office.webp', cut:'ujin', cutVar:'b',
 beats:['작업실 불이 꺼진 늦은 밤. 열쇠를 받아 원단 샘플을 가지러 갔다가, 열린 서랍 틈으로 스케치북 하나를 보게 된다.', '표지에는 아무 글씨도 없다. 안에는 완성되지 못한 컬렉션이 한 장씩 채색되어 있다. 모든 장 끝에 날짜가 적혀 있다. 모두 삼 년 전이다.', '문이 열리고 우진이 서 있다. 그의 얼굴이 처음으로 색을 잃는다.'],
 text:S => `“…보셨군요.” 우진이 천천히 서랍을 닫는다. “삼 년 전, 같이 일하던 선배가 이 도안들을 자기 이름으로 발표했어요. 그 뒤로 저는 도안을 서랍에 넣는 사람이 됐고요.” ${isCouple(S, 'ujin') ? '그가 연인인 나에게 이 말을 꺼내기까지 얼마나 오래 걸렸을까.' : '이 사람이 이 말을 꺼내기까지 얼마나 오래 걸렸을지 짐작이 간다.'}`,
 choices:[
  {label:'“이거 세상에 내놔요. 제가 같이 정리할게요”', sub:'도전 · 호감 큰 변동', run(S){ if(S.st.dare >= 50) return _lsdR(S, 'ujin', 10, {dare:1.5, self:2, bond:1.5}, 'u_open', '우진은 한참 침묵하다가 서랍을 다시 열었다. “…당신이 옆에 있다면요.” 우리는 그날 밤 스케치북을 한 장씩 스캔했다. 삼 년 만에 도안들이 처음으로 환한 빛을 받았다.'); return _lsdR(S, 'ujin', -5, {stress:5}, 'u_pressed', '내 말이 너무 앞서 나갔다. 우진이 서랍을 잠그며 조용히 말했다. “아직 그 정도까지는 준비가 안 됐어요.” 내가 그의 속도를 건너뛴 것이다. 닫힌 서랍 소리가 오래 남았다.', 'serious'); }},
  {label:'“말해 줘서 고마워요. 서두르지 않을게요”', sub:'매력 · 호감↑', run(S){ return _lsdR(S, 'ujin', 7, {charm:1, self:1.5, stress:-2}, 'u_wait', `우진은 긴장이 풀린 듯 의자에 앉았다. “사람들은 대개 해결책부터 말하는데요, 당신은 들어 줬어요.” ${isCouple(S, 'ujin') ? '그가 내 손등에 이마를 대고 한참 숨을 골랐다.' : '그가 작은 목소리로 덧붙였다. “이 얘기를 한 사람이 당신이 처음이에요.”'}`, 'shy'); }},
  {label:'“그 선배의 이름을 알려 줘요. 제가 알아볼게요”', sub:'통찰 · 호감 변동', run(S){ if(S.st.ins >= 50) return _lsdR(S, 'ujin', 5, {ins:1.5, work:1}, 'u_probe', '나는 이름을 듣고 기억 속 어딘가를 더듬었다. 마흔의 내가 알던 업계의 소문 몇 줄이 겹쳐졌다. “그 사람은 어차피 오래 못 가요. 서두를 필요 없어요.” 우진은 잠시 놀라더니 희미하게 웃었다. “미래를 아는 사람처럼 말하네요.”'); return _lsdR(S, 'ujin', -6, {stress:4}, 'u_pressed', '“복수는 원하지 않아요.” 우진이 힘없이 고개를 저었다. 나는 그의 상처를 해결해야 할 문제로 다룬 것이다. 그날 밤 우진은 말수가 적었고 나는 내 서툰 선의가 부끄러웠다.', 'serious'); }},
 ]},

{id:'ls_ujin_4', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_3', 3) && affOf(S, 'ujin') >= 30 && S.m < 114,
 speaker:'신우진', title:'빠진 이름', place:'cafe', img:'art/ct_mall.webp', cut:'ujin', cutVar:'b',
 beats:['컬렉션 협업자 명단이 게시판에 붙었다. 내 이름만 정확히 한 줄 비어 있다.', '며칠 전, 경쟁 브랜드에서 면접 제안을 받은 적이 있다. 그 메일이 공용 프린터 근처에서 출력된 걸 누군가 봤다는 소문이 돌았다.', '우진이 복도 끝에서 나를 보고 걸음을 멈춘다. 평소의 부드러운 눈빛이 없다. 대신 차분한 정적만 흐른다.'],
 text:S => `“당신 이름을 뺀 건 저예요. 이유는, 말하고 싶지 않았어요.” ${lvFlag(S, 'ujin', 'u_open') ? '삼 년 전의 상처를 보여 준 사람이 이번엔 내가 같은 일을 했다고 믿는 모양이다.' : '서랍 속 이야기를 아는 나는 그의 불안이 어디서 오는지 알 것 같다.'} 이 오해를 어떻게 풀까?`,
 choices:[
  {label:'면접 제안이 있었던 것도, 거절한 것도 솔직하게 말한다', sub:'협상 · 호감 큰 변동', run(S){ if(S.st.neg >= 50) return _lsdR(S, 'ujin', 10, {neg:1.5, self:2, bond:2}, 'u_clear', '나는 메일 날짜와 거절 답장까지 차근차근 보여 주었다. 우진은 한참 화면을 보다가 입술을 깨물었다. “미안해요. 또 그럴 줄 알고 먼저 문을 닫았어요.” 그가 사과하는 모습은 처음이었다.'); return _lsdR(S, 'ujin', 3, {neg:1, stress:6}, 'u_clear', '말하는 도중에 목소리가 흔들려 변명처럼 들렸다. 그래도 거짓 없이 끝까지 말했다. 우진은 완전히 믿지는 못한 얼굴로 “시간이 필요해요”라고 했다. 하지만 문은 닫히지 않았다.', 'serious'); }},
  {label:'밤새 그의 색감으로 새 도안을 그려 건넨다', sub:'감각 · 호감 큰 변동', run(S){ if(S.st.sense >= 55) return _lsdR(S, 'ujin', 11, {sense:2, work:2, stress:4}, 'u_clear', '아침에 책상 위에 올려 둔 도안을 본 우진이 한동안 서 있었다. 그가 아끼는 쪽빛과 연한 회색이 내 선으로 이어져 있었다. “이건, 의심한 사람한테 줄 그림이 아니에요.” 그가 도안을 가슴에 대었다.'); return _lsdR(S, 'ujin', 2, {sense:1.5, stress:6}, 'u_clear', '밤새 그린 도안은 아직 어설펐다. 우진은 그걸 조용히 받아 들었다. “노력은 알겠어요. 색이 아직 흔들리네요.” 칭찬은 아니었지만, 그는 도안을 쓰레기통이 아닌 서류함에 넣었다.', 'serious'); }},
  {label:'“의심할 거면 이름 빼세요”라고 한다', sub:'호감 하락 · 자존', run(S){ return _lsdR(S, 'ujin', -9, {self:2, stress:5}, 'u_cold', '우진의 얼굴에 그림자가 졌다. “…알겠어요.” 그가 고개를 끄덕이고 돌아섰다. 맞는 말이었지만 이긴 기분은 없었다. 복도 창밖의 색이 평소보다 어둡게 보였다.', 'serious'); }},
 ]},

{id:'ls_ujin_5', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_4', 3) && _lsdHigh(S, 'ujin') && S.m < 116,
 speaker:'신우진', title:'컬렉션 전야', place:'night', img:'art/ct_night.webp', cut:'ujin', cutVar:'a',
 beats:['쇼 이틀 전 밤. 거래처에서 핵심 원단의 염색이 틀어졌다는 연락이 왔다. 대체할 시간이 하루 반밖에 없다.', '우진은 작업실 한가운데서 불량 원단을 양손으로 쥔 채 서 있다. 어깨가 아주 조금 떨린다.', '“이 원단 없이 이 컬렉션은 없어요. 그렇다고 세 달을 이 색에 매달린 마음을 버릴 수도 없고요.”'],
 text:S => `${lvFlag(S, 'ujin', 'u_clear') ? '오해를 푼 뒤로 우진은 위기마다 가장 먼저 내 이름을 부른다.' : lvFlag(S, 'ujin', 'u_cold') ? '그날의 냉기가 완전히 풀리진 않았지만, 지금 이 순간만은 모든 걸 뒤로 미룰 때다.' : '시간이 부족하다. 하지만 그의 손을 놓고 싶지는 않다.'} ${isCouple(S, 'ujin') ? '“네가 없으면 이 밤을 못 넘길 것 같아.”' : '“혼자서는 못 하겠어요. 도와줄래요?”'}`,
 choices:[
  {label:'거래처 사장을 직접 찾아가 재염색을 설득한다', sub:'매력 · 협상 · 호감↑', run(S){ if(S.st.charm >= 50 || S.st.neg >= 55) return _lsdR(S, 'ujin', 10, {charm:1.5, neg:1.5, work:2, stress:6}, 'u_save', '밤 열한 시, 염색 공장의 불을 내가 직접 두드렸다. 사장은 한참 팔짱을 끼고 있다가 “내일 새벽까지는 해 보겠다”고 했다. 작업실로 돌아오자 우진이 말없이 내 손을 감쌌다. 손이 차가웠고 그의 손이 따뜻했다.'); return _lsdR(S, 'ujin', 5, {charm:1, work:1, stress:8}, 'u_save', '사장은 끝내 새벽 재염색은 어렵다고 했다. 다만 남은 원단 일부를 급히 돌려주겠다고 약속했다. 빈손은 아니었다. 우진은 내 소매의 먼지를 털어 주며 말했다. “이 정도면 충분히 해냈어요.”', 'serious'); }},
  {label:'남은 원단과 다른 색을 섞어 룩을 즉석에서 재구성한다', sub:'감각 · 호감 큰 변동', run(S){ if(S.st.sense >= 50) return _lsdR(S, 'ujin', 11, {sense:2, work:2, stress:5}, 'u_save', '새벽까지 원단 조각을 바닥에 펼쳐 놓고 색을 맞췄다. 쪽빛 사이에 연회색 한 줄을 넣자 룩 전체가 숨을 쉬는 듯했다. 우진이 한참 서서 보다가 소리 없이 웃었다. “원래 계획보다 더 낫네요. 틀어진 덕분에요.”'); return _lsdR(S, 'ujin', 4, {sense:1.5, work:1, stress:8}, 'u_save', '조합이 어딘가 어색해서 몇 번을 다시 짰다. 우진이 옆에서 조용히 핀을 꽂아 주었다. “완벽하지 않아도 이 색이 거짓말은 아니에요.” 새벽 네 시, 둘 다 졸음을 참으며 마지막 단을 마무리했다.'); }},
  {label:'아무것도 묻지 않고 그의 곁에서 밤새 같이 손을 움직인다', sub:'관계↑ · 부끄러움', run(S){ return _lsdR(S, 'ujin', 7, {bond:2, stress:6, hp:-3}, 'u_hands', `우리는 말 없이 밤을 새웠다. 핀을 꽂고 시침질을 하고 이따금 서로의 손가락을 찔러 반창고를 붙여 주었다. ${isCouple(S, 'ujin') ? '새벽 다섯 시, 우진이 내 어깨에 이마를 대고 짧게 속삭였다. “이 일을 하길 잘했어. 네가 있는 이 밤이 생겨서.”' : '새벽 다섯 시, 그가 작게 중얼거렸다. “오늘 밤의 색은 아마 오래 기억날 것 같아요.”'}`, 'shy'); }},
 ]},

{id:'ls_ujin_6', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_5', 3) && _lsdHigh(S, 'ujin') && S.m < 119,
 speaker:'신우진', title:'계절의 첫 옷', place:'room', img:'art/bg_room_autumn.webp', cut:'ujin', cutVar:'a',
 beats:['쇼가 끝나고 며칠 뒤. 우진이 종이 상자를 들고 조심스럽게 작업실로 나를 부른다.', '상자 안에는 가을빛의 코트 한 벌이 접혀 있다. 내가 한 번도 말한 적 없는 어깨선, 소매 길이, 쪽빛 안감이다.', '“치수는 그동안 곁에서 눈으로 쟀어요. 오늘 이 옷이 이 계절의 첫 번째 옷이에요.”'],
 text:S => `${lvFlag(S, 'ujin', 'u_open') ? '서랍에서 꺼낸 그의 도안들이 쇼에서 처음으로 빛을 받았다.' : '그가 오래 닫아 두었던 마음이 이 옷 한 벌만큼 열렸다.'} 안감 한쪽에는 작은 글씨가 수놓여 있다. ${isCouple(S, 'ujin') ? '“사계절 내내, 네 옷은 내가 지을게.”' : '“계절마다 첫 옷은 당신에게.”'} 이 마음에 어떻게 답할까?`,
 choices:[
  {label:'그 자리에서 코트를 입고 거울 앞에 선다', sub:'감각 · 매력 · 호감↑↑', run(S){ S.album.push('우진이 지어 준 가을 코트 안감에는 쪽빛 실로 수놓은 약속이 있었다.'); lvSet(S, 'ujin', 'u_promise'); if(S.st.sense >= 50 || S.st.charm >= 55) return _lsdR(S, 'ujin', 12, {sense:1.5, charm:1.5, self:3, bond:2}, 'u_final', `코트는 놀랄 만큼 몸에 맞았다. 거울 속 나를 본 우진이 숨을 삼켰다. “역시 색은 거짓말을 안 하네요.” ${isCouple(S, 'ujin') ? '그가 뒤에서 어깨 위에 손을 얹고 거울 속 내 눈을 바라보았다. “매년 첫 옷은 서로를 위해서 짓자.”' : '“약속할게요. 이 계절의 첫 옷은, 앞으로도 당신 몫이에요.”'}`); return _lsdR(S, 'ujin', 9, {self:3, bond:2}, 'u_final', `코트가 약간 헐렁했지만 우진은 개의치 않고 소매를 접어 주었다. “이건 앞으로 더 맞아 갈 거예요.” ${isCouple(S, 'ujin') ? '그의 손끝이 내 소매 위에 오래 머물렀다.' : '그의 말이 옷에 대한 건지 우리에 대한 건지 한참 생각했다.'}`, 'shy'); }},
  {label:'“저도 약속 하나 드릴게요. 제 첫 번째 도안은 당신 거예요”', sub:'도전 · 호감↑', run(S){ S.album.push('우진에게 약속했다. 내 첫 번째 도안은 언제나 그의 몫이라고.'); lvSet(S, 'ujin', 'u_promise'); return _lsdR(S, 'ujin', 10, {dare:1.5, self:3, work:1}, 'u_final', `우진은 한동안 아무 말도 하지 못했다. 이윽고 서랍에서 새 스케치북을 꺼내 첫 장에 내 이름을 적었다. ${isCouple(S, 'ujin') ? '“그럼 첫 장은 지금 같이 그려요.” 우리는 한 장의 종이에 서로 다른 색 선을 이어 그렸다.' : '“…그럼 저는 첫 장을 비워 둘게요. 당신이 시작할 수 있게.”'}`, 'shy'); }},
  {label:'말없이 그의 손을 잡고 안감의 글씨를 같이 읽는다', sub:'감각 · 호감↑', run(S){ S.album.push('우진의 손을 잡고 안감 위의 글씨를 함께 읽었다. 가을 첫 옷이 약속이 되었다.'); lvSet(S, 'ujin', 'u_promise'); return _lsdR(S, 'ujin', S.st.sense >= 45 ? 9 : 7, {sense:1, self:3, bond:2}, 'u_final', `실밥 하나하나가 그의 숨과 시간을 닮아 있었다. ${S.st.sense >= 45 ? '나는 글자 사이의 색 변화가 일부러 점점 짙어지게 수놓여 있다는 걸 알아챘다. “시작은 연하게, 끝은 진하게. 약속이 깊어지는 방향이죠?” 우진이 눈시울을 붉히며 고개를 끄덕였다.' : '우진이 낮게 말했다. “다 읽지 않아도 돼요. 입고 지내다 보면 천천히 읽혀요.”'}`, 'shy'); }},
 ]},

// ════════ 약속 이후: 유찬 7~8 ════════
{id:'ls_yuchan_7', lover:'yuchan', cond:S => isMet(S, 'yuchan') && afterEv(S, 'ls_yuchan_6', 2) && _lsdHigh(S, 'yuchan') && S.m < 119,
 speaker:'안유찬', title:'별점 한 개', place:'night', img:'art/bg_office.webp', cut:'yuchan', cutVar:'b',
 beats:['서비스를 연 지 일주일. 앱스토어 리뷰에 별점 한 개짜리가 열 개 넘게 달렸다. 결제 화면이 가끔 멈춘다는 불만이다.', '유찬은 아무 말 없이 노트북을 끌어안고 화장실 쪽 비상 계단으로 사라졌다. 약속했던 새벽이 또 혼자가 되려 한다.', '계단 아래에서 키보드 소리가 들린다. 평소보다 훨씬 거칠다.'],
 text:S => `“이건 내 코드가 약한 거예요. 내가 부족한 거고.” 그가 화면에서 눈을 떼지 않은 채 말한다. ${lvFlag(S, 'yuchan', 'y_promise') ? '병합 버튼 위에서 나눈 약속이 떠오른다. 새벽에는 같이 깨어 있기로 했다.' : '그가 또 혼자 짊어지려 한다.'} ${isCouple(S, 'yuchan') ? '이 사람의 곁이 내 자리라는 걸 이제는 안다.' : '내가 어디까지 다가가도 되는지 아직 모르겠다.'}`,
 choices:[

// 효과 → 칩 순으로 결과 객체를 만든다. more: {aff:[id,Δ], rv:Δ, mood:'shy', run(ch)}
const _sxR = (S, o, text, more) => {
  const ch = [], m = more || {};
  if(m.aff) addAff(S, m.aff[0], m.aff[1], ch);

 choices:[

    if(S.st.sense >= 40){ return _srOut(S, {sense:0.5, work:1}, 2, `그는 비웃으며 입고 온 오버사이즈 재킷을 벗어 던졌다. 나는 소매 길이와 어깨선만 집어 한 번 접어 주었다. 십 초 뒤, 거울 앞에서 그의 눈이 아주 잠깐 멈췄다. “…뭐야, 이 사람.” 고맙다는 말은 없었지만 쫓겨나지도 않았다.`, 'shy'); }
    return _srOut(S, {stress:3}, 0, `그가 던지듯 내민 재킷은 내가 보기에도 어울리지 않았다. “그것 봐요, 말할 것도 없잖아.” 비웃음을 뒤로하고 그는 먼저 나가 버렸다. 첫날부터 나는 졌다.`, 'serious'); }},
  {label:'“담당이라서 있는 거예요. 싫으면 팀장님께 직접 말하세요.”', sub:'협상 · 관계 마찰', run(S){ _srStart(S); _srHost(S, 1);
    if(S.st.neg >= 40){ return _srOut(S, {neg:0.5, self:1}, 1, `그가 처음으로 고개를 들었다. 모자 챙 아래에서 짜증 섞인 눈이 나를 훑었다. “…재수 없게 말하네.” 하지만 그는 팀장에게 가지 않았다. 앞의 세 명에게는 없던 일이라고, 나중에 막내가 속삭여 주었다.`, 'serious'); }
    return _srOut(S, {stress:4}, -1, `“그럼 그렇게 하죠.” 그는 정말로 팀장에게 갔고, 나는 오후 내내 회의실에서 해명해야 했다. 첫 담당은 하루 만에 끝나지 않았지만, 이 사람은 사람을 시험하는 데 거리낌이 없다.`, 'serious'); }},
  {label:'말없이 의상 행거를 정리하며 그의 움직임을 지켜본다', sub:'통찰 · 단서', run(S){ _srStart(S); _srHost(S, 1);
    if(S.st.ins >= 45){ lvSet(S, 'raon', 'ankle', 1); return _srOut(S, {ins:0.8}, 1, `그는 앉을 때도, 일어설 때도 왼발에 체중을 싣지 않았다. 신발 끈은 유난히 단단히 묶여 있었고, 바지 밑단은 일부러 내려 있었다. 마흔의 눈으로만 읽히는 아주 작은 어색함. 나는 아무 말도 하지 않고 머릿속에 적어 두었다.`, 'serious'); }
    return _srOut(S, {work:0.5}, 0, `한 시간 내내 그는 휴대폰만 봤고, 나는 행거만 정리했다. 스태프들이 눈치만 보는 이유는 알 것 같다. 그가 왜 저렇게까지 날을 세우는지는, 아직 알 수 없다.`, 'serious'); }},
 ]},

// ════════ 2. 현장 충돌 ════════
{id:'sp_raon_2', cond:S => afterEv(S, 'sp_raon_1', 2) && _srOk(S),
 speaker:'강라온', title:'화보 촬영장의 일침', place:'room', img:'art/bg_office.webp', cut:'raon', cutVar:'b',
 beats:[
  '잡지 화보 촬영 날. 스튜디오 가득 조명이 켜져 있는데 주인공은 한 시간째 대기실에서 나오지 않는다.',
  '막내 어시스턴트가 세 번째로 문을 두드렸다. 안에서 의상이 벽에 부딪히는 소리가 났다. “이딴 걸 입으라고? 내 얼굴 팔아서 장사하는 거잖아!”',
  '문이 열리고, 던져진 재킷이 막내의 발치에 떨어졌다. 막내는 눈물이 맺힌 채 옷을 주워 들었다. 스태프 서른 명이 숨을 죽이고 있다.',
  '“울 거면 나가요. 어차피 내 이름 팔아서 월급 받는 사람들이.” 마스크 뒤의 목소리가 떨리는 걸 나만 알아챘다.',
 ],
 text:S => `이 사람은 지금 자기가 한 말에 자기가 더 다쳤다. 그런데 그걸 받아 주기엔 이 현장의 서른 명이 너무 아프다. 나는 마흔의 기억 속, 어떤 어른도 해 주지 않았던 말을 해야 하는 순간이다. 어떻게 할까?`,
 choices:[
  {label:'“현실을 봐요. 당신이 무너지면 이 사람들이 같이 무너져요.”', sub:'협상·통찰 · 호감 소폭 ↓ · 일침', run(S){ _srHost(S, 2);
    if(S.st.ins >= 45){ lvSet(S, 'raon', 'pierced', 1); return _srOut(S, {ins:0.8, self:1.5, stress:3}, 0, `“월급 받는 게 아니라, 당신 이름으로 먹고사는 사람들이에요. 그래서 당신이 허세로 버티면 제일 먼저 다치는 건 저 막내예요. 나이 스물넷이면 그럴 수도 있어요. 하지만 스물넷이라는 게 면죄부는 아니에요.” 그의 눈이 흔들렸다. “…당신이 나에 대해 뭘 안다고.” 대답은 하지 않았다. 마스크 위로 눈이 붉어져 있었다.`, 'shy'); }
    return _srOut(S, {neg:0.5, stress:4, self:1}, -1, `“현실을 봐요. 당신이 무너지면 같이 무너지는 사람들이 저기 서 있어요.” 현장이 얼어붙었다. 그는 한참 나를 노려보다가 “꺼져요”라고 뱉고 문을 닫았다. 후회는 없지만 마음은 쓰리다.`, 'serious'); }},
  {label:'막내를 내보내고 문 앞에 둘만 남아 낮게 말한다', sub:'매력 · 사적인 훈계', run(S){ _srHost(S, 2);
    if(S.st.charm >= 40){ return _srOut(S, {charm:0.5, bond:1}, 1, `“막내는 제가 달랠게요. 당신은 거울 한번 봐요. 그 표정으로 카메라 앞에 서면 사진이 거짓말을 해요.” 한참 말이 없던 그가 중얼거렸다. “…어른인 척하지 마요.” 하지만 문틈은 닫히지 않았다.`, 'shy'); }
    return _srOut(S, {stress:3}, -1, `조용히 말하려 했지만 그는 비웃기만 했다. “설교는 무대 위에서 충분히 들어요.” 문이 닫혔다. 현장은 한 시간 더 지연됐고, 나는 사과문을 쓰는 사람이 되었다.`, 'serious'); }},
  {label:'촬영을 잠시 멈추고 의상을 즉석에서 다시 짠다', sub:'감각 · 실력으로 입 막기', run(S){ _srHost(S, 2);
    if(S.st.sense >= 45){ return _srOut(S, {sense:0.8, work:2}, 2, `나는 그가 던진 재킷을 뒤집어 안감 색을 드러내고, 소품 셔츠의 소매를 롤업해 새로 입혔다. 사진기자가 “이게 훨씬 낫다”고 중얼거렸다. 거울 앞에서 그가 말없이 서 있었다. “…내가 원한 건 아니지만.” 문장은 거기서 끊겼다. 입은 채로 촬영장에 걸어 나갔다.`, 'shy'); }
    return _srOut(S, {skill:1, stress:3}, 0, `급하게 바꿔 봤지만 어딘가 덜 맞았다. 그는 거울을 보고 “이게 최선이에요?”라며 비꼬았다. 결국 촬영은 원래 의상으로 끝났고, 나는 자존심만 구겨졌다.`, 'serious'); }},
 ]},

// ════════ 3. 공개 말다툼과 거부당한 악수 ════════
{id:'sp_raon_3', cond:S => afterEv(S, 'sp_raon_2', 2) && _srOk(S),
 speaker:'강라온', title:'거부당한 악수', place:'room', img:'art/bg_office.webp', cut:'raon', cutVar:'b',
 beats:[
  '방송국 리허설 복도. 다른 팀 스태프와 매니저, 작가들이 오가는 한복판에서 그가 내 길을 막아섰다.',
  '“내가 입겠다고 한 옷을 왜 마음대로 바꿨어요? 당신이 뭔데 내 무대를 정해요?” 목소리가 복도에 울린다. 시선이 몰린다.',
  '“무대에 서는 건 당신이지만 카메라에 찍히는 건 우리 둘의 일이에요. 어제 약속한 시안대로 한 거예요.” 내 목소리도 낮지만 흔들리지 않는다.',
  '결국 실장이 달려와 우리 사이에 섰다. “둘 다 그만. 서로 사과하고, 악수하세요.” 나는 손을 내밀었다. 그는 내 손을 한 번 보고, 고개를 돌렸다.',
 ],
 text:S => `허공에 뜬 내 손에 모든 시선이 꽂혀 있다. 스태프들 사이에서 수군거림이 번진다. “스타일리스트가 센터한테 대들었대.” “저러다 잘리지.” 그는 모자 챙 아래에서 시선을 피하고 있다. 어떻게 할까?`,
 choices:[
  {label:'손을 거두지 않고 그가 시선을 돌릴 때까지 기다린다', sub:'매력 · 침착함', run(S){ _srHost(S, 3);
    if(S.st.charm >= 40){ return _srOut(S, {charm:0.8, self:1}, 1, `십 초, 이십 초. 복도가 조용해졌다. 그는 끝내 손을 잡지 않았지만 한쪽 발끝이 불안하게 움직였다. 실장이 헛기침을 하자 그가 먼저 자리를 떴다. “…이상한 사람.” 지나치는 순간 들린 중얼거림이 비웃음 같지 않았다.`, 'shy'); }
    return _srOut(S, {stress:4, self:-0.5}, -1, `손을 든 채로 나는 한참 서 있었다. 그는 끝내 돌아보지 않았고, 사람들은 흩어졌다. 팔이 저릿했지만 더 저린 건 얼굴이었다.`, 'serious'); }},
  {label:'손을 내리고 “악수는 일할 때 하는 거예요. 시안부터 맞춰요”라고 말한다', sub:'협상 · 공과 사 구분', run(S){ _srHost(S, 3);
    if(S.st.neg >= 45){ return _srOut(S, {neg:0.8, work:2, bond:1}, 0, `실장이 안도의 한숨을 쉬었다. 나는 일 이야기로 곧장 돌아가 시안 두 개를 펼쳤다. 그가 따라오지 않으려다 멈칫했다. 스태프들 사이에서 “저 사람 뭐지”라는 말이 “저 사람 일은 하네”로 바뀌었다.`, 'serious'); }
    return _srOut(S, {stress:3, work:0.5}, -1, `일 이야기를 꺼냈지만 분위기는 가라앉은 채였다. 그는 이어폰을 꽂았고, 대화는 일방적으로 끝났다. 일은 간신히 이어졌다.`, 'serious'); }},
  {label:'“당신이 그렇게 구는 이유를 나는 알아요”라고 쏘아붙이고 자리를 뜬다', sub:'도전 · 스트레스 ↑ · 소문 ↑', run(S){ _srHost(S, 3);
    if(S.st.dare >= 45){ return _srOut(S, {dare:0.8, self:1.5, stress:5}, -2, `복도에 정적이 흘렀다. 등 뒤에서 그가 숨을 삼키는 소리가 났다. 소문은 더 퍼지겠지만 이상하게도 속은 시원했다. 저녁에 막내가 건넨 말. “…저, 선배 편이에요.”`, 'serious'); }
    return _srOut(S, {stress:7, work:-1}, -2, `쏘아붙이고 돌아섰지만 계단참에서 다리가 풀렸다. 소문은 한 시간 만에 층을 돌았다. “스타일리스트가 센터와 싸웠다.” 내일 팀장에게 불려갈 것이다.`, 'serious'); }},
 ]},

// ════════ 4. 갈등 최고조: 일을 건 선택 ════════
{id:'sp_raon_4', cond:S => afterEv(S, 'sp_raon_3', 3) && _srOk(S),
 speaker:'강라온', title:'이름을 걸고', place:'room', img:'art/bg_office.webp', cut:'raon', cutVar:'b',
 beats:[
  '컴백 쇼케이스를 일주일 앞둔 밤. 실장이 회의실 문을 닫고 서류를 펼쳤다. “소속사에서 콘셉트를 확정했어요. 청순한 순정남. 스캔들 이미지를 덮을 거예요.”',
  '시안에는 무릎이 드러나는 반바지와 얇은 굽의 구두가 그려져 있다. 라온의 얼굴이 하얗게 굳는다. “…싫어요. 이건 못 해요.”',
  '“라온 씨가 못 하겠다면 담당 스타일리스트를 교체할 거예요. 이번 시즌 계약도 없던 걸로 하고요.” 실장의 시선이 나를 향한다. “설득해 주세요. 부탁이 아니라 업무입니다.”',
  '라온이 나를 노려본다. “당신이 나를 팔면 끝이에요. 알죠?” 그의 목소리가 쉬어 있다. 화가 아니라 겁이 난 사람의 목소리다.',
 ],
 text:S => `그가 왜 못 하겠다는지 이유는 말하지 않는다. ${lvFlag(S, 'raon', 'ankle') ? '나는 그의 왼발을 떠올린다. 반바지와 얇은 구두라면 감춰 온 것이 드러난다. ' : ''}이 자리에서 내 일자리와 그의 비밀 사이에 선이 그어진다. 나는 어떻게 선택할까?`,
 choices:[
  {label:'실장에게 “콘셉트를 바꾸지 않으면 제 이름을 빼 주세요”라고 말한다', sub:'협상 · 일을 걸다', run(S){ _srHost(S, 4);
    if(S.st.neg >= 50){ return _srOut(S, {neg:1, work:2, self:2, stress:4}, 1, `“스타일링에 이유 없는 거부는 없어요. 이유를 들을 시간을 주세요. 그게 쇼케이스를 지키는 방법이에요.” 실장은 한참 침묵하다 안경을 벗었다. “…일주일 줄게요.” 라온은 말없이 나를 바라봤다. 믿는 눈은 아니었지만, 처음으로 피하지 않는 눈이었다.`, 'shy'); }
    return _srOut(S, {work:-2, self:2, stress:8}, -2, `“그렇다면 담당 교체 건은 내일 알려 드릴게요.” 실장은 차갑게 말했다. 라온은 비웃지도, 고마워하지도 않았다. “당신 정말 바보 같네요.” 혼자 밤길을 걷는 동안 처음으로 내가 무엇을 걸었는지 실감했다.`, 'serious'); }},
  {label:'라온에게 직접 말한다. “도망치지 말고 서든가 접든가 정해요”', sub:'도전 · 정면 승부', run(S){ _srHost(S, 4);
    if(S.st.dare >= 45 || S.st.ins >= 45){ lvSet(S, 'raon', 'confronted', 1); return _srOut(S, {dare:0.8, self:1.5, stress:5}, 0, `“비겁한 척하지 마요. 겁나면 겁난다고 말해요. 그러면 나도 같이 싸워 줄 수 있으니까.” 그가 입술을 깨물었다. “…당신이랑 상관없는 일이에요.” 그러면서도 회의실을 나가지 않았다. 문 앞에서 한 번 멈췄다. “…내일 알려 줄게요.”`, 'shy'); }
    return _srOut(S, {stress:6, self:1}, -2, `“당신이 뭔데요!” 그가 소리쳤고 컵이 바닥에서 깨졌다. 실장이 얼굴을 찌푸렸다. 그가 문을 박차고 나가고, 나는 남은 파편을 주웠다. 입안이 썼다.`, 'serious'); }},
  {label:'지시를 따르는 척하며 몰래 의상에 보강 장치를 설계한다', sub:'실무·감각 · 비밀 작업', run(S){ _srHost(S, 4);
    if(S.st.skill >= 45 || S.st.sense >= 45){ lvSet(S, 'raon', 'braced', 1); return _srOut(S, {skill:1, sense:0.5, work:1, stress:4}, 0, `나는 그날 밤 작업실에 남았다. 반바지의 안감에 얇은 압박 밴드를 꿰매 넣고, 구두의 안창을 두 겹으로 깔았다. 겉에서는 절대 보이지 않는다. 라온에게 알리지 않았다. 알면 또 화낼 테니까.`, 'serious'); }
    return _srOut(S, {skill:0.5, stress:6}, -1, `밤새 안창을 덧대 봤지만 마음에 들지 않았다. 아무것도 숨기지 못한 채 날이 밝았다. 라온은 시안을 보고도 아무 말도 하지 않았다.`, 'serious'); }},
 ]},

// ════════ 5. 전환 사건: 생방송 무대 ════════
{id:'sp_raon_5', cond:S => afterEv(S, 'sp_raon_4', 2) && _srOk(S),
 speaker:'강라온', title:'생방송, 꺾인 발목', place:'night', img:'art/ct_cinema.webp', cut:'raon', cutVar:'b',
 beats:[
  '컴백 첫 음악방송, 생방송 무대. 안개 기계 소리와 환호가 객석을 채운다. 나는 대기 구역 모니터 앞에서 팔짱을 낀 채 숨을 참는다.',
  '후렴 직전, 센터 라온이 한 발을 디디다 휘청한다. 왼쪽 발목이 꺾이는 소리가 마이크 너머로 들리는 것 같다. 카메라가 흔들린다.',
  '그는 쓰러지지 않았다. 이를 악물고 끝까지 춤을 췄고 마지막 포즈에서 웃었다. 무대 밖으로 나오자마자 무릎이 꺾였다.',
  '한 시간 뒤. 실시간 검색어에는 ‘센터 사고’. 댓글은 쏟아진다. “연기하는 인성 쓰레기.” “센터 자격 없다.” 스태프들이 수군거린다. 라온은 사라졌다.',
 ],
 text:S => `비상계단 아래, 마스크를 벗은 라온이 얼음주머니를 발목에 대고 앉아 있다. 휴대폰 화면에는 악플이 줄줄이 흐른다. “…웃어요. 다들 그러잖아요. 쇼 하다 넘어졌다고.” 어깨가 가늘게 떨린다. ${lvFlag(S, 'raon', 'braced') ? '내가 몰래 넣어 둔 압박 밴드가 오늘 그의 인대를 살렸다는 걸 의사가 확인해 주었다. ' : ''}나는 어떻게 할까?`,
 choices:[
  {label:'말없이 재킷을 덮어 주고 풀린 붕대를 다시 감아 준다', sub:'실무 · 곁에 있어 준다', run(S){ const v = _srEnsure(S); lvf(S, 'raon').hostile = 0; const b = v.aff; v.aff = Math.max(v.aff, _srEasy(S) ? 39 : 38); const ch = []; push(ch, '강라온 호감', v.aff - b); fx(S, {skill:0.8, bond:2, self:1}, ch); lvSet(S, 'raon', 'turned', S.m); S.album.push('생방송 뒤 비상계단에서 라온의 발목을 감아 줌');
    return {text:`그는 발을 빼려다 포기했다. 붕대를 감는 동안 아무도 말하지 않았다. 한참 뒤, 나직한 목소리. “…아팠어요. 한 달 전부터 계속. 쉬면 팀이 끝나고, 우리 엄마 병원비도…” 그는 말을 잇지 못했다. 나는 대답 대신 매듭을 단단히 묶었다. “그래요. 이제 혼자 안 아파도 돼요.” 그가 처음으로 마스크 없이 내 눈을 똑바로 봤다. 눈물이 고여 있었다.`, chips:ch, mood:'shy'}; }},
  {label:'휴대폰을 뺏어 엎어 놓고 말한다. “읽지 마요. 이건 소음이에요. 현실은 지금 당신 발목이에요”', sub:'통찰·학식 · 전환이 쉬운 선택', run(S){ const v = _srEnsure(S); lvf(S, 'raon').hostile = 0; const easy = S.st.ins >= 45 || S.st.know >= 45; const b = v.aff; v.aff = Math.max(v.aff, easy ? 39 : 38); const ch = []; push(ch, '강라온 호감', v.aff - b); fx(S, {ins:0.8, self:1.5, stress:-1}, ch); lvSet(S, 'raon', 'turned', S.m); S.album.push('악플이 쏟아진 밤, 라온에게 현실을 보라고 말함');
    return {text:`“당신이 처음 나에게 한 말이 이거였죠. 현실을 보라고.” 그는 쓴웃음을 지었다. “그땐 정말 싫었는데.” 나는 그의 발목을 가리켰다. “이게 현실이에요. 숫자도 댓글도 아니고요.” ${easy ? '내가 짚은 이야기는 그가 몇 번이고 속으로 되뇌던 문장이었다. 그가 고개를 푹 숙였다. 어깨가 떨렸다. “…아무도 그렇게 말해 주지 않았어요.”' : '그는 대답 대신 얼음주머니를 꼭 쥐었다. 아무 말 없이 한참 앉아 있다가 작게 말했다. “…병원은 같이 가요.”'}`, chips:ch, mood:'shy'}; }},
  {label:'몰려온 기자와 스태프 앞을 막아서며 “이 사람 지금 아파요. 비켜 주세요”라고 말한다', sub:'매력·협상 · 감싸기', run(S){ const v = _srEnsure(S); lvf(S, 'raon').hostile = 0; const b = v.aff; v.aff = Math.max(v.aff, _srEasy(S) ? 39 : 38); const ch = []; push(ch, '강라온 호감', v.aff - b); const strong = S.st.neg >= 45 || S.st.charm >= 45; fx(S, {neg:0.5, charm:0.5, self:2, stress:4, work:strong ? 1.5 : -1}, ch); lvSet(S, 'raon', 'turned', S.m); S.album.push('기자들 앞에서 라온을 몸으로 막아섬');
    return {text:`${strong ? '“지금 촬영본을 찍으면 내일 기사 제목이 바뀝니다. 이 사람의 사고가 아니라 이 사람의 부상으로요.” 기자들이 한 걸음 물러났다.' : '“비켜 주세요, 제발.” 목소리가 떨렸지만 나는 한 걸음도 물러서지 않았다.'} 등 뒤에서 라온이 숨을 삼켰다. 한참 뒤 그가 낮게 말했다. “…당신 정말 바보예요. 그런데…” 말끝을 흐리다 그가 모자를 눌러 썼다. “…고마워요.”`, chips:ch, mood:'shy'}; }},
 ]},

// ════════ 6. 서툰 사과와 어머니 이야기 ════════
{id:'sp_raon_6', cond:S => afterEv(S, 'sp_raon_5', 2) && _srOk(S),
 speaker:'강라온', title:'사과하는 법을 몰라서', place:'room', img:'art/bg_office.webp', cut:'raon', cutVar:'b',
 beats:[
  '이틀 뒤 이른 아침. 의상실 문이 조심스럽게 열렸다. 목발을 짚은 라온이 모자도 쓰지 않은 채 서 있다. 마스크도 없다.',
  '“저기… 사과하러 왔는데, 사과를 어떻게 하는지 몰라서요.” 반말 대신 어색한 존댓말이 튀어나온다. 귀 끝이 빨갛다.',
  '그의 손에는 보온 가방이 들려 있다. “어, 이건… 엄마가 보냈어요. TV에서 나 감싸 준 선생님이 누구냐고. 김밥이랑 반찬… 아니, 그런 게 아니라…”',
  '그는 스스로도 우스운지 헛웃음을 흘리고, 곧 정색을 한다. 막내가 의상실 구석에서 이쪽을 보고 있다.',
 ],
 text:S => `엄마는 분식집을 접고 그를 뒷바라지했다고 한다. 지금은 병원에 있고, 그는 TV에서 웃는 모습만 보여 주고 싶었다고 했다. 날을 세운 건 아프다는 걸 들킬까 봐서였다고. 그가 서툴게 고개를 숙인다. “…그동안 죄송했어요.” 나는 어떻게 답할까?`,
 choices:[
  {label:'“사과는 됐어요. 대신 병원부터 가요. 내가 같이 가 줄게요.”', sub:'통찰 · 호감↑', run(S){ const ch = []; addAff(S, 'raon', 5, ch); fx(S, {ins:0.5, bond:2, self:1}, ch); _srCapMax(S, 39); lvSet(S, 'raon', 'mother', 1);
    return {text:`그는 눈을 크게 떴다가 곧 시선을 피했다. “…그래도 돼요?” 병원 복도에서 그의 어머니가 나를 보고 두 손을 잡았다. “우리 아들, 사람 대하는 게 서툴러서… 고마워요.” 라온의 귀가 다시 빨개졌다. 돌아오는 길에 그가 불쑥 말했다. “…엄마가 웃은 거 오랜만이에요.”`, chips:ch, mood:'shy'}; }},
  {label:'“막내에게도 사과해요. 그게 진짜 사과예요”', sub:'협상 · 단호한 어른', run(S){ const ch = []; addAff(S, 'raon', 4, ch); fx(S, {neg:0.8, self:1.5}, ch); _srCapMax(S, 39);
    const brave = S.st.neg >= 40 || S.st.charm >= 40;
    return {text:`그는 입술을 꾹 다물고 막내 앞에 섰다. ${brave ? '“저, 그때 던진 거… 미안해요. 정말.” 막내가 울음을 터뜨렸고, 스태프들이 웃으며 박수를 쳤다. 그는 어쩔 줄 몰라 하며 내 쪽을 보았다. “…이렇게 하는 거 맞죠?” 나는 고개를 끄덕였다.' : '“그… 미안해요.” 짧고 어색했지만 막내는 고개를 끄덕였다. 그는 땀을 닦으며 내게 속삭였다. “심장 터지는 줄 알았어요.”'}`, chips:ch, mood:'shy'}; }},
  {label:'웃으며 보온 가방을 받는다. “어머니께 잘 먹겠다고 전해 주세요”', sub:'매력 · 호감↑', run(S){ const ch = []; addAff(S, 'raon', 6, ch); fx(S, {charm:0.5, bond:2, stress:-3}, ch); _srCapMax(S, 39);
    return {text:`그는 한참 나를 보다가 이내 마음이 놓인 듯 웃었다. 처음 보는 진짜 웃음이었다. 김밥은 따뜻했고 단무지는 조금 짰다. “그거 엄마가 새벽부터 쌌거든요. 맛없어도 맛있다고 해야 해요.” 나는 웃음을 참지 못했다. 그의 어머니 이야기가 나오는 순간, 이 사람이 얼마나 외로웠는지 알 것 같았다.`, chips:ch, mood:'shy'}; }},
 ]},

// ════════ 7. 설렘, 그리고 들키면 안 되는 긴장 ════════
{id:'sp_raon_7', cond:S => afterEv(S, 'sp_raon_6', 3) && _srOk(S),
 speaker:'강라온', title:'가로등 그림자', place:'night', img:'art/ct_river.webp', cut:'raon', cutVar:'a',
 beats:[
  '재활 병원에서 돌아오는 밤. 그가 마스크와 모자, 두꺼운 후드를 겹겹이 쓰고 한강공원 벤치에 앉아 있다. “여기, 새벽엔 아무도 없대요.”',
  '이어폰 한쪽을 내 귀에 꽂아 준다. 발매 전의 노래. 사실 이 곡의 도입부는 그가 병상에서 썼다고 한다.',
  '“이상하죠. 처음엔 당신이 제일 싫었는데.” 그가 시선을 피한 채 웃는다. 어깨가 닿을 만큼 가깝다.',
  '그때 맞은편 산책로에서 렌즈의 반사광이 번쩍였다. 라온의 몸이 굳는다. “…카메라예요.”',
 ],
 text:S => `아이돌과 스타일리스트가 새벽 강가에 함께 있는 사진은 곧 기사가 된다. 그의 팀, 그의 어머니, 나의 일. 모두가 얽혀 있다. 그가 내 손목을 쥔 채 속삭인다. “어떻게 해요?” 나는 어떻게 할까?`,
 choices:[
  {label:'후드를 깊게 씌워 주고 따로 갈라져 걷는다', sub:'감각 · 안전하게', run(S){ const ch = []; addAff(S, 'raon', 4, ch); fx(S, {sense:0.5, self:1, stress:3}, ch); _srCapMax(S, 39);
    const ok = S.st.sense >= 40 || S.st.ins >= 40;
    return {text:`${ok ? '나는 가로등 반대편으로 걸으며 그의 모자를 눌러 주고, 일부러 전화를 받는 척 큰소리로 말했다. “네, 의상 건이요.” 렌즈는 그 말에 방향을 틀었다.' : '급히 갈라져 걸었지만 심장이 터질 것 같았다. 다행히 사진은 찍히지 않았다.'} 멀어지는 길에서 그가 돌아보며 입 모양으로 말했다. 고마워요. 가슴이 뜨거워서 더 걷고 싶었다.`, chips:ch, mood:'shy'}; }},
  {label:'“우리는 아티스트와 스타일리스트예요. 선을 넘으면 둘 다 끝나요”라고 말한다', sub:'나 · 거리 두기', run(S){ const ch = []; addAff(S, 'raon', 2, ch); fx(S, {self:2.5, stress:2}, ch); _srCapMax(S, 39); lvSet(S, 'raon', 'line', 1);
    return {text:`그는 손목을 놓았다. 아주 잠깐 서운한 표정이 스쳤다. “…알아요.” 그러다 다시 고개를 들었다. “그래도 선 안에서 할 수 있는 건 있잖아요. 같이 밥 먹기. 안부 문자. 그 정도는 괜찮죠?” 나는 대답 대신 웃었다. 마흔의 내가 이십 대에는 하지 못했던 일, 선을 지키면서도 마음을 닫지 않는 것.`, chips:ch, mood:'shy'}; }},
  {label:'그가 잡은 손을 놓지 않고 그림자 속으로 함께 숨는다', sub:'도전 · 설렘↑ · 위험', run(S){ const ch = []; const lucky = S.st.dare >= 45 || R() < 0.5; addAff(S, 'raon', lucky ? 6 : 4, ch); fx(S, {dare:0.8, stress:lucky ? 1 : 5, self:1}, ch); _srCapMax(S, 39);
    return {text:`가로등 그림자가 우리를 삼켰다. 숨소리와 심장 소리가 겹쳤다. 그는 내 손을 놓지 않았고, 나도 놓지 않았다. ${lucky ? '불빛은 지나갔다. 그가 나직하게 웃었다. “…나, 지금 인생에서 제일 무서운데 제일 좋아요.”' : '렌즈가 오래 머물렀지만 결국 지나갔다. 둘 다 한참 말이 없었다. 그가 작게 말했다. “…다음엔 더 잘 숨을게요.”'}`, chips:ch, mood:'shy'}; }},
 ]},

// ════════ 8. 마음 확인 ════════
{id:'sp_raon_8', cond:S => afterEv(S, 'sp_raon_7', 3) && _srOk(S) && S.m < 119,
 speaker:'강라온', title:'가면을 벗는 밤', place:'night', img:'art/ct_night.webp', cut:'raon', cutVar:'a',
 beats:[
  '컴백 활동 마지막 방송이 끝난 밤. 스태프들이 철수한 주차장 옥상에서 라온이 먼저 올라와 기다리고 있다.',
  '마스크도 모자도 없다. 도시의 불빛이 그의 얼굴을 비춘다. 목발은 이제 짚지 않는다. “오늘 처음으로 아프지 않게 마지막 무대를 마쳤어요.”',
  '그가 들고 있던 작은 쇼핑백을 내민다. 안에는 접착 테이프, 줄자, 분필. 스타일리스트의 도구들이다. “필요할 것 같아서요. 선물이 이상하죠.”',
  '“그리고 하고 싶은 말이 있어요.” 그는 숨을 크게 들이쉰다.',
 ],
 text:S => `${isCouple(S, 'raon') ? '이미 서로를 연인으로 부르고 있지만, 그는 말로 확인하고 싶어 한다. ' : ''}“처음엔 당신이 제일 싫었어요. 나보다 내 거짓말을 먼저 알아봐서. 그런데 그 사람이 내 발목도, 내 엄마도, 내 무서움도 다 알고도 도망가지 않았어요. 나, 당신을 좋아해요. 아이돌 말고, 강라온으로요.” 나는 어떻게 답할까?`,
 choices:[
  {label:'“나도 좋아해요. 마흔 살의 기억까지 다 털어놓고 싶을 만큼”', sub:'솔직함 · 호감 크게↑', run(S){ const ch = []; addAff(S, 'raon', 12, ch); fx(S, {self:2, bond:3, stress:-6}, ch); lvSet(S, 'raon', 'arc_done'); S.album.push('가면을 벗은 라온과 마음을 확인한 밤');
    return {text:`“마흔이요?” 그가 고개를 갸웃했다가 이내 웃었다. “뭐든 괜찮아요. 당신이 어떤 사람이든.” 나는 그의 손을 잡았다. 이번에는 둘 다 피하지 않았다. 도시 야경 위로 바람이 지나갔다. 이마가 맞닿았다가 조심스럽게 떨어졌다. “…이제 진짜 비밀 하나 생겼네요, 우리.”`, chips:ch, mood:'shy'}; }},

function fixedEvents(S){
  const out = [];
  if(S.collapse){ out.push(collapseEvent(S)); }
  if(S.m === 0 && !S.seen.prologue) out.push(PROLOGUE);
  for(const c of CHECKS) if(S.m === c.m && !S.seen[c.id]) out.push(checkEvent(S, c));
  for(const e of ERA) if(S.m === e.m && !S.seen[e.id]) out.push(Object.assign({once:true, speaker:''}, e));
  if(S.m === INTEREST_M && !S.seen.interest) out.push(interestEvent(S));
  if(S.m === GRAD_M && !S.seen.graduation) out.push(graduationEvent(S));
  if(S.m === CAREERS.lawyer.school - 1 && !S.seen.bar_exam && BAR_EXAM.cond(S)) out.push(BAR_EXAM);
  const se = storyDue(S); if(se) out.push(se);
  const ne = typeof negoEvent === 'function' ? negoEvent(S) : null; if(ne) out.push(ne); // 이직 합격 직후 연봉 협상
  const ce = careerEvent(S); if(ce) out.push(ce);
  const le = loveEvent(S); if(le) out.push(le);
  if(S.m === TOTAL_MONTHS - 1) out.push(FINALE);
  return out;
}
function collapseEvent(S){
  return {id:'collapse_' + S.m, speaker:'', title:'쓰러지다', place:'room',
    text:S => '버티다 못한 몸이 먼저 신호를 보냈다. 눈을 떠 보니 병원 천장이었다. 의사가 한마디 했다. “이렇게 사시면 안 됩니다.”',
    choices:[{label:'정말 쉬기로 한다', sub:'체력 회복 · 자금 -30', run(S){ const ch = []; S.collapse = false; S.hp = 50; S.stress = 45; fx(S, {cash:-30, self:-2, ins:1}, ch); return {text:'일주일을 입원해 있었다. 마흔의 몸은 이렇게 무너졌을 것이다. 이번에는 늦지 않게 멈췄다.', chips:ch}; }}]};
}
function pickEvent(S){
  const pool = EVENTS.filter(e => (!e.once || !S.seen[e.id]) && (!e.cd || (S.cd[e.id] == null) || S.m - S.cd[e.id] >= e.cd) && (!e.cond || e.cond(S)));
  if(!pool.length) return null;
  const tot = pool.reduce((a, e) => a + (e.w || 1), 0); let r = R() * tot;
  for(const e of pool){ r -= (e.w || 1); if(r <= 0) return e; }
  return pool[pool.length - 1];
}

const chapterOf = S => Math.min(10, Math.floor(S.m / 12) + 1);
const STORY_BASE = () => ({pieces:0, rival:0, momStage:0, truth:0, f:{}});
const SS = S => (S.story = S.story || STORY_BASE());
const SF = S => SS(S).f;
const RIVAL = '서하린';
// 시계 조각을 하나 얻는다(장마다 한 번). 칩에 표시한다.
function givePiece(S, ch){ const st = SS(S); st.pieces = Math.min(10, st.pieces + 1); push(ch, '시계 조각', 1); S.album.push(`시계 조각 ${st.pieces}개째를 얻음`); }
// 라이벌과의 관계를 바꾼다(+우호 / -적대). 칩에 표시한다.
function rivalMood(S, d, ch){ const st = SS(S); const b = st.rival; st.rival = clamp(st.rival + d, -10, 10); if(ch) push(ch, `${RIVAL} 관계`, st.rival - b); }
const rivalState = S => { const r = SS(S).rival; return r >= 4 ? 'ally' : r <= -4 ? 'enemy' : 'neutral'; };

  text:S => { const st = rivalState(S); return st === 'ally' ? '하린이 먼저 서류 얘기를 꺼냈다. “같이 내는 거, 어색하지 않죠?” 어색하지 않은 척하는 목소리였다.' : st === 'enemy' ? '하린은 서류 앞에서 내 쪽을 한 번도 보지 않았다. 정면 승부를 원하는 사람의 침묵이었다.' : '장학금 서류를 쓰던 도서관에서 하린과 눈이 마주쳤다. 서로 아무 말도 하지 않았다.'; },
  choices:[
    {label:'서류를 완벽하게 준비해 정면 승부한다', sub:'학식 +1 · 승산 보통', run(S){ const win = _saScore(S) + 6 + rand(-10, 10) > 38; return win ? _sa(S, {cash:120, know:1, stress:2}, -1, '장학금 통지서가 왔다. 120만 원. 기쁨보다 하린의 얼굴이 먼저 떠올랐다. 그녀는 복도에서 “축하해요”라고 정확하게 말했고, 그날 이후 도서관에서 보이지 않았다.', 'sad') : _sa(S, {know:1, stress:3}, 0, '장학금은 하린에게 돌아갔다. 통지서를 들고 서 있던 그녀가 나를 보았다. 이긴 얼굴이 아니었다. 안도하는 얼굴이었다. 나는 그 표정을 오래 기억했다.', 'shy'); }},
    {label:'서류를 내지 않고 포기한다. 하린이 받게', sub:'하린 관계 +3 · 나 -1', run(S){ return _sa(S, {self:-1, stress:2}, 3, '며칠 뒤 하린이 사물함 앞에서 나를 막았다. “누가 부탁했어요? 동정은 받지 않습니다.” 목소리는 매서웠지만 손에는 합격 통지서가 구겨져 있었다. “…빚이에요. 갚을게요.”', 'shy'); }},
    {label:'하린에게 서류 검토를 부탁한다', sub:'하린 관계 +1 · 상황에 따라 승산 변동', run(S){ const help = rivalState(S) !== 'enemy'; const win = _saScore(S) + (help ? 11 : 5) + rand(-10, 10) > 38; if(win) return _sa(S, {cash:120, know:1.5}, help ? 1 : 0, help ? '하린이 붉은 펜으로 오탈자까지 잡아 줬다. 결과는 내 승리. 통지서를 받자 그녀가 말했다. “내가 잡아 준 건 맞춤법뿐이에요. 내용은 당신 거고요.” 그 말이 위로처럼 들렸다.' : '검토를 맡기는 건 도박이었다. 하린은 날카롭게 약점만 짚었다. 그 약점을 고친 서류로 장학금을 받았다. 고마운 건지 분한 건지 알 수 없었다.', 'serious'); return _sa(S, {know:1.5}, help ? 2 : 0, '결과는 하린이었다. “미안하다고 하면 모욕이겠죠.” 그녀는 서류에 남긴 붉은 펜 자국을 보며 말했다. “다음엔 같이 이길 방법을 찾아요.”', 'tender'); }},

Object.assign({}, _saHarin, {id:'rv_library_night', w:4, cd:10, cond:S => S.m >= 8 && S.m <= 110, place:'night', title:'새벽 두 시의 열람실',

Object.assign({}, _saHarin, {id:'rv_help_sab', w:5, cd:10, cond:S => S.m >= 12 && S.m <= 105, place:'campus', title:'마감 한 시간 전',
  text:S => { const r = SS(S).rival; return r >= 2 ? '과제 마감 한 시간 전, 사물함에 포스트잇이 붙어 있었다. 「3번 식은 분모가 틀렸어요. —H」 틀림없이 하린의 필체였다.' : r <= -2 ? '조별 과제 제출 직전, 공유 폴더의 내 파일이 한 시간 전 버전으로 되돌려져 있었다. 마지막 수정자는 비어 있었다. 그런 일을 할 사람은 한 명밖에 떠오르지 않았다.' : '과제 옆자리에서 하린이 아무 말 없이 지우개 가루를 털었다. 내 답안 한 문제를 가리켰다. “이건 틀렸어요. 이유는 안 알려 줄 거예요.”'; },
  choices:[

    {label:'말없이 스스로 해결한다', sub:'일 +2 · 스트레스 +3', run:S => _sa(S, {work:2, stress:3, skill:1}, 0, '시간 안에 어떻게든 제출했다. 누구도 나를 구해 주지 않았고, 아무도 나를 무너뜨리지 못했다. 이상하게 그게 오늘의 가장 큰 수확이었다.', 'serious')},
    {label:'작은 것으로 응수한다 (커피 한 잔)', sub:'자금 -4 · 하린 관계 +1', run:S => _sa(S, {cash:-4}, 1, '뚜껑에 「독 없음」이라고 적은 커피를 책상에 놓았다. 하린은 한참 뚜껑을 보다가 한 모금 마셨다. “…설탕 너무 많이 넣었어요.” 하지만 컵은 끝까지 비웠다.', 'tender')},
  ]}),

Object.assign({}, _saHarin, {id:'rv_job_market', once:true, w:5, cd:30, cond:S => S.m >= 38 && S.m <= 75, place:'campus', title:'채용 박람회',

Object.assign({}, _saHarin, {id:'rv_rumor', once:true, w:4, cd:30, cond:S => S.m >= 20 && S.m <= 95, place:'campus', title:'단톡방의 소문',
  text:S => { const st = rivalState(S); return st === 'enemy' ? '학과 단톡에 이상한 말이 돈다. 「서윤이 교수님 연구실에 자주 가는 이유가 따로 있대.」 출처를 쫓아가 보니 마지막에 하린의 후배가 있다.' : st === 'ally' ? '비슷한 소문이 돌았지만 하루 만에 사라졌다. 진원지 후배가 하린 앞에서 사과하는 걸 우연히 봤다. “정확하지 않은 건 말하지 않게 하고 싶었을 뿐이에요.”' : '내게 관한 소문이 돌았지만, 가장 먼저 부정한 사람이 서하린이었다는 말이 들렸다. 이상한 일이다.'; },

    {label:'무시한다. 시간이 해결해 준다', sub:'스트레스 +1 · 관계 -1', run:S => _sa(S, {stress:1, bond:-1}, 0, '일주일이 지나서야 소문은 시들었다. 하지만 몇몇 친구의 시선은 이미 한 칸 멀어져 있었다. 침묵은 평화가 아니라 비용이었다.', 'serious')},
    {label:'하린에게 직접 확인한다', sub:'하린 관계 상황에 따라 · 통찰 +1', run(S){ const st = rivalState(S); return st === 'enemy' ? _sa(S, {ins:2}, 0, '“내가 했다면 이렇게 서툴지 않았을 거예요.” 이상하게 설득력 있는 대답이었다. 나는 그녀를 의심하면서도 믿었다.', 'serious') : st === 'ally' ? _sa(S, {ins:1}, 2, '“갚은 거예요. 장학금 때.” 하린이 시선을 돌렸다. “소문은 비효율적이에요. 사람을 소모하니까.” 그녀의 정의가 나를 살렸다.', 'shy') : _sa(S, {ins:1}, 1, '“저는 소문을 만들 시간 없어요.” 하린이 단호하게 말했다. 변명 같지 않았다. 그 말이 이상하게 안심이 됐다.', 'serious'); }},

Object.assign({}, _saHarin, {id:'rv_coffee', w:3, cd:14, cond:S => S.m >= 18 && S.m <= 110 && SS(S).rival >= 0, place:'cafe', title:'식은 커피',

Object.assign({}, _saHarin, {id:'rv_bet', once:true, w:4, cd:30, cond:S => S.m >= 16 && S.m <= 80, place:'cafe', title:'소원 내기',

    {label:'거절한다. 걸 만한 게 없다', sub:'스트레스 -2 · 하린 관계 -1', run:S => _sa(S, {stress:-2}, -1, '“그렇군요.” 하린이 시간표를 접어 다시 가방에 넣었다. 아무렇지 않은 얼굴이었지만, 내기에서 진 사람 같은 어깨였다.', 'sad')},
    {label:'조건을 바꾼다. 진 쪽이 이긴 쪽 노트를 정리해 주기', sub:'학식 +1 · 하린 관계 +1', run:S => _sa(S, {know:1.5, stress:1}, 1, '“노트 정리라니, 소원치고는 시시하네요.” “시시한 게 좋은 소원이에요.” 하린이 한참 나를 보다 악수를 청했다. 그날의 악수는 조금 길었다.', 'surprised')},
  ]}),

Object.assign({}, _saHarin, {id:'rv_rain_alley', w:3, cd:18, cond:S => S.m >= 30 && S.m <= 112, place:'rain', title:'같은 우산',

// 전화 걸기: 성공하면 이벤트를 돌려주고, 횟수·달 제한은 여기서 처리한다. 걸 수 없으면 사유 문자열.
function tryCall(S, id){
  if(callsLeft(S) <= 0) return '이번 달 통화는 모두 사용했어요';
  if(calledThisMonth(S, id)) return '이번 달에 이미 통화했어요';
  const ev = callEvent(S, id); if(!ev) return '연락할 수 없어요';
  if(!S.calls || S.calls.m !== S.m) S.calls = {m:S.m, n:0};
  S.calls.n++; (S.callAt || (S.callAt = {}))[id] = S.m;
  return ev;
}

// 엔딩 판정과 텍스트 (ENGINE 구간 안, DOM 금지)
const FREE_MIN = 50, FREE_SUM = 192;

// 빌린 인생 / 되풀이된 결혼 같은 보정을 반영한 최종 3축
function finalPillars(S){
  const w = S.work - Math.min(32, S.borrowed * 2.8);
  let b = S.bond; const j = S.love.jaewoo;
  if(S.partner === 'jaewoo' && j && !j.fixed) b -= 18;
  return {work:clamp(w, 0, 100), bond:clamp(b, 0, 100), self:S.self};
}
function isFree(P){ return P.work >= FREE_MIN && P.bond >= FREE_MIN && P.self >= FREE_MIN && (P.work + P.bond + P.self) >= FREE_SUM; }

const loverOf = S => S.partner && S.love[S.partner] && S.love[S.partner].stage >= 1 && !(S.secret && S.secret[S.partner]) ? S.partner : null;
const exLovers = S => Object.keys(S.love).filter(i => S.love[i].stage === -9).length;
function computeEnding(S){
  if(S.ending) return S.ending;
  const P = finalPillars(S), raw = {work:S.work, bond:S.bond, self:S.self};
  const lov = loverOf(S), secretNow = Object.keys(S.secret || {}).some(i => S.secret[i] && S.love[i] && S.love[i].stage >= 1);
  if(isFree(P)){
    if(S.divorced && !S.married) return 'free_divorced';
    if(S.married && P.bond >= 62) return 'free_wedding';
    if(lov && P.bond >= 58) return 'free_love_' + lov;
    if(secretNow) return 'free_secret';
    if(S.hired && (S.rank || 0) >= 3 && !inLawSchool(S)) return 'free_exec';
    if((S.switched || 0) >= 1 && S.hired) return 'free_hopper';
    if(S.cash >= 1500) return 'free_rich';
    if(CAREERS[S.track] && S.hired && P.work >= 62 && !inLawSchool(S)) return 'free_' + S.track;
    if((S.engaged || S.married) && P.bond >= 70) return 'free_home';
    if(Object.keys(S.love).filter(i => S.love[i].aff >= 40 && S.love[i].stage !== -9).length >= 3) return 'free_many';
    if(!S.partner && !S.married && P.self >= 60) return 'free_single';
    if(S.st.know >= 68) return 'free_scholar';
    if(S.st.charm >= 62) return 'free_charm';
    if(S.st.dare >= 55) return 'free_dare';
    if(S.st.ins >= 62) return 'free_ins';
    if(P.self >= 75) return 'free_soul';
    return 'free_balance';
  }
  if(isFree(raw)) return 'ret_borrowed'; // 겉보기엔 통과했지만 빌린 인생이었다
  const lowest = Object.keys(P).sort((a, b) => P[a] - P[b])[0];
  if(P.work < 35 && P.bond < 35 && P.self < 35) return 'ret_all';
  if(S.lastDisc != null && P.bond < 50) return 'ret_exposed';
  if(S.divorced) return 'ret_divorce';
  if(exLovers(S) >= 3 && P.bond < 55) return 'ret_breakups';
  if(S.married && P.bond < 50) return 'ret_cold';
  if(S.stress >= 85) return 'ret_burnout';
  if(S.cash >= 1500) return 'ret_rich';
  if(!S.hired && S.m >= 60) return 'ret_nojob';
  if((S.switched || 0) >= 2) return 'ret_hopper';
  if(P.work >= 68 && P.bond < 50 && P.self < 50) return 'ret_workaholic';
  if(S.st.know >= 68) return 'ret_bookish';
  return 'ret_' + lowest;
}

  if(id === 'intern' && CAREERS[S.interest]) eff = Object.assign({}, eff, CAREERS[S.interest].eff);
  const out = [], ent = Object.entries(eff).filter(([k, v]) => v > 0 && LABEL[k]).sort((x, y) => y[1] - x[1]);
  for(const [k] of ent.slice(0, 3)) out.push({t:LABEL[k] + '▲', c:'up'});
  if(pay) out.push({t:'수입', c:'pay'});
  if(hp > 0) out.push({t:'체력▲', c:'up'}); else if(hp <= -8) out.push({t:'체력▼', c:'down'});
  if(st < 0) out.push({t:'스트레스▼', c:'up'}); else if(st >= 7) out.push({t:'스트레스▲', c:'down'});
  if(id === 'future') out.push({t:'선명도▼', c:'down'});

  if(S.hp < 30) return {t:'몸이 먼저야. 체력이 바닥이면 번아웃이 와. 이번 달엔 휴식 한 칸을 꼭 넣어.'};
  if(S.stress > 75) return {t:'스트레스가 너무 높아. 쉬거나 취미로 풀지 않으면 한 달을 통째로 날릴 수 있어.'};
  if(S.cash < 60) return {t:'통장이 비어 간다. 알바나 일로 자금을 먼저 채워 둬.'};
  const w = weakest(), msg = {work:'일 기둥이 가장 약해. ' + (S.hired ? '회사 업무와 프로젝트에 칸을 더 써 보자.' : S.m < 48 ? '공부와 인턴으로 진로를 준비하자.' : '구직 활동을 서두르자.'), bond:'관계 기둥이 약해. 친구, 가족, 마음에 둔 사람과 시간을 보내 봐. 전화도 좋아.', self:'나 기둥이 약해. 운동, 일기, 취미로 나를 돌보는 시간이 필요해.'};

function setPlan(i, id){
  const p = S.plan; if(S.dateTo) S.dateTo[i] = null; if(S.jobTo) S.jobTo[i] = null;
  const clear = j => { if(p[j] === '>'){ p[j] = null; if(p[j - 1] && ACTS[p[j - 1]] && ACTS[p[j - 1]].slots === 2) p[j - 1] = null; } else if(p[j] && ACTS[p[j]].slots === 2){ p[j] = null; p[j + 1] = null; } else p[j] = null; };
  clear(i); const a = ACTS[id];
  if(a.slots === 2){ clear(i + 1); p[i] = id; p[i + 1] = '>'; } else p[i] = id;
}

function openPicker(i, cat){
  activeSlot = i;

  if(cat) pickCat = cat; else if(!pickCat || !cat){ const lowK = weakest(); pickCat = {work:S.m < 48 ? '공부' : '일', bond:'관계', self:'나'}[lowK]; }
  const cats = ACTS_ORDER_CATS.filter(c => Object.values(ACTS).some(a => a.cat === c));
  if(!cats.includes(pickCat)) pickCat = cats[0];
  const draw = () => {
    const ids = Object.keys(ACTS).filter(id => ACTS[id].cat === pickCat).map(id => {
      const a = ACTS[id]; let why = a.req ? a.req(S) : null; if(!why && a.cost && a.cost > S.cash) why = '자금이 모자라요'; if(!why && (a.slots || 1) > 3 - activeSlot) why = '이 칸에서는 못 해요 (2칸 필요)';
      return {id, a, why};
    }).sort((x, y) => (x.why ? 1 : 0) - (y.why ? 1 : 0));

      const pay = id === 'job' && S.hired ? jobOf(S).pay : a.pay;
      const em = [pay ? `+${Math.round(pay * earnedMult(S))}만` : '', a.slots > 1 ? '2칸' : ''].filter(Boolean).join(' · ');
      return `<button class="act ${S.plan[activeSlot] === id ? 'on' : ''}" data-id="${id}" ${why ? 'disabled' : ''}><span class="top"><span class="ic">${a.icon}</span><b>${actName(S, id)}</b></span>${em ? `<span class="em">${em}</span>` : ''}${why ? `<span class="why">${why}</span>` : `<span class="d">${a.desc}</span><span class="tg">${actTags(S, id).map(t => `<i class="${t.c}">${t.t}</i>`).join('')}</span>`}</button>`;
    }).join('') + `</div><div class="foot">이번 달 활동비 ${spend}만 · 생활비 ${livingCost(S)}만${allowance(S) ? ` (지원 +${allowance(S)}만)` : ''}</div>`);
    $('x').onclick = () => { closeSheet(); render(); };
    $('b-auto').onclick = () => { S.plan = autoPlan(); assignDates(); save(); closeSheet(); render(); };
    $('b-prev').onclick = () => { if(S.lastPlan){ S.plan = S.lastPlan.slice(); save(); closeSheet(); render(); } };
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { pickCat = b.dataset.c; draw(); });
    { const tb = document.querySelector('.tabs'), on = tb && tb.querySelector('.tab.on'); if(on) tb.scrollLeft = on.offsetLeft - (tb.clientWidth - on.offsetWidth) / 2; }
    const placed = () => { save(); const nx = S.plan.findIndex(x => !x); if(nx < 0){ closeSheet(); render(); } else { activeSlot = nx; render(); draw(); } };

}

function cfb(img){ const l = (img.dataset.fb || '').split('|').filter(Boolean); const nx = l.shift(); img.dataset.fb = l.join('|'); if(nx) img.src = nx; else img.onerror = null; }
function showAct(slotName, id, out, first = 0, opts = {}){
  // 스테이지 제로 메이커처럼: 홈 화면(상태창·탭)은 그대로 두고, 가운데 팝업 카드에서 2.5등신 장면이 진행된다
  return new Promise(res => {
    const a = ACTS[id], el = $('act');
    const sp = SPRITE[id];
    let inner, cls = 'apf', frameBg = '';
    // 데이트: 연인별 일러스트(음식 장면만 나오지 않게 여러 장 중 하나), 없으면 2.5등신 데이트 세트
    const dtN = sp === 'date' && out.lover ? [1, 2, 3, 4].filter(n => DATE_ART.has(`dt_${out.lover}_${n}`)) : [];
    if(dtN.length){
      const n = dtN[Math.floor(R() * dtN.length)]; cls += ' art';
      inner = `<div class="fart dt" style="background-image:url(art/dt_${out.lover}_${n}.webp)"></div>`;
    } else if(sp){
      // 직업 일: 큰 일러스트 대신 직업별 2.5등신 캐릭터(두 장이 번갈아 움직인다). 직업 세트가 없으면 직장인 → 기본 순서로 대체
      const jobSet = sp === 'job' ? (id === 'intern' ? 'job_intern' : S.hired && CAREERS[S.track] ? `job_${S.track}` : 'job_i') : null;
      const spf = sp === 'date' && out.lover ? `date_${out.lover}` : jobSet || sp + outfitSuffix(S, id);
      const sbg = sp === 'job' ? 'art/bg_office.webp' : seasonBg(S, OUTDOOR.has(id) ? 'campus' : 'room'), bgA = ACTS[id].cp ? `art/cp_${ACTS[id].cp}.webp), url(${sbg}` : sbg;
      const fb = jobSet ? ['job_w', 'job'] : [];
      cls += ' ill'; frameBg = `style="background-image:url(${bgA})"`; // 장소 일러스트를 깔고 그 위에서 캐릭터가 움직인다
      const fbA = (fb.length ? fb : [sp]).map(x => `art/chibi/${x}_a.webp`).join('|'), fbB = (fb.length ? fb : [sp]).map(x => `art/chibi/${x}_b.webp`).join('|');
      inner = `<div class="fsp ${sp === 'friends' || sp === 'date' ? 'wide' : ''}"><img class="fa" src="art/chibi/${spf}_a.webp" alt="" data-fb="${fbA}" onerror="cfb(this)"><img class="fb" src="art/chibi/${spf}_b.webp" alt="" data-fb="${fbB}" onerror="cfb(this)"></div>`;
    } else {
      cls += ' art';
      const bg = ACT_ART.has(id) ? `url(art/act_${id}.webp)` : 'none';
      inner = `<div class="fart" style="background-image:${bg}"></div>`;
    }
    const mo = monthOf(S), d0 = first * 10 + 1, d1 = Math.min(30, (first + a.slots) * 10);
    el.innerHTML = `<div class="apop"><div class="aph"><h2>${a.icon} ${esc(actName(S, id))}</h2><span class="ptag">${slotName}</span></div><div class="${cls}" ${frameBg}>${inner}</div><div id="apx"><div class="apbar"><i></i></div><div class="apfoot"><b id="adate">${opts.noDate ? '교정 산책' : `${mo}월 ${d0}일`}</b><span>탭하면 건너뛰기</span></div></div></div>`;
    el.classList.add('on');
    const bar = el.querySelector('.apbar i'); requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '100%'; }));
    let done = false, auto = 0; const t0 = Date.now(), DUR = 2600;
    const tick = opts.noDate ? 0 : setInterval(() => { const day = Math.min(d1, d0 + Math.floor((Date.now() - t0) / DUR * (d1 - d0 + 1))); const dd = $('adate'); if(dd) dd.textContent = `${mo}월 ${day}일`; }, 120);
    const result = () => {
      if(done) return; done = true; clearInterval(tick); clearTimeout(auto);
      $('apx').innerHTML = `<div class="txt">${esc(out.note || a.desc)}</div><div class="chips">${chipHTML(out.ch)}</div><button class="btn" id="anx">다음</button>`;
      el.querySelector('.apop').onclick = null;
      $('anx').onclick = () => { el.classList.remove('on'); res(); };
    };
    auto = setTimeout(result, DUR + 200);
    el.querySelector('.apop').onclick = result;
  });
}
async function runMonth(){
  seedMonth(S); S.lastPlan = S.plan.slice();
  for(let i = 0; i < 3; i++){
    let id = S.plan[i]; if(!id || id === '>') continue; let a = ACTS[id]; const first = i;
    let fell = false; if(a.cost && a.cost > S.cash || (a.req && a.req(S))){ fell = true; id = 'rest'; a = ACTS[id]; }
    S.curDate = S.dateTo && S.dateTo[first] || null; S.curJob = S.jobTo && S.jobTo[first] || null; const out = doAction(S, id); S.curDate = null; S.curJob = null; i += a.slots - 1; if(fell) out.note = '조건이 맞지 않아 계획을 바꿔 쉬었다.';
    await showAct(SLOT_NAMES[first], id, out, first);
    if(out.burnout) break;
  }
  const sch = settle(S);
  await alertSheet(`${yearOf(S)}년 ${monthOf(S)}월 정산`, '생활비·균형을 정산했어요.', sch, '계속');
  if(!S.ending){
    const fx_ = fixedEvents(S); for(const f of fx_){ await playEvent(f); if(S.ending) break; }
    if(!S.ending){ const ev = fx_.length >= 2 ? null : (R() < 0.7 ? pickEvent(S) : null); if(ev) await playEvent(ev); }
  }
  if(!S.ending) S.m++;
  S.cpLeft = CAMPUS_VISITS; // 새 달: 교정 방문 3번 충전
  S.plan = [null, null, null];
  if(S.m >= TOTAL_MONTHS || S.ending){ S.ending = S.ending || computeEnding(S); save(); return showEnding(); }
  save(); render();
}
async function startFlow(){ // 새 게임: 프롤로그 먼저
  seedMonth(S); await playEvent(PROLOGUE); save(); render();
}

// ── 엔딩 ──────────────────────────────────────────────────────
function showEnding(){
  const id = S.ending || computeEnding(S), e = ENDINGS[id]; const P = finalPillars(S);
  const seen = store(ENDINGS_KEY) || []; if(!seen.includes(id)){ seen.push(id); store(ENDINGS_KEY, seen); }
  $('end').innerHTML = `<div class="endbg" style="background-image:url(art/${e.free ? 'age30' : 'cover'}.webp)"></div><div class="endscroll"><div class="endspacer"></div><div class="endcard ending"><div class="big">${e.icon}</div><span class="tag ${e.free ? '' : 'ret'}">${e.sub}</span><h1>${e.title}</h1>
   <div class="pillars">${Object.keys(PILLAR).map(k => `<div class="pcard ${k}"><div class="pt"><span>${PILLAR[k]}</span><b>${Math.round(P[k])}</b></div><div class="t"><i style="width:${P[k]}%"></i><u></u></div></div>`).join('')}</div>
   <div class="letter">${esc(e.letter.replace(/\{name\}/g, S.name))}\n\n— 일흔 살의 나로부터</div>
   <p class="sub">엔딩 ${seen.length}/${ENDING_IDS.length} 수집 · 빌린 인생 ${S.borrowed} · 기억 선명도 ${Math.round(S.clarity)}</p>
   <button class="btn" id="b-again">${e.free ? '다시 도전하기' : '한 번 더 되감기'}</button></div></div>`;
  $('b-again').onclick = () => { store(SAVE_KEY, null); S = null; initTitle(); show('title'); };
  show('end');
}

// ── 메뉴·기록 ─────────────────────────────────────────────────
function initGame(){
  $('btn-go').onclick = () => { if(S.plan.some(x => !x)){ openPicker(firstEmpty()); return; } $('btn-go').disabled = true; $('dialog').hidden = true; runMonth().finally(() => { $('btn-go').disabled = false; }); };
  $('b-call').onclick = openPhone;

  document.querySelectorAll('[data-sheet]').forEach(b => b.onclick = () => ({stat:showStats, career:showCareer, love:showLove, dex:showDex, shop:showShop, campus:showCampus}[b.dataset.sheet])());
  $('b-menu').onclick = () => { openSheet(sheetHead('메뉴') + `<div class="menu-list"><button class="btn ghost sm" id="m-dex">📖 도감 (엔딩·인물)</button><button class="btn ghost sm" id="m-update">🔄 새 버전 확인</button><button class="btn ghost sm" id="m-slots">💾 저장 · 불러오기 (슬롯 5개)</button><button class="btn ghost sm" id="m-title">🏠 타이틀로 (자동 저장)</button></div><div class="foot">빌드 #71 · 2026.10.11<br><span id="diag"></span></div>`);
    $('x').onclick = closeSheet;
    try{ const pr = document.createElement('div'); pr.style.cssText = 'position:fixed;left:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top);visibility:hidden'; document.body.appendChild(pr); const cs = getComputedStyle(pr), sb = cs.paddingBottom, st = cs.paddingTop; pr.remove(); const sa = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; $('diag').textContent = `화면 ${innerWidth}×${innerHeight} · 기기 ${screen.width}×${screen.height} · 안전영역 위 ${st}/아래 ${sb} · ${sa ? '홈 화면 앱' : '브라우저'}`; }catch(e){}
    $('m-dex').onclick = () => { closeSheet(); showDex(); };
    $('m-update').onclick = () => checkUpdate(true);
    $('m-slots').onclick = () => showSlots(true);
    $('m-title').onclick = () => { save(); closeSheet(); initTitle(); show('title'); }; };
  $('ov').addEventListener('click', e => { if(e.target === $('ov') && !document.querySelector('#sheet #nx')){ closeSheet(); if(S) render(); } });
}
initTitle(); initGame(); paintIcons(); paintEdge('title');

// 설치형 앱(PWA): 서비스워커로 그림을 기기에 캐시해 두 번째부터는 빠르게, 오프라인에서도 열린다
try{ if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}

// 아이폰 사파리: 화면 아래에 접힌 하단 바 자리가 따로 생긴다. 그림은 그 자리까지 채우고(앱 높이 = 기기 화면 높이),
// 버튼·탭은 바 위에 오도록 아래 여백(--sb)을 그만큼 준다.
function fitFull(){
  try{
    const root = document.documentElement, app = $('app');
    const ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    // 가장 큰 화면 높이(하단 바 뒤까지)를 lvh 프로브로 잰다. 안 되면 기기 화면 높이를 쓴다.
    let big = Math.max(screen.height, screen.width);
    try{ const pr = document.createElement('div'); pr.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:100vh;height:100lvh;visibility:hidden;pointer-events:none'; document.body.appendChild(pr); const h = pr.getBoundingClientRect().height; pr.remove(); if(h > 100) big = Math.max(h, big, window.innerHeight); }catch(e){}
    const gap = Math.round(big - window.innerHeight);
    window.__fit = {inner:window.innerHeight, big:Math.round(big), screen:screen.height, gap};
    if(ios && Math.min(screen.width, screen.height) < 600 && gap > 4 && gap < 140 && window.innerHeight > window.innerWidth){
      app.style.bottom = 'auto'; app.style.height = Math.round(big) + 'px'; root.style.setProperty('--sb', gap + 'px');
    } else { app.style.bottom = ''; app.style.height = ''; root.style.removeProperty('--sb'); }
    const d = document.getElementById('fitdiag'); if(d) d.textContent = /[?&](probe|diag)\b/.test(location.search) ? `화면 ${innerWidth}×${innerHeight} · 최대 ${Math.round(big)} · 기기 ${screen.height} · 여백 ${gap}` : '';
    if(/[?&]probe\b/.test(location.search)) probeFit(big);
  }catch(e){}
}
// ?probe 로 열면: 배경을 새빨갛게, 화면 맨 아래(852 기준)에 파란 띠를 깔고 측정값을 크게 보여 준다 — 아래 여백이 '페이지가 못 그리는 곳'인지 가리는 용도
function probeFit(big){
  let b = document.getElementById('probe'); if(!b){ b = document.createElement('div'); b.id = 'probe'; document.body.appendChild(b); document.documentElement.style.background = document.body.style.background = '#ff2a2a'; }
  const mk = (css) => { const e = document.createElement('div'); e.style.cssText = 'position:fixed;left:0;right:0;visibility:hidden;' + css; document.body.appendChild(e); const h = e.getBoundingClientRect().height; e.remove(); return h; };
  const st = (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) ? '홈화면앱' : '사파리탭';
  const vv = window.visualViewport ? `${Math.round(visualViewport.height)}@${Math.round(visualViewport.offsetTop)}` : '-';
  const top = mk('padding-top:env(safe-area-inset-top,0px)'), bot = mk('padding-top:env(safe-area-inset-bottom,0px)');
  b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;pointer-events:none;font:700 15px/1.5 system-ui;color:#fff';
  b.innerHTML = `<div style="position:absolute;top:0;left:0;right:0;background:#000c;padding:70px 12px 8px">${st} · inner ${innerWidth}×${innerHeight} · vv ${vv}<br>screen ${screen.width}×${screen.height} · 최대 ${Math.round(big)} · 안전 위${top} 아래${bot}<br>빌드 #${BUILD_NO} — 맨 아래 파란 띠가 보이면 페이지가 그릴 수 있는 영역</div><div style="position:absolute;top:${Math.round(big) - 59}px;height:59px;left:0;right:0;background:#1f4bff;text-align:center;padding-top:16px">▼ 파란 띠 (852 기준 아래 59px)</div>`;
}
fitFull(); addEventListener('resize', fitFull); addEventListener('orientationchange', () => setTimeout(fitFull, 300)); setTimeout(fitFull, 600);

// ── 새 버전 확인: 사파리는 페이지를 몇 분간 기억해 두므로, 서버의 빌드 번호와 비교해 알려 준다 ──
const BUILD_NO = parseInt(('#71 · 2026.10.11'.match(/#(\d+)/) || [0, 0])[1], 10);
async function checkUpdate(manual){
  try{
    const r = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'}); const txt = await r.text();
    const m = txt.match(/빌드 #(\d+)/), no = m ? parseInt(m[1], 10) : 0;
    if(no > BUILD_NO){ showUpdateBar(no); return true; }
    if(manual) toast('최신 버전이에요 (빌드 #' + BUILD_NO + ')');
  }catch(e){ if(manual) toast('확인하지 못했어요. 인터넷을 확인해 주세요'); }
  return false;
}
function showUpdateBar(no){
  if(document.getElementById('upbar')) return;
  const d = document.createElement('div'); d.id = 'upbar'; d.innerHTML = `새 버전 #${no}이 있어요 <button id="up-go">업데이트</button>`; $('app').appendChild(d);
  $('up-go').onclick = async () => { try{ const rs = await navigator.serviceWorker.getRegistrations(); for(const x of rs) await x.unregister(); const ks = await caches.keys(); for(const k of ks) await caches.delete(k); }catch(e){} location.replace(location.pathname + '?v=' + Date.now()); };
}
setTimeout(() => checkUpdate(false), 1500);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(false); });
