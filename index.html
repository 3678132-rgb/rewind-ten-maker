<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1230"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="다시스무살"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>다시, 스무 살</title>
<meta name="description" content="마흔에서 스무 살로 되감긴 십 년, 육성 시뮬레이션">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>/* ───── 스테이지 제로 메이커(1편)와 같은 화면 구성: 풀블리드 장면 + 알약 HUD + 떠 있는 버튼 + 노란 탭바 + 흰 시트 ───── */
:root{--sb:env(safe-area-inset-bottom,0px);--paper:#E7ECEE;--paper-2:#D8DFE2;--glass:rgba(255,255,255,.7);--glass-solid:#F6F8F9;--line:rgba(21,25,28,.13);--ink:#14181B;--mute:#56636B;--serum:#2B44C0;--serum-soft:#DDE3FA;--gold:#E9C77A;--good:#1f9d55;--bad:#d23b3b;--rose:#e0507a;
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--f-display:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Noto Sans KR",serif;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1d2350;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:active:not(:disabled){transform:translateY(2px)}
button:disabled{cursor:default}
h1,h2,h3{margin:0}
.txt,.sub,.ch span,.ch b{text-wrap:pretty}
.sub{color:var(--mute);font-size:12px}
.mono{font-variant-numeric:tabular-nums}
/* 화면 틀: 폰은 꽉 채우고 넓은 화면은 9:16 폭으로 가운데 */
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:calc(100vh * 9 / 16);overflow:hidden;background:#1b2140;box-shadow:0 0 60px rgba(0,0,0,.5)}
@supports (height:100dvh){#app{max-width:calc(100dvh * 9 / 16)}}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.screen.on{display:block}
/* ───── 버튼 ───── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#F4F6F7;min-height:50px;padding:0 22px;border-radius:999px;width:100%;font-weight:700;font-size:16px;letter-spacing:.02em}
.btn.blue{background:linear-gradient(135deg,#2B44C0,#1c2a7a);border:0;color:#fff;box-shadow:0 8px 24px rgba(43,68,192,.35)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);font-weight:600}
.btn.sm{min-height:42px;font-size:14px}
.btn:disabled{opacity:.38}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--serum);color:var(--serum)}
.tag.ret{border-color:var(--bad);color:var(--bad)}
.who{display:inline-block;font-size:12px;background:var(--serum);color:#fff;border-radius:99px;padding:1px 11px;font-weight:800;margin-bottom:4px}
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase}
/* ───── 타이틀 ───── */
#title{overflow:hidden;text-align:center;background:#1d2350}
.coverart{position:absolute;inset:0;background:url(art/cover.webp) 50% 40%/cover no-repeat}
#title::before{content:"";position:absolute;inset:0 0 auto;height:38%;z-index:1;background:linear-gradient(180deg,rgba(28,36,92,.6),rgba(28,36,92,.18) 60%,transparent)}
#title::after{content:"";position:absolute;inset:auto 0 0;height:30%;z-index:1;background:linear-gradient(0deg,rgba(246,248,252,.96) 0%,rgba(246,248,252,.7) 55%,rgba(246,248,252,0) 100%)}
.ctop{position:absolute;z-index:2;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);padding:0 20px;color:#fff}
.ctop .eyebrow{color:rgba(255,255,255,.85)}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,13.5vw,62px);line-height:1.05;letter-spacing:-.01em;margin:6px 0 0;color:#fff;text-shadow:0 2px 18px rgba(20,24,70,.55),0 0 2px rgba(20,24,70,.4)}
.wordmark .colon{color:#9fb4ff}
.wordmark small{display:block;font-size:.3em;letter-spacing:.5em;font-weight:700;margin-top:.5em;padding-left:.5em;color:rgba(255,255,255,.92)}
.csub{margin:14px auto 0;display:inline-block;line-height:1.4;font-size:12px;letter-spacing:.14em;color:#fff;padding:5px 14px;border:1px solid rgba(255,255,255,.55);border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.cbot{position:absolute;z-index:2;left:0;right:0;bottom:calc(var(--sb) + 18px);padding:0 22px;display:grid;gap:12px;justify-items:center}
.ccard{width:min(100%,340px);padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.94);border:1px solid #fff;box-shadow:0 6px 24px rgba(30,40,100,.18);font-size:13px;line-height:1.6;color:#27304d}
.cbot .btn{width:min(100%,340px);min-height:54px}
.note{font-size:11.5px;color:var(--mute)}
/* ───── 시작 설정(종이 양식) ───── */
#setup{background:var(--paper);background-image:radial-gradient(120% 80% at 15% 0%,#F7F9FA 0%,transparent 55%),radial-gradient(90% 70% at 100% 100%,#DCE2F5 0%,transparent 60%)}
.wiz{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.wizhead{display:flex;align-items:center;gap:12px}
.wizback{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:4px;border-radius:99px;background:var(--paper-2)}
.dots i.on{background:var(--serum)}
.wizq{margin:18px 2px 12px}
.wizq .eyebrow{color:var(--mute);font-size:10.5px}
.wizq h2{font-family:var(--f-display);font-size:23px;letter-spacing:-.4px;margin-top:4px;line-height:1.35}
.wizq p{margin:4px 0 0}
.wizbody{flex:1;overflow-y:auto;margin:0 -16px;padding:2px 16px 12px;-webkit-overflow-scrolling:touch}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards1{display:grid;gap:10px}
.opt{position:relative;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 11px;min-height:88px}
.opt .ic{font-size:26px;line-height:1}
.opt b{display:block;font-size:15px;margin-top:5px;letter-spacing:-.3px}
.opt .ds{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}
.opt .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.opt.sel{border-color:var(--serum);box-shadow:inset 0 0 0 1px var(--serum);background:#fff}
.opt.sel::after{content:'✓';position:absolute;top:8px;right:11px;color:var(--serum);font-weight:900}
.cards1 .opt{display:flex;gap:12px;align-items:center;min-height:0}
.cards1 .opt b{margin-top:0}
.wizfoot{padding:12px 0 calc(14px + var(--sb))}
input[type=text]{width:100%;padding:15px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;font-weight:700;text-align:center;font-family:var(--f-display)}
input[type=text]:focus{outline:2px solid var(--serum)}
/* ───── 메인: 장면 + 떠 있는 UI ───── */
#game{overflow:hidden;background:#1b2140}
.scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#232a5c,#1b2140)}
.scene .pimg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.scene-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(15,20,45,.5) 0%,rgba(15,20,45,0) 16%,rgba(15,20,45,0) 66%,rgba(15,20,45,.45) 100%)}
.hud-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:6px;z-index:4}
.avatar{width:44px;height:44px;flex:none;border-radius:16px;border:3px solid #fff;background:#ffe9b5 50% 9%/330% no-repeat;box-shadow:0 4px 0 #b9780a,0 6px 12px rgba(0,0,0,.25)}
.hud-center{flex:1;min-width:0;background:rgba(18,24,52,.62);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:3px 10px 4px;backdrop-filter:blur(4px)}
.hud-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-line b{font-family:var(--f-display);font-size:15px;font-weight:800;white-space:nowrap}
.hud-line span{font-size:11px;opacity:.9;white-space:nowrap}
.hud-bar{height:6px;margin-top:2px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.hud-bar i{display:block;height:100%;background:linear-gradient(90deg,#7be35a,#c8f56b);border-radius:99px}
.hud-sub{font-size:10px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{position:relative;width:36px;height:36px;flex:none;border-radius:50%;border:3px solid #fff;background:linear-gradient(180deg,#ffe07a,#ffb21f);color:#7a4a00;display:grid;place-items:center;box-shadow:0 4px 0 #b9780a,0 6px 12px rgba(0,0,0,.25)}
.hud-res{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;z-index:4}
.res{display:flex;align-items:center;gap:5px;background:rgba(18,24,52,.62);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 10px 3px 4px;font-size:12px;backdrop-filter:blur(4px)}
.res i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;background:linear-gradient(180deg,#ffe07a,#ffb21f);color:#5a3500}
.res b.warn{color:#ffb4b4}
.side-l,.side-r{position:absolute;top:calc(66px + env(safe-area-inset-top));display:grid;gap:8px;z-index:4}
.side-l{left:8px}.side-r{right:8px}
.fab{--c1:#ff9cc0;--c2:#ff5c8a;--c3:#c93a66;position:relative;width:68px;display:grid;justify-items:center;color:#fff}
.fab.c-orange{--c1:#ffc46b;--c2:#ff9330;--c3:#c4621a}.fab.c-purple{--c1:#c3a2ff;--c2:#8f5cff;--c3:#5f34c2}.fab.c-green{--c1:#9be87a;--c2:#4cc25a;--c3:#2b8a3a}.fab.c-red{--c1:#ffa38a;--c2:#ff6a4d;--c3:#c23c24}.fab.c-teal{--c1:#7ff0dc;--c2:#22c3ac;--c3:#138a79}
.fab .ic{width:54px;height:54px;border-radius:18px;background:linear-gradient(180deg,var(--c1),var(--c2));border:3px solid #fff;color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--c3),0 6px 12px rgba(0,0,0,.25)}
.fab .ic.gauge{background:#fff;border-color:var(--c2)}
.gauge svg{width:46px;height:46px}
.fab .lb{margin-top:-9px;position:relative;font-size:11px;font-weight:800;background:linear-gradient(180deg,var(--c2),var(--c3));border:2px solid #fff;border-radius:99px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.gear svg{width:22px;height:22px}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:99px;background:#e23b3b;color:#fff;border:2px solid #fff;font-weight:900;font-size:11px;display:grid;place-items:center}
.badge:empty{display:none}
.bottom-area{position:absolute;left:0;right:0;bottom:calc(84px + var(--sb));z-index:4;display:grid;justify-items:center;gap:8px;padding-inline:12px}
.slots3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.slot3{border:2px dashed rgba(255,255,255,.75);background:rgba(18,24,52,.5);color:#fff;border-radius:12px;padding:5px 8px;text-align:left;min-height:48px;display:grid;align-content:start;backdrop-filter:blur(3px)}
.slot3 small{font-size:10px;opacity:.8;letter-spacing:.1em}
.slot3 b{font-size:12px;line-height:1.25}
.slot3.filled{border-style:solid;border-color:#E9C77A;background:rgba(255,255,255,.92);color:var(--ink)}
.slot3.active{box-shadow:0 0 0 2px var(--serum)}
.slot3.cont{opacity:.7;border-style:solid;border-color:#E9C77A}
.cta{width:min(80%,320px);padding:13px 10px;font-size:20px;font-weight:900;letter-spacing:.02em;border-radius:20px;border:3px solid #fff;background:linear-gradient(180deg,#ffd45c,#ff9f1c);color:#fff;text-shadow:0 2px 0 rgba(150,70,0,.55);box-shadow:0 5px 0 #c26a00,0 10px 20px rgba(0,0,0,.3)}
.cta.ready{background:linear-gradient(180deg,#8ff06a,#3fbf45);text-shadow:0 2px 0 rgba(20,100,30,.6);box-shadow:0 5px 0 #23852f,0 10px 20px rgba(0,0,0,.3)}
.cta:disabled{opacity:.6}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;height:calc(78px + var(--sb));padding-bottom:var(--sb);background:linear-gradient(180deg,#fbf1dc,#ecd7ac);border-top:3px solid #d9b46a;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end}
.tb{display:grid;justify-items:center;gap:2px;padding:0 0 9px;font-size:11.5px;font-weight:800;color:#6b4e2a}
.tb .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff;border:2px solid #d9b46a;color:var(--serum)}
.tb.home .ic{width:64px;height:64px;margin-top:-30px;border-radius:22px;background:linear-gradient(180deg,#6c86f2,var(--serum));color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #1c2e8a}
.tb:active .ic{transform:translateY(2px)}
/* 조언 말풍선(대화 카드) */
.dialog{position:absolute;left:10px;right:10px;bottom:calc(252px + var(--sb));z-index:5;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;background:rgba(246,248,249,.96);border:2px solid var(--gold);border-radius:16px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-height:30%;overflow:auto}
.dialog[hidden]{display:none}
.dialog .face{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;object-position:50% 10%;background:#ffe9b5}
.dialog .head{font-size:11px;font-weight:800;color:var(--serum)}
.dialog .body{font-size:13px;line-height:1.5}
.dialog .nx{grid-column:2;justify-self:end;font-size:12px;font-weight:800;color:var(--serum)}
/* ───── 시트(흰 바닥 시트, 금빛 윗선) ───── */
.ov{position:absolute;inset:0;background:rgba(10,14,30,.45);display:none;align-items:flex-end;z-index:20}
.ov.on{display:flex}
.sheet{width:100%;max-height:82%;overflow:auto;background:var(--glass-solid);border-radius:22px 22px 0 0;border-top:3px solid #E9C77A;padding:12px 14px calc(18px + var(--sb));animation:up .25s ease both;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sh-head b{font-family:var(--f-display);font-size:18px;font-weight:800}
.sh-x{background:var(--paper-2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.sheet h3{margin:12px 0 6px;font-size:11px;letter-spacing:.18em;color:var(--mute);font-weight:600}
.txt{white-space:pre-wrap;margin:6px 0 12px}
.menu-list{display:grid;gap:10px;padding-top:6px}
.tabs{display:flex;gap:4px;margin-bottom:8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:-12px;background:var(--glass-solid);z-index:2;padding-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:1 0 auto;padding:7px 12px;font-weight:700;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--serum)}
.planbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:3px;align-content:start;min-height:104px}
.act .top{display:flex;align-items:center;gap:6px}
.act .top .ic{font-size:20px}
.act .top b{font-size:14px;letter-spacing:-.3px;line-height:1.25}
.act .em{font-size:11.5px;font-weight:800;color:var(--serum)}
.act .d{font-size:11.5px;color:var(--mute);line-height:1.4}
.act .why{font-size:11.5px;color:var(--bad);line-height:1.4}
.act .tg,.opt .tg{display:flex;flex-wrap:wrap;gap:3px}
.tg i{font-style:normal;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--paper)}
.tg i.up{color:var(--good)}.tg i.down{color:var(--bad)}.tg i.pay{color:#a8730a}
.act:disabled{opacity:.5}
.act.on{border-color:var(--serum);box-shadow:inset 0 0 0 1px var(--serum)}
.foot{margin-top:10px;font-size:12px;color:var(--mute);text-align:center}
.meter{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;margin:5px 0;font-size:13px}
.meter .bar{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter.work .bar i{background:var(--serum)}.meter.bond .bar i{background:var(--rose)}.meter.self .bar i{background:var(--good)}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.kv b{color:var(--serum)}
.lcard{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;text-align:left;width:100%}
.lcard .av{width:54px;height:54px;border-radius:12px;object-fit:cover;object-position:50% 10%;background:var(--paper-2)}
.lcard .av.sil{filter:brightness(0) opacity(.25)}
.lcard b{display:block;font-size:14px}
.lcard small{display:block;color:var(--mute);font-size:11.5px;line-height:1.4}
.lcard .hb{height:5px;border-radius:99px;background:var(--paper-2);margin-top:4px;overflow:hidden}.lcard .hb i{display:block;height:100%;background:var(--rose)}
.lcard .cb,.contact .cb{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#ffe07a,#ffb21f);display:grid;place-items:center;font-size:16px;box-shadow:0 2px 0 #b9780a}
.lcard:disabled .cb,.contact:disabled .cb{background:var(--paper-2);box-shadow:none;opacity:.6}
.contacts{display:grid;gap:8px;margin:8px 0 4px}
.contact{display:grid;grid-template-columns:50px 1fr 36px;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;width:100%}
.contact .av{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:var(--paper-2);border:2px solid var(--gold)}
.contact .ci b{display:block;font-size:15px}.contact .ci small{color:var(--mute);font-size:12px}
.contact:disabled{opacity:.5}
.dexrow{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;font-size:13px}
.dexrow .g{font-size:22px;text-align:center}.dexrow small{display:block;color:var(--mute);font-size:11.5px}.dexrow.lock{opacity:.45}

function doAction(S, id){
  const a = ACTS[id], ch = [], out = {id, ch, note:''};
  if(a.cost) bump(S, 'cash', -a.cost, ch);
  if(a.pay){ const pay = Math.round(a.pay * earnedMult(S) * (id === 'cafe' ? 1 : 1)); bump(S, 'cash', pay, ch); }
  if(a.run) a.run(S, ch, out);
  if(!out.skipBase){
    if(a.hp) bump(S, 'hp', a.hp, ch);
    if(a.stress) bump(S, 'stress', a.stress, ch);
    if(a.eff) fx(S, a.eff, ch);
    if(a.eff && S.items && S.items.laptop && ['study', 'cert', 'project', 'intern'].includes(id)){ const e2 = {}; for(const k in a.eff) if(STAT[k]) e2[k] = a.eff[k] * 0.2; fx(S, e2, ch); }
  }
  if(id === 'study' || id === 'cert') S.semStudy = (S.semStudy || 0) + 1;
  S.uses[id] = (S.uses[id] || 0) + 1;
  if(S.hp <= 0){ S.hp = 0; S.collapse = true; out.burnout = true; }
  return out;
}

function settle(S){
  const ch = [];
  bump(S, 'cash', -livingCost(S), ch); if(allowance(S)) bump(S, 'cash', allowance(S), ch);
  if(S.stress >= 75){ bump(S, 'self', -1.2, ch); }
  if(S.stress >= 100 || S.hp <= 0) S.collapse = true;
  // 균형: 한쪽만 하면 다른 쪽이 마른다
  if(S.m - S.last.bond > 3) gauge(S, 'bond', -0.7, ch);
  if(S.m - S.last.work > 4) gauge(S, 'work', -0.5, ch);
  if(S.m - S.last.self > 4) gauge(S, 'self', -0.5, ch);
  for(const id in S.love){ const v = S.love[id]; if(v.stage === -9) continue; if(S.m - (v.lastDate == null ? v.since : v.lastDate) > 3){ const b = v.aff; v.aff = clamp(v.aff - (v.stage >= 1 ? 1.4 : 0.8), 0, 100); if(v.stage >= 1 && v.aff < 14) v.fading = true; } }
  itemMonthly(S, ch);
  S.hp = clamp(S.hp + 3, 0, 100);
  S.stress = clamp(S.stress - 2, 0, 100);
  if(S.cash < -300 && !S.ending) S.ending = 'ret_debt';
  return ch;
}

const ROM_GAP = 2;
function romEligible(S, id){
  const v = S.love[id]; if(!v || v.stage !== -1 || !ROM[id]) return null;
  const n = v.rom || 0; if(n >= ROM[id].length) return null;
  if(S.m - (v.lastRom == null ? -9 : v.lastRom) < ROM_GAP) return null;
  if(v.aff < [0, 5, 14, 24][n]) return null;
  return n;
}
function romEvent(S){
  let best = null;
  for(const id of Object.keys(ROM)){ const n = romEligible(S, id); if(n == null) continue; if(!best || S.love[id].aff > S.love[best.id].aff) best = {id, n}; }
  if(!best) return null;
  const {id, n} = best, lv = LOVERS[id], sc = ROM[id][n];
  return {id:`rom_${id}_${n + 1}`, lover:id, speaker:lv.name, title:sc[0], place:sc[4], img:`art/lv_${id}.webp`,
    text:S => sc[1],
    choices:[

      {label:sc[3][0], sub:'조심스럽게 · 호감 ↑', run(S){ const v = S.love[id], ch = []; v.rom = n + 1; v.lastRom = S.m; addAff(S, id, 4, ch); fx(S, {self:1, stress:-1}, ch); return {text:sc[3][1], chips:ch}; }},
    ]};

    ['공동 캠페인', '신제품 캠페인을 지후와 함께 맡게 됐다. 밤마다 시안을 비교하며 서로의 취향이 부딪힌다. “이 색은 너무 튀지 않아요?” “그게 포인트예요.”', ['내 감각을 믿고 밀어붙인다', '결과는 대성공이었다. 지후는 “당신 말이 맞았네요” 하며 처음으로 먼저 박수를 쳤다.'], ['그의 의견을 따른다', '무난하지만 안정적인 결과가 나왔다. 그는 “다음엔 당신 방식도 해 봐요” 하고 약속했다.'], 'night'],
    ['승진 심사', '같은 시기에 승진 심사를 받게 되었다. 지후가 조용히 말한다. “우리 중 하나만 될 수도 있어요. 그래도 괜찮죠?”', ['“누가 되든 축하해 주자”', '결과 발표 날, 둘 다 서로를 안아 주느라 결과를 늦게 확인했다.'], ['“이번엔 지고 싶지 않아요”', '그는 웃으며 “좋아요, 그 눈빛이 좋아요” 했다. 서로를 자극하는 연인이었다.'], 'campus'],
    ['그의 가족 저녁', '지후가 어렵게 말을 꺼낸다. “이번 주말, 우리 집에서 저녁 먹을래요? 어머니가 궁금해하세요.”', ['“좋아요, 선물은 제가 준비할게요”', '어머니는 첫인상부터 편안하게 웃어 주셨다. 지후는 식탁 아래에서 내 손을 꼭 잡았다.'], ['“조금 더 시간이 필요해요”', '그는 이해한다고 했다. 대신 다음 달 약속을 잡았다.'], 'room'],
    ['이직 제안', '해외 브랜드에서 지후에게 이직 제안이 왔다. “가야 할지 모르겠어요. 당신 곁이 좋아서.”', ['“가요, 나는 기다릴 수 있어요”', '그는 오래 생각하다 말했다. “가더라도 같이 갈 방법을 찾아볼게요.”'], ['“같이 계획을 세워 봐요”', '둘은 밤새 종이에 미래를 써 내려갔다. 막막함이 반쯤 가벼워졌다.'], 'night'],

  dohyun: [
    ['촬영장 비밀 연애', '현장 스태프 몰래 도현이 내 커피에 하트를 그려 둔다. 걸릴까 봐 조마조마한데 그의 눈은 장난기로 가득하다.', ['같이 모른 척 즐긴다', '점심시간에 그는 대본 뒤에 작게 적었다. “오늘도 수고했어, 내 감독님.”'], ['현장에서는 프로답게', '그는 “알겠습니다, PD님” 하고 경례했다. 퇴근길엔 평소보다 오래 손을 잡았다.'], 'night'],
    ['밤샘 편집', '편집실에서 도현이 졸린 눈으로 화면을 본다. “이 컷 어때요? 당신이라면 어디서 자를래요?”', ['내 의견대로 컷을 정한다', '방송 반응이 좋았다. 그는 크레디트에 작게 내 이름을 넣어 주었다.'], ['그의 선택을 믿는다', '그는 “믿어 줘서 고마워요” 하고 내 어깨에 머리를 기댔다.'], 'room'],
    ['현장 사고', '촬영 중 작은 사고가 났다. 도현이 가장 먼저 달려와 괜찮냐고 묻는다. 그의 손이 떨렸다.', ['“괜찮아요, 일은 이어 가요”', '그는 눈을 붉히며 웃었다. “…당신은 정말 강하네요.”'], ['“잠깐만 쉬게 해 줘요”', '그는 담요를 가져와 어깨에 덮어 주었다. 한참을 말없이 옆에 있었다.'], 'night'],
    ['첫 해외 로케', '해외 로케이션에 도현과 함께 가게 됐다. 낯선 도시의 새벽, 그가 호텔 로비에서 기다리고 있었다. “일 말고, 이 도시를 같이 보고 싶어서요.”', ['“좋아요, 한 시간만요”', '새벽 거리의 빵집에서 그는 처음으로 일 이야기를 하지 않았다.'], ['“시차 때문에 쉴게요”', '그는 “그럼 내일 아침에 보자” 하고 웃으며 방까지 데려다 주었다.'], 'cafe'],
    ['감독 데뷔 제안', '도현에게 감독 데뷔 제안이 들어왔다. “같이 만들어 줄래요? 내 첫 작품에 당신이 있어야 해요.”', ['“좋아요, 같이 해요”', '그는 소리를 지르며 나를 안아 올렸다. 현장 사람들이 놀라 쳐다볼 정도였다.'], ['“먼저 내 일도 챙겨야 해요”', '그는 “그럼 내가 기다릴게요” 하고 고개를 끄덕였다. 둘 다 각자의 시간을 갖기로 했다.'], 'campus'],
  ],
  sian: [
    ['공동 집필', '시안과 한 작품을 함께 쓰게 됐다. 이야기의 방향을 두고 밤새 토론했다. 의견이 갈릴 때마다 그는 문장으로 설득하려 든다.', ['내 방향을 끝까지 주장한다', '그는 한참 침묵하다가 말했다. “…이 결말이 더 아프고 더 맞네요.”'], ['그의 방향을 따라 준다', '그는 “다음 편은 당신 방식으로 가요” 하며 약속의 의미로 원고를 건넸다.'], 'room'],
    ['첫 번째 팬레터', '방송국으로 시청자 편지가 도착했다. “이 대사 덕분에 오늘을 버텼어요.” 시안이 편지를 내 앞에 놓는다. “이건 당신 문장이에요.”', ['“우리 문장이에요”', '그는 편지를 접어 서랍에 넣었다. “우리가 쓴 걸 기억하려고요.”'], ['“고마운 마음만 받을게요”', '그는 웃으며 편지를 다시 봉투에 넣었다. 편지는 한동안 우리 책상 위에 있었다.'], 'cafe'],
    ['슬럼프 동반', '시안이 슬럼프에 빠졌다. 몇 주째 한 줄도 못 쓴다. “내가 쓰는 이야기가 다 거짓 같아요.”', ['“쓰지 않아도 돼요, 같이 걸어요”', '둘은 아무 목적 없이 한참 걸었다. 그가 걷다가 문득 말했다. “…한 줄 생각났어요.”'], ['“제 이야기부터 읽어 줄래요?”', '그는 내 이야기를 읽으며 천천히 웃었다. 펜을 다시 들었다.'], 'night'],
    ['시상식 후보', '작품이 시상식 후보에 올랐다. 시안은 정장을 입고 거울 앞에서 한참 서성인다. “수상 소감, 같이 써 줄래요?”', ['“진심으로 쓰면 돼요”', '그는 무대에서 내 이름을 마지막에 불렀다. 객석의 나는 눈물을 참았다.'], ['“당신 이야기를 해요”', '그는 무대에서 조용히 웃으며 말했다. “옆에 앉은 사람 덕분이에요.”'], 'campus'],
    ['결말을 쓰는 밤', '“우리 이야기는 어떤 결말일까요?” 시안이 빈 원고지를 앞에 두고 묻는다. 마흔의 나는 해피엔딩을 믿지 않았다.', ['“함께 쓰는 사람이 있다면 해피엔딩이죠”', '그는 첫 줄에 이렇게 썼다. “그리고 둘은 다음 페이지로 넘어갔다.”'], ['“결말은 천천히 정해요”', '그는 연필을 내려놓고 웃었다. “좋아요, 우린 아직 중간이니까.”'], 'room'],

  seunghyun: [
    ['숨겨야 하는 연애', '소속사에서 열애설 금지령이 내려왔다. 승현은 마스크 너머로 속삭인다. “들켜도 괜찮은데, 당신이 상처받을까 봐 무서워요.”', ['“들키지 않게 몰래 만나요”', '심야 편의점 앞에서 그는 모자와 마스크를 쓰고 나타났다. 우리는 컵라면을 나눠 먹었다.'], ['“떳떳하게 가요”', '그는 눈을 크게 뜨더니 마스크 위로 웃었다. “…용기 내 볼게요.”'], 'night'],
    ['오디션 전날', '큰 오디션을 앞두고 승현이 잠을 못 이룬다. “만약 떨어지면 어떡하죠?”', ['“연습한 만큼 보여 주면 돼요”', '그는 거울 앞에서 한 번 더 연습했다. “…당신 응원이 최고예요.”'], ['“떨어져도 곁에 있을게요”', '그는 한참 말없이 내 손을 잡았다. 떨림이 천천히 멎었다.'], 'room'],
    ['팬미팅 무대', '팬미팅 무대 뒤. 승현이 거울 속 자신을 바라본다. “카메라 밖의 나를 아는 사람은 당신뿐이에요.”', ['“무대 위의 당신도 좋아해요”', '그는 환하게 웃으며 무대로 올라갔다. 객석에서 본 그의 미소는 오늘 가장 눈부셨다.'], ['“끝나고 같이 집에 가요”', '무대가 끝나고 그는 가장 먼저 내게 문자를 보냈다. “지금 나가요.”'], 'night'],
    ['열애설 기사', '기사가 터졌다. “신인 배우 열애설.” 승현의 폰이 쉴 새 없이 울린다. 그는 폰을 뒤집어 놓고 말한다. “이제 숨기지 않아도 되죠?”', ['“같이 입장을 정리해요”', '둘은 짧은 공식 입장을 함께 썼다. 의외로 응원이 쏟아졌다.'], ['“잠시 거리를 둘까요”', '그는 힘없이 웃었다. “…알겠어요. 대신 연락은 끊지 않을게요.”'], 'cafe'],
    ['첫 주연', '승현이 드라마 첫 주연을 맡았다. 첫 촬영 날, 그가 내게 대본을 보여 준다. “여기, 당신이 말해 준 대사를 넣었어요.”', ['“당신이 해낸 거예요”', '촬영장에서 그가 그 대사를 말하는 순간 모두가 숨을 죽였다. 나는 객석에서 그를 보며 웃었다.'], ['“앞으로가 더 중요해요”', '그는 고개를 끄덕였다. “그래서 계속 당신 옆에서 배울래요.”'], 'campus'],

  geonwoo: [
    ['야근 데이트', '로펌 자정 복도. 건우가 도시락 두 개를 책상에 올린다. “공판 준비 중이지만 식사는 하고 해요.” 딱딱한 말투와 다정한 행동이 어울리지 않는다.', ['“같이 먹어요, 잠깐만요”', '그는 판례집 사이에서 처음으로 젓가락을 들고 웃었다. “이런 야근은 환영입니다.”'], ['“저는 서류부터 끝낼게요”', '그는 도시락을 내 책상 위에 두고 갔다. 식은 도시락도 맛있었다.'], 'night'],
    ['공동 변론', '건우와 같은 사건을 맡았다. 법정에서 호흡이 척척 맞는다. 휴정 시간, 그가 작게 속삭인다. “오늘 컨디션 좋은데요.”', ['“이길 수 있어요”', '변론이 끝나고 판사의 눈빛이 달라졌다. 그는 복도에서 주먹을 쥐어 보였다.'], ['“끝까지 침착하게 가요”', '그는 고개를 끄덕이며 서류를 정리했다. 평정심이 서로에게 전해졌다.'], 'campus'],
    ['원칙과 감정', '건우가 의뢰인의 사정을 듣고 흔들린다. “원칙만 따지면 이길 수 있지만, 이 사람이 너무 안쓰러워서…”', ['“원칙 안에서 도울 방법을 찾아요”', '둘은 밤새 판례를 뒤져 방법을 찾아냈다. 그는 “우리가 같은 편이라 다행이에요” 했다.'], ['“감정은 접어 두자고 말한다”', '그는 잠깐 침묵하다가 고개를 끄덕였다. 하지만 마음 한구석이 쓰렸다.'], 'room'],
    ['변호사 시험 합격자 발표', '건우와 함께 합격자 명단을 확인했다. 그가 말없이 내 어깨를 안는다. “고생했어요, 정말.”', ['“우리 정말 해냈네요”', '그는 눈시울이 붉어져 웃었다. “오늘만큼은 법전 말고 샴페인이에요.”'], ['“아직 시작일 뿐이에요”', '그는 웃으며 고개를 끄덕였다. “그래도 오늘은 같이 기뻐해요.”'], 'cafe'],
    ['청혼의 예고', '건우가 말없이 반지 상자 같은 것을 만지작거린다. “아직 아니에요, 서류 정리 중입니다.” 우스꽝스러운 변명이 귀엽다.', ['“기다릴게요, 천천히 와요”', '그는 귀까지 빨개져서 상자를 주머니에 넣었다. “곧 정식으로 제출하겠습니다.”'], ['“저도 준비할 게 있어요”', '그는 진지하게 고개를 끄덕였다. “서로 준비되었을 때 제출하죠.”'], 'night'],

  yuchan: [
    ['사내 연애 알림', '유찬이 슬랙으로 하트 이모지를 보낸다. 그런데 그만 팀 채널로 보내 버렸다. 모두가 조용해졌다.', ['웃으며 인정한다', '팀원들이 박수를 쳤다. 유찬은 얼굴이 빨개져 한동안 모니터만 봤다.'], ['“오타 같네요”라고 넘긴다', '유찬은 다급히 메시지를 지우고 내게 개인 메시지를 보냈다. “미안해요, 진짜…”'], 'cafe'],
    ['코드 리뷰 데이트', '유찬이 내 코드를 리뷰한다. 코멘트가 이상하게 다정하다. “이 함수 이름, 귀엽네요.”', ['“리뷰 말고 영화 보러 갈래요?”', '그는 한참 화면을 보다가 “수락(Approve)”을 눌렀다. 그날 우린 심야 영화를 봤다.'], ['“칭찬 말고 개선점도 알려 줘요”', '그는 진지하게 열 개의 개선점을 적어 보냈다. 마지막 줄엔 하트가 하나 달려 있었다.'], 'night'],

function buyItem(S, id){
  const it = ITEMS[id]; if(!it) return '없는 물건이에요';

  const n = owned(S, id), cap = it.stack || 1;
  if(n >= cap) return it.stack ? '더 살 수 없어요' : '이미 가지고 있어요';
  if(S.cash < it.price) return '자금이 모자라요';

function promotionEvent(S){

  const c = CAREERS[S.track], next = c.ranks[r + 1], cur = c.ranks[r];
  const raise = Math.round(c.pay * (1 + RAISE * (r + 1))) - payOf(S), bonusAmt = Math.round(c.pay * (0.7 + 0.2 * r));

  return {id:`promo_${r}_${S.m}`, speaker:'', title:`${next} 승진 심사`, place:'cafe',
    text:S => `${c.company}에서 ${next} 승진 심사 시즌이 시작됐다. 이번 분기 평가표에는 ${cur} 시절의 이름이 적혀 있다. 마흔의 나는 이 자리에서 늘 “다음에 하죠”라고 말했다. 이번엔 어떻게 할까.`,

      {label:'이번에는 미룬다', sub:'스트레스 -3 · 다음 기회', run(S){ const ch = []; S.promoAt = S.m - 8; bump(S, 'stress', -3, ch); return {text:'조금 더 쌓고 가기로 했다. 서두르지 않아도 되는 날도 있다.', chips:ch}; }},

    choices:[{label:tier ? '장학금을 받는다' : '다음 학기를 다짐한다', sub:tier ? `자금 +${amt}만 · 학식 +${tier}` : '학기 공부 횟수가 쌓여야 해요', run(S){ const ch = []; if(tier){ bump(S, 'cash', amt, ch); fx(S, {know:tier}, ch); gauge(S, 'self', 1, ch); S.album.push(`${term}학기 ${tier === 2 ? '성적 우수' : '부분'} 장학금 ${amt}만`); } else bump(S, 'stress', 2, ch); S.semStudy = 0; return {text:tier === 2 ? '“진짜 받았다!” 엄마에게 가장 먼저 전화했다. 도서관에서 보낸 밤이 숫자가 되어 돌아왔다.' : tier === 1 ? '전액은 아니지만 이번 학기 생활비에 큰 보탬이 됐다. 다음엔 우수 장학생을 노려 보자.' : '아쉬웠다. 이번 학기엔 공부가 조금 모자랐다. 다음 학기엔 시간표를 다시 짜 보자.', chips:ch}; }}]};
}

function fixedEvents(S){
  const out = [];
  if(S.collapse){ out.push(collapseEvent(S)); }
  if(S.m === 0 && !S.seen.prologue) out.push(PROLOGUE);
  for(const c of CHECKS) if(S.m === c.m && !S.seen[c.id]) out.push(checkEvent(S, c));
  for(const e of ERA) if(S.m === e.m && !S.seen[e.id]) out.push(Object.assign({once:true, speaker:''}, e));
  if(S.m === INTEREST_M && !S.seen.interest) out.push(interestEvent(S));
  if(S.m === GRAD_M && !S.seen.graduation) out.push(graduationEvent(S));
  if(S.m === CAREERS.lawyer.school - 1 && !S.seen.bar_exam && BAR_EXAM.cond(S)) out.push(BAR_EXAM);
  const se = storyDue(S); if(se) out.push(se);
  const ce = careerEvent(S); if(ce) out.push(ce);
  const le = loveEvent(S); if(le) out.push(le);
  if(S.m === TOTAL_MONTHS - 1) out.push(FINALE);
  return out;
}
function collapseEvent(S){
  return {id:'collapse_' + S.m, speaker:'', title:'쓰러지다', place:'room',
    text:S => '버티다 못한 몸이 먼저 신호를 보냈다. 눈을 떠 보니 병원 천장이었다. 의사가 한마디 했다. “이렇게 사시면 안 됩니다.”',
    choices:[{label:'정말 쉬기로 한다', sub:'체력 회복 · 자금 -30', run(S){ const ch = []; S.collapse = false; S.hp = 50; S.stress = 45; fx(S, {cash:-30, self:-2, ins:1}, ch); return {text:'일주일을 입원해 있었다. 마흔의 몸은 이렇게 무너졌을 것이다. 이번에는 늦지 않게 멈췄다.', chips:ch}; }}]};
}
function pickEvent(S){
  const pool = EVENTS.filter(e => (!e.once || !S.seen[e.id]) && (!e.cd || (S.cd[e.id] == null) || S.m - S.cd[e.id] >= e.cd) && (!e.cond || e.cond(S)));
  if(!pool.length) return null;
  const tot = pool.reduce((a, e) => a + (e.w || 1), 0); let r = R() * tot;
  for(const e of pool){ r -= (e.w || 1); if(r <= 0) return e; }
  return pool[pool.length - 1];
}

// 시계 조각을 하나 얻는다(장마다 한 번). 칩에 표시한다.
function givePiece(S, ch){ const st = SS(S); st.pieces = Math.min(10, st.pieces + 1); push(ch, '시계 조각', 1); S.album.push(`시계 조각 ${st.pieces}개째를 얻음`); }
// 라이벌과의 관계를 바꾼다(+우호 / -적대). 칩에 표시한다.
function rivalMood(S, d, ch){ const st = SS(S); const b = st.rival; st.rival = clamp(st.rival + d, -10, 10); if(ch) push(ch, `${RIVAL} 관계`, st.rival - b); }
const rivalState = S => { const r = SS(S).rival; return r >= 4 ? 'ally' : r <= -4 ? 'enemy' : 'neutral'; };

    {label:'“다음 학기엔 내가 1등이야.” 선전포고한다', sub:'학식 +2 · 스트레스 +3 · 하린 관계 -1', run:S => _sa(S, {know:2, stress:3}, -1, '“근거는요?” “지금부터 만들죠.” 하린이 눈썹을 올렸다. 자존심으로 한 말이었지만 그날 밤 책상에 앉은 시간은 평소의 두 배였다.', 'serious')},
    {label:'“축하해요. 비결이 뭐예요?” 묻는다', sub:'통찰 +1 · 하린 관계 +1', run:S => _sa(S, {ins:1, know:0.5}, 1, '“잠을 줄여요. 따라 하지 마요.” 그리고 덧붙였다. “저는 시간이 없어서 그래요.” 이상한 말이었다. 스무 살의 입에서 나올 말이 아니었다.', 'serious')},
    {label:'노트 교환을 제안한다', sub:'학식 +1 · 하린 관계는 상황에 따라', run(S){ return rivalState(S) === 'enemy' ? _sa(S, {stress:2}, 0, '“저는 제 노트를 파는 사람이 아니에요.” 단호한 거절이었다. 그래도 그녀의 시선이 내 노트 모서리에 잠깐 머물렀다.', 'serious') : _sa(S, {know:1.5, bond:1}, 2, '하린이 내 노트를 한 장 넘기다 말했다. “정리하는 방식이 나랑 비슷하네요.” 노트를 돌려줄 때 그녀의 글씨가 한 줄 달려 있었다. 「3장 개념 보강.」', 'surprised'); }},
  ]}),

Object.assign({}, _saHarin, {id:'rv_scholarship', once:true, w:4, cd:30, cond:S => S.m >= 14 && S.m <= 70, place:'campus', title:'단 한 명의 장학금',
  beats:[
    '성적우수 장학금, 이번 학기 단 한 명. 제출 서류 목록의 맨 아래에 같은 이름 두 개가 있다.',
    '하린의 가정 형편은 학과에서 아는 사람만 안다. 이 장학금이 없으면 휴학을 고민해야 할지도 모른다는 소문이 있었다.',
  ],
  text:S => { const st = rivalState(S); return st === 'ally' ? '하린이 먼저 서류 얘기를 꺼냈다. “같이 내는 거, 어색하지 않죠?” 어색하지 않은 척하는 목소리였다.' : st === 'enemy' ? '하린은 서류 앞에서 내 쪽을 한 번도 보지 않았다. 정면 승부를 원하는 사람의 침묵이었다.' : '장학금 서류를 쓰던 도서관에서 하린과 눈이 마주쳤다. 서로 아무 말도 하지 않았다.'; },
  choices:[
    {label:'서류를 완벽하게 준비해 정면 승부한다', sub:'학식 +1 · 승산 보통', run(S){ const win = _saScore(S) + 6 + rand(-10, 10) > 38; return win ? _sa(S, {cash:120, know:1, stress:2}, -1, '장학금 통지서가 왔다. 120만 원. 기쁨보다 하린의 얼굴이 먼저 떠올랐다. 그녀는 복도에서 “축하해요”라고 정확하게 말했고, 그날 이후 도서관에서 보이지 않았다.', 'sad') : _sa(S, {know:1, stress:3}, 0, '장학금은 하린에게 돌아갔다. 통지서를 들고 서 있던 그녀가 나를 보았다. 이긴 얼굴이 아니었다. 안도하는 얼굴이었다. 나는 그 표정을 오래 기억했다.', 'shy'); }},
    {label:'서류를 내지 않고 포기한다. 하린이 받게', sub:'하린 관계 +3 · 나 -1', run(S){ return _sa(S, {self:-1, stress:2}, 3, '며칠 뒤 하린이 사물함 앞에서 나를 막았다. “누가 부탁했어요? 동정은 받지 않습니다.” 목소리는 매서웠지만 손에는 합격 통지서가 구겨져 있었다. “…빚이에요. 갚을게요.”', 'shy'); }},
    {label:'하린에게 서류 검토를 부탁한다', sub:'하린 관계 +1 · 상황에 따라 승산 변동', run(S){ const help = rivalState(S) !== 'enemy'; const win = _saScore(S) + (help ? 11 : 5) + rand(-10, 10) > 38; if(win) return _sa(S, {cash:120, know:1.5}, help ? 1 : 0, help ? '하린이 붉은 펜으로 오탈자까지 잡아 줬다. 결과는 내 승리. 통지서를 받자 그녀가 말했다. “내가 잡아 준 건 맞춤법뿐이에요. 내용은 당신 거고요.” 그 말이 위로처럼 들렸다.' : '검토를 맡기는 건 도박이었다. 하린은 날카롭게 약점만 짚었다. 그 약점을 고친 서류로 장학금을 받았다. 고마운 건지 분한 건지 알 수 없었다.', 'serious'); return _sa(S, {know:1.5}, help ? 2 : 0, '결과는 하린이었다. “미안하다고 하면 모욕이겠죠.” 그녀는 서류에 남긴 붉은 펜 자국을 보며 말했다. “다음엔 같이 이길 방법을 찾아요.”', 'tender'); }},
  ]}),

Object.assign({}, _saHarin, {id:'rv_library_night', w:4, cd:10, cond:S => S.m >= 8 && S.m <= 110, place:'night', title:'새벽 두 시의 열람실',
  beats:[

    '서하린이 책 위에 엎드려 잠들어 있었다. 책상 위에는 작은 모래 타이머가 서 있다. 이미 다 흘러내린 채로.',

  text:S => '단정한 사람이 처음으로 흐트러진 모습이다. 입술 아래 눌린 책 모서리가 아파 보인다. 어떻게 할까?',

Object.assign({}, _saHarin, {id:'rv_help_sab', w:5, cd:10, cond:S => S.m >= 12 && S.m <= 105, place:'campus', title:'마감 한 시간 전',
  text:S => { const r = SS(S).rival; return r >= 2 ? '과제 마감 한 시간 전, 사물함에 포스트잇이 붙어 있었다. 「3번 식은 분모가 틀렸어요. —H」 틀림없이 하린의 필체였다.' : r <= -2 ? '조별 과제 제출 직전, 공유 폴더의 내 파일이 한 시간 전 버전으로 되돌려져 있었다. 마지막 수정자는 비어 있었다. 그런 일을 할 사람은 한 명밖에 떠오르지 않았다.' : '과제 옆자리에서 하린이 아무 말 없이 지우개 가루를 털었다. 내 답안 한 문제를 가리켰다. “이건 틀렸어요. 이유는 안 알려 줄 거예요.”'; },
  choices:[
    {label:'하린에게 직접 찾아간다', sub:'하린 관계는 상황에 따라', run(S){ const r = SS(S).rival; return r >= 2 ? _sa(S, {bond:1}, 2, '“고마워요.” “제 이름은 쓰지 마요. 알려 준 적 없는 거예요.” 그렇게 말하며 그녀는 귀 끝이 붉어졌다. 좋은 사람은 서투르게 좋아야 한다는 걸 처음 알았다.', 'shy') : r <= -2 ? _sa(S, {stress:3}, -1, '“증명해 보세요.” 하린은 부정하지 않았다. 그 침묵이 더 불길했다. 하지만 그녀의 시선은 끝내 내 눈을 피했다.', 'serious') : _sa(S, {ins:1}, 1, '“왜 알려 줘요?” “알려 줄 이유는 없어요. 틀린 걸 두고 보는 게 불편했을 뿐이에요.” 이유가 없다면서 이유를 말하는 사람이었다.', 'surprised'); }},
    {label:'말없이 스스로 해결한다', sub:'일 +2 · 스트레스 +3', run:S => _sa(S, {work:2, stress:3, skill:1}, 0, '시간 안에 어떻게든 제출했다. 누구도 나를 구해 주지 않았고, 아무도 나를 무너뜨리지 못했다. 이상하게 그게 오늘의 가장 큰 수확이었다.', 'serious')},
    {label:'작은 것으로 응수한다 (커피 한 잔)', sub:'자금 -4 · 하린 관계 +1', run:S => _sa(S, {cash:-4}, 1, '뚜껑에 「독 없음」이라고 적은 커피를 책상에 놓았다. 하린은 한참 뚜껑을 보다가 한 모금 마셨다. “…설탕 너무 많이 넣었어요.” 하지만 컵은 끝까지 비웠다.', 'tender')},
  ]}),

Object.assign({}, _saHarin, {id:'rv_job_market', once:true, w:5, cd:30, cond:S => S.m >= 38 && S.m <= 75, place:'campus', title:'채용 박람회',

    {label:'“누구한테 들었는데요?” 캐묻는다', sub:'통찰 +2 · 하린 관계 -1', run:S => _sa(S, {ins:2, stress:2}, -1, '“…읽은 기사가 있어요.” 대답이 한 박자 늦었다. 기사는 없었다. 나는 그녀의 거짓말을 처음으로 정확히 읽었다. 그리고 그녀가 거짓말을 못 한다는 것도.', 'serious')},

Object.assign({}, _saHarin, {id:'rv_rumor', once:true, w:4, cd:30, cond:S => S.m >= 20 && S.m <= 95, place:'campus', title:'단톡방의 소문',
  text:S => { const st = rivalState(S); return st === 'enemy' ? '학과 단톡에 이상한 말이 돈다. 「서윤이 교수님 연구실에 자주 가는 이유가 따로 있대.」 출처를 쫓아가 보니 마지막에 하린의 후배가 있다.' : st === 'ally' ? '비슷한 소문이 돌았지만 하루 만에 사라졌다. 진원지 후배가 하린 앞에서 사과하는 걸 우연히 봤다. “정확하지 않은 건 말하지 않게 하고 싶었을 뿐이에요.”' : '내게 관한 소문이 돌았지만, 가장 먼저 부정한 사람이 서하린이었다는 말이 들렸다. 이상한 일이다.'; },
  choices:[
    {label:'직접 해명하고 정면 돌파한다', sub:'나 +2 · 스트레스 +3', run:S => _sa(S, {self:2, stress:3, charm:1}, 0, '질문하는 사람 앞에서 사실만 말했다. 소문은 설명하는 순간 힘을 잃었다. 떨리는 손을 숨기는 일이 그날의 가장 어려운 일이었다.', 'serious')},
    {label:'무시한다. 시간이 해결해 준다', sub:'스트레스 +1 · 관계 -1', run:S => _sa(S, {stress:1, bond:-1}, 0, '일주일이 지나서야 소문은 시들었다. 하지만 몇몇 친구의 시선은 이미 한 칸 멀어져 있었다. 침묵은 평화가 아니라 비용이었다.', 'serious')},
    {label:'하린에게 직접 확인한다', sub:'하린 관계 상황에 따라 · 통찰 +1', run(S){ const st = rivalState(S); return st === 'enemy' ? _sa(S, {ins:2}, 0, '“내가 했다면 이렇게 서툴지 않았을 거예요.” 이상하게 설득력 있는 대답이었다. 나는 그녀를 의심하면서도 믿었다.', 'serious') : st === 'ally' ? _sa(S, {ins:1}, 2, '“갚은 거예요. 장학금 때.” 하린이 시선을 돌렸다. “소문은 비효율적이에요. 사람을 소모하니까.” 그녀의 정의가 나를 살렸다.', 'shy') : _sa(S, {ins:1}, 1, '“저는 소문을 만들 시간 없어요.” 하린이 단호하게 말했다. 변명 같지 않았다. 그 말이 이상하게 안심이 됐다.', 'serious'); }},
  ]}),

Object.assign({}, _saHarin, {id:'rv_coffee', w:3, cd:14, cond:S => S.m >= 18 && S.m <= 110 && SS(S).rival >= 0, place:'cafe', title:'식은 커피',

  text:S => '처음으로 하린이 자기 이야기를 한다. 숫자와 계획이 아닌 이야기. 어떻게 답할까?',

    {label:'아무 말 않고 끝까지 들어준다', sub:'스트레스 -3 · 하린 관계 +2', run:S => _sa(S, {stress:-3, bond:1}, 2, '하린은 십 분 넘게 말하고, 문득 정신을 차린 듯 입을 다물었다. “이런 얘기, 한 적 없어요.” “나도 들은 적 없는 걸로 할게요.” 그녀가 처음으로 소리 내어 웃었다.', 'tender')},

Object.assign({}, _saHarin, {id:'rv_bet', once:true, w:4, cd:30, cond:S => S.m >= 16 && S.m <= 80, place:'cafe', title:'소원 내기',

const STORY = [].concat(typeof STORY_A !== 'undefined' ? STORY_A : [], typeof STORY_B !== 'undefined' ? STORY_B : [], typeof STORY_C !== 'undefined' ? STORY_C : []).sort((a, b) => a.m - b.m);
function storyDue(S){
  for(const e of STORY){
    if(S.seen[e.id]) continue; if(S.m < e.m) continue;
    if(S.m > e.m + (e.exp == null ? 8 : e.exp)) continue;
    if(e.cond && !e.cond(S)) continue;
    return Object.assign({once:true}, e);
  }
  return null;
}

// 전화 걸기: 성공하면 이벤트를 돌려주고, 횟수·달 제한은 여기서 처리한다. 걸 수 없으면 사유 문자열.
function tryCall(S, id){
  if(callsLeft(S) <= 0) return '이번 달 통화는 모두 사용했어요';
  if(calledThisMonth(S, id)) return '이번 달에 이미 통화했어요';
  const ev = callEvent(S, id); if(!ev) return '연락할 수 없어요';
  if(!S.calls || S.calls.m !== S.m) S.calls = {m:S.m, n:0};
  S.calls.n++; (S.callAt || (S.callAt = {}))[id] = S.m;
  return ev;
}

// 엔딩 판정과 텍스트 (ENGINE 구간 안, DOM 금지)
const FREE_MIN = 50, FREE_SUM = 192;

// 빌린 인생 / 되풀이된 결혼 같은 보정을 반영한 최종 3축
function finalPillars(S){
  const w = S.work - Math.min(32, S.borrowed * 2.8);
  let b = S.bond; const j = S.love.jaewoo;
  if(S.partner === 'jaewoo' && j && !j.fixed) b -= 18;
  return {work:clamp(w, 0, 100), bond:clamp(b, 0, 100), self:S.self};
}
function isFree(P){ return P.work >= FREE_MIN && P.bond >= FREE_MIN && P.self >= FREE_MIN && (P.work + P.bond + P.self) >= FREE_SUM; }

const loverOf = S => S.partner && S.love[S.partner] && S.love[S.partner].stage >= 1 && !(S.secret && S.secret[S.partner]) ? S.partner : null;
const exLovers = S => Object.keys(S.love).filter(i => S.love[i].stage === -9).length;
function computeEnding(S){
  if(S.ending) return S.ending;
  const P = finalPillars(S), raw = {work:S.work, bond:S.bond, self:S.self};
  const lov = loverOf(S), secretNow = Object.keys(S.secret || {}).some(i => S.secret[i] && S.love[i] && S.love[i].stage >= 1);
  if(isFree(P)){
    if(S.divorced && !S.married) return 'free_divorced';
    if(S.married && P.bond >= 62) return 'free_wedding';
    if(lov && P.bond >= 58) return 'free_love_' + lov;
    if(secretNow) return 'free_secret';
    if(S.hired && (S.rank || 0) >= 3 && !inLawSchool(S)) return 'free_exec';
    if((S.switched || 0) >= 1 && S.hired) return 'free_hopper';
    if(S.cash >= 1500) return 'free_rich';
    if(CAREERS[S.track] && S.hired && P.work >= 62 && !inLawSchool(S)) return 'free_' + S.track;
    if((S.engaged || S.married) && P.bond >= 70) return 'free_home';
    if(Object.keys(S.love).filter(i => S.love[i].aff >= 40 && S.love[i].stage !== -9).length >= 3) return 'free_many';
    if(!S.partner && !S.married && P.self >= 60) return 'free_single';
    if(S.st.know >= 68) return 'free_scholar';
    if(S.st.charm >= 62) return 'free_charm';
    if(S.st.dare >= 55) return 'free_dare';
    if(S.st.ins >= 62) return 'free_ins';
    if(P.self >= 75) return 'free_soul';
    return 'free_balance';
  }
  if(isFree(raw)) return 'ret_borrowed'; // 겉보기엔 통과했지만 빌린 인생이었다
  const lowest = Object.keys(P).sort((a, b) => P[a] - P[b])[0];
  if(P.work < 35 && P.bond < 35 && P.self < 35) return 'ret_all';
  if(S.lastDisc != null && P.bond < 50) return 'ret_exposed';
  if(S.divorced) return 'ret_divorce';
  if(exLovers(S) >= 3 && P.bond < 55) return 'ret_breakups';
  if(S.married && P.bond < 50) return 'ret_cold';
  if(S.stress >= 85) return 'ret_burnout';
  if(S.cash >= 1500) return 'ret_rich';
  if(!S.hired && S.m >= 60) return 'ret_nojob';
  if((S.switched || 0) >= 2) return 'ret_hopper';
  if(P.work >= 68 && P.bond < 50 && P.self < 50) return 'ret_workaholic';
  if(S.st.know >= 68) return 'ret_bookish';
  return 'ret_' + lowest;
}

  if(pay) out.push({t:'수입', c:'pay'});
  if(hp > 0) out.push({t:'체력▲', c:'up'}); else if(hp <= -8) out.push({t:'체력▼', c:'down'});

      });
    };
    if(mc){ const n = +mc[1]; const el = $('ev'); el.className = 'evcard on chapter'; el.style.backgroundImage = 'none'; el.innerHTML = `<div class="chapcard"><small>${yearOf(S)}년 · ${n} / 10</small><b>제 ${n} 장</b><h1>${esc(CHAPTER_TITLES[n - 1] || '')}</h1><p>시계 조각 ${SS(S).pieces} / 10</p><button class="btn" id="chgo">시작</button></div>`; $('chgo').onclick = nextBeat; }
    else nextBeat();
  });
}
const alertSheet = (title, body, chips, btn) => new Promise(res => { openSheet(`<div class="sh-head"><b>${esc(title)}</b></div><div class="txt">${body}</div><div class="chips">${chipHTML(chips)}</div><button class="btn blue" id="nx" style="margin-top:14px">${btn || '계속'}</button>`); $('nx').onclick = () => { closeSheet(); res(); }; });

// ── 한 달 진행 ────────────────────────────────────────────────
const ACT_ART = new Set(['study','cert','tutor','cafe','intern','project','jobhunt','job','future','exercise','journal','hobby','style','family','friends','club','date','travel','rest']);
// 직업 그림은 나이대별: 25살(기본)·27살·30살 (인턴은 항상 기본)
function jobArtFor(c, intern){ const k = intern ? '' : (S.m >= 96 ? '_30' : S.m >= 72 ? '_27' : ''); return `art/job_${c}${k}.webp`; }
// 계절(3~5 봄, 6~8 여름, 9~11 가을, 12~2 겨울)과 2.5등신 캐릭터 스프라이트(두 장이 번갈아 움직인다)
const seasonOf = S => { const m = monthOf(S); return m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter'; };
const SPRITE = {study:'study', cert:'study', tutor:'study', cafe:'cafe', intern:'job', project:'job', jobhunt:'job', job:'job', future:'journal', journal:'journal', exercise:'exercise', hobby:'hobby', style:'style', family:'family', friends:'friends', club:'friends', date:'date', travel:'travel', rest:'rest'};
const OUTDOOR = new Set(['exercise', 'friends', 'club', 'date', 'travel', 'cafe', 'tutor']);
const seasonBg = (S, place) => `art/bg_${place}_${seasonOf(S)}.webp`;
function showAct(slotName, id, out){
  return new Promise(res => {
    const a = ACTS[id], el = $('act');
    const jobArt = id === 'job' ? (inLawSchool(S) ? 'art/job_lawschool.webp' : (CAREERS[S.track] ? jobArtFor(S.track) : null)) : null;
    const internArt = id === 'intern' && CAREERS[S.interest] ? jobArtFor(S.interest, true) : null;
    const duoArt = id === 'job' && out.duo ? `art/duo_${out.duo}.webp` : null;
    const body = `<div class="abot"><h2>${a.icon} ${esc(actName(S, id))}</h2>${out.note ? `<div class="txt" style="margin:4px 0 8px">${esc(out.note)}</div>` : `<div class="txt" style="margin:4px 0 8px;opacity:.85">${esc(a.desc)}</div>`}<div class="chips">${chipHTML(out.ch)}</div><button class="btn" id="anx" style="margin-top:14px">다음</button></div>`;
    const sp = SPRITE[id];
    if(sp){ // 계절 배경 위에서 2.5등신 캐릭터가 계속 움직이고, 결과 카드는 그 위에 같이 나온다
      const spf = sp === 'date' && out.lover ? `date_${out.lover}` : sp;
      el.style.backgroundImage = `url(${seasonBg(S, OUTDOOR.has(id) ? 'campus' : 'room')})`;
      el.innerHTML = `<div class="ashade"></div><div class="atop"><span class="who">${slotName} · ${esc(actName(S, id))}</span></div><div class="sprite ${sp === 'friends' || sp === 'date' ? 'wide' : ''}"><img class="fa" src="art/chibi/${spf}_a.webp" alt="" onerror="this.src='art/chibi/${sp}_a.webp'"><img class="fb" src="art/chibi/${spf}_b.webp" alt="" onerror="this.src='art/chibi/${sp}_b.webp'"></div>` + body;
    } else {
      el.style.backgroundImage = duoArt ? `url(${duoArt}), url(${jobArt || 'art/act_job.webp'}), url(art/act_job.webp)` : jobArt ? `url(${jobArt}), url(art/act_job.webp)` : internArt ? `url(${internArt}), url(art/act_intern.webp)` : ACT_ART.has(id) ? `url(art/act_${id}.webp)` : 'none';
      el.innerHTML = `<div class="ashade"></div><div class="atop"><span class="who">${slotName}</span></div>` + body;
    }
    el.classList.add('on'); paintEdge('card'); $('anx').onclick = () => { el.classList.remove('on'); paintEdge('game'); res(); };
  });
}
async function runMonth(){
  seedMonth(S); S.lastPlan = S.plan.slice();
  for(let i = 0; i < 3; i++){
    let id = S.plan[i]; if(!id || id === '>') continue; let a = ACTS[id]; const first = i;
    let fell = false; if(a.cost && a.cost > S.cash || (a.req && a.req(S))){ fell = true; id = 'rest'; a = ACTS[id]; }
    S.curDate = S.dateTo && S.dateTo[first] || null; const out = doAction(S, id); S.curDate = null; i += a.slots - 1; if(fell) out.note = '조건이 맞지 않아 계획을 바꿔 쉬었다.';
    await showAct(SLOT_NAMES[first], id, out);
    if(out.burnout) break;
  }
  const sch = settle(S);
  await alertSheet(`${yearOf(S)}년 ${monthOf(S)}월 정산`, '생활비·균형을 정산했어요.', sch, '계속');
  if(!S.ending){
    const fx_ = fixedEvents(S); for(const f of fx_){ await playEvent(f); if(S.ending) break; }
    if(!S.ending){ const ev = fx_.length >= 2 ? null : (R() < 0.7 ? pickEvent(S) : null); if(ev) await playEvent(ev); }
  }
  if(!S.ending) S.m++;
  S.plan = [null, null, null];
  if(S.m >= TOTAL_MONTHS || S.ending){ S.ending = S.ending || computeEnding(S); save(); return showEnding(); }
  save(); render();
}
async function startFlow(){ // 새 게임: 프롤로그 먼저
  seedMonth(S); await playEvent(PROLOGUE); save(); render();
}

// ── 엔딩 ──────────────────────────────────────────────────────
function showEnding(){
  const id = S.ending || computeEnding(S), e = ENDINGS[id]; const P = finalPillars(S);
  const seen = store(ENDINGS_KEY) || []; if(!seen.includes(id)){ seen.push(id); store(ENDINGS_KEY, seen); }
  $('end').innerHTML = `<div class="endbg" style="background-image:url(art/${e.free ? 'age30' : 'cover'}.webp)"></div><div class="endscroll"><div class="endspacer"></div><div class="endcard ending"><div class="big">${e.icon}</div><span class="tag ${e.free ? '' : 'ret'}">${e.sub}</span><h1>${e.title}</h1>
   <div class="pillars">${Object.keys(PILLAR).map(k => `<div class="pcard ${k}"><div class="pt"><span>${PILLAR[k]}</span><b>${Math.round(P[k])}</b></div><div class="t"><i style="width:${P[k]}%"></i><u></u></div></div>`).join('')}</div>
   <div class="letter">${esc(e.letter.replace(/\{name\}/g, S.name))}\n\n— 일흔 살의 나로부터</div>
   <p class="sub">엔딩 ${seen.length}/${ENDING_IDS.length} 수집 · 빌린 인생 ${S.borrowed} · 기억 선명도 ${Math.round(S.clarity)}</p>
   <button class="btn" id="b-again">${e.free ? '다시 도전하기' : '한 번 더 되감기'}</button></div></div>`;
  $('b-again').onclick = () => { store(SAVE_KEY, null); S = null; initTitle(); show('title'); };
  show('end');
}

// ── 메뉴·기록 ─────────────────────────────────────────────────
function initGame(){
  $('btn-go').onclick = () => { if(S.plan.some(x => !x)){ openPicker(firstEmpty()); return; } $('btn-go').disabled = true; $('dialog').hidden = true; runMonth().finally(() => { $('btn-go').disabled = false; }); };
  $('b-call').onclick = openPhone;
  $('btn-advice').onclick = () => { if($('dialog').hidden) showDialog(); else $('dialog').hidden = true; };
  $('dlg-x').onclick = () => { $('dialog').hidden = true; };
  document.querySelectorAll('[data-sheet]').forEach(b => b.onclick = () => ({stat:showStats, career:showCareer, love:showLove, dex:showDex, shop:showShop}[b.dataset.sheet])());
  $('b-menu').onclick = () => { openSheet(sheetHead('메뉴') + `<div class="menu-list"><button class="btn ghost sm" id="m-update">🔄 새 버전 확인</button><button class="btn ghost sm" id="m-slots">💾 저장 · 불러오기 (슬롯 5개)</button><button class="btn ghost sm" id="m-title">🏠 타이틀로 (자동 저장)</button></div><div class="foot">빌드 #37 · 2026.10.11<br><span id="diag"></span></div>`);
    $('x').onclick = closeSheet;
    try{ const pr = document.createElement('div'); pr.style.cssText = 'position:fixed;left:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top);visibility:hidden'; document.body.appendChild(pr); const cs = getComputedStyle(pr), sb = cs.paddingBottom, st = cs.paddingTop; pr.remove(); const sa = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; $('diag').textContent = `화면 ${innerWidth}×${innerHeight} · 기기 ${screen.width}×${screen.height} · 안전영역 위 ${st}/아래 ${sb} · ${sa ? '홈 화면 앱' : '브라우저'}`; }catch(e){}
    $('m-update').onclick = () => checkUpdate(true);
    $('m-slots').onclick = () => showSlots(true);
    $('m-title').onclick = () => { save(); closeSheet(); initTitle(); show('title'); }; };
  $('ov').addEventListener('click', e => { if(e.target === $('ov') && !document.querySelector('#sheet #nx')){ closeSheet(); if(S) render(); } });
}
initTitle(); initGame(); paintIcons(); paintEdge('title');

// 설치형 앱(PWA): 서비스워커로 그림을 기기에 캐시해 두 번째부터는 빠르게, 오프라인에서도 열린다
try{ if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}

// 아이폰 사파리: 화면 아래에 접힌 하단 바 자리가 따로 생긴다. 그림은 그 자리까지 채우고(앱 높이 = 기기 화면 높이),
// 버튼·탭은 바 위에 오도록 아래 여백(--sb)을 그만큼 준다.
function fitFull(){
  try{
    const root = document.documentElement, app = $('app');
    const ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const sh = Math.max(screen.height, screen.width), gap = Math.round(sh - window.innerHeight);
    if(ios && Math.min(screen.width, screen.height) < 600 && gap > 4 && gap < 140 && window.innerHeight > window.innerWidth){
      app.style.bottom = 'auto'; app.style.height = sh + 'px'; root.style.setProperty('--sb', gap + 'px');
    } else { app.style.bottom = ''; app.style.height = ''; root.style.removeProperty('--sb'); }
  }catch(e){}
}
fitFull(); addEventListener('resize', fitFull); addEventListener('orientationchange', () => setTimeout(fitFull, 300)); setTimeout(fitFull, 600);

// ── 새 버전 확인: 사파리는 페이지를 몇 분간 기억해 두므로, 서버의 빌드 번호와 비교해 알려 준다 ──
const BUILD_NO = parseInt(('#37 · 2026.10.11'.match(/#(\d+)/) || [0, 0])[1], 10);
async function checkUpdate(manual){
  try{
    const r = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'}); const txt = await r.text();
    const m = txt.match(/빌드 #(\d+)/), no = m ? parseInt(m[1], 10) : 0;
    if(no > BUILD_NO){ showUpdateBar(no); return true; }
    if(manual) toast('최신 버전이에요 (빌드 #' + BUILD_NO + ')');
  }catch(e){ if(manual) toast('확인하지 못했어요. 인터넷을 확인해 주세요'); }
  return false;
}
function showUpdateBar(no){
  if(document.getElementById('upbar')) return;
  const d = document.createElement('div'); d.id = 'upbar'; d.innerHTML = `새 버전 #${no}이 있어요 <button id="up-go">업데이트</button>`; $('app').appendChild(d);
  $('up-go').onclick = async () => { try{ const rs = await navigator.serviceWorker.getRegistrations(); for(const x of rs) await x.unregister(); const ks = await caches.keys(); for(const k of ks) await caches.delete(k); }catch(e){} location.replace(location.pathname + '?v=' + Date.now()); };
}
setTimeout(() => checkUpdate(false), 1500);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(false); });
