 speaker:'안유찬', title:'리포트에 적힌 이름', place:'night', img:'art/ct_office.webp', cut:'yuchan', cutVar:'b',
 beats:['업데이트 이틀 뒤, 우리 숙소 근처 사진이 팬 커뮤니티에 돌기 시작했다. 사생들이 숙소 앞에 몰렸다. 사후 분석 문서가 소속사와 공유된다.', '원인 칸에는 “앱 위치 정보 처리 오류, 리드의 확인 누락”이라고 적혀 있다. 하지만 사실은 내가 앱에 올린 셀카 창밖에 숙소 간판이 찍힌 탓이다. 확인해 주겠다는 그의 말을 듣지 않고 급하게 올린 것도 나다.', '기록을 보니 그가 새벽에 혼자 문서를 고친 흔적이 남아 있다. 내 이름을 지운 사람은 유찬이었다.'],
 text:S => `소속사와의 대책 회의는 내일 오전이다. ${lvFlag(S, 'yuchan', 'y_burn_ok') ? '나를 쉬게 해 준 사람이, 이번엔 내 잘못을 대신 짊어졌다.' : '말 한마디 없이 책임을 가져간 그가 고마운지 화가 나는지 모르겠다.'} 어떻게 할까?`,
 choices:[
  {label:'대책 회의에서 내 잘못을 직접 밝힌다', sub:'협상 · 호감 큰 변동', run(S){ if(S.st.neg >= 50) return _lsdR(S, 'yuchan', 10, {neg:1.5, work:2, self:2, stress:5}, 'y_truth', '“사진은 제가 확인 없이 올렸습니다.” 그리고 앞으로 올리기 전에 지킬 규칙을 종이 한 장으로 설명했다. 오 실장의 표정이 풀렸고 유찬은 말없이 나를 바라보았다. 회의실을 나서자 그가 낮게 말했다. “…내 이름 지우길 잘했네요. 당신 이름이 더 잘 보여서.”'); return _lsdR(S, 'yuchan', 3, {work:-2, self:2, stress:9}, 'y_truth', '말을 꺼냈지만 설명이 어설퍼 회의실이 얼어붙었다. 그래도 사실을 밝혔다는 것 하나는 남았다. 복도에서 유찬이 내 손에 물병을 쥐여 주었다. “서툴렀어요. 그런데 다음엔 더 잘할 사람이에요.”', 'serious'); }},
  {label:'유찬을 찾아가 “왜 말도 없이 덮었어요?”라고 따진다', sub:'호감 하락 가능', run(S){ const hi = affOf(S, 'yuchan') >= 55; return _lsdR(S, 'yuchan', hi ? -3 : -6, {stress:4}, 'y_fight', hi ? '“당신이 혼자 무너지는 건 못 보겠어서요.” 그의 대답은 서툴렀지만 진심이었다. 서로 목소리를 높이다 말고 같이 한숨을 내쉬었다. 화낼 일이었을까, 아니면 고마워할 일이었을까.' : '“확인하는 사람은 저예요. 그게 제 역할이에요.” 유찬이 정색하고 말했다. 맞는 말인데 이상하게 서운했다. 서로 한 발씩 물러선 채 퇴근하는 길이 평소보다 길었다.', 'serious'); }},
  {label:'고맙다고만 하고 넘어간다', sub:'나 -3 · 마음이 무겁다', run(S){ return _lsdR(S, 'yuchan', 1, {self:-3, stress:3}, 'y_silent', '“고마워요.” 그 한마디로 상황은 끝났다. 유찬은 안도한 듯 웃었지만 나는 그날 밤 이불 속에서 오래 뒤척였다. 누군가의 이름 뒤에 숨는 건, 마흔의 내가 가장 싫어하던 모습이었다.'); }},
 ]},

{id:'ls_yuchan_5', lover:'yuchan', cond:S => isMet(S, 'yuchan') && afterEv(S, 'ls_yuchan_4', 3) && _lsdHigh(S, 'yuchan') && S.m < 116,
 speaker:'안유찬', title:'로그에 없는 말', place:'night', img:'art/ct_night.webp', cut:'yuchan', cutVar:'a',
 beats:['그의 사무실 옥상. 도시의 불빛이 로그처럼 줄지어 흘러간다. 유찬이 난간에 팔을 걸치고 한참 말이 없다.', '“저는 말이 컴파일이 안 돼요. 코드로는 이해받는데 사람한테는 번번이 에러가 나요.”', '그가 주머니에서 접힌 종이를 꺼낸다. 직접 그린 앱 구조도 맨 위에, 내 이름이 첫 번째 아티스트로 적혀 있다.'],
 text:S => `${lvFlag(S, 'yuchan', 'y_truth') ? '임원 회의 이후 그의 눈은 한결 편안해졌다.' : lvFlag(S, 'yuchan', 'y_fight') ? '그날 다투고 난 뒤 처음으로 마주 서는 자리다.' : '조심스러운 침묵 속에서도 그의 마음이 읽힌다.'} “올봄에 회사를 나와서, 아이돌을 악플이랑 사생한테서 지키는 앱을 직접 만들어 보려고요. 그런데 혼자 하는 건 처음이라…” ${isCouple(S, 'yuchan') ? '그는 내 손을 쥔 채 말을 이었다.' : '그가 처음으로 내 얼굴을 똑바로 보았다.'}`,
 choices:[
  {label:'“같이 만들어요. 대신 퇴근 시간은 내가 정해요”', sub:'도전 · 협상 · 호감↑', run(S){ if(S.st.dare >= 45 || S.st.neg >= 55) return _lsdR(S, 'yuchan', 9, {dare:1.5, neg:1.5, work:2}, 'y_join', '“…진짜요?” 그의 목소리가 갈라졌다. 나는 팬들에게 들은 불편 목록과 일정표 한 장을 그의 구조도 옆에 얹었다. 그가 웃음을 참으며 파일명을 바꿨다. “공동 소유자 한 명 추가. 오류 없음.”'); return _lsdR(S, 'yuchan', 6, {dare:1, work:1, stress:4}, 'y_join', '자신 있게 말했지만 손바닥에는 땀이 맺혔다. 유찬은 그걸 눈치채고도 모른 척해 주었다. “준비는 내가 많이 해 둘게요. 당신은 방향만 잡아 줘요.”'); }},
  {label:'“당신이 만들고, 나는 가장 먼저 쓰는 사람이 될게요”', sub:'매력 · 호감↑', run(S){ return _lsdR(S, 'yuchan', 7, {charm:1.5, bond:1.5}, 'y_user', `유찬은 한동안 대답 없이 난간만 쥐고 있었다. “사용자 한 명이 이렇게 크게 느껴진 적은 처음이에요.” ${isCouple(S, 'yuchan') ? '그가 내 어깨에 이마를 잠깐 기댔다. 짧은 순간이었지만 오래 기억할 것이다.' : '그가 어색하게 웃으며 시선을 도시의 불빛 쪽으로 돌렸다.'}`, 'shy'); }},
  {label:'“지금은 내 무대부터 단단히 해 둘게요. 기다려 줘요”', sub:'나 +2 · 호감 소폭', run(S){ return _lsdR(S, 'yuchan', isCouple(S, 'yuchan') ? 3 : 1, {self:2.5, stress:-2}, 'y_wait', `“…알겠어요. 대기열에 넣어 둘게요.” 그는 서운함을 감추며 웃었다. 내 선택이 틀린 건 아니지만 옥상의 바람이 조금 쓸쓸했다. ${isCouple(S, 'yuchan') ? '“기다리는 건 잘해요. 로그 돌아가는 걸 몇 시간씩 보던 사람이잖아요.”' : '그가 기다림에 익숙한 사람이라는 게 새삼 마음에 걸렸다.'}`); }},
 ]},

{id:'ls_yuchan_6', lover:'yuchan', cond:S => isMet(S, 'yuchan') && afterEv(S, 'ls_yuchan_5', 3) && _lsdHigh(S, 'yuchan') && S.m < 119,
 speaker:'안유찬', title:'첫 번째 릴리즈', place:'night', img:'art/bg_office.webp', cut:'yuchan', cutVar:'a',
 beats:['출시 날 밤. 텅 빈 사무실에 모니터 불빛만 둘이다. 유찬의 손가락 끝이 배포 버튼 위에서 멈춰 있다.', '“이 버튼은 늘 혼자 눌렀어요. 잘못되면 혼자 책임지려고.” 그가 마우스에서 손을 뗀다.', '앱 소개 화면에는 ‘만든 사람들’ 목록이 보인다. 맨 위에 내 이름, 그 아래에 그의 이름이다.'],
 text:S => `${lvFlag(S, 'yuchan', 'y_join') ? '우리가 함께 만든 서비스가 마침내 세상에 나가는 순간이다.' : lvFlag(S, 'yuchan', 'y_wait') ? '내가 기다려 달라고 했던 시간이 이 밤까지 이어졌다.' : '그가 오랫동안 혼자 만들어 온 것을 마침내 나에게 보여 준다.'} 유찬이 낮게 말한다. “이번엔 같이 눌러요. 혹시 에러가 나면 같이 읽을 수 있게.”`,
 choices:[
  {label:'첫 공지 문구를 직접 써서 그에게 보여 준다', sub:'협상 · 감각 · 호감↑↑', run(S){ S.album.push('유찬과 처음으로 함께 앱을 연 날. 첫 공지에는 “같이 읽는다”라고 적었다.'); lvSet(S, 'yuchan', 'y_promise'); if(S.st.neg >= 55 && S.st.sense >= 55) return _lsdR(S, 'yuchan', 12, {neg:1.5, sense:1.5, self:3, bond:2}, 'y_final', `「새벽 세 시에도 혼자가 아니게.」 내가 쓴 첫 공지를 읽은 그가 입술을 깨물며 웃었다. “이 정도 문장이면 로그가 아니라 편지네요.” ${isCouple(S, 'yuchan') ? '“앞으로도 모든 공지에 네 이름을 같이 적을래.”' : '“약속할게요. 에러가 나도, 새벽이어도, 같이 읽는다는 걸요.”'}`); return _lsdR(S, 'yuchan', 8, {self:3, bond:2}, 'y_final', `「같이 읽는다.」 서툰 문장이었지만 유찬이 한참을 화면에서 눈을 떼지 못했다. ${isCouple(S, 'yuchan') ? '“…이거 영원히 안 지울래. 되돌리기 없이.”' : '“약속이라고 읽어도 되죠?” 그의 목소리가 아주 조금 떨렸다.'}`, 'shy'); }},
  {label:'“약속 하나 해요. 새벽 세 시엔 같이 깨어 있기, 대신 낮엔 같이 자기”', sub:'감각 · 매력 · 호감↑', run(S){ S.album.push('유찬이 배포 버튼을 누르기 전에 약속했다. 어떤 에러도 같이 읽자고.'); lvSet(S, 'yuchan', 'y_promise'); return _lsdR(S, 'yuchan', 10, {charm:1.5, self:3, stress:-3}, 'y_final', `유찬이 소리 내어 웃었다. 오랫동안 들어 보지 못한 웃음이었다. “낮에 자는 건 생각 못 했네요. 좋은 요구 사항이에요.” ${isCouple(S, 'yuchan') ? '우리는 배포 버튼을 같이 눌렀고, 손등이 겹친 채 한동안 떼지 않았다.' : '버튼 위에서 겹친 손가락을 그도 나도 끝내 떼지 못했다.'}`, 'shy'); }},
  {label:'말없이 그의 손 위에 손을 얹어 배포 버튼을 누른다', sub:'도전 · 호감↑', run(S){ S.album.push('유찬의 손 위에 손을 얹어 버튼을 눌렀다. 화면이 초록색으로 바뀌었다.'); lvSet(S, 'yuchan', 'y_promise'); return _lsdR(S, 'yuchan', S.st.dare >= 45 ? 9 : 7, {dare:1, self:3, bond:2}, 'y_final', `화면이 초록색으로 바뀌었다. 한동안 아무도 말하지 않았다. ${S.st.dare >= 45 ? '유찬은 천천히 내 손을 뒤집어 깍지를 끼웠다. “이게 제일 완전한 배포 같아요.”' : '유찬이 숨을 길게 내쉬었다. “…이제 되돌리기 없어요.” 그 말이 오히려 안심이 되었다.'}`, 'shy'); }},
 ]},

// ════════ 신우진 (무대 의상 디자이너 · 원단과 색으로 마음을 읽는 사람) ════════
{id:'ls_ujin_1', lover:'ujin', cond:S => isMet(S, 'ujin') && S.m < 112,
 speaker:'신우진', title:'색은 거짓말을 안 해요', place:'cafe', img:'art/ct_mall.webp', cut:'ujin', cutVar:'a',
 beats:['의상실 테이블 위에 내가 그려 간 무대 의상 낙서와 색 견본이 펼쳐져 있다. 우진이 장갑도 끼지 않은 맨손으로 종이 가장자리를 천천히 쓸어 본다.', '그는 아무 말이 없다. 초 단위로 시간이 가는 소리가 들릴 정도다.', '마흔의 나는 이런 침묵이 두려웠다. 하지만 스무 살의 나는 이 침묵이 평가가 아니라 읽는 중이라는 걸 안다.'],
 text:S => `한참 뒤 우진이 고개를 든다. “여기 이 쪽빛이요, 의도한 색인가요, 우연히 나온 색인가요?” ${isCouple(S, 'ujin') ? '연인의 눈이 아니라 디자이너의 눈으로 묻는 질문이라 더 긴장된다.' : '그의 눈빛이 이상하게 진지해서 대답이 잘못 나올까 손끝이 차가워진다.'}`,
 choices:[
  {label:'“어떤 색이 거짓말을 했나요?”라고 되묻는다', sub:'감각 · 호감↑', run(S){ if(S.st.sense >= 45) return _lsdR(S, 'ujin', 6, {sense:1.5, work:1}, 'u_eye', '우진은 보드 한쪽의 연한 회색을 가리켰다. 나는 거의 반사적으로 “이 회색이 옆의 쪽빛을 죽이고 있죠” 하고 말했다. 그가 놀란 듯 눈을 크게 떴다. “…눈이 좋아요. 손끝이 아니라 눈으로 읽는 분이네요.”'); return _lsdR(S, 'ujin', 4, {sense:1.5}, 'u_eye', '우진은 천천히 회색 조각을 짚으며 이유를 설명했다. 이해하는 데 시간이 걸렸지만 그는 한 번도 서두르지 않았다. “색을 보는 눈은 길러져요. 오늘 하나 늘었어요.”'); }},
  {label:'“솔직히 우연이에요. 그런데 마음에 들었어요”', sub:'매력 · 호감↑', run(S){ return _lsdR(S, 'ujin', 5, {charm:1, self:1}, 'u_honest', '우진의 입가가 부드럽게 풀렸다. “우연이라고 말해 주는 사람이 드물어요. 대부분 처음부터 다 계획한 척하거든요.” 그가 쪽빛 천 조각 하나를 건넸다. “이건 선물이에요. 우연히 마음에 들어서.”', 'shy'); }},
  {label:'“그럼 이 색을 어떻게 고쳐야 하나요?”라고 가르침을 청한다', sub:'멘탈 · 표현력', run(S){ return _lsdR(S, 'ujin', 4, {ins:1, sense:1, work:1.5}, 'u_learn', '우진은 가위를 들어 천 조각 한쪽 끝을 비스듬히 잘랐다. “색은 고치는 게 아니라 옆에 둘 사람을 바꾸는 거예요.” 그의 설명은 시처럼 들렸지만 따라 해 보니 정말 색이 살아났다.'); }},
 ]},

{id:'ls_ujin_2', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_1', 2) && S.m < 108,
 speaker:'신우진', title:'새벽 원단 시장', place:'rain', img:'art/bg_shop.webp', cut:'ujin', cutVar:'a',
 beats:['새벽 다섯 시, 비가 내린다. 우진이 내 컴백 무대 의상 원단을 직접 고르겠다며 나를 불러냈다.', '좁은 골목마다 원단 롤이 쌓여 있다. 그는 롤 사이를 걸으며 손끝으로 천을 쓸고, 눈을 감은 채 결을 읽는다.', '“비 오는 날 천은 평소보다 솔직해요. 습기를 먹으면 거짓 광택이 사라지거든요.”'],
 text:S => `상인이 같은 색이라며 건넨 롤 두 개를 우진이 번갈아 만진다. ${lvFlag(S, 'ujin', 'u_eye') ? '내 눈에도 두 롤의 색이 미묘하게 다르게 보인다.' : '솔직히 내 눈에는 똑같아 보이지만, 그의 표정이 굳어 있다.'} 어떻게 할까?`,
 choices:[
  {label:'두 롤을 펼쳐 놓고 빛에 비춰 색 차이를 짚는다', sub:'감각 · 호감↑', run(S){ if(S.st.sense >= 50) return _lsdR(S, 'ujin', 9, {sense:1.5, work:1.5}, 'u_dye', '“염색 로트가 달라요. 이쪽이 아주 조금 붉어요.” 내 지적에 상인이 머쓱하게 머리를 긁었고 우진은 나를 오래 바라보았다. “지금 이 순간이, 제가 당신을 믿게 된 때예요.”'); return _lsdR(S, 'ujin', 4, {sense:1, stress:3}, 'u_dye', '빛에 비춰 봐도 확신이 서지 않았다. 그래도 정직하게 “잘 모르겠지만 이쪽이 더 따뜻해 보여요”라고 말했다. 우진이 짧게 웃었다. “그 말이 틀린 말이 아니라서 괜찮아요.”'); }},
  {label:'상인과 가격을 조율해 불량 롤을 교환받는다', sub:'협상 · 호감↑', run(S){ if(S.st.neg >= 45) return _lsdR(S, 'ujin', 7, {neg:1.5, work:1.5}, 'u_deal', '상인은 처음엔 버텼지만 내가 입고 날짜와 지난번 거래 기록을 차근차근 들이밀자 한숨을 쉬며 교환에 응했다. 돌아서는 우진의 입가에 비가 아닌 웃음이 번졌다. “협상하는 모습, 재단하는 손 같아요.”'); return _lsdR(S, 'ujin', 3, {neg:1, stress:4}, 'u_deal', '상인은 끝내 교환은 안 된다고 버텼다. 그래도 우진은 내 서툰 협상을 끝까지 옆에서 들어 주었다. “교환은 못 했어도, 같이 서 있어 줘서 충분해요.”'); }},
  {label:'우산을 기울여 그의 어깨가 젖지 않게 한다', sub:'관계↑ · 부끄러움', run(S){ return _lsdR(S, 'ujin', 6, {bond:1.5, charm:0.5}, 'u_umbrella', `우진이 걸음을 멈췄다. 내 우산 아래로 들어오며 낮게 말했다. “이 색은 처음 봐요. 빗속의 베이지.” ${isCouple(S, 'ujin') ? '그의 손가락이 내 손가락 사이로 천천히 들어왔다. 우산 손잡이를 같이 쥔 셈이다.' : '우산 안이 너무 좁아서 팔이 닿았다. 둘 다 앞만 보고 걸었다.'}`, 'shy'); }},
 ]},

{id:'ls_ujin_3', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_2', 3) && affOf(S, 'ujin') >= 30 && S.m < 112,
 speaker:'신우진', title:'서랍 속 미완성 컬렉션', place:'room', img:'art/bg_office.webp', cut:'ujin', cutVar:'b',
 beats:['작업실 불이 꺼진 늦은 밤. 열쇠를 받아 원단 샘플을 가지러 갔다가, 열린 서랍 틈으로 스케치북 하나를 보게 된다.', '표지에는 아무 글씨도 없다. 안에는 완성되지 못한 컬렉션이 한 장씩 채색되어 있다. 모든 장 끝에 날짜가 적혀 있다. 모두 삼 년 전이다.', '문이 열리고 우진이 서 있다. 그의 얼굴이 처음으로 색을 잃는다.'],
 text:S => `“…보셨군요.” 우진이 천천히 서랍을 닫는다. “삼 년 전, 같이 일하던 선배가 이 도안들을 자기 이름으로 발표했어요. 그 뒤로 저는 도안을 서랍에 넣는 사람이 됐고요.” ${isCouple(S, 'ujin') ? '그가 연인인 나에게 이 말을 꺼내기까지 얼마나 오래 걸렸을까.' : '이 사람이 이 말을 꺼내기까지 얼마나 오래 걸렸을지 짐작이 간다.'}`,
 choices:[
  {label:'“이거 세상에 내놔요. 제가 같이 정리할게요”', sub:'도전 · 호감 큰 변동', run(S){ if(S.st.dare >= 50) return _lsdR(S, 'ujin', 10, {dare:1.5, self:2, bond:1.5}, 'u_open', '우진은 한참 침묵하다가 서랍을 다시 열었다. “…당신이 옆에 있다면요.” 우리는 그날 밤 스케치북을 한 장씩 스캔했다. 삼 년 만에 도안들이 처음으로 환한 빛을 받았다.'); return _lsdR(S, 'ujin', -5, {stress:5}, 'u_pressed', '내 말이 너무 앞서 나갔다. 우진이 서랍을 잠그며 조용히 말했다. “아직 그 정도까지는 준비가 안 됐어요.” 내가 그의 속도를 건너뛴 것이다. 닫힌 서랍 소리가 오래 남았다.', 'serious'); }},
  {label:'“말해 줘서 고마워요. 서두르지 않을게요”', sub:'매력 · 호감↑', run(S){ return _lsdR(S, 'ujin', 7, {charm:1, self:1.5, stress:-2}, 'u_wait', `우진은 긴장이 풀린 듯 의자에 앉았다. “사람들은 대개 해결책부터 말하는데요, 당신은 들어 줬어요.” ${isCouple(S, 'ujin') ? '그가 내 손등에 이마를 대고 한참 숨을 골랐다.' : '그가 작은 목소리로 덧붙였다. “이 얘기를 한 사람이 당신이 처음이에요.”'}`, 'shy'); }},
  {label:'“그 선배의 이름을 알려 줘요. 제가 알아볼게요”', sub:'통찰 · 호감 변동', run(S){ if(S.st.ins >= 50) return _lsdR(S, 'ujin', 5, {ins:1.5, work:1}, 'u_probe', '나는 이름을 듣고 기억 속 어딘가를 더듬었다. 마흔의 내가 알던 업계의 소문 몇 줄이 겹쳐졌다. “그 사람은 어차피 오래 못 가요. 서두를 필요 없어요.” 우진은 잠시 놀라더니 희미하게 웃었다. “미래를 아는 사람처럼 말하네요.”'); return _lsdR(S, 'ujin', -6, {stress:4}, 'u_pressed', '“복수는 원하지 않아요.” 우진이 힘없이 고개를 저었다. 나는 그의 상처를 해결해야 할 문제로 다룬 것이다. 그날 밤 우진은 말수가 적었고 나는 내 서툰 선의가 부끄러웠다.', 'serious'); }},
 ]},

{id:'ls_ujin_4', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_3', 3) && affOf(S, 'ujin') >= 30 && S.m < 114,
 speaker:'신우진', title:'빠진 이름', place:'cafe', img:'art/ct_mall.webp', cut:'ujin', cutVar:'b',
 beats:['우진과 같이 준비하던 무대 의상 협업 화보의 참여자 명단이 나왔다. 내 이름만 정확히 한 줄 비어 있다.', '며칠 전, 다른 디자이너에게서 단독 화보 제안을 받은 적이 있다. 그 제안서를 의상실 누군가 봤다는 소문이 돌았다.', '우진이 복도 끝에서 나를 보고 걸음을 멈춘다. 평소의 부드러운 눈빛이 없다. 대신 차분한 정적만 흐른다.'],
 text:S => `“당신 이름을 뺀 건 저예요. 이유는, 말하고 싶지 않았어요.” ${lvFlag(S, 'ujin', 'u_open') ? '삼 년 전의 상처를 보여 준 사람이 이번엔 내가 같은 일을 했다고 믿는 모양이다.' : '서랍 속 이야기를 아는 나는 그의 불안이 어디서 오는지 알 것 같다.'} 이 오해를 어떻게 풀까?`,
 choices:[
  {label:'다른 제안이 있었던 것도, 거절한 것도 솔직하게 말한다', sub:'협상 · 호감 큰 변동', run(S){ if(S.st.neg >= 50) return _lsdR(S, 'ujin', 10, {neg:1.5, self:2, bond:2}, 'u_clear', '나는 제안 메일 날짜와 거절 답장까지 차근차근 보여 주었다. 우진은 한참 화면을 보다가 입술을 깨물었다. “미안해요. 또 그럴 줄 알고 먼저 문을 닫았어요.” 그가 사과하는 모습은 처음이었다.'); return _lsdR(S, 'ujin', 3, {neg:1, stress:6}, 'u_clear', '말하는 도중에 목소리가 흔들려 변명처럼 들렸다. 그래도 거짓 없이 끝까지 말했다. 우진은 완전히 믿지는 못한 얼굴로 “시간이 필요해요”라고 했다. 하지만 문은 닫히지 않았다.', 'serious'); }},
  {label:'밤새 그의 색감으로 새 도안을 그려 건넨다', sub:'감각 · 호감 큰 변동', run(S){ if(S.st.sense >= 55) return _lsdR(S, 'ujin', 11, {sense:2, work:2, stress:4}, 'u_clear', '아침에 책상 위에 올려 둔 도안을 본 우진이 한동안 서 있었다. 그가 아끼는 쪽빛과 연한 회색이 내 선으로 이어져 있었다. “이건, 의심한 사람한테 줄 그림이 아니에요.” 그가 도안을 가슴에 대었다.'); return _lsdR(S, 'ujin', 2, {sense:1.5, stress:6}, 'u_clear', '밤새 그린 도안은 아직 어설펐다. 우진은 그걸 조용히 받아 들었다. “노력은 알겠어요. 색이 아직 흔들리네요.” 칭찬은 아니었지만, 그는 도안을 쓰레기통이 아닌 서류함에 넣었다.', 'serious'); }},
  {label:'“의심할 거면 이름 빼세요”라고 한다', sub:'호감 하락 · 자존', run(S){ return _lsdR(S, 'ujin', -9, {self:2, stress:5}, 'u_cold', '우진의 얼굴에 그림자가 졌다. “…알겠어요.” 그가 고개를 끄덕이고 돌아섰다. 맞는 말이었지만 이긴 기분은 없었다. 복도 창밖의 색이 평소보다 어둡게 보였다.', 'serious'); }},
 ]},

{id:'ls_ujin_5', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_4', 3) && _lsdHigh(S, 'ujin') && S.m < 116,
 speaker:'신우진', title:'컴백 전야', place:'night', img:'art/ct_night.webp', cut:'ujin', cutVar:'a',
 beats:['컴백 무대 이틀 전 밤. 거래처에서 핵심 원단의 염색이 틀어졌다는 연락이 왔다. 대체할 시간이 하루 반밖에 없다.', '우진은 작업실 한가운데서 불량 원단을 양손으로 쥔 채 서 있다. 어깨가 아주 조금 떨린다.', '“이 원단 없이 이 무대 의상은 없어요. 그렇다고 세 달을 이 색에 매달린 마음을 버릴 수도 없고요.”'],
 text:S => `${lvFlag(S, 'ujin', 'u_clear') ? '오해를 푼 뒤로 우진은 위기마다 가장 먼저 내 이름을 부른다.' : lvFlag(S, 'ujin', 'u_cold') ? '그날의 냉기가 완전히 풀리진 않았지만, 지금 이 순간만은 모든 걸 뒤로 미룰 때다.' : '시간이 부족하다. 하지만 그의 손을 놓고 싶지는 않다.'} ${isCouple(S, 'ujin') ? '“네가 없으면 이 밤을 못 넘길 것 같아.”' : '“혼자서는 못 하겠어요. 도와줄래요?”'}`,
 choices:[
  {label:'거래처 사장을 직접 찾아가 재염색을 설득한다', sub:'매력 · 협상 · 호감↑', run(S){ if(S.st.charm >= 50 || S.st.neg >= 55) return _lsdR(S, 'ujin', 10, {charm:1.5, neg:1.5, work:2, stress:6}, 'u_save', '밤 열한 시, 염색 공장의 불을 내가 직접 두드렸다. 사장은 한참 팔짱을 끼고 있다가 “내일 새벽까지는 해 보겠다”고 했다. 작업실로 돌아오자 우진이 말없이 내 손을 감쌌다. 손이 차가웠고 그의 손이 따뜻했다.'); return _lsdR(S, 'ujin', 5, {charm:1, work:1, stress:8}, 'u_save', '사장은 끝내 새벽 재염색은 어렵다고 했다. 다만 남은 원단 일부를 급히 돌려주겠다고 약속했다. 빈손은 아니었다. 우진은 내 소매의 먼지를 털어 주며 말했다. “이 정도면 충분히 해냈어요.”', 'serious'); }},
  {label:'남은 원단과 다른 색을 섞어 의상을 즉석에서 다시 짠다', sub:'감각 · 호감 큰 변동', run(S){ if(S.st.sense >= 50) return _lsdR(S, 'ujin', 11, {sense:2, work:2, stress:5}, 'u_save', '새벽까지 원단 조각을 바닥에 펼쳐 놓고 색을 맞췄다. 쪽빛 사이에 연회색 한 줄을 넣자 무대 의상 전체가 숨을 쉬는 듯했다. 우진이 한참 서서 보다가 소리 없이 웃었다. “원래 계획보다 더 낫네요. 틀어진 덕분에요.”'); return _lsdR(S, 'ujin', 4, {sense:1.5, work:1, stress:8}, 'u_save', '조합이 어딘가 어색해서 몇 번을 다시 짰다. 우진이 옆에서 조용히 핀을 꽂아 주었다. “완벽하지 않아도 이 색이 거짓말은 아니에요.” 새벽 네 시, 둘 다 졸음을 참으며 마지막 단을 마무리했다.'); }},
  {label:'아무것도 묻지 않고 그의 곁에서 밤새 같이 손을 움직인다', sub:'관계↑ · 부끄러움', run(S){ return _lsdR(S, 'ujin', 7, {bond:2, stress:6, hp:-3}, 'u_hands', `우리는 말 없이 밤을 새웠다. 핀을 꽂고 시침질을 하고 이따금 서로의 손가락을 찔러 반창고를 붙여 주었다. ${isCouple(S, 'ujin') ? '새벽 다섯 시, 우진이 내 어깨에 이마를 대고 짧게 속삭였다. “이 일을 하길 잘했어. 네가 있는 이 밤이 생겨서.”' : '새벽 다섯 시, 그가 작게 중얼거렸다. “오늘 밤의 색은 아마 오래 기억날 것 같아요.”'}`, 'shy'); }},
 ]},

{id:'ls_ujin_6', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_5', 3) && _lsdHigh(S, 'ujin') && S.m < 119,
 speaker:'신우진', title:'계절의 첫 옷', place:'room', img:'art/bg_room_autumn.webp', cut:'ujin', cutVar:'a',
 beats:['컴백 활동이 끝나고 며칠 뒤. 우진이 종이 상자를 들고 조심스럽게 작업실로 나를 부른다.', '상자 안에는 가을빛의 코트 한 벌이 접혀 있다. 내가 한 번도 말한 적 없는 어깨선, 소매 길이, 쪽빛 안감이다.', '“치수는 그동안 곁에서 눈으로 쟀어요. 오늘 이 옷이 이 계절의 첫 번째 옷이에요.”'],
 text:S => `${lvFlag(S, 'ujin', 'u_open') ? '서랍에서 꺼낸 그의 도안들이 무대에서 처음으로 빛을 받았다.' : '그가 오래 닫아 두었던 마음이 이 옷 한 벌만큼 열렸다.'} 안감 한쪽에는 작은 글씨가 수놓여 있다. ${isCouple(S, 'ujin') ? '“사계절 내내, 네 옷은 내가 지을게.”' : '“계절마다 첫 옷은 당신에게.”'} 이 마음에 어떻게 답할까?`,
 choices:[
  {label:'그 자리에서 코트를 입고 거울 앞에 선다', sub:'감각 · 매력 · 호감↑↑', run(S){ S.album.push('우진이 지어 준 가을 코트 안감에는 쪽빛 실로 수놓은 약속이 있었다.'); lvSet(S, 'ujin', 'u_promise'); if(S.st.sense >= 50 || S.st.charm >= 55) return _lsdR(S, 'ujin', 12, {sense:1.5, charm:1.5, self:3, bond:2}, 'u_final', `코트는 놀랄 만큼 몸에 맞았다. 거울 속 나를 본 우진이 숨을 삼켰다. “역시 색은 거짓말을 안 하네요.” ${isCouple(S, 'ujin') ? '그가 뒤에서 어깨 위에 손을 얹고 거울 속 내 눈을 바라보았다. “매년 첫 옷은 서로를 위해서 짓자.”' : '“약속할게요. 이 계절의 첫 옷은, 앞으로도 당신 몫이에요.”'}`); return _lsdR(S, 'ujin', 9, {self:3, bond:2}, 'u_final', `코트가 약간 헐렁했지만 우진은 개의치 않고 소매를 접어 주었다. “이건 앞으로 더 맞아 갈 거예요.” ${isCouple(S, 'ujin') ? '그의 손끝이 내 소매 위에 오래 머물렀다.' : '그의 말이 옷에 대한 건지 우리에 대한 건지 한참 생각했다.'}`, 'shy'); }},
  {label:'“저도 약속 하나 드릴게요. 제 첫 번째 도안은 당신 거예요”', sub:'도전 · 호감↑', run(S){ S.album.push('우진에게 약속했다. 내 첫 번째 도안은 언제나 그의 몫이라고.'); lvSet(S, 'ujin', 'u_promise'); return _lsdR(S, 'ujin', 10, {dare:1.5, self:3, work:1}, 'u_final', `우진은 한동안 아무 말도 하지 못했다. 이윽고 서랍에서 새 스케치북을 꺼내 첫 장에 내 이름을 적었다. ${isCouple(S, 'ujin') ? '“그럼 첫 장은 지금 같이 그려요.” 우리는 한 장의 종이에 서로 다른 색 선을 이어 그렸다.' : '“…그럼 저는 첫 장을 비워 둘게요. 당신이 시작할 수 있게.”'}`, 'shy'); }},

// ════════ 약속 이후: 유찬 7~8 ════════
{id:'ls_yuchan_7', lover:'yuchan', cond:S => isMet(S, 'yuchan') && afterEv(S, 'ls_yuchan_6', 2) && _lsdHigh(S, 'yuchan') && S.m < 119,
 speaker:'안유찬', title:'별점 한 개', place:'night', img:'art/bg_office.webp', cut:'yuchan', cutVar:'b',
 beats:['앱을 연 지 일주일. 앱 장터 리뷰에 별점 한 개짜리가 열 개 넘게 달렸다. 결제 화면이 가끔 멈춘다는 불만이다.', '유찬은 아무 말 없이 노트북을 끌어안고 화장실 쪽 비상 계단으로 사라졌다. 약속했던 새벽이 또 혼자가 되려 한다.', '계단 아래에서 키보드 소리가 들린다. 평소보다 훨씬 거칠다.'],

 choices:[
  {label:'사용자 리뷰를 모두 읽고 재현 조건을 정리해 건넨다', sub:'학식 · 통찰 · 호감↑', run(S){ if(S.st.know >= 50 || S.st.ins >= 50) return _lsdR(S, 'yuchan', 10, {know:1.5, ins:1.5, work:2, stress:4}, 'y_bug', '열두 개의 리뷰에서 공통점 하나가 보였다. 특정 기기, 특정 시각, 쿠폰 입력 직후. 내가 정리한 표를 본 유찬이 소리 없이 입을 벌렸다. “이걸… 지금 찾았다고요? 한 시간이면 고쳐요.” 새벽 두 시, 별점 한 개가 하나씩 지워지기 시작했다.'); return _lsdR(S, 'yuchan', 5, {know:1, work:1, stress:6}, 'y_bug', '리뷰를 다 읽었지만 공통점은 끝내 찾지 못했다. 그래도 정리한 목록이 그의 마음을 가라앉혔다. “사용자 목소리를 이렇게 모아 본 건 처음이에요. 틀려도 괜찮은 방향이 보여요.”'); }},
  {label:'노트북을 덮게 하고 “오늘은 이대로 두고 내일 같이 봐요”라고 말한다', sub:'도전 · 호감 큰 변동', run(S){ if(S.st.dare >= 50 || affOf(S, 'yuchan') >= 70) return _lsdR(S, 'yuchan', 9, {dare:1, self:2, stress:-3}, 'y_rest', '그는 한참 내 얼굴과 화면을 번갈아 보다가 노트북을 덮었다. “…내일 같이 보기로 했으니까요.” 그날 밤은 처음으로 앱이 느려도 그는 잠을 잤다. 다음 날 아침 에러는 반나절 만에 고쳐졌다.'); return _lsdR(S, 'yuchan', -6, {stress:5}, 'y_rush', '“지금 못 쉬는 사람한테 쉬라고 하는 건 폭력이에요.” 그가 처음으로 날카롭게 말했다. 곧 눈을 감고 사과했지만, 계단 아래 공기는 한참 차가웠다. 내 타이밍이 틀렸다.', 'serious'); }},
  {label:'말없이 옆에 앉아 그가 읽는 로그를 같이 읽는다', sub:'관계↑ · 부끄러움', run(S){ return _lsdR(S, 'yuchan', 7, {bond:2, skill:0.5}, 'y_beside', `새벽 세 시, 우리는 약속한 대로 같이 깨어 있었다. 그가 한 줄을 읽고 내가 다음 줄을 읽는 식이었다. ${isCouple(S, 'yuchan') ? '“이렇게 누가 옆에 앉아 있으면 에러도 덜 무서워. 진짜로.”' : '“이상하죠. 옆에 누가 있는 게 이렇게 속도를 올릴 줄은 몰랐어요.”'}`, 'shy'); }},
 ]},

{id:'ls_yuchan_8', lover:'yuchan', cond:S => isMet(S, 'yuchan') && afterEv(S, 'ls_yuchan_7', 2) && _lsdHigh(S, 'yuchan') && S.m < 119,
 speaker:'안유찬', title:'백업이 없는 사람', place:'room', img:'art/bg_room_winter.webp', cut:'yuchan', cutVar:'a',
 beats:['겨울 일요일. 유찬이 처음으로 자기 집 문을 열어 준다. 방 안은 모니터와 책 몇 권과 낡은 의자뿐이다.', '“저는 백업이 없는 사람이에요. 가족이랑도 데이터를 주고받은 지 오래고, 믿을 수 있는 서버는 제 노트북 하나였죠.”', '그가 서랍에서 오래된 USB 하나를 꺼낸다. 어릴 적 만든 첫 게임이 들어 있다고 한다.'],
 text:S => `“이 안엔 열두 살의 제가 있어요. 한 번도 누구에게 보여 준 적이 없는데, 이상하게 당신한테는 보여 주고 싶었어요.” ${lvFlag(S, 'yuchan', 'y_bug') ? '장애 밤에 나를 믿어 준 순간이 이 문을 열게 했나 보다.' : '약속을 지킨 시간이 쌓여 이 문 앞까지 데려왔다.'} 화면 속 도트 캐릭터가 천천히 걷기 시작한다.`,

  {label:'끝까지 게임을 해 보고 점수를 기록한다', sub:'실무 · 호감↑↑', run(S){ S.album.push('유찬의 열두 살이 만든 게임을 끝까지 했다. 마지막 화면에 내 이름이 새겨졌다.'); lvSet(S, 'yuchan', 'arc_done'); if(S.st.skill >= 55) return _lsdR(S, 'yuchan', 12, {skill:1.5, self:3, bond:2}, 'y_final', `나는 숨은 지름길까지 찾아내 마지막 보스를 쓰러뜨렸다. 엔딩 화면에는 빈 이름 칸이 있었고, 유찬이 조용히 내 이름을 입력했다. ${isCouple(S, 'yuchan') ? '“이건 이제 우리 두 사람의 세이브 파일이야. 삭제하지 않을게.”' : '“열두 살의 제가 기다리던 두 번째 플레이어가 이제 생겼어요.”'}`); return _lsdR(S, 'yuchan', 9, {skill:1, self:3, bond:2}, 'y_final', `중간에 몇 번을 죽었지만 유찬은 끝까지 옆에서 힌트를 주었다. 엔딩 화면에 내 이름이 천천히 새겨졌다. ${isCouple(S, 'yuchan') ? '“졌어도 괜찮아. 다시 시작하면 되니까. 같이.”' : '“실패한 판도 기록이에요. 저는 이 기록을 지우지 않을 거예요.”'}`, 'shy'); }},
  {label:'“이제 백업은 내가 해 줄게요”라고 말한다', sub:'매력 · 호감↑', run(S){ S.album.push('유찬에게 백업은 내가 해 주겠다고 말했다. 그가 아무 말 없이 USB를 내 손에 쥐여 주었다.'); lvSet(S, 'yuchan', 'arc_done'); return _lsdR(S, 'yuchan', 10, {charm:1.5, self:3, stress:-3}, 'y_final', `유찬은 한동안 눈을 깜빡이다 USB를 내 손바닥에 올려놓았다. “…그럼 이건 당신이 가지고 있어요. 저보다 안전하니까.” ${isCouple(S, 'yuchan') ? '그가 내 이마에 조용히 이마를 맞댔다. 오래된 도트 음악이 낮게 흘렀다.' : '내 손이 USB를 감싸자 그의 손가락이 아주 잠깐 내 손등에 닿았다.'}`, 'shy'); }},
  {label:'말없이 그의 어깨에 기대어 화면 속 캐릭터를 같이 본다', sub:'감각 · 호감↑', run(S){ S.album.push('유찬과 어깨를 맞대고 열두 살의 게임을 바라봤다. 한 겨울이 따뜻했다.'); lvSet(S, 'yuchan', 'arc_done'); return _lsdR(S, 'yuchan', S.st.sense >= 45 ? 9 : 7, {sense:1, self:3, bond:2}, 'y_final', `${S.st.sense >= 45 ? '창밖의 눈 소리와 모니터의 도트 음악이 이상하게 같은 박자였다. 유찬이 그 우연을 알아채고 작게 웃었다. “이 순간은 로그에 안 남기고 기억으로만 둘게요.”' : '둘 다 화면만 보고 있었는데 가슴만은 가까이 뛰고 있었다.'} 그 겨울 일요일은 오래도록 내 안에서 저장된 채로 남았다.`, 'shy'); }},
 ]},

{id:'ls_ujin_7', lover:'ujin', cond:S => isMet(S, 'ujin') && afterEv(S, 'ls_ujin_6', 2) && _lsdHigh(S, 'ujin') && S.m < 119,

 text:S => `선배가 낮게 말한다. “그때 일은 사과하고 싶었어. 다만 오늘 협업 제안도 들어줬으면 해.” ${lvFlag(S, 'ujin', 'u_open') ? '서랍에서 꺼낸 도안들이 그의 이름으로 세상에 나온 지금이라 그 사과는 더 복잡하게 들린다.' : '우진이 아직 이 만남을 감당할 준비가 되었는지 알 수 없다.'} ${isCouple(S, 'ujin') ? '나는 우진의 곁에서 아무도 모르게 그의 손목을 감싼다.' : '우진이 나를 흘끗 보며 도움을 구한다.'}`,
 choices:[
  {label:'우진을 대신해 사과는 받되 협업은 정중히 거절한다', sub:'협상 · 호감 큰 변동', run(S){ if(S.st.neg >= 50) return _lsdR(S, 'ujin', 10, {neg:1.5, self:2, bond:1.5}, 'u_boundary', '“사과는 받겠습니다. 다만 신우진 디자이너의 다음 컬렉션은 이미 다른 사람과의 약속으로 채워져 있습니다.” 내 말이 끝나자 선배는 숨을 삼켰고 우진은 가만히 나를 바라보았다. 복도에서 그가 한 줄로 말했다. “…대신 말해 줘서 고마워요. 이제는 제가 직접 말하는 연습을 할게요.”'); return _lsdR(S, 'ujin', -4, {stress:6}, 'u_overstep', '내가 서둘러 거절하자 선배가 불쾌한 얼굴로 돌아섰고 우진은 아무 말도 하지 못했다. 복도에서 그가 힘없이 말했다. “제 일은 제가 정리해야 했는데…” 보호하려던 마음이 그의 목소리를 뺏었다는 걸 뒤늦게 알았다.', 'serious'); }},
  {label:'우진이 말할 때까지 곁에서 침묵으로 기다린다', sub:'매력 · 호감↑', run(S){ return _lsdR(S, 'ujin', 8, {charm:1.5, self:1.5}, 'u_speak', `우진은 눈을 감았다가 천천히 떴다. “제 도안은 팔지 않아요. 하지만 사과는 받겠습니다.” 한 문장이 떨리지 않고 나왔다. ${isCouple(S, 'ujin') ? '선배가 떠난 뒤 그가 내 손을 꽉 쥐었다. “방금, 처음으로 내 색으로 말했어.”' : '선배가 떠난 뒤 그가 작은 숨을 내쉬며 웃었다. “방금, 처음으로 제 색으로 말했어요.”'}`, 'shy'); }},
  {label:'그 선배가 가진 업계 소문을 조용히 우진에게만 귀띔한다', sub:'통찰 · 호감 변동', run(S){ if(S.st.ins >= 50) return _lsdR(S, 'ujin', 6, {ins:1.5, work:1}, 'u_probe2', '나는 우진의 귓가에 짧게 말했다. “이 협업은 그쪽이 필요해서 제안한 거예요. 당신이 필요한 게 아니라.” 우진의 표정이 단번에 가라앉았다. 그가 그 말을 기억하고 정확히 한 문장으로 협상을 마쳤다.'); return _lsdR(S, 'ujin', -3, {stress:4}, 'u_overstep', '귀띔이 오히려 우진을 더 흔들었다. 정확하지 않은 정보로 사람을 의심하게 만든 셈이다. 우진은 자리를 뜨고 한참 뒤에 돌아와 말했다. “다음엔 확인하고 말해 줘요.”', 'serious'); }},
 ]},

        yes:['공을 주워 같이 차 보자고 한다', '서툰 패스가 몇 번 오갔다. 민준은 공을 놓칠 때마다 “미안!”을 외치고, 나는 웃음을 참지 못했다. 마지막에 제대로 맞은 공이 골대 쪽으로 곧게 날아가자 그가 환하게 웃었다. 그 웃음이 눈부셨다.'],

      love:{title:'달리는 저녁',
        text:'해가 기울 무렵 운동장 트랙을 민준이 천천히 달리고 있다. 나를 발견하자 속도를 줄이고 숨을 몰아쉬며 다가온다. “같이… 걸을래? 나는 달린 거 아니고 걷는 거야.” 이마에 땀이 맺혀 있는데도 허세를 부린다.',
        yes:['“그래, 같이 걷자”며 보폭을 맞춘다', '나란히 트랙을 걷는 동안 민준은 말수가 적었다. 바람이 불자 그가 슬쩍 바람 쪽에 서 주었다. 한 바퀴를 다 돌았을 때, 그가 작게 말했다. “네가 옆에 있으면 오래 걸어도 안 힘들어.”'],

  hajin: {

      love:{title:'비어 있는 강의실',

    garden:{

      love:{title:'벤치 위의 이십 분',

  raon: {

      pre:{title:'열람실 구석의 마스크',
        text:'도서관 열람실 맨 구석, 모자와 마스크를 푹 눌러쓴 사람이 책 한 권을 방패처럼 세워 놓고 앉아 있다. 라일락빛 머리카락 한 가닥이 모자 밖으로 삐져나왔다. 눈이 마주치자 그가 입에 손가락을 대고 쪽지를 밀어낸다. “제발 아무한테도 말하지 마세요. 저 지금 과제하러 온 학생이에요.”',

};
const CAMPUS_END = 48; // 졸업(2020.3) 전까지만 교정을 돌아다닌다
const CAMPUS_VISITS = 3; // 한 달에 교정을 돌아다닐 수 있는 횟수(스케줄 칸을 쓰지 않는다)
const cpLeft = S => S.cpLeft == null ? CAMPUS_VISITS : S.cpLeft;
// 팝업 연출용 활동 정보(스케줄 목록에는 나오지 않는다)
for(const key in CAMPUS_PLACES){ const p = CAMPUS_PLACES[key], id = 'cp_' + key; ACTS[id] = {id, cp:key, slots:1, cat:'캠퍼스', icon:p.icon, name:p.name, desc:p.desc, cost:0, eff:{}}; }
// 장소를 한 번 방문한다: 작은 효과 + 우연한 만남. 방문 횟수 1 소모
function campusVisit(S, key){
  const p = CAMPUS_PLACES[key], ch = [], out = {id:'cp_' + key, ch, note:'', place:key};
  S.cpLeft = Math.max(0, cpLeft(S) - 1);
  if(p.cost && S.cash >= p.cost) bump(S, 'cash', -p.cost, ch);
  if(p.hp) bump(S, 'hp', Math.round(p.hp / 2), ch);
  if(p.stress) bump(S, 'stress', Math.round(p.stress / 2), ch);
  const e = {}; for(const k in p.eff) e[k] = p.eff[k] * 0.5; fx(S, e, ch);
  out.enc = campusEncounter(S, key, ch) || campusQuiet(S, key, ch); out.note = p.desc;
  return out;
}
const CP_CUT = {'소연':'soyeon', '지수':'jisu', '태윤':'taeyun'};
function weightedPick(list){ const tot = list.reduce((a, c) => a + c.w, 0); let r = R() * tot; for(const c of list){ r -= c.w; if(r <= 0) return c; } return list[list.length - 1]; }
// 아무도 마주치지 않은 날: 효과만 보여 주는 짧은 장면
function campusQuiet(S, place, visitCh){
  const p = CAMPUS_PLACES[place], line = pick(['오늘은 아는 얼굴이 보이지 않았다. 그래도 바람이 좋았다.', '한참을 어슬렁거렸지만 마주친 사람은 없었다. 혼자만의 시간도 나쁘지 않다.', '아무도 마주치지 않은 평온한 한때. 머릿속이 조금 정리됐다.']);
  return {id:`cp_q_${place}_${S.m}_${Math.floor(R() * 1e4)}`, speaker:'', title:p.name, place:'campus', img:`art/cp_${place}.webp`, text:S => `${p.desc}\n\n${line}`,
    choices:[{label:'다음에 또 와야지', sub:'', run(S){ return {text:'교정을 한 바퀴 돌고 나니 기분이 한결 가벼워졌다.', chips:(visitCh || []).slice()}; }}]};
}
function campusEncounter(S, place, visitCh){
  const LV = typeof CP_LOVER !== 'undefined' ? CP_LOVER : {}, FR = typeof CP_FRIEND !== 'undefined' ? CP_FRIEND : {};
  if(R() < 0.15) return null; // 가끔은 아무도 마주치지 않는다
  const cands = [];
  for(const id of Object.keys(LV)){
    const set = LV[id][place]; if(!set || !LOVERS[id]) continue; const v = S.love[id], lv = LOVERS[id];
    if(v){ if(v.stage === -9 || v.stage === -2 || v.stage > 2 || v.cpAt === S.m) continue; const sc = v.stage >= 1 ? set.love : set.pre; if(sc) cands.push({w:3 + v.aff / 22, kind:'lover', id, sc}); }
    else if(!S.seen['meet_' + id] && !lv.career && S.m >= lv.meet - 8 && S.m < CAMPUS_END) cands.push({w:4.5, kind:'meet', id}); // 첫 만남이 이 장소에서 앞당겨진다
  }
  (FR[place] || []).forEach((sc, idx) => cands.push({w:2.2, kind:'friend', sc, idx}));
  if(!cands.length) return null;
  const c = weightedPick(cands);
  if(c.kind === 'meet') return meetEvent(S, c.id);
  if(c.kind === 'lover' && typeof loverStoryFor === 'function' && R() < 0.65 && S.m - (S.lsAt == null ? -9 : S.lsAt) >= 1){ const st = loverStoryFor(S, c.id); if(st){ S.lsAt = S.m; S.love[c.id].cpAt = S.m; return st; } } // 관계가 깊어지면 그 장소에서 이야기 이벤트가 이어진다
  const sc = c.sc, pl = CAMPUS_PLACES[place];
  if(c.kind === 'friend') return {id:`cp_f_${place}_${S.m}`, speaker:sc.who, title:`${pl.name} · ${sc.title}`, place:'campus', img:`art/cp_${place}.webp`, cut:CP_CUT[sc.who] || null, text:S => sc.text,
    choices:[
      {label:sc.yes[0], sub:'함께한다 · 관계↑ 스트레스↓', run(S){ const ch = (visitCh || []).slice(); fx(S, {bond:1.2, stress:-2}, ch); return {text:sc.yes[1], chips:ch}; }},
      {label:sc.no[0], sub:'거리를 둔다 · 나↑', run(S){ const ch = (visitCh || []).slice(); fx(S, {bond:0.5, self:1.0}, ch); return {text:sc.no[1], chips:ch, mood:'shy'}; }},
    ]};
  const id = c.id, lv = LOVERS[id];
  return {id:`cp_${id}_${place}_${S.m}`, lover:id, speaker:lv.name, title:`${pl.name} · ${sc.title}`, place:'campus', img:`art/cp_${place}.webp`, cut:id, text:S => sc.text,
    choices:[
      {label:sc.yes[0], sub:'다가간다 · 호감 크게 ↑', run(S){ const ch = (visitCh || []).slice(); S.love[id].cpAt = S.m; addAff(S, id, 3.5 + (S.st[lv.like] || 0) / 40, ch); fx(S, {bond:0.6, stress:-2}, ch); return {text:sc.yes[1], chips:ch}; }},
      {label:sc.no[0], sub:'조심스럽게 · 호감 ↑', run(S){ const ch = (visitCh || []).slice(); S.love[id].cpAt = S.m; addAff(S, id, 1.6, ch); fx(S, {self:1.0}, ch); return {text:sc.no[1], chips:ch, mood:'shy'}; }},
    ]};
}

      no:['“조금만 더 들어 봐, 의외로 재밌어”라고 속삭이고 앞으로 간다', '태윤은 투덜대면서도 끝까지 들었다. 나오는 길에 “아까 그 그림, 무대 조명이랑 색이 비슷하더라”라고 했다. 나도 수첩에 같은 걸 적어 두었었다.']},
    {who:'지수', title:'포토존 줄서기', text:'미술관 포토존 앞에서 지수가 휴대폰을 들고 폴짝거린다. “사진 좀 찍어 줘! 프로필에 쓸 만한 거 하나 건지고 싶어.” 벌써 몇 번이나 포즈를 바꿔 가며 준비 중이다.',
      yes:['“좋아, 각도 잡아 줄게”라며 휴대폰을 받는다', '쭈그려 앉아 찍으니 지수가 작품만큼 크게 나왔다. 그 애가 사진을 보더니 “이거다!” 하고 환호했다. 보답으로 내 사진도 열 장쯤 찍어 주었다.'],
      no:['“작품부터 보고 찍자”며 혼자 먼저 들어간다', '지수는 “맞네, 순서가 틀렸다” 하며 따라 들어왔다. 그림을 오래 본 뒤 찍은 사진은 표정이 훨씬 편했다. 그 애가 “아까보다 내가 좋아 보여”라고 속삭였다.']},
  ],
  mall:[
    {who:'소연', title:'엄마 선물 고르기', text:'스카프 코너에서 소연이 두 개를 번갈아 들고 고민하고 있다. “엄마 생신 선물인데 이 색이랑 이 색 중에 뭐가 나을까? 연습생 된 뒤로 용돈만 받아서 마음이 좀 그래.” 목소리가 낮아진다.',
      yes:['“엄마 얼굴이 환해 보이는 쪽으로 가자”며 같이 고른다', '소연이 엄마 목에 스카프를 둘러 드리는 상상을 하는지 한참 웃었다. 포장을 기다리며 그 애가 “너 같은 친구가 있어서 다행이야”라고 속삭였다. 쇼핑백이 하나도 무거워 보이지 않았다.'],
      no:['“스카프보다 편지 한 장이 더 좋을걸”이라고 말해 준다', '소연이 눈을 크게 뜨더니 문구 코너로 달려갔다. 짧은 편지를 직접 써서 작은 스카프 옆에 끼웠다. 계산을 마친 그 애가 “오늘 제일 잘한 일 같아”라고 했다.']},
    {who:'지수', title:'세일 코너 전투', text:'세일 코너 한복판에서 지수가 옷걸이 사이를 헤치고 있다. 나를 보자마자 트레이닝복 한 벌을 흔든다. “이거 봐, 반값이야! 연습복으로 딱이야. 사이즈만 맞으면 둘이 같은 걸로 사자!”',
      yes:['“좋아, 일단 입어 보자”며 피팅룸으로 간다', '피팅룸 거울 앞에서 둘이 같은 옷을 입고 한참 웃었다. 지수가 즉석에서 안무 한 소절을 췄고 점원이 박수를 쳤다. 다음 날부터 우리는 똑같은 연습복을 입었다.'],
      no:['“난 구경만 할게, 대신 점수는 매겨 줄게”라고 한다', '지수가 입고 나올 때마다 솔직하게 점수를 불렀다. 8점, 6점, 9점. 마지막 옷에서 그 애가 “이걸로 간다!” 하고 손을 번쩍 들었는데, 정말 잘 어울렸다.']},
    {who:'태윤', title:'선물 코치 요청', text:'남성복 코너 마네킹 앞에서 태윤이 팔짱을 끼고 서 있다. 나를 부르는 목소리가 평소보다 작다. “아버지 생신이라 셔츠 하나 사려고 아르바이트비 모았거든. 근데 아무것도 모르겠어. 같이 좀 봐 줘.”',
      yes:['“같이 보자, 아버지 취향부터 말해 봐”라고 한다', '태윤이 아버지 이야기를 하나씩 꺼냈다. 차분한 색을 좋아하고 목 단추는 늘 풀어 둔다는 것. 우리는 회색 셔츠를 골랐고, 태윤이 “이 정도면 합격이지”라며 한숨을 놓았다.'],
      no:['“점원분께 추천받아 봐”라며 직원을 불러 준다', '직원이 몇 가지를 골라 주자 태윤이 진지한 얼굴로 하나씩 만져 봤다. 결국 가장 부드러운 셔츠를 골랐다. 나오며 그 애가 “모르면 물어보는 게 답이네”라고 중얼거렸다.']},
  ],
  beauty:[
    {who:'지수', title:'립 샘플 열 개', text:'샘플 진열대 앞에서 지수가 손등에 립 색을 줄줄이 발라 놓았다. 나를 보더니 손등을 내민다. “무대 조명 아래서 제일 예쁜 색이 뭘까? 고르다가 손이 무지개가 됐어!”',
      yes:['“내 손등에도 발라 봐”라며 같이 고른다', '서로의 손등에 색을 발라 보니 누구에게 어떤 색이 맞는지 신기하게 보였다. 지수가 내가 고른 색을 사며 “이건 너 때문에 산 거야!”라고 웃었다.'],
      no:['“가장 자연스러운 색이 제일 예뻐”라고 솔직히 말한다', '지수가 손등을 한참 보더니 “은근 이게 제일 낫네” 하고 인정했다. 계산대에서 그 애가 샘플 하나를 몰래 더 챙겨 내 손에 쥐여 주었다.']},
    {who:'소연', title:'새벽 연습 뒤의 피부', text:'스킨케어 코너에서 소연이 제품 뒷면을 읽으며 미간을 찌푸리고 있다. “새벽까지 연습하니까 피부가 말이 아니야. 카메라 테스트도 있는데 어떡하지?” 거울에 비친 눈 밑이 어둡다.',
      yes:['“내가 쓰는 샘플 있어, 같이 써 보자”며 건넨다', '소연이 샘플을 발라 보더니 “오, 이거 괜찮은데?” 하며 감탄했다. 그 애가 “다음 주에 후기 알려 줄게”라고 했다. 가방 속 작은 샘플이 괜히 뿌듯했다.'],
      no:['“화장품보다 잠이 먼저야. 오늘은 일찍 자”라고 걱정한다', '소연이 한숨을 쉬면서도 고개를 끄덕였다. “알아, 나도 아는데…… 네가 말해 주니까 들려.” 그 애는 수면 안대 하나만 사 들고 나왔다.']},
    {who:'태윤', title:'여동생 생일 선물', text:'화장품 진열대 사이에서 태윤이 어색하게 서 있다. 모자를 눌러쓴 채 알록달록한 상자들만 쳐다보다가 나를 발견하고 얼굴이 환해진다. “살았다. 동생 생일 선물을 사야 하는데 뭐가 뭔지 하나도 모르겠어.”',
      yes:['“동생이 평소에 뭘 쓰는지 같이 떠올려 보자”고 한다', '태윤이 동생 화장대를 열심히 떠올렸다. 분홍색 케이스를 자주 들고 다녔다는 기억으로 핸드크림 세트를 골랐다. 포장을 기다리며 그 애가 “역시 너한테 묻길 잘했다”고 했다.'],
      no:['“동생한테 직접 문자로 물어봐”라고 한다', '태윤이 반신반의하며 문자를 보냈고 몇 분 만에 답장이 왔다. 읽고 나서 그 애가 낮게 웃었다. “제품 이름이 이렇게 길 줄은 몰랐네.”']},
  ],
  books:[
    {who:'소연', title:'가사 노트 고르기', text:'문구 코너에서 소연이 노트 두 권을 들고 고민하고 있다. “작사 공부 해 보려고. 언젠가 내가 부를 노래 가사 하나쯤은 내가 쓰고 싶어서.” 나를 보며 겸연쩍게 웃는다.',
      yes:['“나도 하나 살래, 같이 써 보자”고 한다', '똑같은 노트 두 권을 사서 북카페에 앉았다. 첫 장에 각자 한 줄씩 써서 바꿔 읽었다. 소연이 “우리 가사 꽤 괜찮은데?”라며 형광펜을 꺼냈다.'],
      no:['“네 첫 가사, 다 쓰면 보여 줘”라고 응원만 한다', '소연은 “약속!” 하고 노트를 품에 안았다. 며칠 뒤 사진 한 장이 왔다. 삐뚤빼뚤한 글씨로 네 줄짜리 가사가 적혀 있었다.']},
    {who:'지수', title:'안 읽은 책 인증', text:'북카페 창가에서 지수가 책 한 권과 음료를 여러 각도로 찍고 있다. “마침 잘 왔다. 이거 같이 들고 찍어 줘. 쉬는 날 책 읽은 척하려고. 안 읽고 올려도 되나?”',
      yes:['“읽는 척이라도 하자”며 책을 펼쳐 같이 찍는다', '책장 넘기는 순간을 잡느라 열 번쯤 찍었다. 그러다 지수가 첫 문장을 읽고 “어, 이거 재밌는데?” 하며 눈을 반짝였다. 결국 그 애는 책을 사 갔다.'],
      no:['“한 챕터라도 읽고 올려”라고 놀린다', '지수가 입을 삐죽이면서도 책을 펼쳤다. 한참 뒤 고개를 들었을 때 음료가 다 식어 있었다. “이거 생각보다 좋아”라는 말에 나는 웃음을 참지 못했다.']},
    {who:'태윤', title:'만화책 탑 쌓기', text:'만화 코너 바닥에 태윤이 책을 쌓아 놓고 앉아 있다. “쉬는 날 하루 통째로 이거 완결까지 볼 거야. 진짜 못 끊어.” 쌓인 책 높이가 무릎을 넘는다.',
      yes:['“한 권만 추천해 줘, 나도 볼래”라며 옆에 앉는다', '태윤이 가장 아끼는 권을 골라 건넸다. 나도 바닥에 앉아 몇 페이지 넘기다가 시간을 잊었다. 일어서자 다리가 저려서 둘 다 웃으며 서로를 부축했다.'],
      no:['“다 읽으면 후기나 알려 줘”라고 응원한다', '태윤은 “그건 약속하지” 하며 다시 책에 코를 박았다. 며칠 뒤 장문의 후기가 도착했다. 한 줄 평은 “결말이 날 울렸다”였다.']},
  ],
  river:[
    {who:'소연', title:'돗자리 위의 속마음', text:'강가 잔디밭에서 소연이 돗자리를 펴 놓고 혼자 앉아 있다. 옆자리를 툭툭 친다. “여기 앉아. 치킨 시켰어, 식단은 내일부터야. 나 오늘 좀 마음이 허하다.” 강물에 비친 불빛이 천천히 흔들린다.',
      yes:['옆에 앉아 어깨를 기댄다', '치킨이 오기 전까지 우리는 강 건너 불빛만 바라봤다. 소연이 “우리 스무 살이 이렇게 지나가네”라고 중얼거렸다. 나는 아무 말 없이 그 애의 손을 한 번 잡아 주었다.'],
      no:['“치킨 오기 전에 한 바퀴 걷고 오자”며 일으킨다', '둘이 강가를 걸으며 서로의 근황을 쏟아 냈다. 돌아오니 치킨이 와 있었고, 소연은 “배고플 때 걸으니까 더 허하네” 하며 허겁지겁 먹었다. 웃음이 터졌다.']},
    {who:'지수', title:'체력 훈련 겸 자전거', text:'자전거 대여소 앞에서 지수가 헬멧을 쓴 채 손을 흔든다. “두 대 빌려 놨어! 체력 훈련 겸 다리 하나 건너갔다 오자. 혼자 가기엔 심심해서.” 그 애 눈이 한껏 반짝인다.',
      yes:['“좋아, 출발하자”며 헬멧을 쓴다', '지수의 속도가 빨라서 따라가느라 숨이 찼다. 중간에 쉬며 마신 물이 어느 때보다 달았다. 돌아오는 길 노을 속에서 그 애가 크게 외쳤다. “우리 체력 최고!”'],
      no:['“난 다리가 후들거려서 걷기만 할래”라고 한다', '지수는 “그럼 천천히 가자” 하며 자전거를 끌고 나란히 걸어 주었다. 느린 걸음 덕분에 강가가 더 잘 보였다. 한 바퀴를 돌고 그 애가 “이것도 좋은데?”라며 웃었다.']},
    {who:'태윤', title:'라면 물 맞추기', text:'강변 편의점에서 태윤이 컵라면 기계 앞에 서서 버튼을 눌렀다 뗐다 한다. “이거 물 붓는 선 어디까지야? 숙소에서 맨날 내가 끓이는데 국물이 항상 이상해.” 눈이 진지하다.',
      yes:['“내가 해 줄게, 선은 여기야”라고 알려 준다', '태윤이 내 손을 따라 물을 붓더니 “이게 정석이구나” 하고 감탄했다. 강가 벤치에서 먹은 라면은 평소보다 맛있었다. 그 애는 국물까지 다 마셨다.'],
      no:['“네가 해야 늘지, 한 번 더 해 봐”라고 한다', '태윤이 선을 확인하며 물을 붓고 3분을 기다렸다. 한 입 먹더니 “이번엔 성공!” 하고 주먹을 쥐었다. 나는 웃으며 박수를 쳐 주었다.']},
  ],
  night:[
    {who:'소연', title:'새벽 두 시의 어묵 국물', text:'연습이 끝난 새벽 두 시, 분식집 앞에서 소연이 어묵 꼬치를 든 채 서 있다. 나를 보자 반가워서 어쩔 줄 모른다. “마침 잘 왔다. 혼자 먹기 서러웠거든.” 목소리는 지쳤는데 얼굴은 밝다.',
      yes:['“나도 배고팠어, 같이 먹자”며 옆에 선다', '뜨끈한 국물 앞에서 소연이 하루 동안 쌓인 일을 풀어 놓았다. 나도 내 이야기를 꺼냈다. 헤어질 때 둘이 동시에 “내일도 버티자”라고 말해서 웃었다.'],

// 같이 간 사람: 공식 연인이 있으면 그 사람, 없으면 호감이 가장 높은 썸·연인
function cityCompanion(S){
  const off = typeof officialOf === 'function' ? officialOf(S) : null; if(off && S.love[off] && S.love[off].stage >= 1) return off;
  const c = Object.keys(S.love).filter(i => { const v = S.love[i]; return v && v.stage !== -9 && v.stage !== -2 && v.stage >= -1 && v.stage <= 2; }).sort((a, b) => S.love[b].aff - S.love[a].aff);
  return c[0] || null;
}
// 구입: 실패하면 안내 문구, 성공하면 null (결과 문장은 S._shopNote)
function cityBuy(S, place, id){
  const it = (CITY_SHOP[place] || []).find(x => x.id === id); if(!it) return '없는 물건이에요';
  if(S.cash < it.price) return '자금이 모자라요';
  if(it.item){ const r = buyItem(S, it.item); if(r) return r; S._shopNote = `${ITEMS[it.item].name}을(를) 샀다.`; return null; }
  let who = null; if(it.who){ who = cityCompanion(S); if(!who) return '함께할 사람이 아직 없어요'; }
  S.cash -= it.price; const ch = [];
  if(it.fx && Object.keys(it.fx).length) fx(S, it.fx, ch);
  if(it.hp) bump(S, 'hp', it.hp, ch);
  if(who) addAff(S, who, it.who + (owned(S, 'perfume') ? 1 : 0), ch);
  S._shopNote = `${it.name}을(를) 샀다.` + (who ? ` ${LOVERS[who].name}와(과) 함께였다.` : '');
  return null;
}

      yes:['옆에 서서 같은 찻잔을 같이 본다', '오 실장은 연습생 때 자기도 무대에 서고 싶었다는 이야기를 아주 짧게 했다. 그래서 흠 있는 아이들을 더 오래 보게 된다고. 나는 그 말을 오래 기억하기로 했다.'],
      no:['“좋은 시간 보내세요”라며 다른 전시실로 간다', '혼자 전시를 둘러보며 아까 그 말을 곱씹었다. 흠이 있어서 더 오래 본다. 다음 월말평가 때 실수한 부분이 덜 무섭게 느껴졌다.']},
    {who:'지석', title:'사진전의 매니저', text:'공연 사진 전시 앞에서 지석 매니저가 팔짱을 끼고 서 있다. 무대 뒤에서 찍힌 사진들이다. “이거 봐. 다들 무대에선 웃는데 대기실에선 이래. 나는 매일 이 얼굴을 봐.”',
      yes:['“오빠는 그럴 때 뭐라고 해 줘요?”라고 묻는다', '지석은 한참 생각하다가 “아무 말도 안 해. 물이랑 담요만 줘”라고 했다. 그게 제일 어렵다고. 나는 그 대답이 이상하게 든든했다.'],
      no:['말없이 다음 사진으로 넘어간다', '지석도 아무 말 없이 따라왔다. 마지막 사진은 텅 빈 무대 위에 놓인 마이크였다. 나오는 길에 그가 “너는 대기실에서도 웃는 사람이 돼라”라고 툭 던졌다.']},
    {who:'하은', title:'당첨된 초대권', text:'미술관 입구에서 하은이 초대권 두 장을 흔들고 있다. “선배님! 이벤트에 당첨됐는데 같이 갈 사람이 없어서요. 혹시 시간 되세요?” 눈빛에 기대가 가득하다.',
      yes:['“좋아, 같이 보자”며 표를 받는다', '하은은 그림마다 이 콘셉트로 무대를 하면 어떨지 상상해서 말했다. 엉뚱했지만 몇 개는 정말 좋았다. 나오는 길에 그 애가 아이디어를 수첩에 적어 두라고 했다.'],
      no:['“다른 동기랑 가 봐, 친해질 기회야”라고 권한다', '하은은 잠깐 망설이다가 같은 기수 연습생에게 연락했다. 며칠 뒤 둘이 같이 연습실에 들어오는 걸 봤다. 하은이 멀리서 나를 보고 꾸벅 인사했다.']},
    {who:'사장님', title:'서예 전시 앞에서', text:'서예 전시실에서 분식집 사장님이 큰 글씨 앞에 서 있다. “우리 아버지가 붓글씨를 하셨어. 나는 김밥만 말았지.” 그녀가 웃으며 글씨 한 줄을 손가락으로 따라 그린다.',
      yes:['“사장님 김밥도 작품이에요”라며 옆에 선다', '사장님이 소리 내어 웃더니 아버지 이야기를 조금 해 주셨다. 매일 같은 획을 몇 백 번씩 그으셨다고. 나는 연습실 거울 앞의 나를 떠올렸다.'],
      no:['인사만 하고 조용히 다른 작품을 본다', '사장님은 한참 그 글씨 앞에 서 계셨다. 나도 혼자 천천히 전시를 돌았다. 나오는 길에 사장님이 “다음에 오면 떡볶이 서비스”라고 손짓하셨다.']},
  ],
  mall:[
    {who:'사장님', title:'새 앞치마 고르는 날', text:'생활용품 코너에서 분식집 사장님이 앞치마 두 장을 들고 고민하고 있다. “십 년 입은 거 버리려고. 근데 새것은 영 어색하네. 너 눈썰미 좋잖아, 골라 봐.”',
      yes:['“이 꽃무늬가 사장님이랑 잘 어울려요”라며 골라 드린다', '사장님이 거울 앞에서 앞치마를 대 보더니 “어머, 젊어 보이네” 하며 웃었다. 다음 날 가게에 가니 정말 그 앞치마를 입고 계셨다. 김밥에 계란이 하나 더 들어 있었다.'],
      no:['“늘 입던 색이 제일 사장님 같아요”라고 말한다', '사장님은 “그렇지?” 하며 늘 입던 남색을 골랐다. 새 앞치마인데도 원래 있던 것처럼 잘 어울렸다. 바뀌지 않는 것도 좋은 거라고 사장님이 말했다.']},
    {who:'하은', title:'부모님께 보낼 선물', text:'선물 코너에서 하은이 지갑을 열어 보고 한숨을 쉬고 있다. “부모님 결혼기념일인데 용돈이 이것밖에 없어요. 연습생이라서 아무것도 못 해 드려서요.” 손에 든 건 작은 손수건 세트다.',
      yes:['“손수건에 편지 한 장 넣자, 그게 제일 좋아”라고 같이 고른다', '하은은 문구 코너에서 카드를 사서 그 자리에서 편지를 썼다. 손수건 세트 위에 카드를 올리니 그럴듯한 선물이 됐다. 그 애가 “데뷔하면 진짜 큰 거 해 드릴 거예요”라고 다짐했다.'],
      no:['“네가 잘 지내는 게 제일 큰 선물이야”라고만 말해 준다', '하은은 한참 생각하다가 손수건을 사고 영상 통화를 걸었다. 멀리서 들리는 부모님 목소리에 그 애가 웃다가 울었다. 나는 조용히 자리를 비켜 주었다.']},
    {who:'지석', title:'정장 고르는 오빠', text:'남성복 매장에서 지석 매니저가 검은 정장 두 벌을 들고 서 있다. “시상식 따라가려면 나도 정장이 있어야 한대. 근데 둘 다 장례식장 같지 않냐?” 그가 진지하게 묻는다.',
      yes:['“넥타이로 분위기를 바꿔요”라며 같이 고른다', '짙은 남색 넥타이를 대 보니 정말 분위기가 달라졌다. 지석이 거울을 보더니 “나 좀 괜찮은데?” 하고 중얼거렸다. 계산하며 그가 “너 데려간 보람 있다”고 했다.'],
      no:['“점원분이 더 잘 아실 거예요”라며 직원을 불러 준다', '직원이 치수를 재더니 몸에 맞는 한 벌을 골라 줬다. 지석은 어색하게 서 있다가 “역시 전문가”라며 고개를 끄덕였다. 나는 그 사이 옆 매장 구경을 했다.']},
    {who:'오 실장', title:'간식 쇼핑백 열 개', text:'식품관에서 오 실장이 쇼핑백 열 개를 양손에 들고 서 있다. 나를 보더니 쇼핑백 하나를 내민다. “연습생들 간식이에요. 내가 샀다고 하지 말아요. 무서운 사람 이미지 지켜야 하니까.”',
      yes:['쇼핑백을 나눠 들고 같이 회사까지 간다', '오 실장은 걷는 동안 연습생 하나하나의 좋아하는 간식을 다 알고 있었다. 회사 앞에서 그녀가 “오늘 본 건 잊어요” 하고 쇼핑백을 받아 들었다. 다음 날 연습실 냉장고가 가득 차 있었다.'],
      no:['“비밀 지킬게요”라며 인사만 하고 지나간다', '오 실장은 고개를 끄덕이고 혼자 쇼핑백을 들고 갔다. 다음 날 연습실 냉장고에 간식이 가득했다. 동기들이 누가 샀는지 궁금해했지만 나는 끝까지 모른 척했다.']},
  ],
  beauty:[
    {who:'오 실장', title:'립스틱 앞의 실장님', text:'립스틱 진열대 앞에서 오 실장이 빨간 립을 손등에 발라 보고 있다. 나를 보고도 손을 숨기지 않는다. “나도 이십 대엔 이런 색을 발랐어요. 무대에 서고 싶었거든요.”',
      yes:['“실장님한테 잘 어울려요”라며 다른 색도 권한다', '오 실장은 내가 권한 색을 발라 보고 처음으로 소리 내어 웃었다. 결국 그 립스틱을 샀다. 다음 날 회의실에서 그녀의 입술 색이 아주 조금 밝았다.'],
      no:['“그 꿈 얘기, 나중에 더 들려주세요”라고 한다', '오 실장은 잠깐 나를 보더니 “언젠가요” 하고 립스틱을 내려놓았다. 그 대답이 오래 남았다. 그녀에게도 포기한 무대가 있었다는 것.']},
    {who:'하은', title:'평가 전날의 컨실러', text:'컨실러 코너에서 하은이 눈 밑을 거울에 비춰 보고 있다. “내일 평가인데 다크서클이 이래요. 선배님, 이거 가려지는 게 있긴 해요?” 목소리에 긴장이 묻어 있다.',
      yes:['“이 색이 잘 가려져”라며 같이 골라 준다', '하은 손등에 몇 가지를 발라 보고 피부에 맞는 색을 찾았다. 그 애가 “이제 좀 자신 있어요”라며 웃었다. 다음 날 평가에서 하은은 처음으로 중간 순위에 들었다.'],
      no:['“가리는 것보다 오늘 일찍 자는 게 나아”라고 말한다', '하은은 고개를 끄덕이고 아무것도 사지 않고 나갔다. 다음 날 아침 그 애 눈 밑이 조금 밝아 보였다. “선배님 말 듣고 열한 시에 잤어요”라고 자랑했다.']},
    {who:'지석', title:'어머니 핸드크림', text:'핸드크림 코너에서 지석 매니저가 테스터를 하나씩 손등에 발라 보고 있다. “우리 엄마 손이 다 텄대. 근데 냄새가 다 똑같은데? 너 이거 구분 돼?”',
      yes:['“향 없는 걸로 해요, 어머니들은 그게 좋대요”라며 고른다', '지석은 내 말을 듣고 무향 핸드크림 세 개를 샀다. “하나는 너 줄게, 연습하다 손 트잖아.” 받아 든 크림이 손에 따뜻했다.'],
      no:['“어머니한테 직접 물어보세요”라고 한다', '지석은 그 자리에서 전화를 걸었다. 어머니가 “그런 거 사지 마” 하셨는데도 그는 제일 비싼 걸 골랐다. 전화를 끊고 “엄마들은 다 그래”라며 웃었다.']},
    {who:'사장님', title:'거친 손의 핸드크림', text:'계산대 앞에서 분식집 사장님이 핸드크림 하나를 들고 망설이고 있다. “이거 하나에 이 값이야? 김밥 세 줄 값이네.” 사장님 손등이 물일에 갈라져 있다.',
      yes:['“제가 선물할게요”라며 계산대에 같이 선다', '사장님이 한사코 말렸지만 나는 먼저 카드를 내밀었다. 다음 날 가게에 가니 사장님이 그 크림을 계산대 옆에 두고 계셨다. 내 접시에는 튀김이 하나 더 올라와 있었다.'],
      no:['“그 값 하는 거예요, 꼭 사세요”라고 권한다', '사장님은 한참 망설이다가 결국 그 크림을 샀다. “네가 사라고 해서 산 거다” 하고 웃으셨다. 나도 덩달아 마음이 놓였다.']},
  ],
  books:[
    {who:'지석', title:'운전석의 책', text:'에세이 코너에서 지석 매니저가 얇은 책 한 권을 고르고 있다. “신호 대기할 때 한 페이지씩 읽어. 운전석이 내 서재야.” 그가 책을 들어 보인다.',
      yes:['“저도 그거 읽어 볼래요”라며 같은 책을 산다', '그 책은 짧은 글들로 되어 있어서 연습 쉬는 시간에 읽기 좋았다. 며칠 뒤 이동하는 차 안에서 지석이 “몇 쪽까지 읽었냐” 하고 물었다. 둘만 아는 독서 모임이 생겼다.'],
      no:['“다 읽으면 빌려주세요”라고 한다', '지석은 “밑줄 그은 거 보면 웃지 마라” 하고 책을 샀다. 한 달 뒤 정말 책이 내 사물함에 들어 있었다. 밑줄은 대부분 ‘오늘도 무사히’ 같은 문장이었다.']},
    {who:'오 실장', title:'서점에서 만난 실장님', text:'경영서 코너에서 오 실장이 두꺼운 책을 들고 서 있다. 나를 보더니 책을 슬쩍 돌려 잡는다. 제목은 ‘사람을 키우는 법’이다. “……일 때문에 보는 거예요.”',
      yes:['“저희 키우시느라 고생 많으세요”라고 웃는다', '오 실장은 대답 대신 책 표지를 손으로 한 번 쓸었다. 그리고 “너희는 내가 키우는 게 아니라 스스로 크는 거예요”라고 했다. 나오는 길에 그 말이 이상하게 따뜻했다.'],
      no:['모른 척 인사만 하고 지나간다', '오 실장은 짧게 고개를 숙이고 책을 계산대로 가져갔다. 다음 주 연습실에서 그녀가 처음으로 모두에게 “잘하고 있어요”라고 말했다. 그 책 덕분인지는 모르겠다.']},
    {who:'하은', title:'악보 코너의 고민', text:'음악 서적 코너에서 하은이 악보집 두 권을 들고 망설이고 있다. “선배님, 저 보컬 순위가 너무 낮아서 기초부터 다시 하려고요. 이거랑 이거 중에 뭐가 나아요?”',
      yes:['“이걸로 해, 내가 처음 봤던 거야”라며 같이 펴 본다', '하은은 내가 접어 두었던 부분을 물어보며 열심히 메모했다. 다음 주부터 그 애가 연습실 구석에서 그 책을 펴 놓고 발성을 하는 게 보였다. 나도 덩달아 기초를 다시 봤다.'],
      no:['“책보다 트레이너님께 직접 물어봐”라고 권한다', '하은은 다음 날 용기를 내서 트레이너 선생님을 찾아갔다. 생각보다 친절하게 연습 방법을 알려 주셨다고 했다. 그 애 목소리가 조금씩 단단해졌다.']},
    {who:'지석', title:'중고 서점의 메모', text:'중고 서점 구석에서 지석 매니저가 오래된 책을 펼쳐 들고 있다. 책 사이에 누군가 쓴 메모가 끼워져 있다. “이거 봐. ‘다시 시작하는 너에게’래. 누가 누구한테 준 걸까?”',
      yes:['메모를 같이 읽으며 이야기를 상상한다', '둘이 메모의 주인을 상상하다 보니 이야기가 길어졌다. 지석은 그 책을 사서 메모째 나에게 건넸다. “이건 너한테 필요할 것 같다.”'],
      no:['“그냥 두세요, 다음 사람도 봐야죠”라고 한다', '지석은 고개를 끄덕이고 메모를 그대로 끼워 책을 꽂았다. 나오는 길에 그가 “너 은근 낭만 있다”고 했다. 나도 언젠가 누군가에게 그런 메모를 남기고 싶어졌다.']},

function fixedEvents(S){
  const out = [];
  if(S.collapse){ out.push(collapseEvent(S)); }
  if(S.m === 0 && !S.seen.prologue) out.push(PROLOGUE);
  if(S.m === 0 && S.round > 1 && !S.seen.round2) out.push(ROUND2);
  for(const c of CHECKS) if(S.m === c.m && !S.seen[c.id]) out.push(checkEvent(S, c));
  for(const e of ERA) if(S.m === e.m && !S.seen[e.id]) out.push(Object.assign({once:true, speaker:''}, e));
  if(S.m === INTEREST_M && !S.seen.interest) out.push(interestEvent(S));
  if(S.m === GRAD_M && !S.seen.graduation) out.push(graduationEvent(S));
  if(S.m === CAREERS.lawyer.school - 1 && !S.seen.bar_exam && BAR_EXAM.cond(S)) out.push(BAR_EXAM);
  const se = storyDue(S); if(se) out.push(se);
  const ne = typeof negoEvent === 'function' ? negoEvent(S) : null; if(ne) out.push(ne); // 이직 합격 직후 연봉 협상
  const ce = careerEvent(S); if(ce) out.push(ce);
  const le = loveEvent(S); if(le) out.push(le);
  if(S.m === TOTAL_MONTHS - 1) out.push(FINALE);
  return out;
}
function collapseEvent(S){
  return {id:'collapse_' + S.m, speaker:'', title:'쓰러지다', place:'room',
    text:S => '버티다 못한 몸이 먼저 신호를 보냈다. 눈을 떠 보니 병원 천장이었다. 의사가 한마디 했다. “이렇게 사시면 안 됩니다.”',
    choices:[{label:'정말 쉬기로 한다', sub:'체력 회복 · 자금 -30', run(S){ const ch = []; S.collapse = false; S.hp = 50; S.stress = 45; fx(S, {cash:-30, self:-2, ins:1}, ch); return {text:'일주일을 입원해 있었다. 마흔의 몸은 이렇게 무너졌을 것이다. 이번에는 늦지 않게 멈췄다.', chips:ch}; }}]};
}
function pickEvent(S){
  const pool = EVENTS.filter(e => (!e.once || !S.seen[e.id]) && (!e.cd || (S.cd[e.id] == null) || S.m - S.cd[e.id] >= e.cd) && (!e.cond || e.cond(S)));
  if(!pool.length) return null;
  const tot = pool.reduce((a, e) => a + (e.w || 1), 0); let r = R() * tot;
  for(const e of pool){ r -= (e.w || 1); if(r <= 0) return e; }
  return pool[pool.length - 1];
}

const momBy = (S, d, ch) => { const b = S.mom || 0; S.mom = clamp(b + d, 0, 100); push(ch, '엄마 마음', S.mom - b); };

   text:S => '월요일 아침 아홉 시, 연습실 구석에 체중계가 놓였다. 오 실장이 이름을 부르고 숫자를 받아 적는다. 내 차례가 세 명 남았다.',

     {label:'어제부터 굶었으니 그대로 올라간다', sub:'비주얼 +2 · 체력 -8 · 마음 -2', run:S => IE_(S, {charm:2, hp:-8, self:-2}, '숫자는 내려갔다. “좋아, 유지해.” 오 실장의 칭찬을 듣고 화장실에서 물만 세 컵 마셨다.')},
     {label:'밥은 먹고, 숫자는 받아들인다', sub:'마음 +2 · 체력 +3 · 스트레스 +5', run:S => IE_(S, {self:2, hp:3, stress:5}, '“0.8킬로 늘었네.” 오 실장이 펜을 멈췄다. 나는 고개를 들었다. 마흔의 몸은 굶어서 망가졌었다.')},
     {label:'측정 전에 줄넘기 천 개를 한다', sub:'댄스 +1 · 비주얼 +1 · 체력 -5', run:S => IE_(S, {skill:1, charm:1, hp:-5, stress:2}, '땀을 쏟고 올라간 체중계는 조금 봐줬다. 다리가 후들거렸지만 오전 연습은 버텼다.')},
   ]},
  {id:'t_snack', w:5, cd:10, cond:isTrainee, speaker:'소연', cut:'soyeon', title:'새벽 한 시의 컵라면', place:'night', img:'art/bg_dorm.webp',
   text:S => '숙소 불이 꺼진 새벽 한 시. 소연이 이불 속에서 컵라면 두 개를 꺼냈다. “딱 한 번만. 같이 먹자, 응?” 내일은 체중 측정 날이다.',
   choices:[
     {label:'같이 몰래 먹는다', sub:'관계 +3 · 스트레스 -8 · 비주얼 -1 · 들킬 수도', run:S => IE_(S, {bond:3, stress:-8, charm:-1}, '국물까지 다 마시고 둘이 소리 죽여 웃었다.', ch => { if(R() < 0.35){ rivalMood(S, -1, ch); return '방문 틈으로 하린의 눈이 보였다. 아무 말 없이 문이 닫혔다.'; } }, 'happy')},
     {label:'반 개만 나눠 먹는다', sub:'관계 +1.5 · 스트레스 -3', run:S => IE_(S, {bond:1.5, stress:-3}, '“너 진짜 독하다.” 소연이 투덜거리면서도 반을 덜어 줬다. 세 젓가락이 이렇게 맛있을 줄 몰랐다.')},
     {label:'거절하고 잔다', sub:'비주얼 +1 · 체력 +3 · 관계 -1.5', run:S => IE_(S, {charm:1, hp:3, bond:-1.5}, '등을 돌리고 누웠다. 라면 냄새가 방 안을 한참 떠돌았다. 소연은 다음 날 조금 서운한 얼굴이었다.')},
   ]},
  {id:'t_trainer', w:4, cd:12, cond:isTrainee, title:'트레이너의 독설', place:'stage', img:'art/bg_practice.webp',
   text:S => '보컬 트레이너가 피아노 뚜껑을 쾅 닫았다. “그 목소리로 데뷔하겠다고? 노래방에서나 불러.” 연습생 열두 명이 모두 나를 본다.',
   choices:[
     {label:'“한 번만 더 하겠습니다.”', sub:'보컬 +2 · 멘탈 +1 · 스트레스 +6', run:S => IE_(S, {know:2, ins:1, stress:6}, '두 번째는 조금 나았다. 트레이너는 아무 말도 하지 않았다. 그게 이 사람의 칭찬이라는 걸 나중에 알았다.')},
     {label:'끝나고 따로 찾아가 묻는다', sub:'보컬 +3 · 실력 +2 · 체력 -4', run:S => IE_(S, {know:3, work:2, hp:-4}, '“뭐가 문제예요?” 트레이너가 한숨을 쉬고 녹음 파일을 틀어 줬다. 숨을 쉬는 자리가 다 틀려 있었다. 밤 열한 시까지 호흡만 했다.')},
     {label:'화장실에서 울고 털어 버린다', sub:'스트레스 -6 · 마음 -1', run:S => IE_(S, {stress:-6, self:-1}, '수도꼭지를 틀어 놓고 울었다. 거울 속 눈이 빨갰다. 그래도 나와서 다음 곡을 불렀다.', null, 'sad')},
   ]},
  {id:'t_tears', w:4, cd:14, cond:isTrainee, speaker:'지수', cut:'jisu', title:'동기의 눈물', place:'night', img:'art/bg_practice.webp',
   text:S => '밤 열두 시, 불 꺼진 연습실에서 지수가 혼자 앉아 있었다. 늘 냉정하던 애가 무릎에 얼굴을 묻고 있다. “나 이번에도 떨어지면 엄마가 그만두래.”',
   choices:[
     {label:'옆에 앉아 아무 말 없이 있는다', sub:'관계 +3 · 체력 -3', run:S => IE_(S, {bond:3, hp:-3}, '한 시간쯤 지나 지수가 일어났다. “고마워. 이거 아무한테도 말하지 마.” 그 뒤로 지수는 내 안무 동선을 봐 주기 시작했다.')},
     {label:'같이 안무를 한 번 더 맞춰 보자고 한다', sub:'댄스 +2 · 관계 +1.5 · 체력 -6', run:S => IE_(S, {skill:2, bond:1.5, hp:-6}, '“…그래, 우는 것보다 낫겠다.” 둘이서 새벽 두 시까지 같은 8카운트를 맞췄다.')},
     {label:'내 연습이 먼저라 조용히 나온다', sub:'실력 +1.5 · 관계 -2', run:S => IE_(S, {work:1.5, bond:-2}, '문을 살며시 닫았다. 옆 연습실에서 혼자 거울을 봤다. 마음 한쪽이 계속 그 방에 남아 있었다.')},
   ]},
  {id:'t_room_war', w:4, cd:12, cond:isTrainee, speaker:'서하린', cut:'harin', title:'연습실 쟁탈전', place:'stage', img:'art/bg_practice.webp',
   text:S => '평가 일주일 전, 큰 연습실은 하나뿐이다. 밤 열 시에 예약표를 보니 내 이름 위에 서하린이 펜으로 이름을 덧썼다. “먼저 온 사람이 쓰는 거잖아요.”',
   choices:[
     {label:'예약표를 들고 따진다', sub:'예능감 +1.5 · 실력 +1 · 하린 관계 -2', run:S => IE_(S, {dare:1.5, work:1}, '결국 연습실은 내 차지가 됐다. 하린은 말없이 가방을 챙겼다. 이긴 기분이 오래가지 않았다.', ch => rivalMood(S, -2, ch))},
     {label:'반씩 나눠 쓰자고 한다', sub:'하린 관계 +2 · 댄스 +1 · 스트레스 +3', run:S => IE_(S, {skill:1, stress:3}, '거울 반쪽씩. 하린의 발소리가 신경 쓰였지만, 하린의 턴을 곁눈으로 본 것만으로도 배운 게 있었다.', ch => rivalMood(S, 2, ch))},
     {label:'양보하고 옥상에서 연습한다', sub:'마음 +1 · 체력 -5 · 하린 관계 +1', run:S => IE_(S, {self:1, hp:-5}, '옥상 바닥은 미끄럽고 바람이 찼다. 다음 날 하린이 지나가며 말했다. “어제는… 고마웠어요.”', ch => rivalMood(S, 1, ch))},
   ]},
  {id:'t_mom_box', w:4, cd:10, cond:S => preDebut(S) && (S.mom || 0) >= 40, speaker:'엄마', title:'엄마의 반찬 택배', place:'room', img:'art/mom.webp',
   text:S => '숙소 앞에 아이스박스가 도착했다. 멸치볶음, 장조림, 깍두기. 뚜껑 위에 엄마 글씨로 ‘다 같이 먹어라. 너무 굶지 말고.’라고 적혀 있다.',
   choices:[
     {label:'동기들과 나눠 먹고 사진을 보낸다', sub:'관계 +3 · 엄마 마음 +4 · 비주얼 -1', run:S => IE_(S, {bond:3, charm:-1, stress:-4}, '숙소 거실이 오랜만에 시끌벅적했다. 사진을 보내자 엄마가 바로 답장했다. “장조림 더 보낼까?”', ch => momBy(S, 4, ch), 'happy')},
     {label:'전화해서 “고마워, 엄마.”라고만 한다', sub:'엄마 마음 +6 · 마음 +1.5', run:S => IE_(S, {self:1.5}, '“고맙긴. 잘 먹고 잘 자.” 엄마 목소리가 금방 젖었다. 마흔의 나는 이 말을 거의 안 했다.', ch => momBy(S, 6, ch))},
     {label:'체중 때문에 냉동실에 넣어 둔다', sub:'비주얼 +1 · 엄마 마음 -2', run:S => IE_(S, {charm:1, stress:2}, '반찬통이 냉동실 안쪽으로 밀려났다. 한 달 뒤에도 그대로였다. 엄마에게는 맛있게 먹었다고 말했다.', ch => momBy(S, -2, ch))},
   ]},
  {id:'t_mom_no', w:4, cd:12, cond:S => preDebut(S) && (S.mom || 0) < 40, speaker:'엄마', title:'엄마의 반대', place:'room', img:'art/mom.webp',
   text:S => '“연습생이 뭐 하는 거니. 언제까지 그럴 건데. 지금이라도 학교로 돌아와.” 엄마 목소리가 날카롭다. 스무 살의 나는 이 전화를 받고 꿈을 접었다.',
   choices:[
     {label:'월말평가 영상을 보내 준다', sub:'엄마 마음 +6 · 스트레스 +4', run:S => IE_(S, {stress:4}, '답장이 한참 없었다. 밤 열한 시에 메시지가 왔다. “…노래는 잘하네. 그래도 밥은 먹어.”', ch => momBy(S, 6, ch))},
     {label:'“이번엔 끝까지 해 볼게.”라고만 말한다', sub:'마음 +3 · 엄마 마음 -2', run:S => IE_(S, {self:3, ins:1}, '엄마가 먼저 끊었다. 손이 떨렸다. 그래도 이번에는 내가 고른 길이다.', ch => momBy(S, -2, ch))},
     {label:'주말에 내려가 직접 얘기한다', sub:'엄마 마음 +8 · 관계 +2 · 연습 공백 · 자금 -10', run:S => IE_(S, {bond:2, cash:-10, work:-1, hp:-3}, '엄마는 계속 부엌에만 있었다. 떠나는 날 아침, 터미널까지 따라 나와 봉투를 쥐여 줬다.', ch => momBy(S, 8, ch))},
   ]},
  {id:'t_parttime', w:3, cd:18, cond:S => isTrainee(S) && S.cash < 120, speaker:'오 실장', cut:'teamlead', title:'알바가 들켰다', place:'room', img:'art/bg_office.webp',
   text:S => '편의점 야간 알바를 하는 걸 오 실장이 알았다. “연습생은 겸업 금지야. 몸 상하고 사진 찍히면 어쩔 건데.” 이번 달 숙소비가 모자라는 건 사실이다.',
   choices:[
     {label:'사정을 말하고 그만둔다', sub:'체력 +5 · 자금 -20 · 실력 +1', run:S => IE_(S, {hp:5, cash:-20, work:1}, '“그만둬. 이번 달은 회사가 밥값 좀 보태 줄게.” 오 실장은 생각보다 덜 차가웠다.')},
     {label:'주말만 몰래 계속한다', sub:'자금 +30 · 체력 -6 · 들키면 큰일', run:S => IE_(S, {cash:30, hp:-6, stress:5}, '주말 새벽마다 계산대 앞에 섰다.', ch => { if(R() < 0.3){ fx(S, {work:-2, stress:6}, ch); return '세 번째 주에 오 실장이 편의점 문을 열고 들어왔다. 경고장을 받았다.'; } return '아직은 아무도 모른다. 대신 월요일마다 눈이 퀭했다.'; })},
     {label:'엄마에게 손을 벌린다', sub:'자금 +30 · 엄마 마음 -3 · 마음 -1', run:S => IE_(S, {cash:30, self:-1}, '“그래서 엄마가 하지 말랬잖아.” 잔소리 끝에 입금 알림이 왔다. 고맙고, 작아졌다.', ch => momBy(S, -3, ch))},
   ]},
  {id:'t_vlog', w:4, cd:10, cond:isTrainee, title:'연습생 브이로그', place:'room',
   text:S => '회사 계정에 연습생 브이로그가 올라갔다. 내 분량은 1분. 댓글이 하나둘 달린다. ‘저 연습생 누구예요?’ 그리고 ‘얼굴이 좀 부었네.’',
   choices:[
     {label:'좋은 댓글에만 하트를 누른다', sub:'팬 + · 팬소통 +1.5 · 스트레스 +2', run:S => IE_(S, {neg:1.5, stress:2}, '하트 하나에 답글이 열 개 달렸다. ‘누나 데뷔해요?’', ch => addFans(S, 0.1 + S.st.charm / 1500, ch))},
     {label:'댓글은 아예 안 본다', sub:'멘탈 +2 · 스트레스 -3', run:S => IE_(S, {ins:2, stress:-3}, '앱을 지웠다. 내 얼굴에 대한 남의 평가는 데뷔하고 나서 들어도 늦지 않다.')},
     {label:'부었다는 댓글을 밤새 곱씹는다', sub:'비주얼 +1.5 · 마음 -2 · 스트레스 +6', run:S => IE_(S, {charm:1.5, self:-2, stress:6}, '새벽 세 시까지 얼굴 마사지를 했다. 다음 날 붓기는 빠졌고 눈 밑은 꺼졌다.', null, 'sad')},
   ]},
  {id:'t_rumor', w:3, cd:14, cond:S => isTrainee(S) && S.m < 18, speaker:'태윤', cut:'taeyun', title:'데뷔조 루머', place:'cafe', img:'art/bg_shop.webp',
   text:S => '“들었어? 회사가 벌써 데뷔조 다섯 명을 정해 놨대.” 태윤이 떡볶이를 집으며 말했다. “하린은 확정이고, 나머지는 실장님 마음이래.”',
   choices:[
     {label:'신경 쓰지 않고 연습량을 늘린다', sub:'실력 +2 · 체력 -5', run:S => IE_(S, {work:2, hp:-5}, '루머는 루머다. 정해진 게 있다면 숫자로 뒤집으면 된다. 그날 밤 연습실 불을 마지막으로 껐다.')},
     {label:'오 실장 눈에 띄려고 자주 인사하러 간다', sub:'팬소통 +1.5 · 동기 관계 -1 · 스트레스 +3', run:S => IE_(S, {neg:1.5, bond:-1, stress:3}, '오 실장 사무실 앞을 하루에 세 번 지나갔다. 동기들의 시선이 따가웠다.')},
     {label:'“너는 어떻게 생각해?” 태윤에게 묻는다', sub:'관계 +2 · 멘탈 +1', run:S => IE_(S, {bond:2, ins:1}, '“나? 넌 뽑힐 거야. 근데 뽑히는 게 다가 아니잖아.” 태윤이 떡볶이 국물을 숟가락으로 떠 줬다.')},
   ]},
  {id:'t_looks', w:4, cd:14, cond:isTrainee, speaker:'오 실장', cut:'teamlead', title:'외모 평가표', place:'stage', img:'art/bg_eval.webp',
   text:S => '카메라 테스트 결과지가 나왔다. ‘턱선 보완 필요. 콧대 고려.’ 오 실장이 말했다. “강요는 아니야. 그런데 카메라는 거짓말을 안 해.”',
   choices:[
     {label:'시술 상담을 받아 본다', sub:'비주얼 +4 · 자금 -60 · 마음 -2', run:S => IE_(S, {charm:4, cash:-60, self:-2, hp:-4}, '작은 시술 하나. 붓기가 빠진 얼굴은 화면에서 확실히 달랐다. 거울을 볼 때마다 조금 낯설었다.')},
     {label:'표정과 각도 연습으로 대신한다', sub:'표현력 +2 · 비주얼 +1 · 스트레스 +3', run:S => IE_(S, {sense:2, charm:1, stress:3}, '휴대폰 카메라로 각도를 백 장 찍었다. 내 얼굴이 제일 예뻐 보이는 15도를 찾았다.')},
     {label:'“이대로 데뷔하겠습니다.”', sub:'마음 +3 · 멘탈 +1 · 평가 불리', run:S => IE_(S, {self:3, ins:1, work:-1}, '오 실장이 결과지를 접었다. “고집 있네. 그 고집으로 증명해.”')},
   ]},
  {id:'t_slump', w:4, cd:12, cond:S => isTrainee(S) && (lastRank(S) || 0) >= 7, title:'슬럼프', place:'night', img:'art/bg_practice.webp',
   text:S => `지난 평가 ${lastRank(S)}위. 몸이 안무를 까먹은 것처럼 굳는다. 거울 속의 나는 마흔의 나처럼 지쳐 보인다.`,
   choices:[
     {label:'사흘 동안 기초만 다시 한다', sub:'댄스 +2 · 보컬 +2 · 스트레스 +4', run:S => IE_(S, {skill:2, know:2, stress:4}, '스트레칭, 발성, 아이솔레이션. 지겨운 것만 했다. 나흘째에 몸이 조금 풀렸다.')},
     {label:'하루 통째로 쉬고 한강에 간다', sub:'스트레스 -12 · 마음 +2 · 실력 -1', run:S => IE_(S, {stress:-12, self:2, work:-1}, '강물만 봤다. 아무 생각도 하지 않았다. 숙소에 돌아오니 이상하게 노래가 하고 싶었다.')},
     {label:'잘하는 동기에게 봐 달라고 한다', sub:'관계 +2 · 댄스 +1.5 · 마음 -1', run:S => IE_(S, {bond:2, skill:1.5, self:-1}, '지수가 내 영상을 보고 말했다. “너 요즘 겁먹고 춰.” 자존심은 상했지만 맞는 말이었다.')},
   ]},
  {id:'t_nodule', w:3, cd:30, cond:S => preDebut(S) && (S.hp < 55 || S.stress > 60), title:'목이 잠겼다', place:'room', img:'art/bg_hospital.webp',
   text:S => '아침에 일어났는데 목소리가 안 나온다. 이비인후과 의사가 내시경 화면을 가리켰다. “결절 직전이에요. 2주는 말도 하지 마세요.” 다음 평가까지 3주.',
   choices:[
     {label:'2주 동안 완전히 쉰다', sub:'체력 +10 · 보컬 +1 · 실력 -2 · 스트레스 +4', run:S => IE_(S, {hp:10, know:1, work:-2, stress:4}, '메모장으로 대화했다. 대신 남들 노래를 하루 종일 들었다. 목이 돌아오자 소리가 조금 맑아졌다.')},
     {label:'약 먹고 작게 계속 연습한다', sub:'실력 +1 · 체력 -6 · 위험', run:S => IE_(S, {work:1, hp:-6, stress:5}, '목에 스카프를 감고 속삭이듯 불렀다.', ch => { if(R() < 0.35){ fx(S, {know:-3, stress:8}, ch); return '일주일 뒤 목이 더 나빠졌다. 의사가 화를 냈다.'; } return '다행히 목은 버텨 주었다.'; })},
     {label:'노래 대신 댄스·표정에 집중한다', sub:'댄스 +2 · 표현력 +2 · 체력 -3', run:S => IE_(S, {skill:2, sense:2, hp:-3}, '목을 쉬게 하는 동안 거울 앞에서 표정만 연습했다. 소리 없이도 전할 수 있는 게 있었다.')},
   ]},
  {id:'t_released', once:true, cond:S => isTrainee(S) && S.m >= 4, speaker:'태윤', cut:'taeyun', title:'방출된 동기', place:'rain', img:'art/cover.webp',
   text:S => '같은 날 입소한 동기 하나가 방출됐다. 비 오는 숙소 앞, 캐리어 바퀴 소리가 멀어진다. 태윤이 우산을 들고 서 있다. “배웅 갈래?”',
   choices:[
     {label:'버스 정류장까지 따라간다', sub:'관계 +3 · 스트레스 +4 · 체력 -2', run:S => IE_(S, {bond:3, stress:4, hp:-2}, '“너는 꼭 데뷔해.” 버스가 떠났다. 그 말이 등에 짐처럼 얹혔다.', null, 'sad')},
     {label:'창문으로만 본다', sub:'멘탈 +1.5 · 마음 -1', run:S => IE_(S, {ins:1.5, self:-1}, '나가면 울 것 같았다. 커튼 틈으로 우산 두 개가 멀어지는 걸 봤다.')},
     {label:'그날 밤 연습실에 혼자 남는다', sub:'실력 +2 · 체력 -5 · 관계 -1', run:S => IE_(S, {work:2, hp:-5, bond:-1}, '다음은 내가 될 수도 있다. 그 생각을 땀으로 지웠다.')},
   ]},
  // ── 조연들 ─────────────────────────────────────────────────────
  {id:'t_owner', w:4, cd:10, cond:preDebut, speaker:'분식집 사장님', cut:'owner', title:'사장님의 공짜 떡볶이', place:'shop', img:'art/bg_shop.webp',
   text:S => '연습실 앞 분식집. 떡볶이 1인분을 시켰는데 순대랑 튀김이 같이 나왔다. “서비스야. 연습생들 얼굴 보면 내가 다 배고파.”',
   choices:[
     {label:'다 먹고 설거지를 돕는다', sub:'관계 +2 · 스트레스 -6 · 비주얼 -1', run:S => IE_(S, {bond:2, stress:-6, charm:-1}, '“데뷔하면 사인 하나 붙여 줘.” 사장님이 비닐장갑을 벗으며 웃었다. 벽에 아직 빈자리가 많았다.', null, 'happy')},
     {label:'포장해서 동기들에게 가져간다', sub:'관계 +3 · 자금 -5', run:S => IE_(S, {bond:3, cash:-5}, '숙소에 떡볶이 냄새가 퍼지자 모두 방에서 나왔다. 하린도 한 개는 먹었다.')},
     {label:'고맙다고만 하고 반만 먹는다', sub:'비주얼 +1 · 마음 -1', run:S => IE_(S, {charm:1, self:-1}, '사장님이 남은 접시를 보고 아무 말 없이 치웠다. 미안해서 다음 날도 들렀다.')},
   ]},
  {id:'t_jiseok', w:4, cd:12, cond:preDebut, speaker:'지석 매니저', cut:'jiseok', title:'지석 매니저의 조언', place:'night', img:'art/bg_alley.webp',
   text:S => '연습 끝나고 편의점 앞. 지석 매니저가 캔커피를 건넸다. “내가 데뷔하는 애들 많이 봤거든. 끝까지 가는 애들은 딱 하나가 달라.”',
   choices:[
     {label:'“뭐가 달라요?” 진지하게 묻는다', sub:'멘탈 +2 · 마음 +1.5', run:S => IE_(S, {ins:2, self:1.5}, '“잘 자고 잘 먹어. 그거 못 하는 애들이 먼저 무너져.” 너무 시시해서 웃었는데, 그날은 일찍 잤다.')},
     {label:'다른 기획사 이야기도 캐묻는다', sub:'예능감 +1.5 · 팬소통 +1', run:S => IE_(S, {dare:1.5, neg:1}, '방송국 대기실 서열, 음방 사녹 순서, 매니저들끼리만 아는 이야기. 한 시간이 금방 갔다.')},
     {label:'커피만 받고 연습실로 돌아간다', sub:'실력 +1.5 · 체력 -3', run:S => IE_(S, {work:1.5, hp:-3}, '“너 그러다 쓰러진다.” 등 뒤로 지석 매니저 목소리가 들렸다.')},
   ]},
  {id:'t_haeun', w:4, cd:12, cond:S => isTrainee(S) && S.m >= 2, speaker:'하은', cut:'haeun', title:'막내 연습생 하은', place:'stage', img:'art/bg_practice.webp',
   text:S => '열여섯 살 하은이 계단 구석에서 휴대폰을 보며 울고 있었다. 화면에는 ‘엄마’. “집에 가고 싶은데, 가면 다 끝날 것 같아요.”',
   choices:[
     {label:'저녁을 사 주며 이야기를 들어 준다', sub:'관계 +3 · 자금 -10', run:S => IE_(S, {bond:3, cash:-10, stress:-2}, '하은은 김밥 두 줄을 먹고 조금 웃었다. “언니는 왜 이렇게 어른 같아요?” 마흔이라서, 라고는 말 못 했다.')},
     {label:'하은의 노래를 봐 준다', sub:'관계 +2 · 보컬 +1.5 · 체력 -3', run:S => IE_(S, {bond:2, know:1.5, hp:-3}, '하은의 고음은 맑았다. 숨 쉬는 자리 두 군데만 고쳐 줬다. 가르치면서 나도 배웠다.')},
     {label:'“여기는 다 힘들어.”라고 짧게 말한다', sub:'멘탈 +1 · 관계 -1.5', run:S => IE_(S, {ins:1, bond:-1.5}, '하은이 눈물을 닦고 고개를 끄덕였다. 맞는 말이었지만 그 애가 듣고 싶은 말은 아니었다.')},
   ]},
  {id:'t_teamlead', w:3, cd:16, cond:S => isTrainee(S) && S.m >= 3, speaker:'오 실장', cut:'teamlead', title:'오 실장의 면담', place:'cafe', img:'art/bg_office.webp',
   text:S => `오 실장이 사무실로 불렀다. “서윤, 너는 뭐가 하고 싶어? 메인보컬? 센터? 회사는 네 포지션을 아직 못 정했어.” ${lastRank(S) ? `최근 순위 ${lastRank(S)}위.` : ''}`,
   choices:[
     {label:'“센터요.”라고 말한다', sub:'예능감 +2 · 실력 +1 · 스트레스 +5', run:S => IE_(S, {dare:2, work:1, stress:5}, '오 실장이 펜을 돌렸다. “하린이 있는데? 좋아. 그 말 잊지 마.”')},
     {label:'“팀에 필요한 자리면 어디든요.”', sub:'관계 +2 · 마음 -1', run:S => IE_(S, {bond:2, self:-1}, '“착한 대답이네. 착한 애는 잘 안 보여.” 오 실장이 웃었다.')},
     {label:'“제 노래를 쓰고 싶어요.”', sub:'표현력 +2 · 마음 +2 · 회사 반응 미지근', run:S => IE_(S, {sense:2, self:2, work:-0.5}, '“작곡? 데뷔부터 하고 말해.” 그래도 오 실장은 수첩에 무언가를 적었다.')},
   ]},
  {id:'t_dorm_rule', w:3, cd:14, cond:isTrainee, speaker:'소연', cut:'soyeon', cut2:'jisu', title:'숙소 청소 당번', place:'room', img:'art/bg_dorm.webp',
   text:S => '숙소 싱크대에 설거지가 사흘째 쌓였다. 소연과 지수가 서로 네 차례라며 언성을 높인다. 둘 다 나를 본다.',
   choices:[
     {label:'내가 다 해 버린다', sub:'관계 +2 · 체력 -4 · 마음 -1', run:S => IE_(S, {bond:2, hp:-4, self:-1}, '고무장갑을 꼈다. 싸움은 멈췄다. 대신 다음 주에도 다들 나를 봤다.')},
     {label:'당번표를 만들어 벽에 붙인다', sub:'팬소통 +1.5 · 관계 +1 · 스트레스 +2', run:S => IE_(S, {neg:1.5, bond:1, stress:2}, '요일별로 이름을 적었다. 지수가 투덜대며 자기 칸에 체크했다.')},
     {label:'모른 척하고 연습실로 간다', sub:'실력 +1 · 관계 -1.5', run:S => IE_(S, {work:1, bond:-1.5}, '돌아오니 설거지는 끝나 있었다. 둘 다 나한테 말을 안 걸었다.')},
   ]},
  {id:'t_phone', w:3, cd:16, cond:isTrainee, speaker:'오 실장', cut:'teamlead', title:'휴대폰 반납', place:'room', img:'art/bg_dorm.webp',
   text:S => '평가 전 한 달은 휴대폰 반납이다. 오 실장이 바구니를 들고 돌아다닌다. 주머니 속 휴대폰에 방금 메시지가 왔다. 고향 친구 민준이다.',
   choices:[
     {label:'순순히 낸다', sub:'실력 +1.5 · 스트레스 +3 · 관계 -1', run:S => IE_(S, {work:1.5, stress:3, bond:-1}, '한 달 동안 연습만 했다. 휴대폰을 돌려받으니 메시지가 백 개 넘게 쌓여 있었다.', ch => addAff(S, 'minjun', -1, ch))},
     {label:'공기계를 내고 진짜는 숨긴다', sub:'관계 +1.5 · 들키면 경고', run:S => IE_(S, {bond:1.5, stress:-2}, '밤마다 이불 속에서 짧게 답장했다.', ch => { addAff(S, 'minjun', 2, ch); if(R() < 0.3){ fx(S, {work:-2, stress:6}, ch); return '보름째 되는 밤, 이불이 걷혔다. 오 실장이었다.'; } return '한 달 내내 들키지 않았다.'; })},
     {label:'민준에게만 답장하고 낸다', sub:'관계 +1 · 스트레스 +1', run:S => IE_(S, {bond:1, stress:1}, '‘한 달 연락 못 해. 걱정 마.’ 답장이 바로 왔다. ‘응. 밥 꼭 먹어.’', ch => addAff(S, 'minjun', 1, ch))},
   ]},
  {id:'t_minjun', w:3, cd:14, cond:S => preDebut(S) && met(S, 'minjun'), speaker:'한민준', cut:'minjun', title:'고향 친구의 방문', place:'night', img:'art/bg_alley.webp',
   text:S => '민준이 기차를 타고 올라왔다. 연습실 앞 골목에 서서 비닐봉지를 흔든다. “너희 엄마가 보낸 거. 그리고 이건 내가 산 거.” 귤 한 봉지다.',
   choices:[
     {label:'한 시간 동안 같이 걷는다', sub:'호감 + · 스트레스 -8 · 연습 시간 -', run:S => IE_(S, {stress:-8, work:-0.5}, '개천을 따라 걸었다. 민준은 학교 설계 과제 이야기만 했다. 그게 좋았다. 여기 아무도 안 하는 이야기라서.', ch => addAff(S, 'minjun', 4, ch), 'happy')},
     {label:'귤만 받고 연습실로 돌아간다', sub:'실력 +1 · 호감 -1', run:S => IE_(S, {work:1}, '“그래, 들어가. 나 그냥 얼굴 보러 온 거야.” 민준이 먼저 손을 흔들었다.', ch => addAff(S, 'minjun', -1, ch))},
     {label:'분식집에서 엄마 이야기를 묻는다', sub:'호감 +2 · 엄마 마음 +3 · 자금 -6', run:S => IE_(S, {cash:-6, bond:1}, '“어머니 요즘 네 영상 몰래 보셔.” 떡볶이를 집던 손이 멈췄다.', ch => { addAff(S, 'minjun', 2, ch); momBy(S, 3, ch); })},
   ]},
  {id:'t_jaewoo', w:3, cd:14, cond:S => preDebut(S) && met(S, 'jaewoo'), speaker:'서재우', cut:'jaewoo', title:'홍대 버스킹', place:'city', img:'art/ct_night.webp',
   text:S => '홍대 놀이터 앞, 재우가 기타를 메고 서 있다. “코러스 한 소절만 같이 해 줄래? 아무도 안 알아봐.” 회사는 무허가 공연을 싫어한다.',
   choices:[
     {label:'모자를 눌러쓰고 같이 부른다', sub:'호감 +4 · 보컬 +1.5 · 들키면 경고', run:S => IE_(S, {know:1.5, self:1.5}, '서른 명쯤 모였다. 재우의 기타 위로 내 목소리가 얹혔다. 노래가 끝나고 박수가 길었다.', ch => { addAff(S, 'jaewoo', 4, ch); if(R() < 0.25){ fx(S, {stress:6, work:-1}, ch); return '다음 날 누가 찍은 영상이 돌았다. 오 실장에게 불려 갔다.'; } }, 'happy')},
     {label:'관객으로만 듣는다', sub:'호감 +2 · 표현력 +1.5', run:S => IE_(S, {sense:1.5, stress:-3}, '재우는 노래 사이마다 나를 봤다. 마지막 곡은 처음 듣는 곡이었다.', ch => addAff(S, 'jaewoo', 2, ch))},
     {label:'다음에 하자며 연습하러 간다', sub:'실력 +1.5 · 호감 -1', run:S => IE_(S, {work:1.5}, '“그래, 데뷔하면 그때 같이 해.” 재우의 기타 소리가 골목 끝까지 따라왔다.', ch => addAff(S, 'jaewoo', -1, ch))},
   ]},
  {id:'t_taeyun', w:4, cd:12, cond:isTrainee, speaker:'태윤', cut:'taeyun', title:'남자 연습생 층', place:'stage', img:'art/bg_practice.webp',
   text:S => '남자 연습생 층의 태윤이 듀엣 과제 파트너를 구한다. “너랑 하면 잘될 것 같아.” 회사는 남녀 연습생이 붙어 다니는 걸 싫어한다.',
   choices:[
     {label:'파트너가 된다', sub:'보컬 +2 · 관계 +2 · 소문 위험', run:S => IE_(S, {know:2, bond:2}, '화음이 생각보다 잘 맞았다. 녹음본을 들은 트레이너가 처음으로 고개를 끄덕였다.', ch => { if(R() < 0.3){ fx(S, {stress:6}, ch); return '그 주부터 둘이 사귄다는 소문이 돌았다. 아니라고 해도 소용없었다.'; } })},
     {label:'연습만 같이 하고 영상은 따로 찍는다', sub:'보컬 +1 · 관계 +1', run:S => IE_(S, {know:1, bond:1}, '“조심스럽네.” 태윤이 웃었다. “그게 맞지. 우리 둘 다 데뷔해야 하니까.”')},
     {label:'거절하고 지수와 짝을 짠다', sub:'댄스 +2 · 관계 -1', run:S => IE_(S, {skill:2, bond:-1}, '지수와의 과제는 칼군무였다. 태윤은 다른 애랑 짝을 지었다. 복도에서 눈이 마주치면 어색했다.')},
   ]},
  {id:'t_ankle', w:3, cd:20, cond:S => preDebut(S) && S.hp < 60, title:'발목이 꺾였다', place:'stage', img:'art/bg_practice.webp',
   text:S => '점프 착지에서 발목이 돌아갔다. 얼음을 대니 금방 부어오른다. 평가 곡의 하이라이트가 바로 그 점프다.',
   choices:[
     {label:'병원에 가고 한 주 쉰다', sub:'체력 +8 · 댄스 -1 · 자금 -15', run:S => IE_(S, {hp:8, skill:-1, cash:-15, stress:3}, '반깁스를 했다. 대신 앉아서 할 수 있는 건 다 했다. 가사를 쓰고, 표정을 연습했다.')},
     {label:'테이핑하고 그대로 연습한다', sub:'실력 +1.5 · 체력 -10 · 재발 위험', run:S => IE_(S, {work:1.5, hp:-10, stress:4}, '테이프를 세 겹 감았다. 연습은 끝까지 했다. 밤에 발목이 욱신거렸다.')},
     {label:'안무를 내 발목에 맞게 바꿔 달라고 한다', sub:'표현력 +1.5 · 예능감 +1 · 스트레스 +3', run:S => IE_(S, {sense:1.5, dare:1, stress:3}, '점프를 턴으로 바꿨다. 안무 선생님은 처음엔 싫어했지만, 결과물을 보고 그대로 두었다.')},
   ]},
  {id:'t_scout', w:2, cd:24, cond:S => preDebut(S) && S.m >= 6, speaker:'윤하진', cut:'hajin', title:'명함 한 장', place:'cafe', img:'art/bg_shop.webp',
   text:S => '카페에서 누가 명함을 내밀었다. ‘윤하진, 대표.’ 생긴 지 일 년 된 엔터 회사다. “우리 회사로 오면 바로 데뷔 준비 들어가요. 조건도 더 좋고요.”',
   choices:[
     {label:'정중히 거절하고 명함은 챙긴다', sub:'호감 +1 · 멘탈 +1.5', run:S => IE_(S, {ins:1.5}, '“생각 바뀌면 연락 줘요.” 그는 서두르지 않았다. 명함이 지갑 안쪽에 남았다.', ch => addAff(S, 'hajin', 1, ch))},
     {label:'조건을 자세히 들어 본다', sub:'팬소통 +2 · 호감 +2 · 동기 관계 -1', run:S => IE_(S, {neg:2, bond:-1, stress:3}, '정산 비율, 데뷔 시기, 숙소. 다 우리 회사보다 나았다. 숙소에 돌아와 동기들 얼굴을 보기가 어려웠다.', ch => addAff(S, 'hajin', 2, ch))},
     {label:'오 실장에게 사실대로 말한다', sub:'실력 +1 · 마음 -1', run:S => IE_(S, {work:1, self:-1}, '“말해 줘서 고마워.” 오 실장이 처음으로 내 어깨를 두드렸다. 대신 그 명함은 버리라고 했다.')},
   ]},
  {id:'t_future_trend', w:2, cd:24, cond:S => preDebut(S) && S.clarity >= 30 && S.m >= 3, title:'아직 오지 않은 유행', place:'room',
   text:S => '마흔의 기억 속에 몇 년 뒤 유행할 안무 동작과 노래 스타일이 또렷하다. 지금 연습 영상에 넣으면 다들 처음 보는 감각이라고 할 것이다.',
   choices:[
     {label:'미래 유행을 그대로 가져다 쓴다', sub:'표현력 +3 · 실력 +2 · 선명도 -6', run:S => { S.borrowed++; return IE_(S, {sense:3, work:2, clarity:-6}, '트레이너가 영상을 돌려 보며 물었다. “이거 어디서 봤어?” 아무 데서도. 아직은.'); }},
     {label:'힌트만 얻고 내 식으로 바꾼다', sub:'표현력 +1.5 · 선명도 -2', run:S => { S.borrowed++; return IE_(S, {sense:1.5, clarity:-2}, '기억의 뼈대만 빌리고 살은 내가 붙였다. 반쯤은 내 것이라고 우겨 본다.'); }},
     {label:'기억은 덮어 둔다', sub:'마음 +2 · 멘탈 +1', run:S => IE_(S, {self:2, ins:1}, '이 인생의 춤은 이 몸으로 찾기로 했다. 느리지만 떳떳하다.')},
   ]},
  {id:'t_birthday', w:3, cd:12, cond:isTrainee, speaker:'소연', cut:'soyeon', title:'숙소 생일 파티', place:'night', img:'art/bg_dorm.webp',
   text:S => '오늘이 내 생일인 걸 아무도 모르는 줄 알았다. 밤 열두 시, 불이 꺼지고 소연이 초 하나 꽂은 컵케이크를 들고 들어왔다. 뒤에 동기들이 줄줄이 서 있다.',
   choices:[
     {label:'다 같이 새벽까지 논다', sub:'관계 +4 · 스트레스 -10 · 체력 -5', run:S => IE_(S, {bond:4, stress:-10, hp:-5}, '노래방 앱으로 돌아가며 노래했다. 하린은 끝까지 방에서 안 나왔지만, 문 앞에 작은 쪽지가 놓여 있었다.', null, 'happy')},
     {label:'소원만 빌고 일찍 잔다', sub:'관계 +2 · 체력 +3', run:S => IE_(S, {bond:2, hp:3}, '소원은 말하지 않았다. 마흔의 생일에는 혼자 미역국을 끓였다. 오늘은 그러지 않아도 됐다.')},
     {label:'엄마에게 먼저 전화한다', sub:'관계 +1.5 · 엄마 마음 +5', run:S => IE_(S, {bond:1.5}, '“낳아 줘서 고마워.” 엄마가 한참 웃다가 울었다. 동기들이 문밖에서 기다려 주었다.', ch => momBy(S, 5, ch))},
   ]},
  {id:'t_language', w:3, cd:15, cond:isTrainee, title:'외국어 수업', place:'room', img:'art/bg_dorm.webp',
   text:S => '회사가 일본어·중국어 수업을 열었다. 해외 활동을 대비한 거다. 수업은 연습이 끝난 밤 아홉 시. 다들 꾸벅꾸벅 존다.',
   choices:[
     {label:'끝까지 받아 적는다', sub:'팬소통 +2.5 · 체력 -4', run:S => IE_(S, {neg:2.5, hp:-4}, '인사말, 자기소개, “사랑해요”. 세 나라 말로 외웠다. 마흔의 머리는 의외로 잘 버텼다.')},
     {label:'수업 시간에 몰래 잔다', sub:'체력 +5 · 팬소통 -1', run:S => IE_(S, {hp:5, neg:-1}, '선생님이 내 이름을 두 번 불렀다. 그래도 그날 밤은 오랜만에 깊이 잤다.')},
     {label:'수업 대신 보컬 연습을 한다', sub:'보컬 +2 · 관계 -1', run:S => IE_(S, {know:2, bond:-1}, '빈 녹음실에서 혼자 불렀다. 다음 날 동기들이 노트를 빌려주지 않았다.')},
   ]},
  {id:'t_allnight', w:4, cd:10, cond:isTrainee, title:'밤샘 연습', place:'night', img:'art/bg_practice.webp',
   text:S => '새벽 세 시, 연습실 불이 아직 다 켜져 있다. 다들 안 자는데 나만 자러 가면 뒤처지는 기분이다.',
   choices:[
     {label:'해 뜰 때까지 남는다', sub:'댄스 +2 · 실력 +1.5 · 체력 -10', run:S => IE_(S, {skill:2, work:1.5, hp:-10, stress:4}, '창밖이 파래질 때 마지막 8카운트가 맞았다. 계단을 내려오다 다리가 풀렸다.')},
     {label:'두 시간만 더 하고 잔다', sub:'댄스 +1 · 체력 -4', run:S => IE_(S, {skill:1, hp:-4}, '다섯 시에 누웠다. 알람 소리가 너무 빨리 왔다.')},
     {label:'지금 바로 잔다', sub:'체력 +6 · 스트레스 +3', run:S => IE_(S, {hp:6, stress:3}, '마흔의 나는 잠을 줄여서 버티다가 몸을 잃었다. 불안했지만 눈을 감았다.')},
   ]},
  {id:'t_raon', w:3, cd:16, cond:S => isTrainee(S) && met(S, 'raon'), speaker:'강라온', cut:'raon', title:'선배 그룹의 연습실', place:'stage', img:'art/bg_practice.webp',
   text:S => '노바의 강라온이 연습실 문을 열고 들어왔다. 우리 연습을 십 초쯤 보더니 말했다. “거기, 왼쪽 두 번째. 박자 밀려요.” 나다.',
   choices:[
     {label:'“다시 봐 주세요.”라고 말한다', sub:'댄스 +2 · 호감 +2 · 스트레스 +4', run:S => IE_(S, {skill:2, stress:4}, '라온은 팔짱을 끼고 끝까지 봤다. “…이번엔 맞네.” 그 말만 하고 나갔다.', ch => addAff(S, 'raon', 2, ch))},
     {label:'못 들은 척 계속한다', sub:'멘탈 +1.5 · 호감 -1', run:S => IE_(S, {ins:1.5}, '라온이 피식 웃었다. “자존심은 있네.” 문이 닫혔다.', ch => addAff(S, 'raon', -1, ch))},
     {label:'끝나고 따로 찾아가 묻는다', sub:'댄스 +3 · 호감 +3 · 소문 위험', run:S => IE_(S, {skill:3, stress:2}, '복도 끝에서 라온이 동작 하나를 천천히 보여 줬다. 다음 날 연습생들 사이에 이상한 소문이 돌았다.', ch => { addAff(S, 'raon', 3, ch); rivalMood(S, -1, ch); })},
   ]},
  {id:'t_cover', w:3, cd:14, cond:preDebut, title:'커버 영상', place:'room',
   text:S => '연습실에서 찍은 커버 영상이 회사 계정에 올라갈지 정해야 한다. 잘 나온 컷은 화려하지만 라이브가 조금 흔들렸다.',
   choices:[
     {label:'화려한 컷으로 올린다', sub:'팬 + · 비주얼 +1 · 라이브 지적 위험', run:S => IE_(S, {charm:1}, '조회수가 꽤 나왔다.', ch => { addFans(S, 0.15, ch); if(R() < 0.3){ fx(S, {stress:5}, ch); return '맨 위 댓글은 ‘라이브는 좀…’이었다.'; } })},
     {label:'라이브가 깔끔한 컷으로 올린다', sub:'보컬 +1.5 · 팬 조금 +', run:S => IE_(S, {know:1.5}, '조회수는 적었다. 대신 ‘라이브 안정적’이라는 댓글이 맨 위에 걸렸다.', ch => addFans(S, 0.05, ch))},
     {label:'다시 찍자고 한다', sub:'실력 +2 · 체력 -6', run:S => IE_(S, {work:2, hp:-6}, '열네 번째 테이크에서 겨우 둘 다 잡혔다. 카메라 감독이 한숨을 쉬었다.')},
   ]},
  {id:'t_mirror', w:3, cd:18, cond:S => preDebut(S) && S.m >= 6, title:'마흔의 눈', place:'night', img:'art/bg_practice.webp',
   text:S => '연습실 전면 거울 앞에 혼자 섰다. 스무 살 몸에 마흔의 눈이 박혀 있다. 이 몸으로 다시 꿈을 꾸는 게 맞는 걸까.',
   choices:[
     {label:'일기에 마흔의 나에게 편지를 쓴다', sub:'마음 +3 · 스트레스 -6', run:S => IE_(S, {self:3, stress:-6}, '‘포기했던 거, 이번엔 내가 대신 해 볼게.’ 한 줄 쓰고 한참 울었다.')},
     {label:'노래를 한 곡 끝까지 부른다', sub:'보컬 +2 · 표현력 +1', run:S => IE_(S, {know:2, sense:1}, '마흔의 나는 회식 노래방에서 이 노래를 불렀다. 오늘은 거울 앞에서, 제대로.')},
   ]},
  // ── 무소속(방출·탈락 후) ────────────────────────────────────────
  {id:'o_audition_fail', w:5, cd:8, cond:isOut, title:'또 낙방', place:'city', img:'art/ct_office.webp',
   text:S => '이번 달에만 세 번째 오디션. 대기실에는 열여섯 살들이 앉아 있다. 심사위원이 내 서류를 보고 물었다. “나이가 좀 있네요?”',
   choices:[
     {label:'“그만큼 오래 준비했습니다.”', sub:'예능감 +2 · 멘탈 +1.5 · 스트레스 +5', run:S => IE_(S, {dare:2, ins:1.5, stress:5}, '심사위원이 처음으로 서류에서 눈을 뗐다. 결과는 같았지만, 그 표정은 기억하기로 했다.')},
     {label:'노래 대신 자작곡을 부른다', sub:'표현력 +2 · 마음 +2', run:S => IE_(S, {sense:2, self:2, stress:3}, '아무도 모르는 노래였다. 끝나고 심사위원 하나가 제목을 물었다.')},
     {label:'오늘은 그냥 집에 간다', sub:'스트레스 -8 · 실력 -1', run:S => IE_(S, {stress:-8, work:-1}, '대기실 문 앞에서 돌아섰다. 지하철에서 창밖만 봤다. 다음 주엔 다시 갈 것이다.', null, 'sad')},
   ]},
  {id:'o_job', w:4, cd:10, cond:isOut, speaker:'분식집 사장님', cut:'owner', title:'사장님의 제안', place:'shop', img:'art/bg_shop.webp',
   text:S => '연습실을 나온 걸 알고 분식집 사장님이 말했다. “낮에 가게 좀 봐 줄래? 연습은 저녁에 하고. 월급은 많이 못 줘.”',
   choices:[
     {label:'고맙게 일한다', sub:'자금 +40 · 체력 -5 · 관계 +2', run:S => IE_(S, {cash:40, hp:-5, bond:2}, '앞치마를 맸다. 손님들이 가끔 알아봤다. “연습생이었죠?” 이제는 웃으면서 대답할 수 있다.')},
     {label:'연습 시간이 줄어서 거절한다', sub:'실력 +1.5 · 자금 -10', run:S => IE_(S, {work:1.5, cash:-10, stress:3}, '“그래, 네 꿈이 먼저지.” 사장님은 떡볶이를 한 접시 더 담아 주었다.')},
   ]},
  {id:'o_tv', w:4, cd:14, cond:S => isOut(S) && S.m >= 23, title:'TV 속 동기들', place:'room', img:'art/bg_room_winter.webp',
   text:S => `음악방송에 ${GROUP_NAME}가 나온다. 하린이 센터에서 웃고, 소연이 고음을 친다. 저 자리에 내가 있을 수도 있었다.`,
   choices:[
     {label:'끝까지 보고 축하 문자를 보낸다', sub:'관계 +3 · 마음 -1', run:S => IE_(S, {bond:3, self:-1}, '소연에게서 답장이 왔다. ‘언니 보고 싶어. 언니 꼭 와.’ 휴대폰을 오래 쥐고 있었다.')},
     {label:'채널을 돌리고 연습하러 간다', sub:'실력 +2 · 스트레스 +4', run:S => IE_(S, {work:2, stress:4}, '연습실 대여비 시간당 만 원. 거울 속의 나는 아직 포기한 얼굴이 아니었다.')},
     {label:'이불을 뒤집어쓴다', sub:'스트레스 -5 · 마음 -2', run:S => IE_(S, {stress:-5, self:-2}, '그날은 아무것도 하지 않았다. 내일은 할 수 있을 것이다. 아마도.', null, 'sad')},
   ]},
  {id:'o_contract', w:3, cd:20, cond:isOut, title:'수상한 계약서', place:'cafe', img:'art/bg_office.webp',
   text:S => '이름도 처음 듣는 기획사에서 연락이 왔다. “데뷔 보장. 대신 트레이닝비 300만 원 선납.” 계약서 글씨가 유난히 작다.',
   choices:[
     {label:'그 자리에서 거절한다', sub:'멘탈 +2 · 스트레스 +2', run:S => IE_(S, {ins:2, stress:2}, '마흔의 나는 이런 계약서를 너무 많이 봤다. 커피값만 내고 나왔다.')},
     {label:'무료 법률 상담을 받아 본다', sub:'팬소통 +1 · 스트레스 -2 · 최건우 호감 +3', run:S => IE_(S, {neg:1, stress:-2}, '상담 창구의 변호사가 계약서를 넘기다 웃었다. “이건 계약서가 아니라 영수증이네요.” 명찰에 ‘최건우’라고 적혀 있었다.', ch => addAff(S, 'geonwoo', 3, ch))},
     {label:'혹시나 해서 돈을 낸다', sub:'자금 -300 · 아주 작은 기회', run:S => IE_(S, {cash:-300, stress:10}, '한 달 뒤 사무실 문이 잠겨 있었다.', ch => { if(R() < 0.1){ addFans(S, 0.1, ch); return '그래도 그 회사에서 찍은 연습 영상 하나가 조금 퍼졌다.'; } }, 'sad')},
   ]},
  {id:'o_mom_home', w:3, cd:12, cond:isOut, speaker:'엄마', title:'집밥', place:'room', img:'art/mom.webp',
   text:S => '오랜만에 엄마 집. 엄마는 아무것도 묻지 않고 찌개를 끓인다. 숟가락을 들다 엄마가 말했다. “이제 그만해도 돼. 충분히 했어.”',

  {id:'i_airport', w:3, cd:14, cond:S => isIdol(S) && fansOf(S) >= 8, title:'공항 출국길', place:'city', img:'art/ct_mall.webp',

  {id:'i_senior', w:3, cd:16, cond:S => isIdol(S) && sinceDebut(S) < 30, title:'선배의 텃세', place:'stage', img:'art/bg_stage.webp',

  {id:'i_credit', w:3, cd:18, cond:S => isIdol(S) && IDOL(S).songs >= 1, title:'작곡 크레딧', place:'room', img:'art/bg_studio.webp',

  {id:'i_ujin', w:3, cd:16, cond:isIdol, speaker:'신우진', cut:'ujin', title:'무대 의상 사고', place:'stage', img:'art/bg_stage.webp',

  {id:'i_sian', w:2, cd:20, cond:S => isIdol(S) && sinceDebut(S) >= 12, speaker:'유시안', cut:'sian', title:'드라마 카메오', place:'city', img:'art/ct_cinema.webp',

  {id:'i_hajin', w:2, cd:24, cond:S => isIdol(S) && sinceDebut(S) >= 12, speaker:'윤하진', cut:'hajin', title:'이적 제안', place:'cafe', img:'art/bg_office.webp',

  {id:'i_geonwoo', w:2, cd:24, cond:S => isIdol(S) && sinceDebut(S) >= 18, speaker:'최건우', cut:'geonwoo', title:'정산서의 숫자', place:'cafe', img:'art/bg_office.webp',

  {id:'i_seunghyun', w:2, cd:20, cond:S => isIdol(S) && met(S, 'seunghyun'), speaker:'백승현', cut:'seunghyun', title:'회사 지하 주차장', place:'night', img:'art/bg_alley.webp',

  {id:'i_center', w:3, cd:18, cond:inLumi, speaker:'서하린', cut:'harin', title:'센터 자리', place:'stage', img:'art/bg_practice.webp',
   text:S => '새 안무 동선표가 나왔다. 하이라이트 센터가 하린에서 나로 바뀌었다. 하린이 동선표를 내려놓았다. “실장님 결정이에요? 아니면 언니가 말한 거예요?”',

   text:S => '새벽 팬 라이브. 팬들이 묻는다. ‘다음 앨범 언제 나와요?’ 아직 발표 전이다. 피곤해서 입이 가볍다.',

  {id:'i_haeun', w:3, cd:16, cond:inLumi, speaker:'하은', cut:'haeun', title:'막내의 새벽', place:'night', img:'art/bg_dorm.webp',

  {id:'i_lipsync', w:3, cd:20, cond:S => isIdol(S) && fansOf(S) >= 4, title:'립싱크 논란', place:'room', img:'art/bg_dorm.webp',

const _srStart = S => {
  if(!S.love.raon) S.love.raon = {aff:0, stage:-1, since:S.m};
  else if(S.love.raon.aff > 6) S.love.raon.aff = 6;   // 이미 안면이 있어도 이 구간에서는 앙숙으로 시작한다
  S.seen['meet_raon'] = true;
};
const _srEnsure = S => { if(!S.love.raon) S.love.raon = {aff:0, stage:-1, since:S.m}; return S.love.raon; };
const _srHost = (S, n) => { lvSet(S, 'raon', 'hostile', n); const v = S.love.raon; if(v && v.aff > 15) v.aff = 15; };
const _srCapMax = (S, c) => { const v = S.love.raon; if(v && v.aff > c) v.aff = c; };

 choices:[
  {label:'오 실장에게 “안무를 바꾸지 않으면 저를 빼 주세요”라고 말한다', sub:'팬소통 · 내 기회를 걸다', run(S){ _srHost(S, 4);
    if(S.st.neg >= 50){ return _srOut(S, {neg:1, work:2, self:2, stress:4}, 1, `“이유 없는 거부는 없어요. 이유를 들을 시간을 주세요. 그게 쇼케이스를 지키는 방법이에요.” 오 실장은 한참 침묵하다 안경을 벗었다. “…일주일 줄게.” 라온은 말없이 나를 바라봤다. 믿는 눈은 아니었지만, 처음으로 피하지 않는 눈이었다.`, 'shy'); }
    return _srOut(S, {work:-2, self:2, stress:8}, -2, `“그럼 이번 평가에서 감점이야. 내일 알려 줄게.” 오 실장은 차갑게 말했다. 라온은 비웃지도, 고마워하지도 않았다. “당신 정말 바보 같네요.” 혼자 숙소로 걷는 동안 처음으로 내가 무엇을 걸었는지 실감했다.`, 'serious'); }},
  {label:'라온에게 직접 말한다. “도망치지 말고 서든가 접든가 정해요”', sub:'예능감 · 정면 승부', run(S){ _srHost(S, 4);
    if(S.st.dare >= 45 || S.st.ins >= 45){ lvSet(S, 'raon', 'confronted', 1); return _srOut(S, {dare:0.8, self:1.5, stress:5}, 0, `“비겁한 척하지 마요. 겁나면 겁난다고 말해요. 그러면 나도 같이 싸워 줄 수 있으니까.” 그가 입술을 깨물었다. “…연습생이랑 상관없는 일이에요.” 그러면서도 실장실을 나가지 않았다. 문 앞에서 한 번 멈췄다. “…내일 알려 줄게요.”`, 'shy'); }
    return _srOut(S, {stress:6, self:1}, -2, `“당신이 뭔데요!” 그가 소리쳤고 컵이 바닥에서 깨졌다. 오 실장이 얼굴을 찌푸렸다. 그가 문을 박차고 나가고, 나는 남은 파편을 주웠다. 입안이 썼다.`, 'serious'); }},
  {label:'따르는 척하며 몰래 왼발 부담을 줄이는 동선을 짠다', sub:'댄스·표현력 · 비밀 작업', run(S){ _srHost(S, 4);
    if(S.st.skill >= 45 || S.st.sense >= 45){ lvSet(S, 'raon', 'braced', 1); return _srOut(S, {skill:1, sense:0.5, work:1, stress:4}, 0, `나는 그날 밤 연습실에 남았다. 미끄러지는 동작을 오른발 회전으로 바꾸고, 엔딩에서 백업 둘이 그의 왼쪽을 받치게 동선을 고쳤다. 겉에서는 원래 안무처럼 보인다. 안무 선생님에게만 몰래 보여 주었다. 라온에게는 알리지 않았다. 알면 또 화낼 테니까.`, 'serious'); }
    return _srOut(S, {skill:0.5, stress:6}, -1, `밤새 동선을 고쳐 봤지만 마음에 들지 않았다. 아무것도 숨기지 못한 채 날이 밝았다. 라온은 시안을 보고도 아무 말도 하지 않았다.`, 'serious'); }},
 ]},

// ════════ 5. 전환 사건: 생방송 무대 ════════
{id:'sp_raon_5', cond:S => afterEv(S, 'sp_raon_4', 2) && _srOk(S),
 speaker:'강라온', title:'생방송, 꺾인 발목', place:'stage', img:'art/bg_stage.webp', cut:'raon', cutVar:'b',
 beats:[
  '노바 컴백 첫 음악방송, 생방송 무대. 안개 기계 소리와 환호가 객석을 채운다. 나는 백업 대기석에서 숨을 참는다.',
  '후렴 직전, 센터 라온이 한 발을 디디다 휘청한다. 왼쪽 발목이 꺾이는 소리가 마이크 너머로 들리는 것 같다. 카메라가 흔들린다.',
  '그는 쓰러지지 않았다. 이를 악물고 끝까지 춤을 췄고 마지막 포즈에서 웃었다. 무대 밖으로 나오자마자 무릎이 꺾였다.',
  '한 시간 뒤. 실시간 검색어에는 ‘노바 센터 사고’. 댓글은 쏟아진다. “연기하는 인성 쓰레기.” “센터 자격 없다.” 스태프들이 수군거린다. 라온은 사라졌다.',
 ],
 text:S => `비상계단 아래, 마스크를 벗은 라온이 얼음주머니를 발목에 대고 앉아 있다. 휴대폰 화면에는 악플이 줄줄이 흐른다. “…웃어요. 다들 그러잖아요. 쇼 하다 넘어졌다고.” 어깨가 가늘게 떨린다. ${lvFlag(S, 'raon', 'braced') ? '내가 몰래 바꿔 둔 동선 덕분에 인대는 무사하다는 걸 의사가 확인해 주었다. ' : ''}나는 어떻게 할까?`,
 choices:[
  {label:'말없이 재킷을 덮어 주고 풀린 붕대를 다시 감아 준다', sub:'댄스 · 곁에 있어 준다', run(S){ const v = _srEnsure(S); lvf(S, 'raon').hostile = 0; const b = v.aff; v.aff = Math.max(v.aff, _srEasy(S) ? 39 : 38); const ch = []; push(ch, '강라온 호감', v.aff - b); fx(S, {skill:0.8, bond:2, self:1}, ch); lvSet(S, 'raon', 'turned', S.m); S.album.push('생방송 뒤 비상계단에서 라온의 발목을 감아 줌');
    return {text:`그는 발을 빼려다 포기했다. 붕대를 감는 동안 아무도 말하지 않았다. 한참 뒤, 나직한 목소리. “…아팠어요. 한 달 전부터 계속. 쉬면 팀이 끝나고, 우리 엄마 병원비도…” 그는 말을 잇지 못했다. 나는 대답 대신 매듭을 단단히 묶었다. 연습생 숙소에서 매일 하던 일이다. “그래요. 이제 혼자 안 아파도 돼요.” 그가 처음으로 마스크 없이 내 눈을 똑바로 봤다. 눈물이 고여 있었다.`, chips:ch, mood:'shy'}; }},
  {label:'휴대폰을 뺏어 엎어 놓고 말한다. “읽지 마요. 이건 소음이에요. 현실은 지금 선배 발목이에요”', sub:'멘탈·보컬 · 전환이 쉬운 선택', run(S){ const v = _srEnsure(S); lvf(S, 'raon').hostile = 0; const easy = S.st.ins >= 45 || S.st.know >= 45; const b = v.aff; v.aff = Math.max(v.aff, easy ? 39 : 38); const ch = []; push(ch, '강라온 호감', v.aff - b); fx(S, {ins:0.8, self:1.5, stress:-1}, ch); lvSet(S, 'raon', 'turned', S.m); S.album.push('악플이 쏟아진 밤, 라온에게 현실을 보라고 말함');
    return {text:`“당신이 처음 나한테 한 말이 이거였죠. 현실을 보라고.” 그는 쓴웃음을 지었다. “그땐 정말 싫었는데.” 나는 그의 발목을 가리켰다. “이게 현실이에요. 숫자도 댓글도 아니고요.” ${easy ? '내가 짚은 이야기는 그가 몇 번이고 속으로 되뇌던 문장이었다. 그가 고개를 푹 숙였다. 어깨가 떨렸다. “…아무도 그렇게 말해 주지 않았어요.”' : '그는 대답 대신 얼음주머니를 꼭 쥐었다. 아무 말 없이 한참 앉아 있다가 작게 말했다. “…병원은 같이 가요.”'}`, chips:ch, mood:'shy'}; }},
  {label:'몰려온 기자와 스태프 앞을 막아서며 “이 사람 지금 아파요. 비켜 주세요”라고 말한다', sub:'비주얼·팬소통 · 감싸기', run(S){ const v = _srEnsure(S); lvf(S, 'raon').hostile = 0; const b = v.aff; v.aff = Math.max(v.aff, _srEasy(S) ? 39 : 38); const ch = []; push(ch, '강라온 호감', v.aff - b); const strong = S.st.neg >= 45 || S.st.charm >= 45; fx(S, {neg:0.5, charm:0.5, self:2, stress:4, work:strong ? 1.5 : -1}, ch); lvSet(S, 'raon', 'turned', S.m); S.album.push('기자들 앞에서 라온을 몸으로 막아섬');
    return {text:`${strong ? '“지금 사진을 찍으면 내일 기사 제목이 바뀝니다. 이 사람의 사고가 아니라 이 사람의 부상으로요.” 기자들이 한 걸음 물러났다.' : '“비켜 주세요, 제발.” 목소리가 떨렸지만 나는 한 걸음도 물러서지 않았다.'} 등 뒤에서 라온이 숨을 삼켰다. 한참 뒤 그가 낮게 말했다. “…당신 정말 바보예요. 그런데…” 말끝을 흐리다 그가 모자를 눌러 썼다. “…고마워요.”`, chips:ch, mood:'shy'}; }},
 ]},

// ════════ 6. 서툰 사과와 어머니 이야기 ════════
{id:'sp_raon_6', cond:S => afterEv(S, 'sp_raon_5', 2) && _srOk(S),
 speaker:'강라온', title:'사과하는 법을 몰라서', place:'room', img:'art/bg_practice.webp', cut:'raon', cutVar:'b',
 beats:[
  '이틀 뒤 이른 아침. 연습실 문이 조심스럽게 열렸다. 목발을 짚은 라온이 모자도 쓰지 않은 채 서 있다. 마스크도 없다.',
  '“저기… 사과하러 왔는데, 사과를 어떻게 하는지 몰라서요.” 반말 대신 어색한 존댓말이 튀어나온다. 귀 끝이 빨갛다.',
  '그의 손에는 보온 가방이 들려 있다. “어, 이건… 엄마가 보냈어요. TV에서 나 감싸 준 연습생이 누구냐고. 김밥이랑 반찬… 아니, 그런 게 아니라…”',
  '그는 스스로도 우스운지 헛웃음을 흘리고, 곧 정색을 한다. 하은이 연습실 구석에서 이쪽을 보고 있다.',
 ],
 text:S => `엄마는 분식집을 접고 그를 뒷바라지했다고 한다. 지금은 병원에 있고, 그는 TV에서 웃는 모습만 보여 주고 싶었다고 했다. 날을 세운 건 아프다는 걸 들킬까 봐서였다고. 그가 서툴게 고개를 숙인다. “…그동안 죄송했어요.” 나는 어떻게 답할까?`,
 choices:[
  {label:'“사과는 됐어요. 대신 병원부터 가요. 내가 같이 가 줄게요.”', sub:'멘탈 · 호감↑', run(S){ const ch = []; addAff(S, 'raon', 5, ch); fx(S, {ins:0.5, bond:2, self:1}, ch); _srCapMax(S, 39); lvSet(S, 'raon', 'mother', 1);
    return {text:`그는 눈을 크게 떴다가 곧 시선을 피했다. “…그래도 돼요?” 병원 복도에서 그의 어머니가 나를 보고 두 손을 잡았다. “우리 아들, 사람 대하는 게 서툴러서… 고마워요.” 라온의 귀가 다시 빨개졌다. 돌아오는 길에 그가 불쑥 말했다. “…엄마가 웃은 거 오랜만이에요.”`, chips:ch, mood:'shy'}; }},
  {label:'“하은이한테도 사과해요. 그게 진짜 사과예요”', sub:'팬소통 · 단단한 어른', run(S){ const ch = []; addAff(S, 'raon', 4, ch); fx(S, {neg:0.8, self:1.5}, ch); _srCapMax(S, 39);
    const brave = S.st.neg >= 40 || S.st.charm >= 40;
    return {text:`그는 입술을 꾹 다물고 하은 앞에 섰다. ${brave ? '“저, 그때 던진 거… 미안해요. 정말.” 하은이 울음을 터뜨렸고, 연습생들이 웃으며 박수를 쳤다. 그는 어쩔 줄 몰라 하며 내 쪽을 보았다. “…이렇게 하는 거 맞죠?” 나는 고개를 끄덕였다.' : '“그… 미안해요.” 짧고 어색했지만 하은은 고개를 끄덕였다. 그는 땀을 닦으며 내게 속삭였다. “심장 터지는 줄 알았어요.”'}`, chips:ch, mood:'shy'}; }},
  {label:'웃으며 보온 가방을 받는다. “어머니께 잘 먹겠다고 전해 주세요”', sub:'비주얼 · 호감↑', run(S){ const ch = []; addAff(S, 'raon', 6, ch); fx(S, {charm:0.5, bond:2, stress:-3}, ch); _srCapMax(S, 39);
    return {text:`그는 한참 나를 보다가 이내 마음이 놓인 듯 웃었다. 처음 보는 진짜 웃음이었다. 김밥은 따뜻했고 단무지는 조금 짰다. “그거 엄마가 새벽부터 쌌거든요. 맛없어도 맛있다고 해야 해요.” 나는 웃음을 참지 못했다. 그의 어머니 이야기가 나오는 순간, 이 사람이 얼마나 외로웠는지 알 것 같았다.`, chips:ch, mood:'shy'}; }},
 ]},

// ════════ 7. 설렘, 그리고 들키면 안 되는 긴장 ════════
{id:'sp_raon_7', cond:S => afterEv(S, 'sp_raon_6', 3) && _srOk(S),
 speaker:'강라온', title:'가로등 그림자', place:'night', img:'art/ct_river.webp', cut:'raon', cutVar:'a',
 beats:[
  '재활 병원에서 돌아오는 밤. 그가 마스크와 모자, 두꺼운 후드를 겹겹이 쓰고 한강공원 벤치에 앉아 있다. “여기, 새벽엔 아무도 없대요.”',
  '이어폰 한쪽을 내 귀에 꽂아 준다. 발매 전의 노래. 사실 이 곡의 도입부는 그가 병상에서 썼다고 한다.',
  '“이상하죠. 처음엔 당신이 제일 싫었는데.” 그가 시선을 피한 채 웃는다. 어깨가 닿을 만큼 가깝다.',
  '그때 맞은편 산책로에서 렌즈의 반사광이 번쩍였다. 라온의 몸이 굳는다. “…카메라예요.”',
 ],
 text:S => `선배 아이돌과 ${_srMe(S)}가 새벽 강가에 함께 있는 사진은 곧 기사가 된다. 그의 팀, 그의 어머니, 그리고 아직 시작도 못 한 내 꿈. 모두가 얽혀 있다. 그가 내 손목을 쥔 채 속삭인다. “어떻게 해요?” 나는 어떻게 할까?`,
 choices:[
  {label:'후드를 깊게 씌워 주고 따로 갈라져 걷는다', sub:'표현력 · 안전하게', run(S){ const ch = []; addAff(S, 'raon', 4, ch); fx(S, {sense:0.5, self:1, stress:3}, ch); _srCapMax(S, 39);
    const ok = S.st.sense >= 40 || S.st.ins >= 40;
    return {text:`${ok ? '나는 가로등 반대편으로 걸으며 그의 모자를 눌러 주고, 일부러 전화를 받는 척 큰소리로 말했다. “네, 실장님, 지금 연습 끝났어요.” 렌즈는 그 말에 방향을 틀었다.' : '급히 갈라져 걸었지만 심장이 터질 것 같았다. 다행히 사진은 찍히지 않았다.'} 멀어지는 길에서 그가 돌아보며 입 모양으로 말했다. 고마워요. 가슴이 뜨거워서 더 걷고 싶었다.`, chips:ch, mood:'shy'}; }},
  {label:'“우리는 선배와 후배예요. 선을 넘으면 둘 다 끝나요”라고 말한다', sub:'마음 · 거리 두기', run(S){ const ch = []; addAff(S, 'raon', 2, ch); fx(S, {self:2.5, stress:2}, ch); _srCapMax(S, 39); lvSet(S, 'raon', 'line', 1);

const _scAbroad = {'hajin:summer':1, 'raon:summer':1, 'ujin:summer':1, 'sian:winter':1};

// 쓸 수 있는 만큼만 쓴다: 부족하면 비용·효과를 줄인다
const _scPay = (S, lo, hi) => { const want = Math.round(rand(lo, hi)); if(S.cash >= want + 15) return {pay:want, k:1, tight:false}; return {pay:Math.min(want, Math.max(8, Math.round(Math.max(S.cash, 0) * 0.6))), k:0.6, tight:true}; };

function mkVac(season, year, withLover){
  const ko = _scSeasonKo[season], other = `sp_vac_${season}_${year}_${withLover ? 'n' : 'w'}`;
  const bg = season === 'summer' ? 'art/bg_room_summer.webp' : 'art/bg_room_winter.webp';
