<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1230"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="다시스무살"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>다시, 스무 살</title>
<meta name="description" content="마흔에서 스무 살로 되감긴 십 년, 육성 시뮬레이션">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>/* ───── 스테이지 제로 메이커(1편)와 같은 화면 구성: 풀블리드 장면 + 알약 HUD + 떠 있는 버튼 + 노란 탭바 + 흰 시트 ───── */
:root{--sb:env(safe-area-inset-bottom,0px);--paper:#E7ECEE;--paper-2:#D8DFE2;--glass:rgba(255,255,255,.7);--glass-solid:#F6F8F9;--line:rgba(21,25,28,.13);--ink:#14181B;--mute:#56636B;--serum:#2B44C0;--serum-soft:#DDE3FA;--gold:#E9C77A;--good:#1f9d55;--bad:#d23b3b;--rose:#e0507a;
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--f-display:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Noto Sans KR",serif;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1d2350;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:active:not(:disabled){transform:translateY(2px)}
button:disabled{cursor:default}
h1,h2,h3{margin:0}
.txt,.sub,.ch span,.ch b{text-wrap:pretty}
.sub{color:var(--mute);font-size:12px}
.mono{font-variant-numeric:tabular-nums}
/* 화면 틀: 폰은 꽉 채우고 넓은 화면은 9:16 폭으로 가운데 */
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:calc(100vh * 9 / 16);overflow:hidden;background:#1b2140;box-shadow:0 0 60px rgba(0,0,0,.5)}
@supports (height:100dvh){#app{max-width:calc(100dvh * 9 / 16)}}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.screen.on{display:block}
/* ───── 버튼 ───── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#F4F6F7;min-height:50px;padding:0 22px;border-radius:999px;width:100%;font-weight:700;font-size:16px;letter-spacing:.02em}
.btn.blue{background:linear-gradient(135deg,#2B44C0,#1c2a7a);border:0;color:#fff;box-shadow:0 8px 24px rgba(43,68,192,.35)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);font-weight:600}
.btn.sm{min-height:42px;font-size:14px}
.btn:disabled{opacity:.38}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--serum);color:var(--serum)}
.tag.ret{border-color:var(--bad);color:var(--bad)}
.who{display:inline-block;font-size:12px;background:var(--serum);color:#fff;border-radius:99px;padding:1px 11px;font-weight:800;margin-bottom:4px}
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase}
/* ───── 타이틀 ───── */
#title{overflow:hidden;text-align:center;background:#1d2350}
.coverart{position:absolute;inset:0;background:url(art/cover.webp) 50% 40%/cover no-repeat}
#title::before{content:"";position:absolute;inset:0 0 auto;height:38%;z-index:1;background:linear-gradient(180deg,rgba(28,36,92,.6),rgba(28,36,92,.18) 60%,transparent)}
#title::after{content:"";position:absolute;inset:auto 0 0;height:30%;z-index:1;background:linear-gradient(0deg,rgba(246,248,252,.96) 0%,rgba(246,248,252,.7) 55%,rgba(246,248,252,0) 100%)}
.ctop{position:absolute;z-index:2;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);padding:0 20px;color:#fff}
.ctop .eyebrow{color:rgba(255,255,255,.85)}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,13.5vw,62px);line-height:1.05;letter-spacing:-.01em;margin:6px 0 0;color:#fff;text-shadow:0 2px 18px rgba(20,24,70,.55),0 0 2px rgba(20,24,70,.4)}
.wordmark .colon{color:#9fb4ff}
.wordmark small{display:block;font-size:.3em;letter-spacing:.5em;font-weight:700;margin-top:.5em;padding-left:.5em;color:rgba(255,255,255,.92)}
.csub{margin:14px auto 0;display:inline-block;line-height:1.4;font-size:12px;letter-spacing:.14em;color:#fff;padding:5px 14px;border:1px solid rgba(255,255,255,.55);border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.cbot{position:absolute;z-index:2;left:0;right:0;bottom:calc(var(--sb) + 18px);padding:0 22px;display:grid;gap:12px;justify-items:center}
.ccard{width:min(100%,340px);padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.94);border:1px solid #fff;box-shadow:0 6px 24px rgba(30,40,100,.18);font-size:13px;line-height:1.6;color:#27304d}
.cbot .btn{width:min(100%,340px);min-height:54px}
.note{font-size:11.5px;color:var(--mute)}
/* ───── 시작 설정(종이 양식) ───── */
#setup{background:var(--paper);background-image:radial-gradient(120% 80% at 15% 0%,#F7F9FA 0%,transparent 55%),radial-gradient(90% 70% at 100% 100%,#DCE2F5 0%,transparent 60%)}
.wiz{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.wizhead{display:flex;align-items:center;gap:12px}
.wizback{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:4px;border-radius:99px;background:var(--paper-2)}
.dots i.on{background:var(--serum)}
.wizq{margin:18px 2px 12px}
.wizq .eyebrow{color:var(--mute);font-size:10.5px}
.wizq h2{font-family:var(--f-display);font-size:23px;letter-spacing:-.4px;margin-top:4px;line-height:1.35}
.wizq p{margin:4px 0 0}
.wizbody{flex:1;overflow-y:auto;margin:0 -16px;padding:2px 16px 12px;-webkit-overflow-scrolling:touch}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards1{display:grid;gap:10px}
.opt{position:relative;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 11px;min-height:88px}
.opt .ic{font-size:26px;line-height:1}
.opt b{display:block;font-size:15px;margin-top:5px;letter-spacing:-.3px}
.opt .ds{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}
.opt .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.opt.sel{border-color:var(--serum);box-shadow:inset 0 0 0 1px var(--serum);background:#fff}
.opt.sel::after{content:'✓';position:absolute;top:8px;right:11px;color:var(--serum);font-weight:900}
.cards1 .opt{display:flex;gap:12px;align-items:center;min-height:0}
.cards1 .opt b{margin-top:0}
.wizfoot{padding:12px 0 calc(14px + var(--sb))}
input[type=text]{width:100%;padding:15px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;font-weight:700;text-align:center;font-family:var(--f-display)}
input[type=text]:focus{outline:2px solid var(--serum)}
/* ───── 메인: 장면 + 떠 있는 UI ───── */
#game{overflow:hidden;background:#1b2140}
.scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#232a5c,#1b2140)}
.scene .pimg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.scene-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(15,20,45,.5) 0%,rgba(15,20,45,0) 16%,rgba(15,20,45,0) 66%,rgba(15,20,45,.45) 100%)}
.hud-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:6px;z-index:4}
.avatar{width:44px;height:44px;flex:none;border-radius:16px;border:3px solid #fff;background:#ffe9b5 50% 9%/330% no-repeat;box-shadow:0 4px 0 #b9780a,0 6px 12px rgba(0,0,0,.25)}
.hud-center{flex:1;min-width:0;background:rgba(18,24,52,.62);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:3px 10px 4px;backdrop-filter:blur(4px)}
.hud-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-line b{font-family:var(--f-display);font-size:15px;font-weight:800;white-space:nowrap}
.hud-line span{font-size:11px;opacity:.9;white-space:nowrap}
.hud-bar{height:6px;margin-top:2px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.hud-bar i{display:block;height:100%;background:linear-gradient(90deg,#7be35a,#c8f56b);border-radius:99px}
.hud-sub{font-size:10px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{position:relative;width:36px;height:36px;flex:none;border-radius:50%;border:3px solid #fff;background:linear-gradient(180deg,#ffe07a,#ffb21f);color:#7a4a00;display:grid;place-items:center;box-shadow:0 4px 0 #b9780a,0 6px 12px rgba(0,0,0,.25)}
.hud-res{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;z-index:4}
.res{display:flex;align-items:center;gap:5px;background:rgba(18,24,52,.62);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 10px 3px 4px;font-size:12px;backdrop-filter:blur(4px)}
.res i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;background:linear-gradient(180deg,#ffe07a,#ffb21f);color:#5a3500}
.res b.warn{color:#ffb4b4}
.side-l,.side-r{position:absolute;top:calc(66px + env(safe-area-inset-top));display:grid;gap:8px;z-index:4}
.side-l{left:8px}.side-r{right:8px}
.fab{--c1:#ff9cc0;--c2:#ff5c8a;--c3:#c93a66;position:relative;width:68px;display:grid;justify-items:center;color:#fff}
.fab.c-orange{--c1:#ffc46b;--c2:#ff9330;--c3:#c4621a}.fab.c-purple{--c1:#c3a2ff;--c2:#8f5cff;--c3:#5f34c2}.fab.c-green{--c1:#9be87a;--c2:#4cc25a;--c3:#2b8a3a}.fab.c-red{--c1:#ffa38a;--c2:#ff6a4d;--c3:#c23c24}.fab.c-teal{--c1:#7ff0dc;--c2:#22c3ac;--c3:#138a79}
.fab .ic{width:54px;height:54px;border-radius:18px;background:linear-gradient(180deg,var(--c1),var(--c2));border:3px solid #fff;color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--c3),0 6px 12px rgba(0,0,0,.25)}
.fab .ic.gauge{background:#fff;border-color:var(--c2)}
.gauge svg{width:46px;height:46px}
.fab .lb{margin-top:-9px;position:relative;font-size:11px;font-weight:800;background:linear-gradient(180deg,var(--c2),var(--c3));border:2px solid #fff;border-radius:99px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.gear svg{width:22px;height:22px}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:99px;background:#e23b3b;color:#fff;border:2px solid #fff;font-weight:900;font-size:11px;display:grid;place-items:center}
.badge:empty{display:none}
.bottom-area{position:absolute;left:0;right:0;bottom:calc(84px + var(--sb));z-index:4;display:grid;justify-items:center;gap:8px;padding-inline:12px}
.slots3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.slot3{border:2px dashed rgba(255,255,255,.75);background:rgba(18,24,52,.5);color:#fff;border-radius:12px;padding:5px 8px;text-align:left;min-height:48px;display:grid;align-content:start;backdrop-filter:blur(3px)}
.slot3 small{font-size:10px;opacity:.8;letter-spacing:.1em}
.slot3 b{font-size:12px;line-height:1.25}
.slot3.filled{border-style:solid;border-color:#E9C77A;background:rgba(255,255,255,.92);color:var(--ink)}
.slot3.active{box-shadow:0 0 0 2px var(--serum)}
.slot3.cont{opacity:.7;border-style:solid;border-color:#E9C77A}
.cta{width:min(80%,320px);padding:13px 10px;font-size:20px;font-weight:900;letter-spacing:.02em;border-radius:20px;border:3px solid #fff;background:linear-gradient(180deg,#ffd45c,#ff9f1c);color:#fff;text-shadow:0 2px 0 rgba(150,70,0,.55);box-shadow:0 5px 0 #c26a00,0 10px 20px rgba(0,0,0,.3)}
.cta.ready{background:linear-gradient(180deg,#8ff06a,#3fbf45);text-shadow:0 2px 0 rgba(20,100,30,.6);box-shadow:0 5px 0 #23852f,0 10px 20px rgba(0,0,0,.3)}
.cta:disabled{opacity:.6}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;height:calc(78px + var(--sb));padding-bottom:var(--sb);background:linear-gradient(180deg,#fbf1dc,#ecd7ac);border-top:3px solid #d9b46a;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end}
.tb{display:grid;justify-items:center;gap:2px;padding:0 0 9px;font-size:11.5px;font-weight:800;color:#6b4e2a}
.tb .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff;border:2px solid #d9b46a;color:var(--serum)}
.tb.home .ic{width:64px;height:64px;margin-top:-30px;border-radius:22px;background:linear-gradient(180deg,#6c86f2,var(--serum));color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #1c2e8a}
.tb:active .ic{transform:translateY(2px)}
/* 조언 말풍선(대화 카드) */
.dialog{position:absolute;left:10px;right:10px;bottom:calc(252px + var(--sb));z-index:5;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;background:rgba(246,248,249,.96);border:2px solid var(--gold);border-radius:16px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-height:30%;overflow:auto}
.dialog[hidden]{display:none}
.dialog .face{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;object-position:50% 10%;background:#ffe9b5}
.dialog .head{font-size:11px;font-weight:800;color:var(--serum)}
.dialog .body{font-size:13px;line-height:1.5}
.dialog .nx{grid-column:2;justify-self:end;font-size:12px;font-weight:800;color:var(--serum)}
/* ───── 시트(흰 바닥 시트, 금빛 윗선) ───── */
.ov{position:absolute;inset:0;background:rgba(10,14,30,.45);display:none;align-items:flex-end;z-index:20}
.ov.on{display:flex}
.sheet{width:100%;max-height:82%;overflow:auto;background:var(--glass-solid);border-radius:22px 22px 0 0;border-top:3px solid #E9C77A;padding:12px 14px calc(18px + var(--sb));animation:up .25s ease both;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sh-head b{font-family:var(--f-display);font-size:18px;font-weight:800}
.sh-x{background:var(--paper-2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.sheet h3{margin:12px 0 6px;font-size:11px;letter-spacing:.18em;color:var(--mute);font-weight:600}
.txt{white-space:pre-wrap;margin:6px 0 12px}
.menu-list{display:grid;gap:10px;padding-top:6px}
.tabs{display:flex;gap:4px;margin-bottom:8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:-12px;background:var(--glass-solid);z-index:2;padding-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:1 0 auto;padding:7px 12px;font-weight:700;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--serum)}
.planbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:3px;align-content:start;min-height:104px}
.act .top{display:flex;align-items:center;gap:6px}
.act .top .ic{font-size:20px}
.act .top b{font-size:14px;letter-spacing:-.3px;line-height:1.25}
.act .em{font-size:11.5px;font-weight:800;color:var(--serum)}
.act .d{font-size:11.5px;color:var(--mute);line-height:1.4}
.act .why{font-size:11.5px;color:var(--bad);line-height:1.4}
.act .tg,.opt .tg{display:flex;flex-wrap:wrap;gap:3px}
.tg i{font-style:normal;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--paper)}
.tg i.up{color:var(--good)}.tg i.down{color:var(--bad)}.tg i.pay{color:#a8730a}
.act:disabled{opacity:.5}
.act.on{border-color:var(--serum);box-shadow:inset 0 0 0 1px var(--serum)}
.foot{margin-top:10px;font-size:12px;color:var(--mute);text-align:center}
.meter{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;margin:5px 0;font-size:13px}
.meter .bar{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter.work .bar i{background:var(--serum)}.meter.bond .bar i{background:var(--rose)}.meter.self .bar i{background:var(--good)}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.kv b{color:var(--serum)}
.lcard{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;text-align:left;width:100%}
.lcard .av{width:54px;height:54px;border-radius:12px;object-fit:cover;object-position:50% 10%;background:var(--paper-2)}
.lcard .av.sil{filter:brightness(0) opacity(.25)}
.lcard b{display:block;font-size:14px}
.lcard small{display:block;color:var(--mute);font-size:11.5px;line-height:1.4}
.lcard .hb{height:5px;border-radius:99px;background:var(--paper-2);margin-top:4px;overflow:hidden}.lcard .hb i{display:block;height:100%;background:var(--rose)}
.lcard .cb,.contact .cb{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#ffe07a,#ffb21f);display:grid;place-items:center;font-size:16px;box-shadow:0 2px 0 #b9780a}
.lcard:disabled .cb,.contact:disabled .cb{background:var(--paper-2);box-shadow:none;opacity:.6}
.contacts{display:grid;gap:8px;margin:8px 0 4px}
.contact{display:grid;grid-template-columns:50px 1fr 36px;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;width:100%}
.contact .av{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:var(--paper-2);border:2px solid var(--gold)}
.contact .ci b{display:block;font-size:15px}.contact .ci small{color:var(--mute);font-size:12px}
.contact:disabled{opacity:.5}
.dexrow{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;font-size:13px}
.dexrow .g{font-size:22px;text-align:center}.dexrow small{display:block;color:var(--mute);font-size:11.5px}.dexrow.lock{opacity:.45}
.toast{position:absolute;left:50%;bottom:calc(190px + var(--sb));transform:translateX(-50%);background:rgba(18,24,52,.94);border:2px solid var(--gold);color:#fff;padding:8px 16px;border-radius:99px;font-size:12.5px;z-index:40;white-space:nowrap;animation:fade .2s}
/* ───── 활동 카드·이벤트(풀스크린 일러스트 + 흰 대화 카드) ───── */
.actcard,.evcard{position:absolute;inset:0;z-index:15;display:none;background:#1b2140 center top/cover no-repeat}
.evcard{z-index:18}
.actcard.on,.evcard.on{display:block;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ashade,.evshade{position:absolute;inset:0;background:linear-gradient(rgba(15,20,45,.45),rgba(15,20,45,0) 20%,rgba(15,20,45,0) 50%,rgba(15,20,45,.35) 100%)}
.atop{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top))}
.atop .who{background:rgba(18,24,52,.7);border:2px solid rgba(255,255,255,.4)}
.abot,.evpanel{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--sb));background:rgba(246,248,249,.97);border:2px solid var(--gold);border-radius:18px;padding:12px 14px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.evpanel{max-height:62%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.abot h2,.evpanel h2{font-family:var(--f-display);font-size:19px;letter-spacing:-.4px;margin-bottom:2px}
.evpanel .txt,.abot .txt{font-size:15px;line-height:1.65;margin:6px 0 12px;white-space:pre-wrap}
.abot .btn,.evpanel .btn{background:linear-gradient(180deg,#6c86f2,var(--serum));border:2px solid #fff;box-shadow:0 3px 0 #1c2e8a;min-height:46px;font-size:15px}
.ch{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-top:8px}
.ch b{display:block;font-size:15px;letter-spacing:-.3px}
.ch span{display:block;font-size:12px;color:var(--serum);margin-top:1px}
.ch:active{border-color:var(--serum)}
.evicon{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:92px;filter:drop-shadow(0 4px 18px rgba(0,0,0,.5))}
.evcard.p-night{background-color:#0b0a20}.evcard.p-campus{background-color:#274c84}.evcard.p-cafe{background-color:#2f1b0d}.evcard.p-room{background-color:#1f1a3a}.evcard.p-rain{background-color:#0f1325}.evcard.p-shop{background-color:#2a1b07}
.face{width:60px;height:80px;border-radius:12px;object-fit:cover;object-position:50% 20%;float:left;margin:0 12px 6px 0;border:2px solid var(--gold)}
/* ───── 엔딩 ───── */
#end{overflow:hidden}
.endbg{position:absolute;inset:0;background:#1b2140 center top/cover no-repeat}
.endscroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.endspacer{height:44%}
.endcard{background:linear-gradient(rgba(246,248,249,0),rgba(246,248,249,.97) 44px);padding:52px 16px calc(24px + var(--sb));min-height:56%;text-align:center}
.endcard .big{font-size:52px}.endcard h1{font-family:var(--f-display);font-size:27px;margin:6px 0 10px;letter-spacing:-.6px}
.endcard .pillars{text-align:left;margin:12px 0}
.letter{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;white-space:pre-wrap;margin:14px 0;font-size:14px;line-height:1.75}
@media (max-height:720px){.dialog{padding:7px 10px;grid-template-columns:36px minmax(0,1fr)}.dialog .face{width:36px;height:36px}.dialog .body{font-size:12px;line-height:1.4}.side-l,.side-r{gap:6px}.fab .ic{width:46px;height:46px}.gauge svg{width:40px;height:40px}}

/* 스케줄 실행: 계절 배경 위에서 2.5등신 캐릭터가 두 장 그림으로 움직인다 */
.sprite{position:absolute;left:50%;bottom:36%;height:40%;transform:translateX(-50%);aspect-ratio:3/5;animation:bob .9s ease-in-out infinite alternate}
.sprite.wide{height:36%;aspect-ratio:7/8}
.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.sprite .fb{animation:flip2 .9s steps(1) infinite}
@keyframes flip2{0%{opacity:0}50%{opacity:1}}
@keyframes bob{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-6px)}}
.shint{position:absolute;left:0;right:0;bottom:calc(8% + var(--sb));text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 8px rgba(0,0,0,.7)}


/* ───── 디자인 정리(v2): 읽기 쉬운 글꼴 · 절제된 색 · 버튼마다 다른 포인트 색 ───── */
:root{--f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--f-display:var(--f-body);--ink:#161a2b;--mute:#5d6478;--indigo:#4458e8;--violet:#8b5cf6;--rose:#f0507c;--coral:#ff7b54;--amber:#f5a524;--mint:#14b8a6;--sky:#2f9bff;--green:#22b45a}
html,body{font-family:var(--f-body);font-feature-settings:"tnum";letter-spacing:-.01em}
h1,h2,h3,.wordmark,.hud-line b,.sh-head b,.wizq h2,input[type=text]{font-family:var(--f-body)}
.wordmark{font-weight:800;letter-spacing:-.03em}
.sh-head b{font-weight:800;font-size:19px;letter-spacing:-.02em}
.txt,.evpanel .txt,.abot .txt{font-weight:500}
/* 상태창(HUD) */
.hud-center{background:rgba(16,20,44,.66);border:1px solid rgba(255,255,255,.22);border-radius:18px;backdrop-filter:blur(10px)}
.hud-line b{font-size:16px;font-weight:800;letter-spacing:-.02em}.hud-line span{font-size:12px;font-weight:600}
.hud-sub{font-size:11px;font-weight:500}
.hud-bar{background:rgba(255,255,255,.2)}.hud-bar i{background:linear-gradient(90deg,#7ee0a8,#37d0c2)}
.avatar{border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.3);background-color:#fff}
.gear{border:0;background:rgba(255,255,255,.92);color:var(--indigo);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gear:nth-of-type(2){color:var(--coral)}
.badge{background:var(--rose);border:2px solid #fff}
.res{background:rgba(16,20,44,.68);border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:12.5px;backdrop-filter:blur(10px)}
.res i{background:var(--amber);color:#fff;font-weight:800}
.res:nth-child(2) i{background:var(--violet)}.res:nth-child(3) i{background:var(--coral)}.res:nth-child(4) i{background:var(--sky)}
/* 옆 버튼: 하얀 카드 + 버튼마다 다른 색 */
.fab{width:62px;--c:var(--indigo);--t:#e8ecff;background:rgba(255,255,255,.94);border-radius:20px;padding:6px 0 5px;box-shadow:0 6px 18px rgba(8,12,40,.28);gap:3px;color:var(--ink)}
.fab .ic,.fab .ic.gauge{width:40px;height:40px;border-radius:14px;background:var(--t);border:0;color:var(--c);box-shadow:none}
.fab .ic.gauge{background:transparent;width:46px;height:46px}
.fab .lb{margin:0;position:static;background:none;border:0;box-shadow:none;padding:0;color:var(--ink);font-size:11.5px;font-weight:800;letter-spacing:-.02em}
.fab:active{transform:scale(.96)}
[data-sheet=stat]{--c:#4458e8;--t:#e8ecff}[data-sheet=career]{--c:#e08a00;--t:#fff2d6}[data-sheet=love]{--c:#f0507c;--t:#ffe6ee}[data-sheet=dex]{--c:#8b5cf6;--t:#efe8ff}[data-sheet=shop]{--c:#0e9f8e;--t:#ddf6f2}#btn-advice{--c:#2f9bff;--t:#e1f1ff}
.side-r .fab:nth-child(1){--c:#22b45a}.side-r .fab:nth-child(2){--c:#ff6a4d}
/* 계획 칸·큰 버튼 */
.slot3{border:1.5px dashed rgba(255,255,255,.7);background:rgba(16,20,44,.55);color:#fff;border-radius:14px;backdrop-filter:blur(8px)}
.slot3 small{font-size:11px;font-weight:700;opacity:.85;letter-spacing:0}.slot3 b{font-size:13px;font-weight:700}
.slot3.filled{border:1.5px solid #fff;background:rgba(255,255,255,.96);color:var(--ink)}
.slot3.filled small{color:var(--indigo);opacity:1}
.slot3.active{box-shadow:0 0 0 2px var(--indigo)}
.cta{border:0;border-radius:18px;background:rgba(255,255,255,.95);color:var(--indigo);text-shadow:none;box-shadow:0 8px 22px rgba(8,12,40,.3);font-size:18px;font-weight:800;letter-spacing:-.02em;padding:15px 10px}
.cta.ready{background:linear-gradient(135deg,#ff7b54,#f0507c);color:#fff;text-shadow:none;box-shadow:0 8px 22px rgba(240,80,124,.45)}
/* 아래 탭바: 흰 바탕 + 탭마다 다른 색 */
.tabbar{background:rgba(255,255,255,.96);border-top:1px solid rgba(20,26,60,.1);backdrop-filter:blur(12px);box-shadow:0 -6px 20px rgba(8,12,40,.12)}
.tb{color:var(--ink);font-size:11.5px;font-weight:800;letter-spacing:-.02em}
.tb .ic{border:0;border-radius:14px;background:var(--t,#e8ecff);color:var(--c,#4458e8);width:38px;height:38px}
.tb:nth-child(1){--c:#3b82f6;--t:#e4eeff}.tb:nth-child(2){--c:#475569;--t:#e9edf3}.tb:nth-child(3){--c:#e08a00;--t:#fff2d6}.tb:nth-child(5){--c:#8b5cf6;--t:#efe8ff}.tb:nth-child(6){--c:#0e9f8e;--t:#ddf6f2}.tb:nth-child(7){--c:#f0507c;--t:#ffe6ee}
.tb.home .ic{width:62px;height:62px;margin-top:-28px;border-radius:22px;background:linear-gradient(135deg,#5b6ff5,#8b5cf6);color:#fff;border:3px solid #fff;box-shadow:0 8px 18px rgba(68,88,232,.45)}
/* 시트·카드·태그 */
.sheet{border-top:0;box-shadow:0 -10px 30px rgba(8,12,40,.25)}
.tab{font-size:14px;font-weight:700}.tab.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.act{border:1px solid rgba(20,26,60,.1);box-shadow:0 2px 8px rgba(20,26,60,.06)}
.act .top b{font-size:14.5px;font-weight:800}.act .em{color:var(--indigo);font-weight:800}.act .d{font-size:12px;color:var(--mute);font-weight:500}
.tg i{font-size:11px;font-weight:700;padding:2px 8px;background:#eef0f6}.tg i.up{color:#0f9d58;background:#e3f6ec}.tg i.down{color:#d6403f;background:#fde8e8}.tg i.pay{color:#b97700;background:#fff2d6}
.chip{font-weight:700}.chip.up{color:#0f9d58;background:#e8f7ef;border-color:#cdeedb}.chip.down{color:#d6403f;background:#fdeded;border-color:#f8d4d4}
.btn{font-weight:700}.btn.blue,.abot .btn,.evpanel .btn{background:linear-gradient(135deg,#4f63f0,#7a5af5);border:0;box-shadow:0 6px 16px rgba(68,88,232,.35);color:#fff}
.lcard .cb,.contact .cb{background:linear-gradient(135deg,#ff9a7a,#f0507c);box-shadow:none;color:#fff}
.meter.work .bar i{background:var(--indigo)}.meter.bond .bar i{background:var(--rose)}.meter.self .bar i{background:var(--mint)}
.abot,.evpanel{border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(8,12,40,.4)}
.who{background:var(--indigo)}
.dialog{border:1px solid rgba(20,26,60,.1);box-shadow:0 10px 26px rgba(8,12,40,.3)}
.ch{border:1px solid rgba(20,26,60,.12);font-weight:600}.ch b{font-weight:800}.ch span{color:var(--indigo);font-weight:600}
.toast{background:rgba(16,20,44,.92);border:1px solid rgba(255,255,255,.2)}
.fab{width:56px;border-radius:18px;padding:5px 0 4px}.fab .ic{width:36px;height:36px;border-radius:12px}.fab .ic.gauge{width:42px;height:42px}.gauge svg{width:40px;height:40px}.fab .lb{font-size:11px}
.side-l,.side-r{gap:7px}
.meter .bar i{background:linear-gradient(90deg,#6b7cff,#8b5cf6)}.meter.work .bar i{background:var(--indigo)}.meter.bond .bar i{background:var(--rose)}.meter.self .bar i{background:var(--mint)}
/* 두 장 그림이 겹쳐 보이지 않게: 한 장이 보일 때 다른 한 장은 완전히 숨긴다 */
.sprite .fa{animation:showA .9s steps(1) infinite}
.sprite .fb{animation:showB .9s steps(1) infinite;opacity:0}
@keyframes showA{0%{opacity:1}50%{opacity:0}}
@keyframes showB{0%{opacity:0}50%{opacity:1}}

.slotlist{display:grid;gap:8px;margin-top:6px}
.slotrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid rgba(20,26,60,.1);border-radius:14px;padding:10px 12px}
.slotrow.empty{opacity:.75;border-style:dashed}
.slotrow .si{min-width:0}.slotrow .si b{display:block;font-size:14px}.slotrow .si small{display:block;font-size:12px;color:var(--mute);line-height:1.4}.slotrow .si small.when{font-size:11px;opacity:.8}
.slotrow .sb{display:flex;gap:6px;flex:none}
.mini{border:0;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:800;background:#eef0f6;color:var(--ink)}
.mini.save{background:var(--indigo);color:#fff}.mini.load{background:#e3f6ec;color:#0f9d58}.mini.del{background:#fdeded}

/* 사파리(브라우저): 화면은 맨 아래까지 채우고, 버튼·탭은 접힌 하단 바 위로 올린다 */


#upbar{position:absolute;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:60;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#161a2b;color:#fff;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#upbar button{background:linear-gradient(135deg,#ff7b54,#f0507c);color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px}

#buildtag{position:absolute;left:8px;bottom:calc(2px + env(safe-area-inset-bottom,0px));z-index:70;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}

/* 이벤트·활동 카드는 화면 맨 아래에 붙여서, 아이폰 하단 영역(페이지 배경색)과 끊김 없이 이어지게 한다 */
.abot,.evpanel{left:0;right:0;bottom:0;border-radius:22px 22px 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:calc(16px + var(--sb))}
.tabbar{background:#fff}

/* 위·아래 여백 없이: 그림은 화면 맨 위(상태바 뒤)부터 맨 아래(탭바 뒤)까지, 탭바는 반투명 유리로 */
.scene{background:#1b2140}
.tabbar{background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

/* 장 시작 카드 */
.evcard.chapter{background-color:#12162e;background-image:radial-gradient(circle at 50% 30%,#2b3a8c,#12162e 70%)}
.chapcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff;padding:0 28px}
.chapcard small{letter-spacing:.3em;opacity:.8;font-weight:700}.chapcard b{font-size:20px;letter-spacing:.2em;color:#ffd98a}.chapcard h1{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.2}.chapcard p{opacity:.8;margin:6px 0 22px;font-weight:600}
.chapcard .btn{width:180px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);box-shadow:none;color:#fff}

/* 상태창을 작게: 얼굴(가운데 위쪽)을 가리지 않도록 왼쪽 작은 알약만 둔다 */
.hud-center{flex:0 1 auto;width:auto;max-width:150px;padding:3px 10px 4px}
.hud-line{display:block}.hud-line b{display:block;font-size:14px;white-space:nowrap}.hud-line span{display:block;font-size:11px;white-space:nowrap;opacity:.9}
.hud-bar,.hud-sub{display:none}
.hud-top{justify-content:flex-start}.hud-top .gear:nth-of-type(1){margin-left:auto}

/* 사파리 하단 바 자리(--sb)는 페이지가 그릴 수 없는 영역이라, 바로 위 경계까지 바와 같은 색으로 꽉 채워 이음새를 없앤다 */
#title::after{height:calc(30% + var(--sb));background:linear-gradient(0deg,#f6f8fc 0,#f6f8fc var(--sb),rgba(246,248,252,.92) calc(var(--sb) + 10%),rgba(246,248,252,.55) calc(var(--sb) + 20%),rgba(246,248,252,0) 100%)}
.tabbar{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.abot,.evpanel{background:#f6f8f9}
.endcard{background:linear-gradient(rgba(246,248,249,0),#f6f8f9 44px)}

/* ───── 스케줄 진행: 홈 화면 위에 가운데 팝업(스테이지 제로 메이커 방식) ───── */
.actcard{background:rgba(10,14,40,.38)}
.actcard .apop{position:absolute;left:5.5%;right:5.5%;top:50%;transform:translateY(-50%);background:linear-gradient(180deg,#fffdf6,#fff6e4);border:4px solid #c9a24a;border-radius:26px;padding:14px;box-shadow:0 14px 40px rgba(8,12,40,.5),inset 0 0 0 2px #fff;animation:popin .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes popin{from{opacity:0;transform:translateY(-46%) scale(.92)}to{opacity:1;transform:translateY(-50%) scale(1)}}
.apop .aph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 10px}
.apop .aph h2{font-family:var(--f-display);font-size:19px;letter-spacing:-.4px;color:#5c3e0e;margin:0}
.apop .ptag{background:#c9a24a;color:#fff;font-weight:800;font-size:13px;padding:5px 14px;border-radius:99px;white-space:nowrap}
.apop .apf{position:relative;width:100%;aspect-ratio:1/1;max-height:46vh;border:3px solid #c9a24a;border-radius:20px;overflow:hidden;background-color:#fde3c4;background-image:radial-gradient(circle,#fff 2.5px,transparent 3px),radial-gradient(circle at 50% 38%,#fff8ec,#fde3c4 78%);background-size:19% 19%,100% 100%}
.apop .apf.art{background:#1b2140}
.apop .fart{position:absolute;inset:0;background-size:cover;background-position:center}
.apop .fsp{position:absolute;left:8%;right:8%;top:6%;bottom:12%;animation:bob2 .9s ease-in-out infinite alternate}
@keyframes bob2{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.apop .fsp::after{content:"";position:absolute;left:12%;right:12%;bottom:-6%;height:12%;border-radius:50%;background:rgba(80,60,40,.18)}
.apop .fsp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;z-index:1}
.apop .fsp .fa{animation:showA .9s steps(1) infinite}.apop .fsp .fb{animation:showB .9s steps(1) infinite;opacity:0}
.apop .apbar{height:14px;margin:14px 2px 8px;border:2.5px solid #c9a24a;border-radius:99px;background:#fff;overflow:hidden}
.apop .apbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4a3b8,#f6b64a);transition:width 2.6s linear}
.apop .apfoot{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px;color:#5c3e0e}
.apop .apfoot b{font-size:15px}.apop .apfoot span{font-size:13px;font-weight:700}
.apop .txt{font-size:14.5px;line-height:1.6;color:#4a3a22;margin:12px 4px 6px}
.apop .chips{margin:6px 2px 0}
.apop .btn{margin-top:12px;width:100%}

/* ───── 타이틀 재배치: 얼굴은 비우고, 제목은 오른쪽 아래(가게 쪽 빈 공간)에 ───── */
#title::before{height:0;background:none}
.ctop{top:auto;bottom:calc(var(--sb) + 262px);left:auto;right:0;width:62%;padding:0 22px 0 0;text-align:right}
.ctop .eyebrow{font-size:10px;letter-spacing:.22em;text-shadow:0 1px 6px rgba(20,24,70,.8)}

const idolIncome = S => { if(!isIdol(S)) return 0; if(sinceDebut(S) < 18) return 0; return Math.round(20 + Math.min(fansOf(S), 150) * 0.55 + IDOL(S).wins * 2); };

function idolEvent(S){
  const I = IDOL(S);
  if(isTrainee(S)){
    if(I.warn >= 4 && !S.seen['cut_' + S.m]) return cutEvent(S);
    if(S.m === DEBUT_PICK_M && !S.seen.debut_pick) return debutPickEvent(S);
    if(S.m === DEBUT_M && I.debutTeam && !S.seen.debut_team) return debutEvent(S, GROUP_NAME, 'team');
    if(I.survival){ const ep = SURVIVAL_M.indexOf(S.m); if(ep >= 0 && !S.seen['survival_' + ep]) return survivalEvent(S, ep); if(S.m > SURVIVAL_M[2] && isTrainee(S)) I.stage = 'out'; }
    if(S.m >= 1 && !I.survival && !S.seen['eval_' + S.m]) return evalEvent(S);
    return null;
  }
  if(isIdol(S)){
    if(monthOf(S) === 12 && !S.seen['awards_' + yearOf(S)]) return awardsEvent(S);
    if(I.contract != null && S.m === Math.min(I.contract, 108) && !S.seen.contract) return contractEvent(S);
    const sd = sinceDebut(S); if(sd > 0 && sd % 6 === 0 && !S.seen['comeback_' + (I.comebacks + 1)]) return comebackEvent(S);
  }
  return null;
}

    ['첫 번째 팬레터', '방송국으로 시청자 편지가 도착했다. “이 장면 덕분에 오늘을 버텼어요.” 시안이 편지를 내 앞에 놓는다. “이건 당신 얼굴로 된 장면이에요.”', ['“우리 장면이에요”', '그는 편지를 접어 서랍에 넣었다. “우리가 찍은 걸 기억하려고요.”'], ['“고마운 마음만 받을게요”', '그는 웃으며 편지를 다시 봉투에 넣었다. 편지는 한동안 리딩 룸 책상 위에 있었다.'], 'cafe'],
    ['슬럼프 동반', '시안이 슬럼프에 빠졌다. 몇 주째 콘티 한 장도 못 그린다. “내가 찍는 이야기가 다 거짓 같아요.”', ['“찍지 않아도 돼요, 같이 걸어요”', '둘은 아무 목적 없이 한참 걸었다. 그가 걷다가 문득 말했다. “…한 장면 생각났어요.”'], ['“제 무대 영상부터 봐 줄래요?”', '그는 내 무대를 보며 천천히 웃었다. 펜을 다시 들었다.'], 'night'],
    ['시상식 후보', '드라마가 연말 시상식 후보에 올랐다. 시안은 정장을 입고 거울 앞에서 한참 서성인다. “수상 소감, 같이 써 줄래요?”', ['“진심으로 쓰면 돼요”', '그는 무대에서 배우들 이름을 부르다 내 이름을 마지막에 불렀다. 객석의 나는 눈물을 참았다.'], ['“당신 이야기를 해요”', '그는 무대에서 조용히 웃으며 말했다. “옆에 앉은 배우 덕분이에요.”'], 'stage'],
    ['결말을 쓰는 밤', '“우리 이야기는 어떤 결말일까요?” 시안이 빈 대본을 앞에 두고 묻는다. 마흔의 나는 해피엔딩을 믿지 않았다.', ['“함께 찍는 사람이 있다면 해피엔딩이죠”', '그는 첫 줄에 이렇게 썼다. “그리고 둘은 다음 장면으로 넘어갔다.”'], ['“결말은 천천히 정해요”', '그는 연필을 내려놓고 웃었다. “좋아요, 우린 아직 중간이니까.”'], 'room'],
  ],
  seunghyun: [
    ['숨겨야 하는 연애', '같은 소속사라 대표에게서 열애 금지령이 내려왔다. 승현은 마스크 너머로 속삭인다. “들켜도 괜찮은데, 당신이 상처받을까 봐 무서워요.”', ['“들키지 않게 몰래 만나요”', '심야 편의점 앞에서 그는 모자와 마스크를 쓰고 나타났다. 우리는 컵라면을 나눠 먹었다.'], ['“떳떳하게 가요”', '그는 눈을 크게 뜨더니 마스크 위로 웃었다. “…용기 내 볼게요.”'], 'night'],
    ['오디션 전날', '큰 영화 오디션을 앞두고 승현이 잠을 못 이룬다. “만약 떨어지면 어떡하죠?”', ['“연습한 만큼 보여 주면 돼요”', '그는 거울 앞에서 한 번 더 연습했다. “…당신 응원이 최고예요.”'], ['“떨어져도 곁에 있을게요”', '그는 한참 말없이 내 손을 잡았다. 떨림이 천천히 멎었다.'], 'room'],
    ['팬미팅 무대', '승현의 팬미팅 무대 뒤. 그가 거울 속 자신을 바라본다. “카메라 밖의 나를 아는 사람은 당신뿐이에요.”', ['“무대 위의 선배도 좋아해요”', '그는 환하게 웃으며 무대로 올라갔다. 관계자석에서 본 그의 미소는 오늘 가장 눈부셨다.'], ['“끝나고 같이 숙소 앞까지 걸어요”', '무대가 끝나고 그는 가장 먼저 내게 문자를 보냈다. “지금 나가요.”'], 'night'],
    ['열애설 기사', '기사가 터졌다. “같은 소속사 선후배 열애설.” 승현의 폰이 쉴 새 없이 울린다. 그는 폰을 뒤집어 놓고 말한다. “이제 숨기지 않아도 되죠?”', ['“같이 입장을 정리해요”', '둘은 짧은 공식 입장을 함께 썼다. 악플만큼 응원도 쏟아졌다.'], ['“잠시 거리를 둘까요”', '그는 힘없이 웃었다. “…알겠어요. 대신 연락은 끊지 않을게요.”'], 'cafe'],
    ['첫 주연', '승현이 드라마 첫 주연을 맡았다. 첫 촬영 날, 그가 내게 대본을 보여 준다. “여기, 당신이 말해 준 대사를 넣었어요. OST도 당신이 불러 줬으면 해요.”', ['“선배가 해낸 거예요”', '촬영장에서 그가 그 대사를 말하는 순간 모두가 숨을 죽였다. 나는 모니터 뒤에서 그를 보며 웃었다.'], ['“앞으로가 더 중요해요”', '그는 고개를 끄덕였다. “그래서 계속 당신 옆에서 배울래요.”'], 'city'],
  ],
  geonwoo: [
    ['늦은 상담 데이트', '자정의 법무법인. 건우가 도시락 두 개를 책상에 올린다. “재계약 서류 검토 중이지만 식사는 하고 하시죠.” 딱딱한 말투와 다정한 행동이 어울리지 않는다.', ['“같이 먹어요, 잠깐만요”', '그는 계약서 사이에서 처음으로 젓가락을 들고 웃었다. “이런 상담은 환영입니다.”'], ['“저는 조항부터 끝까지 읽을게요”', '그는 도시락을 내 앞에 두고 갔다. 식은 도시락도 맛있었다.'], 'night'],
    ['협상 테이블', '내 정산 문제로 소속사와 협상하는 날. 건우와 호흡이 척척 맞는다. 휴식 시간, 그가 작게 속삭인다. “오늘 컨디션 좋은데요.”', ['“이길 수 있어요”', '협상이 끝나자 오 실장의 표정이 달라졌다. 그는 복도에서 주먹을 쥐어 보였다.'], ['“끝까지 침착하게 가요”', '그는 고개를 끄덕이며 서류를 정리했다. 평정심이 서로에게 전해졌다.'], 'cafe'],
    ['원칙과 감정', '건우가 방출된 연습생의 사정을 듣고 흔들린다. “원칙만 따지면 이길 수 있지만, 이 아이가 너무 안쓰러워서…”', ['“원칙 안에서 도울 방법을 찾아요”', '둘은 밤새 계약서를 뒤져 방법을 찾아냈다. 그는 “우리가 같은 편이라 다행입니다” 했다.'], ['“감정은 접어 두자”고 말한다', '그는 잠깐 침묵하다가 고개를 끄덕였다. 하지만 마음 한구석이 쓰렸다.'], 'room'],
    ['내 이름이 걸린 판결', '오래 끌던 내 계약 분쟁 결과가 나오는 날. 건우와 함께 판결문을 확인했다. 그가 말없이 내 어깨를 안는다. “고생했어요, 정말.”', ['“우리 정말 해냈네요”', '그는 눈시울이 붉어져 웃었다. “오늘만큼은 법전 말고 케이크입니다.”'], ['“아직 시작일 뿐이에요”', '그는 웃으며 고개를 끄덕였다. “그래도 오늘은 같이 기뻐하시죠.”'], 'cafe'],
    ['청혼의 예고', '건우가 말없이 반지 상자 같은 것을 만지작거린다. “아직 아닙니다, 서류 정리 중입니다.” 우스꽝스러운 변명이 귀엽다.', ['“기다릴게요, 천천히 와요”', '그는 귀까지 빨개져서 상자를 주머니에 넣었다. “곧 정식으로 제출하겠습니다.”'], ['“저도 준비할 게 있어요”', '그는 진지하게 고개를 끄덕였다. “서로 준비되었을 때 제출하죠.”'], 'night'],
  ],
  yuchan: [
    ['앱 공지 사고', '유찬이 하트 이모지를 보낸다. 그런데 그만 내 개인 메시지가 아니라 「별빛」 운영자 공지 창으로 보내 버렸다. 팬들이 조용해졌다.', ['웃으며 “운영자님이 저 응원해 주시네요”라고 넘긴다', '팬들이 박수 이모지를 쏟아 냈다. 유찬은 얼굴이 빨개져 한동안 모니터만 봤다.'], ['조용히 지워 달라고 부탁한다', '유찬은 다급히 공지를 지우고 내게 개인 메시지를 보냈다. “미안해요, 진짜…”'], 'cafe'],
    ['베타 테스트 데이트', '유찬이 새 기능 베타 테스트를 부탁한다. 메모가 이상하게 다정하다. “이 버튼 이름, 당신이 지어 줘요.”', ['“테스트 말고 영화 보러 갈래요?”', '그는 한참 화면을 보다가 “승인”을 눌렀다. 그날 우린 심야 영화를 봤다.'], ['“칭찬 말고 개선점도 알려 줘요”', '그는 진지하게 열 개의 개선점을 적어 보냈다. 마지막 줄엔 하트가 하나 달려 있었다.'], 'night'],
    ['컴백 날의 서버', '내 컴백 날. 팬들이 몰려 「별빛」 서버가 위태롭다. 유찬이 계속 대시보드만 본다. 손이 차갑다.', ['“저도 같이 지켜볼게요”', '자정이 지나 모든 지표가 안정됐다. 그는 의자에 쓰러지듯 앉아 웃었다.'], ['“커피 보내 놓을게요”', '음악방송을 마치고 연락하니 그는 졸린 목소리로 “와 줘서 고마워요” 하고 웃었다.'], 'night'],
    ['번아웃 경고', '유찬이 점점 말수가 줄고 눈 밑이 어두워졌다. “괜찮아요, 조금만 더 하면 돼요.” 괜찮지 않은 얼굴이다.', ['“오늘은 강제 퇴근이에요”', '그는 못 이기는 척 따라나섰다. 한강 바람을 쐬며 그는 처음으로 힘들다고 말했다.'], ['“필요하면 말해 줘요”', '그는 고개를 끄덕였다. 하지만 며칠 뒤 정말 쓰러지듯 잠들었다.'], 'city'],
    ['감사 목록', '유찬이 말없이 노트북을 돌려 보여 준다. 새로 만든 악플 차단 기능의 감사 목록에 내 이름이 있다. “몰래 올렸어요. 괜찮죠?”', ['“감동이에요”', '그는 쑥스러워 웃으며 마우스를 만지작거렸다. “당신은 이미 내 앱을 지키고 있어요.”'], ['“말도 안 하고요?”', '그는 어쩔 줄 몰라 하다가 말했다. “서프라이즈였는데…”'], 'room'],
  ],
  ujin: [
    ['의상실의 두 사람', '우진의 의상실에 내 의자가 생겼다. 옷감 향기 사이에서 나란히 앉아 다음 무대를 그리는 시간. 가끔 눈이 마주치면 둘 다 말없이 웃는다.', ['“여기가 제일 좋아요”', '그는 바늘을 내려놓고 내 쪽으로 의자를 돌렸다. “그 말, 오래 간직할게요.”'], ['“무대 준비에 집중해요”', '그는 고개를 끄덕이며 다시 천을 잡았다. 조용한 시간이 꽤 오래 이어졌다.'], 'room'],
    ['컴백 의상 충돌', '컴백 콘셉트로 우진과 부딪혔다. “이건 제 색이에요.” “하지만 이 춤엔 이게 안 맞아요.” 서로의 고집이 정면으로 만났다.', ['내 의견을 설득한다', '그는 한참 침묵하다가 말했다. “…한 벌만 당신 방식으로 가요.” 그 한 벌이 컴백의 대표 의상이 되었다.'], ['그의 색을 존중한다', '결과는 독특했지만 호불호가 갈렸다. 그는 “다음엔 같이 타협해요” 하고 웃었다.'], 'night'],
    ['시상식 백스테이지', '연말 시상식 백스테이지. 멤버들 사이에서 우진이 숨을 몰아쉰다. “당신이 마지막 점검해 줘요. 입는 사람 눈이 제일 정확해요.”', ['끝까지 꼼꼼히 확인한다', '무대는 완벽했다. 박수 소리 속에서 그는 무대 옆에서 입 모양으로 말했다. “고마워.”'], ['“믿어요, 당신 작품이에요”', '그는 눈을 감고 숨을 크게 쉬었다. 나를 무대로 내보내는 손이 단단했다.'], 'stage'],
    ['선물한 옷', '우진이 포장된 상자를 내민다. “무대 말고, 당신을 위해 만들었어요. 입어 줄래요?” 열어 보니 연한 라벤더빛 원피스. 그날 샘플로 고른 색이다.', ['“입어 볼게요, 지금 바로”', '그는 한참 나를 바라보다가 말했다. “…제가 만든 것 중 가장 잘 만든 옷이에요.”'], ['“아껴서 중요한 날 입을게요”', '그는 웃으며 고개를 끄덕였다. “그 중요한 날, 제가 곁에 있을게요.”'], 'room'],
    ['파리 연수 제안', '우진에게 파리 연수 제안이 왔다. “일 년 동안. 가고 싶어요. 근데 당신 무대 옷을 다른 사람이 짓는 건 싫어요.”', ['“가요, 나도 내 무대를 지킬게요”', '그는 눈물을 글썽이며 웃었다. “우리 둘 다 각자의 무대에서 만나요.”'], ['“같이 방법을 찾아봐요”', '그는 지도를 펴 놓고 한참 이야기했다. 거리는 멀지만 마음은 가까워졌다.'], 'night'],
  ],
  raon: [

{id:'ls_minjun_3', lover:'minjun', cond:S => isMet(S, 'minjun') && afterEv(S, 'ls_minjun_2', 2) && affOf(S, 'minjun') >= 30 && S.m < 80,

 ],

  {label:'바로 반박하고 근거를 댄다', sub:'예능감이 높을수록 그가 흥미를 보인다', run(S){ lvSet(S, 'hajin', 'k1', 'argue');

    return _lsa(S, 'hajin', 1, {dare:0.5, stress:4}, '반박을 시작했지만 근거가 얇았다. 하진은 팔짱을 낀 채 끝까지 듣고 말했다. “용기는 보였어요. 순위는 다음에.” 냉정하지만 문을 닫지는 않았다.', 'serious'); }},
  {label:'메모하고 다음 평가 결과로 답한다', sub:'댄스가 높을수록 그가 인정한다', run(S){ lvSet(S, 'hajin', 'k1', 'revise');
    if(S.st.skill >= 45) return _lsa(S, 'hajin', 7, {skill:1.5, work:1}, '한 달 뒤 나는 월말평가 영상 링크 하나를 보냈다. 하진은 끝까지 보더니 한 줄을 적어 보냈다. 「이제 확률이 보이네요.」 작은 칭찬이 훈장처럼 느껴졌다.', 'happy');
    return _lsa(S, 'hajin', 3, {skill:0.5}, '밤새 연습한 영상을 보냈지만 군데군데 흔들렸다. “노력은 보이네요. 근데 아직 연습생 영상 같아요.” 부정은 아닌데 마음이 조금 쓰렸다. 그래도 다시 보여 줄 이유가 생겼다.'); }},
  {label:'상처받은 표정을 숨기지 못한다', sub:'호감↑ · 스트레스 +3', run(S){ lvSet(S, 'hajin', 'k1', 'hurt'); return _lsa(S, 'hajin', 3, {stress:3}, '입술을 깨물고 냅킨을 접으려는데 하진이 펜을 내려놓았다. “…말이 센가요. 미안해요. 저는 좋은 재능이 아까워서 이러는 거예요.” 변명처럼 들리지 않는 목소리였다. 직설적인 사람의 서툰 사과가 오래 남았다.', 'shy'); }},
 ]},

{id:'ls_hajin_2', lover:'hajin', cond:S => isMet(S, 'hajin') && afterEv(S, 'ls_hajin_1', 2) && S.m < 80,
 speaker:'윤하진', title:'먹통이 된 첫 오디션', place:'stage', img:'art/bg_practice.webp', cut:'hajin', cutVar:'a',
 beats:[
  '하진의 회사가 처음 여는 공개 오디션. 투자자 두 명이 맨 앞줄에 앉아 있다. 그가 마이크를 잡고 소개를 시작한다.',
  '스피커가 멈춘다. 음향 장비 고장. 투자자의 눈빛이 식어 가고, 하진의 이마에서 땀이 흐른다.',
  '그가 구경 온 나를 힐끗 본다. 직설적인 그가 처음으로 SOS를 보낸다. “…미안, 도와줄 수 있어요?”',
 ],
 text:S => `투자자는 시계를 보고 있다. 오디션이 망하면 이 투자도, 하진의 석 달도 날아간다. ${S.name}, 어떻게 이 자리를 살릴까?`,
 choices:[
  {label:'반주 없이 한 소절을 불러 분위기를 잡는다', sub:'예능감이 높을수록 판을 뒤집는다', run(S){ lvSet(S, 'hajin', 'k2', 'speak');
    if(S.st.dare >= 50) return _lsa(S, 'hajin', 8, {dare:1.5, charm:1}, '“잠깐 기다리시는 동안 한 곡 할게요.” 나는 무반주로 첫 소절을 불렀다. 지원자들이 따라 박수를 쳤고, 투자자가 웃음을 터뜨렸다. 하진이 뒤에서 작게 속삭였다. “…당신, 대체 정체가 뭐예요.”', 'happy');
    return _lsa(S, 'hajin', 3, {dare:0.5, stress:5}, '노래는 시작했지만 첫 소절에서 음이 흔들렸다. 하진이 이어받아 겨우 마무리했고, “다음에 연락드릴게요”라는 대답을 받았다. 실패는 아니었지만 성공도 아니었다. 계단에서 그가 말했다. “그래도 나서 준 건 고마워요.”', 'sad'); }},
  {label:'음향 장비를 같이 붙잡고 순서를 다시 짠다', sub:'댄스가 높을수록 손발이 맞는다', run(S){ lvSet(S, 'hajin', 'k2', 'paper');
    if(S.st.skill >= 50) return _lsa(S, 'hajin', 8, {skill:1.5, work:1}, '연습생 때 익힌 대로 무반주 댄스 심사부터 당기자고 했다. 카운트는 내가 손뼉으로 셌다. 투자자가 고개를 끄덕이기 시작했고, 그사이 스피커가 살아났다. 시연은 상담이 되었고 두 번째 약속이 잡혔다.', 'surprised');
    return _lsa(S, 'hajin', 3, {skill:0.5}, '순서를 바꿔 봤지만 지원자들이 헷갈려 했다. 하진은 한숨을 눌러 참으며 “괜찮아요, 다음에 보완할게요”라고 했다. 미안한 마음이 오래 갔다.'); }},
  {label:'조용히 서 있으며 하진을 기다려 준다', sub:'호감 소폭↑ · 스트레스 -1', run(S){ lvSet(S, 'hajin', 'k2', 'wait'); return _lsa(S, 'hajin', 4, {stress:-1}, '하진은 다섯 번째 재부팅 끝에 스피커를 되살렸다. 오디션은 짧았고 흠집이 남았지만 투자자는 “고생하셨어요” 하며 명함을 받았다. 건물을 나서자 그가 길게 숨을 내쉬었다. “내가 혼자 하는 줄 알았는데, 옆에 누가 있었네요.”'); }},
 ]},

{id:'ls_hajin_3', lover:'hajin', cond:S => isMet(S, 'hajin') && afterEv(S, 'ls_hajin_2', 2) && affOf(S, 'hajin') >= 30 && S.m < 92,
 speaker:'윤하진', title:'남은 석 달', place:'night', img:'art/bg_office.webp', cut:'hajin', cutVar:'b',
 beats:[
  '밤 열 시, 그의 사무실 불이 켜져 있다. 하진이 모니터 앞에서 엑셀 파일 하나를 보고 얼어붙어 있다.',
  '내가 들어서자 그가 황급히 창을 닫는다. 하지만 이미 보았다. 통장 잔고와 석 달 뒤 날짜에 붉은 줄이 그어진 표.',
  '“연습생들은 몰라요. 알면 다 불안해할 테니까.” 직설적인 사람이 처음으로 목소리를 낮춘다. “비밀로 해 줄 수 있어요?”',
 ],
 text:S => `마흔의 나는 이 회사의 이름이 크게 성공한다고 기억한다. 하지만 지금 눈앞의 그는 석 달 뒤를 장담하지 못하는 청년이다. ${S.name}, 어떻게 할까?`,
 choices:[
  {label:'비밀을 지키며 비용 줄일 곳을 같이 찾는다', sub:'댄스가 높을수록 해법이 나온다', run(S){ lvSet(S, 'hajin', 'k3', 'secret'); lvSet(S, 'hajin', 'runway', 'kept');
    if(S.st.skill >= 45) return _lsa(S, 'hajin', 7, {skill:1.5, work:1, stress:3}, '새벽 두 시까지 지출 항목을 하나씩 지우고 합쳤다. 비싼 연습실 대신 쓸 수 있는 곳을 내가 알고 있었다. 하진이 의자를 뒤로 젖히고 웃었다. “이걸 석 달이 아니라 여섯 달로 만들었네요. …고마워요, 진짜.”', 'happy');
    return _lsa(S, 'hajin', 3, {stress:4}, '새벽까지 같이 표를 붙잡았지만 속 시원한 답은 없었다. 그래도 하진은 노트북을 덮으며 말했다. “혼자 보던 숫자를 둘이서 보니 덜 무섭네요.” 비밀을 나눈 무게가 둘 사이에 단단히 얹혔다.'); }},
  {label:'연습생들에게도 알리자고 설득한다', sub:'예능감이 높을수록 그가 결국 받아들인다', run(S){ lvSet(S, 'hajin', 'k3', 'tell'); lvSet(S, 'hajin', 'runway', 'told');
    if(S.st.dare >= 45) return _lsa(S, 'hajin', 8, {dare:1.5, bond:1}, '“숨기면 아는 사람은 불안하고, 모르는 사람은 억울해요. 저도 연습생이라 알아요.” 하진이 화를 낼 줄 알았는데, 한참 후에 고개를 끄덕였다. “…다음 주 전체 회의에서 말할게요.” 말하던 날 연습생들은 놀랐지만 아무도 떠나지 않았다.', 'serious');
    return _lsa(S, 'hajin', -3, {stress:6}, '“그걸 지금 말하라고요?” 하진이 날카롭게 받아쳤다. 설득하려 했지만 목소리에 힘이 없었다. 그는 한동안 말을 하지 않다가 “생각해 볼게요”라고만 답했다. 서로의 의도는 같았는데 온도가 달랐다.', 'sad'); }},
  {label:'아는 미래를 힌트로 흘린다', sub:'호감↑ · 선명도 -6', run(S){ lvSet(S, 'hajin', 'k3', 'hint'); lvSet(S, 'hajin', 'runway', 'hinted'); S.borrowed++; return _lsa(S, 'hajin', 4, {clarity:-6}, '“지금 준비하는 콘셉트 말고, 반년 뒤에 모두가 찾게 될 쪽으로 방향을 틀어 봐요.” 하진의 눈이 번뜩였다. 그는 노트에 쓰다 말고 물었다. “이걸 어떻게 알아요?” 나는 웃으며 얼버무렸다. 기억의 한 조각이 닳아 없어진 느낌이 남았다.', 'surprised'); }},
 ]},

{id:'ls_hajin_4', lover:'hajin', cond:S => isMet(S, 'hajin') && afterEv(S, 'ls_hajin_3', 2) && affOf(S, 'hajin') >= 30 && S.m < 100,
 speaker:'윤하진', title:'구경이 아니라 같이 틀리는 일', place:'night', img:'art/bg_office.webp', cut:'hajin', cutVar:'b',
 beats:[
  '첫 그룹 쇼케이스 전날 새벽. 핵심 멤버 한 명이 다른 회사로 간다는 문자를 남기고 떠났고, 투자자는 불리한 조항이 가득한 계약서를 보냈다.',
  '하진이 계약서를 쥔 채 서성인다. “이거라도 받아야 해요. 안 받으면 다음은 없어요.”',
  `내가 조항 하나를 짚으려 하자 그가 소리를 높인다. “넌 항상 답을 아는 사람처럼 말하지. 내가 틀리는 걸 구경하는 거예요?”`,
 ],
 text:S => `사무실이 조용해진다. 하진도 말을 뱉고는 숨을 삼킨다. 극한의 피로가 만든 말이라는 걸 알지만, 상처는 상처다. ${S.name}, 어떻게 할까?`,
 choices:[
  {label:'“구경이 아니라 같이 틀리려고 여기 있는 거예요”', sub:'예능감이 높을수록 그의 날을 무디게 한다', run(S){ lvSet(S, 'hajin', 'k4', 'together');
    if(S.st.dare >= 50) return _lsa(S, 'hajin', 8, {dare:1.5, bond:2}, '나는 눈을 피하지 않고 말했다. 하진이 계약서를 책상에 내려놓고 얼굴을 손바닥으로 문질렀다. “…미안. 내가 제일 무서운 건 틀리는 게 아니라 혼자 틀리는 거였어요.” 그의 목소리가 처음으로 갈라졌다.', 'tender');
    return _lsa(S, 'hajin', 1, {stress:5}, '말은 했지만 목소리가 떨려서 힘이 실리지 않았다. 하진은 “알아요. 알지만 지금은 못 들어요”라고 말하고 창가로 돌아섰다. 마음은 닿았지만 때가 맞지 않았다.', 'sad'); }},
  {label:'연습생 계약서를 써 본 사람으로서 조항을 하나하나 짚는다', sub:'댄스가 높을수록 협상판이 바뀐다', run(S){ lvSet(S, 'hajin', 'k4', 'termsheet');
    if(S.st.skill >= 50){ lvSet(S, 'hajin', 'term_sheet'); return _lsa(S, 'hajin', 9, {skill:2, work:1.5, neg:0.5}, '나는 불리한 조항 네 개에 형광펜을 긋고 각각 고칠 안과 양보할 선을 표로 정리했다. 내 계약서를 몇 번이나 읽어 본 덕분이었다. 새벽 다섯 시, 협상은 우리 쪽으로 반 뼘 기울었다.', 'happy'); }
    return _lsa(S, 'hajin', 3, {skill:1, stress:5}, '표를 만들었지만 법률 용어에서 몇 번 막혔다. 하진은 “그래도 어디가 문제인지 알겠어요. 이 정도면 충분해요”라고 했다. 완벽하진 않았어도 그는 계약서를 덜 무서워했다.'); }},
  {label:'“말이 심해요”라고 하고 자리를 뜬다', sub:'호감↓ · 마음 +2', run(S){ lvSet(S, 'hajin', 'k4', 'walked'); return _lsa(S, 'hajin', -7, {self:2, stress:5}, '문을 닫고 나오는 복도에서 다리가 후들거렸다. 그의 말이 아팠지만 내가 선을 지킨 것도 사실이다. 한참 뒤 문자가 하나 왔다. 「…방금 건 내가 틀렸어요.」 아직 답장은 하지 못했다.', 'serious'); }},
 ]},

{id:'ls_hajin_5', lover:'hajin', cond:S => isMet(S, 'hajin') && afterEv(S, 'ls_hajin_4', 3) && (affOf(S, 'hajin') >= 55 || isCouple(S, 'hajin')) && S.m < 112,
 speaker:'윤하진', title:'사무실에서 맞은 새벽', place:'night', img:'art/bg_office.webp', cut:'hajin', cutVar:'b',
 beats:[
  '쇼케이스가 끝난 다음 날 새벽. 불 꺼진 사무실 바닥에 하진이 노트북을 안은 채 잠들어 있다.',
  '나는 죽이 든 봉지를 책상에 놓는다. 그가 눈을 뜨고 한참 천장을 보다가 말한다. “꿈에서도 스피커가 죽더라고요.”',
  '숨을 고르듯 그가 낮게 덧붙인다. “아버지가 사업하다 망했어요. 나는 그걸 보고 자랐고, 똑같이 될까 봐 매일 도망치듯 일했어요.”',
 ],
 text:S => `${lvFlag(S, 'hajin', 'term_sheet') ? '조항을 정리해 주던 그 새벽을 기억하는 눈이다. ' : ''}${isCouple(S, 'hajin') ? '그의 손이 내 손목을 조용히 붙잡는다.' : '그가 처음으로 시선을 피하지 않고 나를 본다.'} 직설적인 사람이 약한 소리를 꺼내는 순간이다. ${S.name}, 어떤 말을 건넬까?`,
 choices:[
  {label:'“오늘은 일하지 말고 쉬어요”라고 단호하게 말한다', sub:'예능감이 높을수록 그가 따라 준다', run(S){ lvSet(S, 'hajin', 'k5', 'rest');
    if(S.st.dare >= 50) return _lsa(S, 'hajin', 8, {dare:1, charm:1, stress:-4}, `“회사는 하루쯤 안 망해요. 대표님은 오늘만 대표 말고 사람 해요.” 그가 웃음을 터뜨리다 조용해졌다. “…지시받는 거 오랜만이네.” ${isCouple(S, 'hajin') ? '그는 내 어깨에 이마를 기댄 채 한참 쉬었다.' : '그는 내 어깨 옆에 이마를 가까이 기댄 채 한참 쉬었다.'}`, 'tender');

};

 speaker:'은태오', title:'사라진 필름 가방', place:'night', img:'art/ct_night.webp', cut:'taeoh', cutVar:'b',
 beats:[
  `전시 개막 사흘 전. 밤 열한 시, 태오에게서 숨찬 전화가 온다. “…기차 선반에 두고 내렸어요. 필름 원판이 전부 들어 있는데.”`,
  `역 광장의 가로등 아래, 늘 느리던 사람이 처음으로 뛰고 있다. 손이 떨려 카메라 끈을 쥐지 못한다.`,
 ],
 text:S => `원판을 잃으면 전시는 무너진다. 막차는 이미 지나갔고 사흘밖에 없다. 태오는 아무 말도 못 하고 서 있다. 이번엔 내가 빨라져야 한다.`,
 choices:[
  {label:'역 분실물센터와 종착역에 전화를 돌리며 직접 찾아 나선다', sub:'도전·실무 감각으로 추격', run(S){
    const ok = (S.st.dare + S.st.skill) / 2 + rand(-8, 12) >= 40;
    if(ok) return _lsbR(S, 'taeoh', 9, {dare:1, skill:1, stress:4}, `세 번째 통화에서 종착역 청소 직원이 낡은 가방을 보관 중이라고 했다. 새벽 첫차로 가서 가방을 받아 오는 길, 태오는 원판 하나하나를 만지며 눈이 붉어졌다. “…이걸 찾아 준 사람은 처음이에요.”`, 'tender', 't4_found');
    return _lsbR(S, 'taeoh', 4, {dare:1, stress:6}, `가방은 이미 다른 열차로 떠난 뒤였다. 밤새 뛰었지만 헛걸음이었다. 그래도 태오는 내 손에 쥐어진 식은 캔커피를 한참 바라보았다. “…같이 뛰어 준 건 남았어요.”`, 'shy', 't4_lost'); }},
  {label:'“원판이 없어도 지금 다시 찍자. 사흘 있잖아요”라고 말한다', sub:'감각이 높으면 새 사진이 태어난다', run(S){
    if(S.st.sense >= 50) return _lsbR(S, 'taeoh', 10, {sense:1.5, stress:4}, `사흘 밤, 우리는 도시의 새벽을 쫓아다녔다. 나는 빛이 변하는 시각을 알려 주었고, 태오는 처음으로 내 말에 따라 방향을 틀었다. 개막 하루 전, 새로 찍은 서른 장이 벽에 붙었다. “처음 걸어 보는 전시예요… 이게 더 좋아요.”`, 'tender', 't4_retake');
    return _lsbR(S, 'taeoh', 5, {sense:1, stress:6}, `서툴지만 사흘을 같이 걸었다. 건진 사진은 몇 장뿐이었고, 전시는 반쯤 비어 있었다. 그래도 태오는 빈 벽 앞에 서서 말했다. “빈 벽도 전시예요. 같이 채우면 되니까.”`, null, 't4_retake'); }},
  {label:'“전시를 미루자”고 조심스럽게 말한다', sub:'호감↓ · 현실적 선택', run(S){
    return _lsbR(S, 'taeoh', -4, {stress:2}, `태오는 조용히 고개를 끄덕였지만 한참 대답이 없었다. “…맞는 말이에요. 그런데 오늘만큼은 틀린 말이어도 같이 뛰어 주길 바랐어요.” 맞는 말이 늘 정답은 아니다.`, 'serious', 't4_delay'); }},
 ]},

{id:'ls_taeoh_5', lover:'taeoh', cond:S => isMet(S, 'taeoh') && afterEv(S, 'ls_taeoh_4', 3) && _lsbPre(S, 'taeoh', 55) && S.m < 116,
 speaker:'은태오', title:'정면의 사진', place:'room', img:'art/ct_museum.webp', cut:'taeoh', cutVar:'a',
 beats:[
  `전시가 끝난 밤, 텅 빈 전시장. 벽에는 뒷모습과 옆모습뿐이다. 정면으로 찍힌 얼굴은 하나도 없다.`,
  `태오가 삼각대를 세우고 카메라 앞에 선 나를 바라본다. 그의 손이 렌즈 앞에서 멈춰 있다.`,
  `“…3년 동안 한 번도 못 했어요. 사람의 얼굴을 정면으로 보는 거요.”`,
 ],
 text:S => `${isCouple(S, 'taeoh') ? '연인이 된 뒤에도 태오는 내 정면 얼굴만은 담지 못했다.' : '가까워졌지만 그는 아직 내 정면 얼굴만은 담지 못했다.'} 카메라 앞의 침묵이 길다. 그가 말한다. “오늘이 아니면 못 할 것 같아요.”`,
 choices:[
  {label:'렌즈를 똑바로 보며 서서 기다린다', sub:'감각·통찰이 높을수록 좋은 사진', run(S){
    const ok = (S.st.sense + S.st.ins) / 2 >= 50;
    if(ok) return _lsbR(S, 'taeoh', 10, {sense:1, ins:1, self:3, stress:-5}, `숨을 한 번 쉬고, 그가 숨을 쉬는 리듬에 맞췄다. 셔터가 울렸다. 정적 끝에 태오가 카메라를 내리며 울음 같은 웃음을 터뜨렸다. “…찍었어요. 얼굴이 보여요. 아무 일도 없었다는 듯이.” ${isCouple(S, 'taeoh') ? '그는 이마를 내 이마에 살짝 대고 오래 떨어지지 않았다.' : '그는 한 발 다가와 내 손끝을 조심스럽게 잡았다.'}`, 'tender', 't5_front');
    return _lsbR(S, 'taeoh', 6, {self:2, stress:-3}, `몇 번이나 셔터 앞에서 손이 멈췄다. 결국 한 장을 찍었고, 초점은 흔들렸다. 그래도 태오는 그 사진을 보며 웃었다. “…흔들려도 얼굴이에요. 오늘은 그걸로 충분해요.”`, 'shy', 't5_front'); }},
  {label:'“그럼 제가 찍어 볼게요”라며 카메라를 건네받는다', sub:'역할을 바꾸는 선택', run(S){
    return _lsbR(S, 'taeoh', 8, {dare:1, self:2}, `서툰 손으로 렌즈를 들여다보니 태오가 창가에 서 있다. “숨을 한 번 쉬고, 누르면 돼요.” 처음 알려 준 말을 그대로 돌려받으며 셔터를 눌렀다. 화면 속의 그는 사진가가 아니라 한 사람이었다. 그가 천천히 말했다. “…이렇게 보이는 거였구나.”`, 'tender', 't5_swap'); }},
  {label:'“찍지 않아도 괜찮아요. 오늘은 그냥 같이 있어요”라고 말한다', sub:'조용한 배려 · 호감 안정', run(S){
    return _lsbR(S, 'taeoh', 5, {stress:-4}, `태오는 카메라를 내려놓고 나란히 바닥에 앉았다. 벽의 뒷모습들 사이에서 우리는 한참 말이 없었다. “…언젠가는 찍을게요. 그때 옆에 있어 줄래요?” 약속이 아니라 부탁이었다.`, 'shy', 't5_wait'); }},
 ]},

{id:'ls_taeoh_6', lover:'taeoh', cond:S => isMet(S, 'taeoh') && afterEv(S, 'ls_taeoh_5', 3) && _lsbPre(S, 'taeoh', 55) && S.m <= 119,
 speaker:'은태오', title:'매년, 같은 자리에서', place:'city', img:'art/ct_river.webp', cut:'taeoh', cutVar:'a',
 beats:[
  `처음 만났던 강변. 해 질 무렵, 이번에는 태오가 먼저 도착해 나를 기다리고 있다.`,
  `손에는 필름 한 롤. 케이스 위에 그의 느린 글씨가 있다. “매년, 한 컷.”`,
  `“빛은 매번 달라요. 같은 자리인데 같은 사진은 한 번도 없었어요.”`,
 ],
 text:S => `${isCouple(S, 'taeoh') ? '연인이 된 우리는' : '아직 이름 붙이지 못한 사이이지만, 우리는'} 같은 강변에 서 있다. 태오가 필름 롤을 내민다. “이걸 다 쓰려면 서른 해쯤 걸려요. 같이 쓸래요?”`,
 choices:[
  {label:'“매년 이 날, 이 자리에서 한 컷씩 찍자”라고 약속한다', sub:'서사 완결 · 호감↑', run(S){
    lvSet(S, 'taeoh', 'arc_done'); S.album.push(`강변에서 태오와 필름 한 롤을 나눠 가졌다. 매년 같은 날, 같은 자리에서 한 컷씩. 빛은 매번 달라도 우리는 그 자리에 있기로 했다.`);
    const t = lvFlag(S, 'taeoh', 't5_front') ? ' 첫 컷은 그가 정면으로 찍은 내 얼굴이었다.' : '';
    return _lsbR(S, 'taeoh', 10, {self:3, bond:2, stress:-6}, `셔터가 울리고 해가 강물 속으로 천천히 내려앉았다.${t} 태오가 낮게 말했다. “서두르지 않아도 늦지 않아요. 우린 아직 스물 몇 장이 남았으니까.”`, 'tender'); }},
  {label:'“내가 한 컷은 찍어 줄게요. 번갈아 찍어요”라고 제안한다', sub:'감각이 높으면 감동 · 서사 완결', run(S){
    lvSet(S, 'taeoh', 'arc_done'); S.album.push(`태오와 번갈아 한 컷씩 찍기로 했다. 그의 사진엔 내가, 내 사진엔 그가 있다. 서로의 시간이 같은 필름에 감긴다.`);
    if(S.st.sense >= 50) return _lsbR(S, 'taeoh', 12, {sense:1, self:3, bond:2}, `내가 눌렀다. 빛이 가장 좋은 십 초를 놓치지 않았다. 현상된 사진 속 태오는 웃고 있었다. “…제가 처음 본 제 웃음이에요. 감각이 좋은 사람이네요.” 그가 내 손을 오래 잡았다.`, 'tender');
    return _lsbR(S, 'taeoh', 8, {sense:1, self:3, bond:2}, `내 사진은 조금 기울었고 빛은 반쯤 놓쳤다. 태오는 그 기울어진 사진을 지갑에 넣었다. “이게 제일 마음에 들어요. 기울어진 만큼 사람이 보여서요.”`, 'shy'); }},
  {label:'“지금 한 컷 찍고, 나머지는 천천히 생각할게요”라고 웃는다', sub:'서사 완결 · 여유로운 약속', run(S){
    lvSet(S, 'taeoh', 'arc_done'); S.album.push(`태오와 강변에서 한 컷을 찍었다. 약속은 아직 천천히 정하기로 했다. 서두르지 않아도 늦지 않으니까.`);
    return _lsbR(S, 'taeoh', 7, {self:2, stress:-4}, `태오가 웃으며 셔터를 눌렀다. “좋아요. 급할 게 없는 사람들끼리 만났으니까요.” ${isCouple(S, 'taeoh') ? '그가 내 손등에 짧게 입술을 댔다.' : '그의 어깨가 내 어깨에 조용히 닿았다.'}`, 'shy'); }},
 ]},

// ════════════════ 한지후 (뷰티 브랜드 매니저 · 내가 광고 모델) — 팬소통·보컬을 좋아한다 ════════════════
{id:'ls_jihu_1', lover:'jihu', cond:S => isMet(S, 'jihu') && isIdol(S),
 speaker:'한지후', title:'이 얼굴, 좋습니다', place:'cafe', img:'art/ct_beauty.webp', cut:'jihu', cutVar:'a',
 beats:[
  `광고 캠페인 첫 회의. 브랜드 임원 세 명이 내 프로필을 두고 질문을 퍼붓는다. “신인인데 판매로 이어질까요?” “팬층이 몇 살대죠?”`,
  `지후는 팔짱을 끼고 한마디도 하지 않는다. 시계 초침 소리가 크다. 옆자리 오 실장도 말을 고르는 중이다.`,
  `마지막 질문에서 말문이 막힌 순간, 그의 펜이 책상을 두 번 가볍게 두드렸다.`,
 ],
 text:S => `숨을 고르면 답할 수 있다. 이 답이 지후가 내 프로필에 쓴 한 줄을 증명하는 순간이 될 것이다. ${S.name}, 어떻게 답할까?`,
 choices:[
  {label:'팬카페와 앱에서 본 팬들의 이야기로 답한다', sub:'팬소통이 높으면 확실한 인상', run(S){
    if(S.st.neg >= 50) return _lsbR(S, 'jihu', 7, {neg:1, work:2}, `“제 팬은 스무 살 전후 대학생이 제일 많아요. 팬사인회에서 제일 많이 받은 질문이 피부 관리예요.” 팬들의 말을 차례로 옮겼다. 임원들이 서로 시선을 주고받더니 고개를 끄덕였다. 회의가 끝난 복도에서 지후가 지나치며 낮게 말했다. “…근거가 정확했습니다.” 그의 귓불이 아주 조금 붉어져 있었다.`, 'surprised', 'j1_data');
    return _lsbR(S, 'jihu', 3, {neg:0.5, work:1, stress:3}, `준비는 부족했지만 진심으로 버텼다. 지후가 나중에 말했다. “근거가 한 줄 부족했습니다. 다음엔 채워서 오세요.” 지적이었는데 이상하게 기뻤다. 그는 내 말을 끝까지 들었다는 뜻이니까.`, null, 'j1_data'); }},
  {label:'“그 부분은 확인해서 오늘 안에 말씀드릴게요”라고 한다', sub:'멘탈이 높으면 깔끔한 수습', run(S){
    if(S.st.ins >= 50) return _lsbR(S, 'jihu', 7, {ins:1, work:1.5}, `모른다고 인정하되 기한을 못 박았다. 임원 한 명이 고개를 끄덕이며 “좋습니다” 했다. 회의 후 지후가 말했다. “모르는 걸 모른다고 말하는 건 협상에서 가장 강한 카드입니다.” 그가 처음으로 웃었다.`, 'surprised', 'j1_honest');
    return _lsbR(S, 'jihu', 3, {work:0.5, stress:2}, `임원의 눈빛이 싸늘해졌지만 약속은 지켰다. 저녁에 메일을 보냈더니 짧은 답이 왔다. “확인했습니다. 수고했어요.” 사무적인 문장인데 몇 번이나 다시 읽었다.`, null, 'j1_honest'); }},
  {label:'지후 쪽을 바라보며 눈빛으로 도움을 청한다', sub:'위험 · 호감 소폭↓', run(S){
    return _lsbR(S, 'jihu', -2, {stress:4, charm:0.5}, `그는 가만히 시선을 피했다. 회의 후 복도에서 지후가 낮게 말했다. “의지할 곳을 찾는 눈빛은 상대에게 약점으로 읽힙니다.” 차가운 말이었지만 그는 내 대기실 책상에 커피를 두고 갔다.`, 'serious', 'j1_look'); }},
 ]},

{id:'ls_jihu_2', lover:'jihu', cond:S => isMet(S, 'jihu') && afterEv(S, 'ls_jihu_1', 2),
 speaker:'한지후', title:'숫자와 사람', place:'cafe', img:'art/ct_office.webp', cut:'jihu', cutVar:'a',
 beats:[
  `광고 재계약 자리. 오 실장은 모델료를 20퍼센트 올려야 한다고 한 치도 물러서지 않는다.`,
  `지후는 목소리를 한 번도 높이지 않았다. 그저 오 실장의 말이 끝나길 기다렸다가, 숫자 두 개를 조용히 내려놓았다.`,
  `삼십 분 뒤, 오 실장이 먼저 웃으며 말했다. “…장기 계약으로 가죠.”`,
 ],
 text:S => `엘리베이터 안에서 지후는 재킷 소매를 정리하며 말한다. “배우고 싶으면 보세요. 가르쳐 주진 않아요.” 눈은 앞을 향한 채다. 질문할 기회가 지금뿐이다.`,
 choices:[
  {label:'“왜 하필 그 숫자를 꺼내셨어요?” 하고 묻는다', sub:'팬소통·보컬이 높으면 깊은 대화', run(S){
    if(S.st.neg >= 50 || S.st.know >= 50) return _lsbR(S, 'jihu', 7, {neg:1.5, know:1}, `지후는 처음으로 몸을 돌려 나를 보았다. “상대의 숫자를 보는 게 아니라, 상대가 지키려는 걸 봅니다. 오 실장님은 돈이 아니라 당신의 다음 스케줄을 지키고 싶었습니다.” 그는 수첩을 펼쳐 한 페이지를 보여 주었다. 숫자 옆에 사람 이름이 촘촘히 적혀 있었다.`, 'surprised', 'j2_learn');
    return _lsbR(S, 'jihu', 3, {neg:0.5}, `“좋은 질문입니다. 다만 아직은 설명해도 이해하기 어려울 겁니다.” 그가 선을 긋는 듯하더니 덧붙였다. “…다음 미팅에도 오세요.” 그것이 초대라는 걸 한참 뒤에야 알았다.`, null, 'j2_learn'); }},
  {label:'아무 말 없이 편의점에서 따뜻한 차 두 잔을 사 온다', sub:'호감↑ · 거리 좁히기', run(S){
    return _lsbR(S, 'jihu', 5, {bond:1, stress:-2}, `차를 건네자 지후가 잠시 멈췄다. “…이런 건 요청한 적 없는데요.” 하면서도 컵을 두 손으로 쥐었다. 계단 앞에서 그가 낮게 말했다. “따뜻하네요. 오늘 협상보다 이게 더 어렵습니다.”`, 'shy', 'j2_tea'); }},
  {label:'오 실장의 표정이 달라진 순간을 짚어 말한다', sub:'멘탈이 높으면 인정받는다', run(S){
    if(S.st.ins >= 50) return _lsbR(S, 'jihu', 6, {ins:1, neg:0.5}, `“두 번째 숫자가 나왔을 때 실장님이 안도했어요. 그때부터 이미 끝난 협상이었죠.” 지후가 눈썹을 올렸다. “정확합니다. 그 순간을 본 모델은 처음입니다.”`, 'surprised', 'j2_read');
    return _lsbR(S, 'jihu', 2, {ins:0.5}, `절반쯤 맞았다. “거의 맞습니다. 다만 안도가 아니라 체념이었어요.” 지후는 정정하면서도 설명을 이어 주었다. 그가 설명을 이어 준다는 것이 곧 호의였다.`, null, 'j2_read'); }},
 ]},

{id:'ls_jihu_3', lover:'jihu', cond:S => isMet(S, 'jihu') && afterEv(S, 'ls_jihu_2', 2) && affOf(S, 'jihu') >= 30,
 speaker:'한지후', title:'지워진 장면', place:'night', img:'art/bg_office.webp', cut:'jihu', cutVar:'b',
 beats:[
  `최종 광고 콘티가 공유됐다. 내가 제안했던 장면, 화장을 지운 얼굴로 웃는 마지막 컷이 통째로 빠져 있다. 콘티를 발표한 건 지후였다.`,
  `촬영 준비가 끝난 저녁 브랜드 사무실. 지후는 모니터 불빛 속에서 혼자 자료를 정리하고 있다.`,
  `“…봤군요.” 그가 돌아보지 않고 말한다. “설명은 나중에 하겠습니다.” 나중이라는 말이 오늘따라 차갑다.`,
 ],
 text:S => `내가 몇 주 붙들고 있던 장면이 지워졌다. 내 생각을 가볍게 넘긴 걸까, 아니면 다른 사정이 있을까. 지후는 답하지 않는다. 가슴 속에서 의심이 번진다.`,
 choices:[
  {label:'지금 바로 이유를 차분히 묻는다', sub:'팬소통이 높으면 진실을 끌어낸다', run(S){
    if(S.st.neg >= 50) return _lsbR(S, 'jihu', 9, {neg:1.5, self:2, stress:3}, `감정을 빼고 질문 세 개를 순서대로 던졌다. 지후가 한숨을 쉬더니 서류 한 장을 꺼냈다. “임원진이 맨얼굴 컷을 폐기하려 했습니다. 제 이름으로 잠시 접어 두고, 다음 시즌 단독 캠페인으로 살릴 겁니다. 말씀드리지 못해 죄송합니다.” 그의 목소리가 처음으로 떨렸다.`, 'tender', 'j3_truth');
    return _lsbR(S, 'jihu', -3, {stress:6, self:-1}, `감정이 앞서 말이 거칠어졌다. “신인 아이디어라서 쉽게 지운 거예요?” 지후의 얼굴이 굳었다. “…그렇게 보였다면 제 책임입니다.” 그는 사정을 말하지 않고 자리를 떴다. 한 걸음 늦게 후회가 밀려왔다.`, 'serious', 'j3_clash'); }},
  {label:'콘티 수정 기록을 조용히 비교해 본다', sub:'멘탈이 높으면 사정을 짐작한다', run(S){
    if(S.st.ins >= 50) return _lsbR(S, 'jihu', 8, {ins:1.5}, `수정 기록 구석에 ‘별건 보류’라는 두 글자가 있었다. 장면은 지워진 게 아니라 다른 폴더로 옮겨져 있었다. 다음 날 촬영장에서 내가 먼저 말했다. “안 지워졌네요. 지켜 주신 거죠?” 지후가 한참 나를 보더니 짧게 답했다. “…눈치가 빠르시군요.”`, 'surprised', 'j3_truth');
    return _lsbR(S, 'jihu', 2, {stress:4}, `기록에서 알아낸 건 많지 않았다. 의심이 남은 채로 하루가 지나갔다. 지후는 해명하지 않았고 나도 묻지 못했다. 침묵이 쌓일수록 서로가 멀어지는 소리가 들렸다.`, null, 'j3_unclear'); }},
  {label:'아무 말 없이 돌아가고, 며칠간 거리를 둔다', sub:'호감↓ · 오해가 길어진다', run(S){
    return _lsbR(S, 'jihu', -6, {stress:5, bond:-1}, `촬영 나흘 동안 우리는 인사만 주고받았다. 지후는 평소보다 더 건조해졌고, 나는 모니터 뒤의 그를 볼 수 없었다. 오해는 말하지 않을수록 사실처럼 굳어 갔다.`, 'serious', 'j3_clash'); }},
 ]},

{id:'ls_jihu_4', lover:'jihu', cond:S => isMet(S, 'jihu') && afterEv(S, 'ls_jihu_3', 3) && affOf(S, 'jihu') >= 35,
 speaker:'한지후', title:'회수 통보', place:'night', img:'art/bg_office.webp', cut:'jihu', cutVar:'b',
 beats:[
  `광고가 나간 지 3주. 내가 들고 웃던 크림에 피부 트러블 민원이 쌓이기 시작했다. 내 SNS 댓글에도 “모델이 책임져라”는 말이 달린다. 임원실에서 ‘회수’라는 단어가 오간다.`,
  `자정이 넘은 브랜드 사무실. 지후가 단독으로 책임서를 쓰고 있다. 키보드 소리가 일정하다. 너무 일정해서 오히려 위태롭다.`,
  `“…제가 승인한 제품입니다. 모델에게는 책임이 없습니다. 제가 지겠습니다.”`,
 ],
 text:S => `${lvFlag(S, 'jihu', 'j3_truth') ? '그가 내 장면을 지켜 준 일이 떠오른다. 이번엔 내가 그를 지킬 차례다.' : '지후는 홀로 모든 걸 짊어지려 한다.'} 새벽까지 몇 시간 남았다.`,
 choices:[
  {label:'팬들이 남긴 후기를 밤새 같이 정리한다', sub:'멘탈이 높으면 원인을 찾는다', run(S){
    if(S.st.ins >= 50) return _lsbR(S, 'jihu', 11, {ins:1.5, work:3, stress:6}, `팬들이 남긴 후기 수백 개를 날짜별로 나누자, 민원이 특정 제조 날짜에 몰려 있었다. 전체 회수가 아니라 부분 회수로 충분하다는 결론이 새벽 네 시에 나왔다. 지후가 보고서를 읽다가 고개를 들었다. “…이 분석이 없었다면 전부 폐기했을 겁니다.” 그의 눈가가 젖은 것처럼 보였다.`, 'tender', 'j4_data');
    return _lsbR(S, 'jihu', 5, {ins:1, work:1, stress:7}, `밤을 새웠지만 원인 하나만 겨우 좁혔다. 아침에 지후가 서류를 받아 들고 말했다. “충분하진 않지만… 같이 밤을 새워 준 모델은 처음입니다.”`, 'shy', 'j4_data'); }},
  {label:'“모델이 먼저 사과하는 영상을 올리자”고 제안한다', sub:'팬소통이 높으면 판세를 바꾼다 · 스캔들 위험 소폭', run(S){
    if(S.st.neg >= 50){ const r = _lsbR(S, 'jihu', 10, {neg:1.5, work:2.5, stress:5}, `감추기보다 먼저 사과하고 교환하는 방향을 제안했다. 임원들은 반대했지만 나는 팬들의 반응을 근거로 설득했고, 지후가 마지막에 한마디를 보탰다. “이 방향, 좋습니다.” 같은 말이 오늘은 전혀 다른 무게였다.`, 'tender', 'j4_plan'); addFans(S, 0.5, r.chips); return r; }
    const r = _lsbR(S, 'jihu', 4, {neg:1, work:1, stress:6}, `영상은 진심이었지만 서툴렀고, 댓글은 반으로 갈렸다. 그래도 지후는 내 이름을 보고서 맨 앞에 올렸다. “책임은 제가 지지만, 방향은 같이 정했다는 걸 남기고 싶었습니다.”`, 'shy', 'j4_plan'); addScandal(S, 4, r.chips); return r; }},
  {label:'임원실에 같이 들어가 “모델도 함께 책임지겠다”고 말한다', sub:'실력 -3 · 돈 -30 · 호감↑', run(S){
    const r = _lsbR(S, 'jihu', 9, {work:-3, bond:3, dare:1, stress:6}, `문 앞에서 지후가 내 손목을 잡았다. “안 됩니다.” “이미 들어왔어요.” 임원들 앞에서 우리는 나란히 서 있었다. 결과는 모델료 일부 반납. 문을 나온 지후가 낮게 웃었다. “…무모한 모델과 일하는 건 처음입니다.”`, 'tender', 'j4_joint'); bump(S, 'cash', -30, r.chips); return r; }},
 ]},

{id:'ls_jihu_5', lover:'jihu', cond:S => isMet(S, 'jihu') && afterEv(S, 'ls_jihu_4', 3) && _lsbPre(S, 'jihu', 55),
 speaker:'한지후', title:'옥상의 비', place:'rain', img:'art/ct_night.webp', cut:'jihu', cutVar:'b',
 beats:[
  `브랜드 사옥 옥상, 비 내리는 저녁. 지후가 우산도 쓰지 않고 난간 앞에 서 있다.`,
  `그의 손에는 접힌 서류가 있다. 해외 본사 파견 제안서, 그리고 ‘거절’이라고 이미 서명된 회신서.`,
  `“…정확한 선택이라고 생각했습니다. 그런데 정확한 것과 옳은 것은 다르더군요.”`,
 ],
 text:S => `${isCouple(S, 'jihu') ? '연인인 지금도 그는 이 이야기를 먼저 꺼내지 못했다.' : '그가 이 이야기를 하는 건 처음이다.'} 어릴 적 부모의 이혼 뒤로 ‘정확해야 안전하다’고 믿어 왔다는 고백. 이제 내 차례다.`,
 choices:[
  {label:'“가세요. 제가 기다릴게요”라고 담담히 말한다', sub:'팬소통이 높으면 설득이 닿는다', run(S){
    if(S.st.neg >= 50) return _lsbR(S, 'jihu', 9, {neg:1, self:3, stress:5}, `감정을 앞세우지 않고 이유를 하나씩 말했다. 가야 하는 이유, 돌아올 이유, 내가 기다릴 이유. 지후는 서류를 천천히 펴 보더니 거절 서명 옆에 줄을 그었다. “…다시 쓰겠습니다. 이번엔 제 감정까지 정확하게.” ${isCouple(S, 'jihu') ? '그의 이마가 내 어깨에 닿았다.' : '비에 젖은 그의 손이 내 손을 잡았다.'}`, 'tender', 'j5_go');
    return _lsbR(S, 'jihu', 5, {self:2, stress:5}, `떨리는 목소리로 가라고 했다. 지후는 오래 나를 보다가 말했다. “…진심이 아닌 말은 제일 정확하게 들립니다.” 그래도 그는 서류를 접어 주머니에 넣었다. 답은 아직 정해지지 않았다.`, 'shy', 'j5_go'); }},
  {label:'“가지 말아요. 아직 같이 하고 싶은 일이 많아요”라고 솔직히 말한다', sub:'호감↑ · 진심', run(S){
    return _lsbR(S, 'jihu', 8, {self:3, bond:2, stress:3}, `지후는 한참 말이 없었다. 빗소리 사이로 그가 조용히 말했다. “…누군가 가지 말라고 한 건 처음입니다. 이렇게 이기적인 말이 이렇게 반갑다니.” 그의 눈이 붉어졌다.`, 'tender', 'j5_stay'); }},
  {label:'“함께 생각해 봐요. 결정은 당신 몫이에요”라고 말한다', sub:'멘탈이 높으면 깊은 신뢰', run(S){
    if(S.st.know >= 50 || S.st.ins >= 50) return _lsbR(S, 'jihu', 9, {ins:1, know:1, self:3}, `“정답을 찾는 게 아니라, 후회가 적은 쪽을 고르는 거예요.” 그 말에 지후가 고개를 들었다. “후회…라는 기준은 생각해 본 적 없습니다.” 우산을 펴 그의 머리 위로 씌웠다. 밤새 서류 대신 서로의 이야기를 했다.`, 'tender', 'j5_think');
    return _lsbR(S, 'jihu', 5, {self:2}, `우리는 같은 우산 아래에서 말없이 비를 맞았다. 답은 나오지 않았지만, 지후가 마지막에 말했다. “고민을 나눠 본 건 처음입니다. 생각보다 가볍네요.”`, 'shy', 'j5_think'); }},
 ]},

{id:'ls_jihu_6', lover:'jihu', cond:S => isMet(S, 'jihu') && afterEv(S, 'ls_jihu_5', 3) && _lsbPre(S, 'jihu', 55),
 speaker:'한지후', title:'두 번째 장', place:'cafe', img:'art/ct_beauty.webp', cut:'jihu', cutVar:'a',
 beats:[
  `첫눈이 내린 날, 촬영을 마치고 대기실로 돌아오니 지후가 얇은 기획안 하나를 두고 갔다.`,
  `표지에는 ‘공동 기획 라인 — 초안’. 첫 장은 비어 있고, 두 번째 장 맨 위에 그의 반듯한 글씨가 있다.`,
  `“이 방향, 좋습니다.” 그 아래 한 줄이 더 있다. “이번에는 당신이 직접 써 주십시오. 모델이 아니라 기획자로.”`,
 ],
 text:S => `${lvFlag(S, 'jihu', 'j5_go') ? '해외 파견을 앞둔 그는, 떠나기 전에 같은 문장을 내게 건넸다.' : lvFlag(S, 'jihu', 'j5_stay') ? '남기로 한 그는, 남은 자리에서 새 시작을 건넸다.' : '결정을 마친 그는, 이제 다음 장을 같이 쓰자고 한다.'} 빈 칸을 앞에 두고 숨을 고른다.`,
 choices:[
  {label:'그 한 줄을 지후의 이름 옆에 적어 돌려준다', sub:'서사 완결 · 호감↑', run(S){
    lvSet(S, 'jihu', 'arc_done'); S.album.push(`지후의 기획서 두 번째 장에 우리의 한 줄을 함께 적었다. 이 방향, 좋습니다. 같은 문장을 서로에게 건네는 사이가 되었다.`);
    const j = lvFlag(S, 'jihu', 'j5_go') ? ' 떠나는 날에도 그는 내 기획서 맨 앞에 그 한 줄을 남길 것이다.' : ' 우리는 같은 테이블에 마주 앉아 같은 장을 이어 쓸 것이다.';
    return _lsbR(S, 'jihu', 10, {self:3, bond:3, work:2}, `종이 위에서 우리의 필체가 나란히 놓였다.${j} 지후가 처음으로 환하게 웃으며 말했다. “이 방향, 좋습니다. 정확하게.”`, 'tender'); }},
  {label:'“이 장은 협상으로 정하죠. 조건은 하나, 촬영 끝나면 일 얘기 금지”라고 웃는다', sub:'팬소통이 높으면 유쾌한 합의', run(S){
    lvSet(S, 'jihu', 'arc_done'); S.album.push(`지후와 계약서 같은 약속을 맺었다. 촬영 끝나면 일 얘기 금지. 정확한 사람이 처음으로 지키기 어려운 규칙을 받아들였다.`);
    if(S.st.neg >= 50) return _lsbR(S, 'jihu', 12, {neg:1, self:3, bond:2}, `지후가 펜을 들고 한참 고민하더니 조항을 추가했다. “단, 제가 먼저 어기면 벌칙은 저녁 식사 한 번.” 결국 ${isCouple(S, 'jihu') ? '입술이 닿을 듯 가까이서' : '서로 눈을 마주 본 채'} 서명을 나눴다. 계약 중에서 가장 마음에 드는 계약이었다.`, 'tender');
    return _lsbR(S, 'jihu', 8, {neg:0.5, self:3, bond:2}, `협상은 서툴렀지만 지후가 먼저 양보했다. “손해 보는 계약도 해 볼 만하군요.” ${isCouple(S, 'jihu') ? '그는 돌아가는 길에 내 손을 잡았다.' : '그의 걸음이 내 걸음 속도에 맞춰졌다.'}`, 'shy'); }},
  {label:'아무 말 없이 기획서를 끌어안고 고개를 끄덕인다', sub:'서사 완결 · 조용한 약속', run(S){
    lvSet(S, 'jihu', 'arc_done'); S.album.push(`지후가 건넨 기획서를 안고 숙소로 돌아왔다. 빈 장은 천천히 채우기로 했다. 눈이 오는 길, 그의 우산이 내 쪽으로 기울어 있었다.`);
    return _lsbR(S, 'jihu', 8, {self:3, stress:-5}, `말이 필요 없었다. 지후가 우산을 펴서 내 쪽으로 기울였다. “…그 정도면 충분히 정확한 답입니다.” 눈이 내렸고, 그의 어깨가 반쯤 젖었다.`, 'shy'); }},

{id:'ls_dohyun_1', lover:'dohyun', cond:S => isMet(S, 'dohyun') && isIdol(S),
 speaker:'차도현', title:'방송 이십 분 전', place:'stage', img:'art/bg_stage.webp', cut:'dohyun', cutVar:'a',
 beats:[
  `「뮤직 스테이지」 생방송 이십 분 전. 오프닝을 맡은 MC가 목이 쉬어 말이 나오지 않는다는 소식이 부조정실에 떨어졌다.`,
  `“씨, 누구 큐카드 읽을 수 있는 사람!” 도현의 목소리가 찢어진다. 대기실 복도의 아이돌들이 모두 눈을 피한다.`,
  `내가 고개를 들자 그와 눈이 마주쳤다. “…너. 할 수 있어?”`,
 ],
 text:S => `이십 분이면 불가능하지 않다. 틀리면 생방송 첫 화면이 통째로 날아가고, 내 이름은 짤로 남는다. 도현은 시계를 쥔 채 내 대답을 기다린다. ${S.name}, 어떻게 할까?`,
 choices:[
  {label:'“제가 해 볼게요”라며 큐카드를 잡는다', sub:'예능감·팬소통이 높으면 성공 · 팬 +', run(S){
    const ok = (S.st.dare + S.st.neg) / 2 + rand(-8, 12) >= 42;
    if(ok){ const r = _lsbR(S, 'dohyun', 8, {dare:1.5, neg:1, work:2, stress:4}, `큐카드를 두 번 소리 내어 읽고 카메라 빨간 불 앞에 섰다. 첫 문장이 매끄럽게 나갔고 애드리브 하나에 방청객이 웃었다. 도현이 인터컴 너머로 말했다. “…오케이. 넘어가.” 그리고 작게 덧붙였다. “좋은 입이네.”`, 'surprised', 'd1_light'); addFans(S, 0.3, r.chips); return r; }
    const r = _lsbR(S, 'dohyun', 3, {dare:1, stress:6}, `그룹 이름 하나를 잘못 읽어 한 박자가 날아갔다. 다행히 도현이 카메라를 돌려 장면은 건졌다. 그는 모니터를 보며 퉁명스럽게 말했다. “안 해 본 걸 한다고 나선 건 인정. 다음엔 연습하고 와.”`, 'shy', 'd1_light'); addScandal(S, 2, r.chips); return r; }},
  {label:'“저는 못 해요. 대신 예능 잘하는 선배를 불러올게요”', sub:'안전한 선택 · 호감 소폭', run(S){
    return _lsbR(S, 'dohyun', 3, {neg:0.5, stress:3}, `대기실 세 곳을 뛰어다닌 끝에 예능 경험 많은 선배를 불러냈다. 방송은 무사히 시작됐다. 도현은 한숨을 쉬었지만 내 어깨를 툭 쳤다. “빠른 판단이었어. 근데 오늘은… 네가 직접 잡길 바랐다.”`, null, 'd1_call'); }},
  {label:'“PD님이 정하세요. 저는 따를게요”라고 한 발 물러선다', sub:'호감↓ · 소극적', run(S){
    return _lsbR(S, 'dohyun', -3, {stress:4}, `도현은 혀를 찼다. “현장에서 ‘정하세요’는 책임 떠넘기는 말이야.” 오프닝은 결국 자막으로 대신했다. 그의 등 뒤에서 나는 한 번도 도전하지 않은 사람 같았다.`, 'serious', 'd1_back'); }},
 ]},

{id:'ls_dohyun_2', lover:'dohyun', cond:S => isMet(S, 'dohyun') && afterEv(S, 'ls_dohyun_1', 2),
 speaker:'차도현', title:'이름을 외우는 이유', place:'night', img:'art/bg_studio.webp', cut:'dohyun', cutVar:'a',
 beats:[
  `새벽 세 시의 방송국 편집실. 모니터 불빛이 도현의 얼굴을 파랗게 물들인다.`,
  `책상 한쪽에 낡은 수첩이 펼쳐져 있다. 스태프와 신인 아이돌 이름이 빽빽하다. 막내 조연출 이름 옆에 ‘커피 말고 우유’라고까지 적혀 있다.`,
  `“…봤냐. 쪽팔리게.” 그가 수첩을 탁 덮는다. “내가 신입일 때 말이야, 사람들이 날 ‘어이’라고 불렀거든.”`,
 ],
 text:S => `도현은 거친 말투로 말하지만 눈은 모니터에서 떨어지지 않는다. 어쩐지 이 새벽에만 열리는 이야기 같다. 나는 어떻게 대답할까?`,
 choices:[
  {label:'옆자리에 앉아 우리 무대 컷을 같이 골라 준다', sub:'표현력이 높으면 컷을 맡긴다', run(S){
    if(S.st.sense >= 50) return _lsbR(S, 'dohyun', 8, {sense:1.5, work:2}, `안무가 끊겨 보이는 컷 두 개를 짚었다. 도현이 이어 붙여 보더니 말없이 재생을 눌렀다. “…이게 맞네.” 다음 순간 그가 마우스를 내 쪽으로 밀었다. “나머지 열 컷, 네가 해 봐. 무대 위 사람 눈이 제일 정확하니까.”`, 'surprised', 'd2_edit');
    return _lsbR(S, 'dohyun', 4, {sense:1, work:1}, `고른 컷은 서툴렀지만 도현은 하나하나 이유를 설명해 줬다. 거칠게 말하면서도 끝까지 가르치는 사람. “초보 때는 다 그래. 나도 첫 편집 때 울었다.”`, 'shy', 'd2_edit'); }},
  {label:'“그럼 제 이름은 뭐라고 적혀 있어요?” 하고 수첩을 가리킨다', sub:'예능감이 높으면 장난이 통한다', run(S){
    if(S.st.dare >= 50) return _lsbR(S, 'dohyun', 7, {dare:1, charm:1}, `도현이 당황해서 수첩을 뒤로 감추다가 결국 한 장을 펼쳐 보였다. 내 이름 옆엔 ‘겁 없음. 근데 잘함.’ 이라고 적혀 있었다. “…이건 비밀이다. 퍼뜨리면 컷이다.” 그의 귀가 새빨갰다.`, 'shy', 'd2_note');
    return _lsbR(S, 'dohyun', 3, {charm:0.5}, `“야, 그건 안 보여 준다.” 도현이 수첩을 서랍에 넣고 잠갔다. 하지만 서랍을 잠그는 손이 웃고 있었다. 이름은 못 봤지만 그가 이름을 적어 두었다는 건 알았다.`, 'shy', 'd2_note'); }},
  {label:'아무 말 없이 듣다가 따뜻한 음료를 건넨다', sub:'안정적 · 호감↑', run(S){
    return _lsbR(S, 'dohyun', 5, {stress:-3, bond:1}, `내가 말없이 컵을 놓자 도현이 잠깐 눈을 감았다. “…고맙다.” 짧은 말이었지만 그가 쓰는 말 중에서 가장 무거운 단어였다. 새벽이 밝아 올 때까지 우리는 같은 화면을 보았다.`, 'tender', 'd2_listen'); }},
]},

{id:'ls_dohyun_3', lover:'dohyun', cond:S => isMet(S, 'dohyun') && afterEv(S, 'ls_dohyun_2', 2) && affOf(S, 'dohyun') >= 30,

 choices:[

    return _lsbR(S, 'dohyun', -4, {dare:0.5, stress:6}, `급하게 쫓아가 따졌지만 목소리가 떨렸다. “지금 여기서 이럴 거냐?” 도현이 사람들 눈을 의식해 말을 삼켰고, 우리는 서로 화만 낸 채 헤어졌다. 해명은 늦어졌다.`, 'serious', 'd3_clash'); }},
  {label:'회의가 끝난 뒤 단둘이 있을 때 조용히 묻는다', sub:'멘탈이 높으면 의도를 짐작한다', run(S){
    if(S.st.ins >= 50) return _lsbR(S, 'dohyun', 8, {ins:1, self:1}, `“국장님 앞이라서요? 우리 아이디어 뺏길까 봐.” 도현이 멈칫했다가 코웃음 쳤다. “…눈치가 좋은 건 인정한다.” 그는 내 그룹 이름이 적힌 기획서를 따로 들고 있었다. 보여 주지 못한 마음이 그 안에 있었다.`, 'tender', 'd3_truth');
    return _lsbR(S, 'dohyun', 3, {stress:4}, `저녁에 둘이 남았을 때 물었지만 도현은 “나중에 말해 줄게” 하고 자리를 피했다. 이유는 모르는 채, 신뢰만 겨우 붙들었다. 며칠 뒤에야 그가 먼저 사과했다.`, null, 'd3_late'); }},
  {label:'서운함을 삼키고 무대 구성을 따로 다듬어 둔다', sub:'댄스가 높으면 반전 · 호감 유지', run(S){
    if(S.st.skill >= 50) return _lsbR(S, 'dohyun', 6, {skill:1, work:1.5}, `동선과 카메라 위치까지 그려 넣어 현장에서 바로 쓸 수 있게 고쳐 두었다. 며칠 뒤 도현이 그 문서를 우연히 보고 말을 잃었다. “…누가 이렇게까지 하랬어.” 그는 문서를 자기 서랍 깊숙이 넣었다. “국장 없을 때 쓴다. 너희 이름 걸고.”`, 'surprised', 'd3_truth');
    return _lsbR(S, 'dohyun', 1, {skill:0.5, stress:4}, `정리는 했지만 도현에게 보여 줄 용기는 나지 않았다. 서랍 속 문서가 오래 잠들었다. 오해는 풀리지 않은 채 시간이 흘렀다.`, 'serious', 'd3_clash'); }},
 ]},

{id:'ls_dohyun_4', lover:'dohyun', cond:S => isMet(S, 'dohyun') && afterEv(S, 'ls_dohyun_3', 3) && affOf(S, 'dohyun') >= 35,
 speaker:'차도현', title:'빠진 협찬', place:'night', img:'art/ct_night.webp', cut:'dohyun', cutVar:'b',
 beats:[
  `「뮤직 스테이지」의 메인 협찬사가 갑자기 빠졌다는 통보가 왔다. 다음 개편 때 폐지라는 말이 복도를 돈다. 스태프들이 장비 앞에서 서로의 눈치를 본다.`,

  `“…신인들이 설 무대가 하나 없어지는 거다. 너도 여기서 처음 섰잖아. 근데 방법을 모르겠다.”`,
 ],

 choices:[

    return _lsbR(S, 'dohyun', 5, {dare:1, work:1, stress:9}, `사흘을 뛰었지만 계약은 성사되지 않았다. 도현이 말없이 내 손에 식은 김밥을 쥐여 줬다. “…열한 곳이나 갔다며. 그걸로 충분하다.” 쓰다 남은 용기가 속에서 오래 따뜻했다.`, 'shy', 'd4_sponsor'); }},
  {label:'팬들에게 “이 무대를 지켜 달라”고 시청 응원을 부탁한다', sub:'팬소통이 높으면 시청률이 움직인다 · 팬 +', run(S){
    if(S.st.neg >= 50){ const r = _lsbR(S, 'dohyun', 9, {neg:1.5, bond:2, stress:5}, `라이브 방송에서 진심으로 부탁했다. 다른 그룹 팬들까지 시청 인증을 올리기 시작했고, 그 주 시청률이 반 뼘 올랐다. 도현은 부조정실 구석에서 고개를 숙이고 얼굴을 한 번 닦았다.`, 'tender', 'd4_crew'); addFans(S, 0.6, r.chips); return r; }
    const r = _lsbR(S, 'dohyun', 4, {neg:1, bond:1, stress:6}, `서툰 부탁이었지만 진심은 닿았다. 몇몇은 응원했고, 몇몇은 “아이돌이 왜 방송국 편을 드냐”고 했다. 도현이 담담히 말했다. “응원해 준 사람 이름은 안 잊는다.” 수첩에 새 줄이 적혔다.`, null, 'd4_crew'); addScandal(S, 3, r.chips); return r; }},
  {label:`내 돈을 일부 보태겠다고 한다`, sub:'돈 -40 · 호감↑', run(S){

      return {text:`봉투를 건네자 도현이 한참 쳐다보았다. “…이걸 왜 네가.” “저도 이 무대에서 컸으니까요.” 그는 봉투를 돌려주려다 멈췄고, 결국 받았다. “갚는다. 이자 쳐서.” 거친 말투 끝에 목소리가 갈라졌다.`, chips:ch, mood:'tender'}; }
    addAff(S, 'dohyun', 3, ch); fx(S, {stress:4}, ch); lvSet(S, 'dohyun', 'd4_money');
    return {text:`내 통장 잔고로는 보탤 수 있는 게 거의 없었다. 도현이 피식 웃으며 봉투를 밀어냈다. “마음만 받는다. 정산도 안 나온 신인이 무슨.” 부족한 돈 대신 그의 호의를 얻었다.`, chips:ch, mood:'shy'}; }},

{id:'ls_dohyun_5', lover:'dohyun', cond:S => isMet(S, 'dohyun') && afterEv(S, 'ls_dohyun_4', 3) && _lsbPre(S, 'dohyun', 55),

{id:'ls_sian_5', lover:'sian', cond:S => _lscDeep(S, 'sian') && afterEv(S, 'ls_sian_4', 3),

  {label:'“쉬는 것도 연습이에요. 야식 먹으러 가요”', sub:'스트레스↓ · 호감↑', run(S){ return _lscR(S, 'seunghyun', 4, {stress:-3, bond:1}, 'k3', '“진짜요? 선배들한테 혼나는데.” 승현은 말하면서도 이미 외투를 집었다. 포장마차에서 어묵 국물을 불며 그는 처음으로 오디션 얘기가 아닌 어릴 적 이야기를 했다.'); }},

{id:'ls_seunghyun_2', lover:'seunghyun', cond:S => isMet(S, 'seunghyun') && afterEv(S, 'ls_seunghyun_1', 2),
