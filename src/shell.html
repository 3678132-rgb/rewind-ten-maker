<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1230"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="다시스무살"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>다시, 스무 살</title>
<meta name="description" content="마흔에서 스무 살로 되감긴 십 년, 육성 시뮬레이션">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>/*CSS*/</style></head><body>
<div id="app">
 <section id="title" class="screen on">
  <div class="coverart"></div>
  <div class="ctop"><div class="eyebrow">REWIND TEN · 2016 → 2026</div><h1 class="wordmark">다시,<br>스무 살<small>REWIND TEN</small></h1><div class="csub">십 년의 시간 · 자유 시계를 향해</div></div>
  <div class="cbot">
   <div class="ccard">마흔의 기억을 안고 스무 살로.<br>십 년 안에 새 인생을 못 만들면, 다시 그 골목으로.</div>
   <button class="btn blue" id="b-new">새로 시작</button>
   <button class="btn ghost sm" id="b-slots" style="display:none;background:rgba(255,255,255,.8)">저장 슬롯 불러오기</button>
   <button class="btn ghost sm" id="b-cont" style="display:none;background:rgba(255,255,255,.8)">이어하기</button>
   <div class="note">저장은 이 기기에만 보관돼요. · 빌드 __BUILD__<br><span id="fitdiag"></span></div>
  </div>
 </section>
 <section id="setup" class="screen">
  <div class="wiz">
   <div class="wizhead"><button class="wizback" id="w-back" aria-label="이전">←</button><div class="dots" id="w-dots"></div></div>
   <div class="wizq" id="w-q"></div>
   <div class="wizbody" id="w-body"></div>
   <div class="wizfoot"><button class="btn blue" id="w-next">다음</button></div>
  </div>
 </section>
 <section id="game" class="screen">
  <div class="scene" id="scene"><img class="pimg" id="g-img" alt=""><div class="scene-shade"></div></div>
  <div class="hud-top">
   <div class="avatar" id="hud-avatar"></div>
   <div class="hud-center"><div class="hud-line"><b id="tb-date"></b><span id="hud-age"></span></div><div class="hud-bar"><i id="hud-prog"></i></div><div class="hud-sub" id="tb-sub"></div></div>
   <button class="gear" id="b-call" aria-label="전화하기"><span data-icon="phone"></span><span class="badge" id="call-badge"></span></button>
   <button class="gear" id="b-menu" aria-label="메뉴"><span data-icon="gear"></span></button>
  </div>
  <div class="side-l">
   <button class="fab c-pink" data-sheet="stat"><span class="ic" data-icon="stats"></span><span class="lb">능력치</span></button>
   <button class="fab c-orange" data-sheet="career"><span class="ic" data-icon="company"></span><span class="lb">진로</span></button>
   <button class="fab c-pink" data-sheet="love"><span class="ic" data-icon="heart"></span><span class="lb">연애</span></button>
   <button class="fab c-purple" data-sheet="dex"><span class="ic" data-icon="dex"></span><span class="lb">도감</span></button>
  </div>
  <div class="side-r">
   <button class="fab c-green" data-sheet="stat"><span class="ic gauge" id="g-hp"></span><span class="lb">체력</span></button>
   <button class="fab c-red" data-sheet="stat"><span class="ic gauge" id="g-st"></span><span class="lb">스트레스</span></button>
   <button class="fab c-orange" data-sheet="shop"><span class="ic" data-icon="shop"></span><span class="lb">상점</span></button>
   <button class="fab c-teal" id="btn-advice"><span class="ic" data-icon="chat"></span><span class="lb">조언</span></button>
  </div>
  <div class="dialog" id="dialog" hidden><img class="face" id="dlg-face" src="art/grandma.webp" alt=""><div><div class="head" id="dlg-head"></div><div class="body" id="dlg-body"></div></div><button class="nx" id="dlg-x">닫기</button></div>
  <div class="bottom-area"><div class="hud-res" id="hud-res"></div><div class="slots3" id="slots3"></div><button class="cta" id="btn-go">스케줄 정하기</button></div>
  <nav class="tabbar" id="tabbar"></nav>
 </section>
 <section id="end" class="screen"></section>
 <div id="act" class="actcard"></div>
 <div id="ev" class="evcard"></div>
 <div id="buildtag">빌드 __BUILD__</div>
 <div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
</div>
<script>/*JS*/</script></body></html>
