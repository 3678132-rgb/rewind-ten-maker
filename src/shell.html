<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1230"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="다시스무살"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>다시, 스무 살</title>
<meta name="description" content="마흔에서 스무 살로 되감긴 십 년, 육성 시뮬레이션">
<style>/*CSS*/</style></head><body>
<div id="app">
 <section id="title" class="screen on">
  <div class="coverbg"></div>
  <div class="tcontent"><div class="hourglass">⏳</div><h1>다시, 스무 살</h1>
  <p>마흔의 기억을 안고 스무 살로.<br>십 년 안에 새 인생을 만들지 못하면, 그 골목으로 돌아간다.</p>
  <button class="btn" id="b-new">새로 시작</button>
  <button class="btn ghost" id="b-cont" style="margin-top:10px;display:none">이어하기</button>
  <p class="note">저장은 이 기기에만 보관돼요.</p></div>
 </section>
 <section id="setup" class="screen">
  <div class="wizbg"></div>
  <div class="wiz">
   <div class="wizhead"><button class="wizback" id="w-back" aria-label="이전">←</button><div class="dots" id="w-dots"></div></div>
   <div class="wizq" id="w-q"></div>
   <div class="wizbody" id="w-body"></div>
   <div class="wizfoot"><button class="btn" id="w-next">다음</button></div>
  </div>
 </section>
 <section id="game" class="screen">
  <div class="gbg" id="g-bg"></div><div class="gshade"></div>
  <div class="ghud">
   <div class="hrow">
    <div class="hdate"><b id="h-date"></b></div>
    <div class="ibtns"><button class="ibtn" id="b-call" aria-label="전화하기">📞<span class="badge" id="call-badge"></span></button><button class="ibtn" id="b-stat" aria-label="능력치">📊</button><button class="ibtn" id="b-log" aria-label="기록">📖</button><button class="ibtn" id="b-menu" aria-label="메뉴">⚙️</button></div>
   </div>
   <div class="hjob" id="h-job"></div>
   <div class="sandwrap"><div class="sand"><i id="h-sand"></i></div><span class="left" id="h-left"></span></div>
   <div class="res" id="h-res"></div>
  </div>
  <div class="gbottom">
   <div class="pillars" id="pillars"></div>
   <div class="slots" id="slots"></div>
   <div class="plans"><button class="btn ghost sm" id="b-auto">✨ 추천 계획</button><button class="btn ghost sm" id="b-prev">↻ 지난달처럼</button></div>
   <button class="btn" id="b-run">이번 달 시작</button>
  </div>
 </section>
 <section id="end" class="screen"></section>
 <div id="act" class="actcard"></div>
 <div id="ev" class="evcard"></div>
 <div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
</div>
<script>/*JS*/</script></body></html>
